body:
  text: 名醫類案卷九明江瓘編淋閉壺仙翁治瓜州趙按察病䐜脹不能食溲遺血衆醫以為熱下以大黃之劑神乏氣脫而不能寐召翁診其脉告曰病得之勞傷心血久則脾胃俱受傷耳所以知按察之病者切其脉左寸沉右寸過左一倍兩關弦澀尺反盛蓋煩勞不勝則逆鬱而不通不通則不能升降而作䐜脹䐜脹則不食肉沸而不下則關槖閉而溲且不輸故溲遺血乃和以八補之劑兼五鬱之藥不數日而愈越三月復作如前治立除此案重見第四卷腫脹門陜人高文病淋一日口噤厥逆見症竒一日之淋而口噤厥逆耶他醫以為風翁曰誤矣此熱客膀胱故難溲耳投以八正散二服而溲大行病且愈所以知文之病者診其脉尺沉而大按之而堅知病之在下也膀胱者津液之府氣化則能出此蓋由於熱淋而更接內故移熱於膀胱而使溲難也東垣治一人病小便不利目晴突出腹脹如鼓非鼓脹因小便不出而脹膝以上堅硬皮膚欲裂飲食且不下服甘淡滲泄之藥皆不效李曰疾深矣非精思不能處思之半夜曰吾得之矣內經有云膀胱者津液之府必氣化乃能出焉今服淡滲之藥而病益甚者是氣不化也啓元子云無陽則隂無以生無隂則陽無以化甘淡氣薄皆陽藥獨陽無隂其欲化得乎明日以滋腎丸羣隂之劑投之再服而愈方見丹溪長安王善支病小便不通漸成中滿腹大堅硬如石壅塞之極腿腳堅脹裂出黃水雙睛凸出晝夜不得眠飲食不下獨為關痛苦不可名狀伊戚趙謙甫詣李求治視歸從夜至旦耿耿不寐究記素問有云無陽則隂無以生無隂則陽無以化又云膀胱者州都之官津液藏焉氣化則能出矣此病小便癃閉是無隂而陽氣不化也凡利小便之藥皆淡味滲泄為陽止是氣藥陽中之隂非北方寒水隂中之隂所化者也此乃奉養太過膏粱積熱損北方之隂腎水不足膀胱腎之室久而乾涸小便不化火又逆上而為嘔噦非膈上所生也獨為關非格病也潔古云熱在下焦填塞不便是關格之法今病者內關外格之病悉具死在旦夕但治下焦可愈隨處以禀北方寒水所化大苦寒之味者黃柏知母桂為引用丸如桐子大沸湯下二百丸少時來報服藥須㬰如刀刺前隂火燒之痛溺如瀑泉湧出卧具皆濕床下成流顧盼之間腫脹消散李驚喜曰大哉聖人之言豈可不遍覽而執一者也其症小便閉塞而不渴時見躁者是也凡諸病居下焦皆不渴也非先生不能道此語二者之病一居上焦在氣分而必渴一居下焦在血分而不渴血中有濕故不渴也二者之殊至易别耳治下焦羅謙甫治劉太保淋疾問曰近夏月來同行人多有淋證氣運使然抑水土耶羅曰此間别無所患獨公所有之殆非氣運水土使然繼問公近來多食何物曰宣使賜木瓜百餘對遂多蜜煎之每客至以此待食日三五次曰淋由此也內經曰酸多食之令人癃凡治小便不利不可用酸奪飲則已曰醋味致淋其理安在曰小便主氣經云酸入于胃其氣澀以收上之兩焦弗能出入也不出則留胃中胃中和濕則下注膀胱之胞胞薄以懦得酸則縮踡約而不通水道不行故癃而澀乃作淋也果如言而愈黃明之六月中小便淋莖中痛不可忍相引脅下痛以川練子生甘草一錢元胡索七分人參五分茯苓四分琥珀澤㵼柴胡當歸稍各三分作一服名曰參苓琥珀湯用長流水三盞煎至一盞溫服空心食前大效此方可法中書右丞合刺合孫病小便數而少日夜約至二十餘行臍脹腹滿腰腳沉重不得安卧至元癸未季春羅奉旨治之診視脉得沉緩時時帶數常記小便不利者有三不可一槩而論若津液偏滲於腸胃大便泄㵼而小便澀少一也宜分利而已若熱搏下焦津液則熱濕而不行二也必滲泄則愈若脾胃氣澀不能通利水道下輸膀胱而化者三也可順氣令施化而出也分利滲泄順氣三法治之不可不記今右丞平素膏粱濕熱內蓄不得施化膀胱竅澀是以起數而見少也非滲泄分利則不能快利遂處一方名曰茯苓琥珀湯內經曰甘緩而淡滲熱搏津液內蓄臍腹脹滿當須緩之泄之必以甘淡為主遂以茯苓為君滑石甘寒滑以利竅猪苓琥珀之淡以滲泄而利水道故用三味為臣脾惡濕濕氣內蓄則脾氣不治益脾勝濕必用甘為助故以甘草白术為佐鹹入腎鹹味下泄為隂澤瀉之鹹以瀉伏水腎惡燥急食辛以潤之津液不行以辛散之桂枝味辛散濕潤燥此為因用故以二物為使煎用長流甘爛水使下助其腎氣大作湯劑令直逹于下而急速也此方尤妙于五苓散五苓散加滑石琥珀君臣佐使用法不同兩服減半旬日良愈丹溪治一老人因疝疼二十年多服蒼术烏附等藥疝稍愈又患淋十餘年其間服硝黃諸淋藥不效忽項右邊發一大疽連及缺盆不能食淋痛愈甚叫號困憊時當六月脉短澀左微似弦皆前烏附積毒所致凝積滯血蓄滿膀胱脈澀為敗血澀為血虛而斷為敗血亦合症而云短為血耗忍痛傷血叫號傷氣知其溺後有如敗膿者詢之果然遂先治淋令多取土牛膝根莖葉濃煎湯行瘀并四物湯大劑與三日後痛與敗膿漸減五七日淋止瘡勢亦定蓋四物能生血也但食少瘡未收斂用四物加參茋白术熬膏以陳皮半夏砂仁木香煎取清汁調膏與之遂漸能食一月瘡安先行瘀生新後調元補胃行氣開痰故曰非開痰不足以行氣也一人小便不通醫用利藥益甚脈右寸頗弦滑此積痰在肺肺為上焦膀胱為下焦上焦閉則下焦塞如滴水之器必上竅通而後下竅之水出焉以藥大吐之病如失一婦脾疼後大小便不通此痰隔中焦氣聚下焦二陳加木通煎服再一服探吐之沈宗常治黎守溺不下或竄以藥益閉常曰結絡不解痰成癖法當吐果吐而溲如故孫琳路鈐本殿前司健兒善醫寧宗為郡王病淋日夜凡三百起國醫罔措有薦之者光宗時在東宫亟召之至孫求二十錢買大蒜淡䜴蒸餅三物爛研合和為丸令以溫水下三十丸且曰今日進三服病當退三分之一明日再進如之三日則病除已而果然奏官右列或問其說孫曰小兒何緣有淋只是水道不通利蒜豉皆通利無他巧也滑伯仁治一婦病艱於小溲中滿喘渴一醫投以瞿麥梔苓諸滑利藥而祕益甚診其脉三部皆弦而澀曰經云膀胱者州都之官津液藏焉氣化則能出矣所謂水出高源者也膻中之氣不化則水液不行病因於氣徒行水無益也法當治上焦乃製朱雀湯朱雀湯雄雀肉一隻肉赤小豆一合一人參一兩英赤茯苓一兩大棗一兩小麥兩紫石一兩紫菀五錢末逺志五錢水丹參五錢服甘草三錢雀丸和勻為粗每服三錢煎食逺溫河間朱茯神二兩硃砂五錢沈香五錢參湯下倍以枳桔煎用長流水一飲而溲再飲氣平數服病已東垣案渴此案不渴分在氣在血合前東垣案看之方知其妙一婦年六十餘病小溲閉若淋狀小腹脹口吻渴診其脉沉且澀曰此病在下焦血分隂火盛而水不足法當治血血與水同血有形而氣無形有形之疾當以有形法治之即以東垣滋腎丸服之而愈兩案一弦而澀一沈而澀以渴者屬氣分不渴者屬血分韓􅐂治一人淋素不服藥教以専啖粟米粥絶他味旬餘减月餘痊虞恆德治一老人年七十秋間患小便不通二十餘日百方不效後得一方取地膚草搗自然汁服之遂通地膚草單方葉名鐵掃帚雖至微之物而有回生起死之功故并載之吳茭山治一婦患淋瀝數而疼痛身煩躁醫以熱淋治之用八正散連子飲服之愈劇吳診脈沉數無力沉數為熱在血無力為虛在氣總歸虛熱不得用八正散知氣與火轉鬱於小腸故也遂與木通夌稿節車前子淡竹葉麥冬燈心甘草稍大腹皮之類服之而安蓋小腸乃多氣少血之經今病脈係氣鬱反用大黃梔苓味厚苦寒之藥故寒極傷氣病轉加矣殊不知血中有熱者乃有形之熱為實熱也氣中有熱乃無形之熱為虛熱也同一熱也而分在氣在血血中之熱為實氣中之熱為虛大有至理可悟建中老人治痘之法凡氣中有熱者當行清凉薄劑無不獲效更分氣血多少之經須辨溫凉厚薄之味審察病機斯無失也程沙隨苦血淋百藥無效偶閲本草因見白冬瓜治五淋於是日煮食之至七日而愈唐與正治吳巡檢病不得前溲卧則微通立則不能涓滴醫遍用通小腸藥不效唐因問吳常日服何藥曰常服黑錫丹問何人結砂曰自為之唐灑然悟曰是必結砂時鉛不死硫黃飛去鉛砂入膀胱卧則偏重猶可溲立則正塞水道以故不能通令取金液丹三百粒分為十服煎瞿麥湯下之膀胱得硫黃積鉛成灰從水道下猶纍纍如細砂病遂愈夷堅志夫硫黃之化鉛經方所載苟不察病源而以古方從事未見其可也鄞縣尉耿夢得妻苦砂石淋十三年每溺時器中剝剝有聲痛楚不堪一醫命採苦杖根俗呼為杜牛膝者淨洗碎之凡一合用水五盞煎耗其四而留其一去滓以射乳香末少許研調服之一夕愈本事方元戎載一人小溲不通一切利小水藥不效以其服附子太過消盡肺隂氣所不化師用黃連芩解毒而得通劉子安病腦疽服內托散後泄不止小便大不通亦消肺隂之過諸藥不效郭子明輩用木通五苓導之愈祕劉用陳皮茯苓生甘草之類肺氣下行遂通若止用利小便藥其不知本甚矣醫壘元戎王仲陽治一士人弱冠未婚病遺瀝日久每作虛寒脫泄治之益甚王診得六脈弦數難記至數形骨立不能支王曰此三焦不利膀胱蓄熱為五淋也患者曰膏血砂垢每溺則其痛不可言乃用局方五淋散加山梔子赤芍藥川木通瞿麥穗蚵蚾衣草滑石末作大劑入燈心二十莖煎服五七日全愈無奈頻發既而九日便溲俱不通祕悶欲死王即令用細灰於患人連臍𢃄丹田作一泥塘徑如碗大下令用一指厚灰四圍高起以新汲水調朴硝一兩餘令化漸傾入灰塘中勿令漫溢須臾大小便迸然而出溺中血條皆如指大若非熱解氣使則其如龜竅之小何由連出三四日惡物復得回生再令服黃連解毒丸前後二三載不下三四斤矣至今安然不發一男子患淋久囊大如毬莖如槌因服利藥多痛甚脈微弱如線以參茋歸术加肉桂元胡各一錢木通山梔赤芍赤茯苓甘草稍等藥一服痛稍減二服小溲利四服愈程明祐治昌江一人新娶夏日患淋濁澀痛投藥清利遂苦楚眼痛再服瀉心凉肝口苦下泄久之盜汗潮熱程診之脈緩弱無力左澀而微曰脈之緩而弱脾虛也澀而微者血不足也投以益元氣養血之劑病良已薛立齊治大尹劉天錫內有溼熱大便滑利小便澀滯服淡滲之劑愈加滴瀝小便腿膝皆腫兩眼脹痛此腎經虛熱在下焦淡滲導損陽氣隂無以化遂用地黃滋腎二丸小便如故更以補中益氣加麥冬五味兼服而康一儒者失於調養飲食難化胸膈不利或用行氣消導藥咳嗽喘促服行氣化痰藥肚腹漸脹服行氣分利藥睡卧不能兩足浮腫小便不利大便不實脉浮大按之微細兩寸皆短此脾腎虧損朝用補中益氣加薑附夕用金匱腎氣丸加骨脂肉果各數劑諸症漸愈再佐以八味丸兩月乃能步履却服補中八味半載而康博案以上二案舊刻前案佚其尾後案佚其首并作一案石山治一人形肥蒼白年五十餘病淋沙石澀痛醫用五苓或琥珀八正散之類病益加汪診脈皆濡弱而緩近駛曰此氣血虛也經曰膀胱者津液之府氣化出焉今病氣血虛不惟不能運化蒸溽而亦氣餒不能使之出也經又云血主濡之血少則莖中枯澀水道不利安得不淋醫用通利血愈燥氣愈傷矣遂用大補湯加牛膝煎服月餘病减仍服八味丸除附子加黃茋服半月餘安程仁甫治孚潭汪尚新之父年五十餘六月間忽小便不通更數醫已五日矣豫診其六脈沉而細曰夏月伏隂在內因用冷水凉藥過多氣不化而愈不通矣用五苓散倍加肉桂桂屬龍火使助其化也外用葱白煎水熱洗一劑頓通江篁南治一人年三十餘患淋數年每飲酒或勞役即發小溲紅日夜數十行㸃滴頻數且痛素嗜酸久藥不效診左手浮小而快右沉大近澀曰此氣血虛也經曰膀胱者津液之府氣化出焉今病氣虛不惟不能運化蒸溽而亦氣餒不能使之出也經又云血主濡之血少則莖中枯澀水道不利安得不淋况多服通利血愈燥氣愈傷矣又素嗜酸酸入于胃其氣澀以收上之兩焦弗能出入也不出則留胃中胃中和濕則下注膀胱之胞胞薄以濡得酸則縮捲約而不通水道不行故癃而澀內經曰酸多食之令人癃是也為用大補湯加牛膝煎服數劑稍愈乃製八味丸除附子加黃茋更以生甘草川練子人參延胡茯苓相間服而愈琇按此全襲石山謙甫兩案為一張文學道卿𫝊治血淋方獨蒜一枚山梔子七枚鹽少許三物共搗如泥貼患人臍上所親患血淋二年餘殊甚諸醫治之罔效一日張過視謾試以前方即時去紫黑血片碗許即愈濮陽𫝊云有便血淋者取旱蓮草水煎服隨愈少微述季父守信州時年五十餘值憂勞患身熱作嘔月餘脫肉破㬷小便淋瀝白如膏飴官醫凌生撿一按名曰膏淋用六君加逺志一服有竒功果依方一七而起祕結丹溪治一老人因內傷挾外感自誤汗後以補藥治愈脈尚洪數朱謂洪當作大論年高誤汗後必有虛症乃以參术歸茋陳皮甘草等自言從病不曽更衣今虛努迸痛不堪欲用利藥朱謂非實祕為氣因誤汗而虛不得充腹無力可努仍用前藥間以肉汁粥瑣陽粥啜之丹溪本草謂瑣陽味甘可食者煮粥尤佳補隂氣治虛而大便結燥又謂肉蓯蓉峻補精血驟用動大便滑濃煎葱椒湯浸下體下軟塊五六枚脈大未斂此血氣未復又與前藥二日小便不通小腹滿悶煩苦仰卧則㸃滴而出朱曰補藥未至倍參茋服二日小便通至半月愈虛祕用補法一婦産後祕結脈沈細服黃柏知母附子愈丹溪治其母年老多痰飲大便燥結時以新牛乳猪脂和糜粥中進之雖得暫時滑利終是膩物積多次年夏時鬱為黏痰發為脅瘡作楚甚困苦思而得節養之說時進參术等補胃補血之藥隨天令加减遂得大府不燥面色瑩潔因成一方用參术為君牛膝芍藥為臣陳皮茯苓為佐春加川芎夏加五味黃芩麥冬冬加當歸身倍生薑一日一貼或二貼小水才覺短少便進此藥小水之長如舊即是郤病捷法一婦年五十患小便澀治以八正散等劑小腸脹急不通治裏不效身如芒刺朱以所感霖淫雨濕邪尚在表此症脈必浮濡而不數不然身如芒刺屬濕火居多何以斷之為濕邪在表耶立齊一案時或身如芒刺亦作濕治因用蒼术為君附豫佐之發表一服即汗小便隨通汗法一人年八旬小便短澀分利太過致涓滴不出蓋飲食過傷其胃氣陷於下焦用補中益氣湯一服即通升法當琇案此入淋祕史載之治蔡元長苦大便祕國醫用藥俱不能通利蓋元長不肯服大黃故也時史未知名往謁之閽者齟齬久之乃得見既而診脈史欲出竒曰請求二十文錢元長問何為曰欲市紫菀耳史遂以紫菀末之而進須叟大便遂通元長驚異問故曰大腸肺之𫝊送今之祕結無他以肺氣濁耳紫菀能清肺氣是以通也自是醫名大著氣祕用消法北窗灸輠饒醫熊彥誠年五十餘病前後閉便溲不通五日腹脹如鼓同輩環視皆不能措力與西湖妙杲僧慧月善遣書邀致訣别月驚馳而往過釣橋逢一異客丰姿瀟灑揖之曰方外高士何孑孑走趨如此月曰一善友久患祕結勢不可療急欲往問耳客曰此易療也待奉施一藥即脫靴入水探一大螺而出曰事濟矣持抵其家以鹽半七和殼生搗碎置病者臍下一寸三分用寬布緊繫之仍辦觸器以須其通熊昏不知人妻子聚泣曽未安席砉然暴下而愈月歸訪異人無所見矣熱祕用清法類編王克明治胡秉妻便祕腹脹號呼踰旬克明視之時秉家方㑹食王曰吾愈之使預㑹可乎以半硫丸碾生薑調乳香下之俄起對食如常冷祕用溫法虞恆德治一婦年五十餘身材瘦小得大便燥結不通飲食少進小腹作痛虞診之六脈皆沉伏而結澀作血虛治用四物湯加桃仁麻仁煨大黃等藥數服不通反加滿悶與東垣枳實導滯丸及備急大黃丸等藥下咽片時即吐出蓋胃氣虛而不能久留性速之藥耳遂以備急大黃丸外以黃蠟包之又以細針穿一竅令服三丸蓋以蠟匱者制其不犯胃氣故得出幽門逹大小腸也明日下燥屎一升許繼以四物湯加減作湯使吞潤腸丸如此調理月餘得大便如常飲食進而安血祕用下法一男子因出痘大便閉結不通兒醫云便實為佳兆自病至痘瘡愈後不如厠者凡二十五日肛門連大腸痛甚叫號聲徹四鄰用皂角末及蜜煎導法服以大小承氣湯及枳實導滯丸備急丸皆不效計無所出虞曰此痘瘡餘毒鬱熱結滯於大小腸之間而然以香油一大盞令飲自朝至暮亦不效乃令婢者口含香油以小竹筒一箇套入肛門以油吹入過半時許病者自云其油入腸內如蚯蚓漸漸上行再過片時許下黑糞一二升止困睡而安毒祕薛已治一儒者大便素結服搜風順氣丸後胸膈不利飲食善消面𢃄陽色左關尺脈洪大而虛薛曰此足三隂虛也彼不信乃服潤腸丸大便不實肢體倦怠與補中益氣六味地黃丸月餘而驗年許而安若脾肺氣虛者用補中益氣湯若脾經鬱結者用加味歸脾湯若氣血虛者用八珍湯加肉蓯蓉若脾經津液涸者用六味丸若發熱作渴飲冷者用竹葉黃芩湯若燥在直腸用猪膽汁𨗳之若肝膽邪侮脾者用小柴胡加山梔郁李枳殼若膏粱厚味積熱者用加味清胃散亦有熱燥風燥陽結隂結者當審其因而治之若復傷胃氣多成敗症一老儒素有風熱飲食如常大便十七日不通肚腹不脹兩尺脈洪大而虛此隂火內爍津液用六味丸二十餘劑至三十二日始欲去用猪膽潤而通利如常一婦年七十三痰喘內熱大便不通兩月不寐脈洪大重按微細此屬肝肺腎虧損朝用六味丸夕用逍遙散各三十餘劑計所進飲食百餘碗腹始痞悶乃以猪膽汁導而通之用十全大補調理而安若間前藥飲食不進諸症復作一男子年五十餘因怒少食大便不利服潤腸丸大便祕結胸脅作痛欲兼服脾約丸肝脾腎脈浮而澀薛曰此足三隂精血虧損之症也東垣先生云若人胃强强為邪强脾弱約束津液不得四布但輸膀胱小便數而大便難者用脾約丸若人隂血枯槁內火燔灼肺金受邪土受木傷脾肺失𫝊大便祕而小便數者用潤腸丸今滋其化源則大便自調矣如法果驗一儒者懷抱憂鬱大便祕結食少乃傷脾之變症也博按薛氏原本云一儒者懷抱鬱結復因場屋不遂發熱作渴胸膈不利飲食少思服清熱化痰行氣等劑前症益甚肢體倦怠心脾二脈澀滯乃鬱結傷脾之變症也遂用加味歸脾湯治之飲食漸進諸症漸退但大便尚澀面顴赤色此肝腎虛火內傷隂血用八珍湯加蓯蓉麥冬五味至三十餘劑大便自潤一男子患症同前服大黃等藥泄瀉便血遍身黑黯薛視之曰此隂陽二絡俱傷也經云陽絡傷則血外溢隂絡傷則血內溢此不治也已而果然職方陳莪齊年踰六旬先因大便不通服內疏等劑後飲食少思胸腹作脹兩脅作痛琇按脅痛必由內疏所傷形體倦怠兩尺浮大左關短澀右關弦澀尺當沈今浮大右關當微洪而反弦澀左關當弦而反澀症斷不起時五月請治薛曰此命門火衰不能生脾土而肺金又剋肝木恐金旺之際難起矣果然汪石山治一婦因改醮乘轎勞倦加以憂懼成婚之際遂病小腹脹痛大小便祕結不通醫以硝黃三下之隨便隨閉病增胸膈胃脘脹痛自汗食少汪診之脈皆濡細近駛心脈頗大右脈覺弱汪曰此勞倦憂懼傷脾也蓋脾失健運之職故氣滯不行以致祕結今用硝黃但利血而不能利氣遂用人參二錢歸身錢半陳皮枳殼黃芩各七分煎服而愈江汝潔治一人患前後閉三四日且不能食甚危急江視之曰頭痛耳鳴九竅不利腸胃之所生也經曰北方黑色入通于腎開竅於二隂藏精于腎精不足則二便難以瑣陽三錢酒洗焙乾為末煮粥强與服之是晚二便俱利飲食亦進江應宿治從姪婦患祕結因産後月餘如厠忽跨痛如閃大小便不通已經四五日雜進通利淡滲之藥罔效豫適歸倉惶告急云前後脹腫手不敢近近之則愈痛雖不見脈知其形氣病氣俱實與桃仁承氣湯加紅花一劑暴下而愈黃疸琇按是病多謂濕熱蒸鬱脾胃而成然有肝熱𫝊疸者肝熱移脾者又有燥火便祕宜下者東垣治一人年六十二素有脾胃虛損病目疾時作身面目睛俱黃小便或黃或白大便不調飲食減少氣短上氣怠惰嗜卧四肢不收至六月中目疾復作醫以瀉肝散下數行而前疾增劇李謂大黃牽牛雖除濕熱而不能走經絡妙下咽不入肝經先入胃中大黃苦寒重虛其胃牽牛其味至辛味辛者為金用尅肝木則可經曰肺病無多食辛能瀉氣重虛肺本嗽大作蓋標實不去本虛愈甚加之適當暑雨之際素有黃症之人所以增劇也此當于脾胃肺之本臟㵼外經中之濕熱製清神益氣湯主之茯苓升麻各二分澤瀉蒼术防風各三分生薑四方瀉濕熱而補脾胃此藥能走經除濕熱而不守故不瀉本臟經臟二字妙絶當熟玩補肺與脾胃本臟中氣之虛弱琇按江氏元本止此今考東垣脾胃論此方凡分作三段江或誤認為三方故節去下二段耳為補刋于後青皮一分橘皮生甘草白芍藥白术各二分人參五分此藥皆能守本而不走經不走經者不滋經絡中邪守者能補臟之元氣黃蘗一分麥冬二分人參二分五味子三分琇按第二假已用人參五分此段復用人參二分似悮然觀後發明云救以生脉散則配方本意如此非重出也江氏或緣此悮認為三方耳此藥去時令浮熱濕蒸右件銼如麻豆大都作一服水二盞煎至一盞去柤稍熱空心服火熾之極金伏之際而寒水絶體於此時也故急救以生脈散除其濕熱以惡其太甚肺欲收心苦緩皆酸以收之心火盛則甘以瀉之故人參之甘佐以五味子之酸孫思邈云夏月常服五味子以補五臟氣是也麥門冬之微苦寒能滋水之源於金之位而清肅肺氣又能除火刑金之嗽而斂其痰邪復微加黃蘗之苦寒以為守位滋水之流以鎮墜其浮氣而除兩足之痿弱也羅謙甫治兀顔正卿二月間因官事勞役飲食不節心火乘脾火生土火甚亦能侮土脾氣虛弱又以恚怒氣逆傷肝心下痞滿四肢困倦身體麻木熱傷氣故麻木次𫝊身目俱黃微見青色顔黑初起顔黑故可治色黑濕也心神煩亂怔忡不安兀兀欲吐口生惡味飲食遲化時下完榖小便癃閉而赤黑濕熱故小便祕辰巳胃脾間發熱日暮則止至四月尤盛羅診其脈浮而緩金匱要略云寸口脈浮為風緩為痺痺非中風四肢苦煩脾色必黃瘀熱已行跌陽脈緊為傷脾風寒相搏食榖則眩榖氣不消胃中苦濁濁氣下流小便不通隂被其寒熱流膀胱身體盡黃名曰榖疸榖疸寒熱不食食則頭眩心胸不安小便難久久發黃此風寒相搏榖氣不消胃中苦濁小便不通熱流膀胱所致以茵陳葉一錢茯苓五分梔子仁蒼术去皮炒白术各三錢生黃芩六分黃連枳實猪苓去皮澤瀉陳皮漢防已各二分青皮去白一分作一服以長流水三盞煎至一盞名曰茯苓梔子茵陳湯一服减半二服良愈內經云熱淫於內治以鹹寒佐以苦甘又濕化于火熱反勝之治以苦寒以苦泄之以淡滲之以梔子茵陳苦寒能㵼濕熱而退其黃故以為君難經云苦主心下滿以黃連枳實苦寒泄心下痞滿肺主氣今熱傷其氣故身體麻木以黃芩苦寒瀉火補氣故以為臣二术苦甘溫青皮苦辛溫能除胃中濕熱泄其壅滯養其正氣漢防已苦寒能去十二經留濕澤瀉鹹平茯苓猪苓甘平導膀胱中濕熱利小便而去癃閉也至元丙寅六月時雨霖霪人多病溼瘟真定韓君祥因勞役過度渴飲凉茶及食冷物遂病頭痛肢節亦疼身體沉重胸滿不食自以為外感內傷用通聖散二服添身體困甚醫以百解散發其汗汗越四日以小柴胡湯二服復加煩熱躁渴又六日以三一承氣湯下之下躁渴尤甚又投白虎加人參柴胡飲子之類清病愈增又易醫用黃連解毒湯硃砂膏至寶丹之類至十七日後病勢轉增𫝊變身目俱黃肢體沉重背惡寒皮膚冷心下痞硬按之則痛心下痛按之硬手少隂受寒足少隂血滯執按之而痛為實則誤眼澀眼澀為濕毒不欲開目睛不了了懶言語自汗小便利大便了而不了此痞痛按之痛為隂症故小便利大便了而未了理中湯佳羅診其脈緊細寒按之空虛下焦無陽也兩寸脈短不及本位此證得之因時熱而多飲冷加以寒凉寒藥過度助水乘心反來侮土先囚其母後薄其子經云薄所不勝乘所勝也時值霖雨乃寒濕相合此為隂症發黃明也身無汗際頸而還小便不利則發黃今身自汗小便利而發黃明屬寒濕羅以茵陳附子乾薑湯主之茵陳附子乾薑湯附子皮乾薑瀉半夏實草豆䓻澤枳茵陳白术使陳生薑內經云寒淫於內治以甘熱佐以苦辛濕淫所勝平以苦熱以淡滲之以苦燥之附子乾薑辛甘大熱散其中寒故以為主半夏草豆蔲辛熱白术陳皮苦甘溫健脾燥濕故以為臣生薑辛溫以散之澤瀉甘平以滲之枳實苦微寒泄其痞滿茵陳苦微寒其氣輕浮佐以薑附能去膚腠間寒濕而退其黃故為佐使也煎服一兩前症减半再服悉去又與理中湯服之數日氣得平復或者難曰發黃皆以為熱今暑隆盛之時又以熱藥治之而愈何也此一辨不可少羅曰主乎理耳成無已云隂症有二一者始外傷寒邪隂經受之或因食冷物傷太隂經也一者始得陽症以寒治之寒凉過度變陽為隂也今君祥因天令暑熱冷物傷脾過服寒凉隂氣太勝陽氣欲絶加以隂成寒濕相合發而為黃也仲景所謂當於寒濕中求之李思順云解之而寒凉過劑瀉之而逐寇傷主正以此耳聖賢之制豈敢越哉或曰潔古之學有自來矣劉宗厚治趙顯宗病傷寒至六七日因服下藥太過致發黃其脈沈細遲無力皮膚凉發躁隂極發躁欲于泥中卧喘嘔小便赤澀先投茵陳橘皮湯次第用藥之法喘嘔止次服小茵陳湯半劑脈微出脈微出者生不欲于泥中卧次日又服茵陳附子湯半劑四肢發熱小便二三升用附子而小便長當日中大汗而愈似此治愈者不一一録凡傷寒病黃每遇太陽或太隂司天嵗若下之太過往往變成隂黃蓋辰戌太陽寒水司天水來犯土丑未太隂濕土司天土氣不足即脾胃虛弱亦水來侵犯多變此證也虞恆德治一人年三十餘得榖疸症求治以胃苓湯去桂加茵陳數十貼黃退自以為安不服藥十數日後至晚目盲不見物虞曰此名雀目蓋濕痰盛而肝火有餘也用獖猪肝煮熟和夜明砂作丸服之目明如故來謝虞曰未也不早服制肝補脾消痰之劑必成蠱脹疸成蠱脹伊不信半月後腹漸脹痞滿復求治仍以胃苓湯倍二术加木通麥冬煎湯下褪金丸一月而安江篁南治一人夏月患食疸面目俱黃如金頭痛如破小溲澀難多汗用車前草搗汁調益元散服之小溲即利先瀉濕熱乃與補中益氣湯一貼汗少止後補元氣繼以人參白虎湯竹葉石膏湯合服之頭痛亦止諸症多平惟黃未盡退乃以流氣清熱之劑治之愈猶子三陽患疸症皮膚目睛皆黃小溲赤左脈弦而數右三部原不應指今重按之隱隱然指下證見午後發熱濕熱變瘧五更方退兼隂瘧以茵陳五苓散除桂加當歸梔子黃柏柴胡數服繼用人參養榮湯乃八物除芎加茋陳皮五味薑棗兼人乳童溲熱退三日已而復作間日發於午後肌熱灼指脈近弦乃作瘧治之而愈後數年復患目睛黃午飯難尅化則小溲黃以黃茋建中湯除桂加白术陳皮茯苓半夏神曲麥牙薑少許而退兖山汪兖渠之內年十八因以冷水洗澡𢃄濕卧簟坐冷石致腹痛甚腹痛為寒醫疑經滯用破血行經之藥不效更醫用附子理中湯加桂痛稍定次日躁擾譫言不知人醫以補中加寒凉藥二三服乃覺身熱面目發黃頭暈小溲黃如金色濕月事如常但少耳所苦午後發熱咽㗋不清常作聲咳嗽初秋江診之脈左右皆浮大而駛而右尤躁疾方以蒼白术茵陳澤瀉茯苓猪苓柴胡黃蘗梔子薑皮等藥次日脈稍平以陳皮桔梗元參併前方出入增損數服而愈揚州吳世德患胸腹作滯小溲黃澀目睛黃甚惡風鼻塞飲食作惡暑月江診左脈沉小而緩右頗大而弦脾部帶滑乃食傷太隂為食疸症也兼風寒外襲法宜䟱利消導以防風蒼术茵陳蘇葉陳皮茯苓猪苓澤瀉枳實薑葱煎服夜來小溲頗長早因驚悸出汗一時許乃用五苓去桂加滑石茵陳合平胃散四服胸膈寬小溲色漸淡而長面目皮膚黃漸退臨卧㗋口作乾大便燥口臭前方減厚朴蒼术加白术數服而愈癍疹丹溪治一乳孩因胎毒兩腋生癤後腹脹發赤疹如霞片以剪刀草汁調原蠶砂敷之愈滄州翁二條滑伯仁一條見傷寒類完顔小將軍病寒熱間作腕後有癍三五㸃鼻中微血出兩手脈沉澀胸膈四肢按之無大熱無大熱此內傷寒也問之因暑卧殿角傷風又渴飲冰酪水此外感者輕內傷者重從內病俱為隂也見斑鼻衄斷為隂甚妙故先癍衄後顯內隂寒熱間作脾亦有之非往來少陽之寒熱也與調中湯數服而愈調中湯治內傷外感而發隂癍蒼术一錢五分陳皮一錢砂仁藿香白芍炙甘草桔梗半夏白芷羌活枳殼各一錢川芎麻黃桂枝各五分生薑三片水煎服方見玉機微義江篁南治章祁一人年十五因伐木受濕夏間裁遇熱汗衣則皮膚發紅疹隱隱如布粟狀少取凉汗收則疹漸沒素有腸鳴之症自患前恙則腸不復鳴矣江曰此症雖有隂陽輕重俱從火化此無根失守之火聚於胸中上獨熏肺蓋肺主氣主皮毛遇熱汗衣傷之則傳於皮膚而為疹矣取凉汗收而疹沒者火散而疹自退承乃制之義也腹中鳴乃火擊動其水昔有而今無者火從中達外也若不節食絶欲早拔其根他日恐成癘風也其人食欲不能節已而果成癘風不治風疸唐與正治姪女年數嵗得風疸疾先發於臆迤邐延上赤腫痛癢醫以上膈風熱治之亦不逺不效唐診之曰是肝肺風熱盛極耳以升麻羌活荆芥鼠黏子赤芍藥淡竹葉桔梗乾葛八物治之自下漸退而腫聚於頂其高數寸雖飲食寢處無妨而疾未去也唐母吳夫人曰此女乳母好飲熱酒至并啜其糟疾殆因是歟唐方悟所以至頂不消之由思之惟乾葛消酒且能療火毒乃以先方加葛三倍使服之二日腫盡去夷堅志齊王太后病召臣意入診脈曰風疸客脬注云脬膀胱也言風疸之病客居在膀胱難於大小溲腎主二便與膀胱為表裏溺赤濕生熱臣意飲以火齊湯即黃連解毒湯或云川連一味為火齊湯一飲即前後溲再飲病已溺如故病得之流汗出潃音巡潃者去衣而汗晞也去衣汗晞風濕應肺受之蓋肺主通調水道而移于膀胱故曰客也所以知齊王太后者臣意診其脈切其太隂之口肺部溼然風氣也脈法曰沈之而大堅浮之而大緊者病主在腎腎切之而相反也脈大而躁大者膀胱氣也躁者中有熱而溺赤史記四肢病琇按經曰脾病則四肢不用諸案所列類多瘍症華他别傳曰琅琊有女子右股上有瘡癢而不痛愈而復作他曰當得稻糠色犬繫馬頓走出五十里斷頭向癢乃從之須臾有蛇在皮中動以鐵橫貫引出長三尺許七日愈獨異志羅謙甫治真定張大年近三十素嗜酒至元辛未夏間病手指節腫痛屈伸不利膝臏亦然心下痞滿身體沉重不欲飲食食即欲吐面色痿黃精神減少病近月餘羅診其脈沈而緩緩者脾也難經云腧主體重節痛腧者脾之所主四肢屬脾蓋其人素飲酒加之時助溼氣大勝流於四肢故為腫痛內經云諸溼腫滿皆屬脾土仲景云溼流關節肢體煩痛此之謂也宜以大羌活湯主之內經云溼淫於內治以苦溫以苦發之以淡滲之又云風能勝溼羌活獨活苦溫透關節而勝溼故以為君升麻苦平威靈仙防風蒼术苦辛溫發之者也故以為臣血壅而不流則痛當歸辛溫以散之甘草甘溫益氣緩中澤瀉鹹平茯苓甘平導溼而利小便以淡滲之也使氣味相合上下分散其溼也一人兩足心凸如腫硬如釘脛骨生碎孔流髓身發寒戰惟思飲酒症見寒戰飲酒亦竒此肝腎氣冷熱相吞用川烏炮為末傅之溫以行之內煎韭菜湯服之愈行瘀溫散一人四肢節脫但有皮連不能舉動名曰筋解症竒用黃蘆酒浸一宿焙為末酒下二錢多服而安一人手指臂曲骨節間痛不可忍漸至斷落以萆麻子去殼二兩碎者不用黃連四兩貯瓶內水二升浸之春夏三日秋冬五日每早面東以此水吞下萆麻子一粒漸加至四五粒微泄無害忌食動風物屢效症竒治亦竒葛可久治同郡富人女年可十七八病四肢痿痺不能自食目瞪衆醫莫能治葛視之笑曰此不難治乃令悉去房中香奩流蘇之屬發地板掘土為坎舁女子其中扄其扉戒家人俟其手足動而作聲當報我久之手足果動而呼投藥一丸明日自坎中出矣蓋此女平日嗜香而脾為香氣所蝕故也吹劍續録趙宜真曰豫一故人曽患鼓椎風往來寒熱數月伏枕諸藥不能療最後一醫士診之曰雖成痼疾而有客邪在少陽經未解若曽服五積散則誤矣詢之果然因投小柴胡湯數服寒熱頓除却用本料追風丸等藥理其風證而全瘳矣趙宜真明初人徐文中以醫名吳中鎮南王妃卧病不可起文中入診視王曰疾可為乎對曰臣以針石加於玉體不痊其安用臣遂請妃舉手足妃謝不能文中因請診候按手合谷曲池而針隨以入妃不覺知少選請舉如前妃復謝不能文中曰針氣已行請舉玉手妃不覺為一舉請舉足足舉王大悅明日妃起坐王大設宴賜聲震廣陵一女子年十六嵗四腕軟皮處生惡物如黃豆大半在內紅紫色痛甚諸藥不效方士教買水銀四兩以白綿紙二張揉熟蘸水銀擦之三日愈一人發寒熱四肢堅硬如石擊之有鐘磬聲目黃瘦用茱萸木香等分水煎一二服愈有人患人面瘡多在股上其形似人面有口眼傅藥上即食之與飲食亦然一日將貝母末傅即密口不受遂拉之瘡口數次遂愈江左有商人左膊上有瘡如人面亦無他苦商人戲滴酒瘡口中其面亦赤色以物食之亦能食食多則覺膊內肉脹起或不食之則一臂痺有善醫者教其歷試諸藥金石草木之類悉無所苦至貝母其瘡乃聚眉閉口其人喜曰此藥可治也因以小葦筒投其口灌之數日成痂遂愈本事方薛立齊治一婦人素清苦四肢患血風瘡誤用敗毒寒凉晡熱內熱自汗盜汗月經不行口乾咽燥此鬱結傷脾四肢者脾主之用歸脾湯數劑後兼逍遙散五十餘劑而愈一人手十指斷壞惟有筋連無節肉內蟲出如燈心長數尺遍身緑毛名血餘用茯苓胡黃連煎服愈作溼熱治兼殺蟲有人患腳瘡冬月頓然無事夏月臭爛疼痛不可言一道人視之曰爾因行草上惹著蛇交遺瀝瘡中有蛇兒冬伏夏出故疼痛也以生蝦蟆搗碎傅之日三四換凡三日有一小蛇自瘡中出以鐵鉗取之其病遂愈托青雜記一人左手無名指瓜角生一小瘡初起麻粒大用小刀挑開瘡頭血出如溺不止一日長出肉瘤如菌裹指頂內開一孔如眼目轉動此疔毒也以艾灸四十壯不知疼痛癢復烙之翦去肉瘤敷拔疔散外以膏藥貼之內服解毒七日全愈一人手足甲忽然長倒生肉刺如錐食葵菜自愈荆州處士侯又𤣥嘗出郊厠于荒冢上及下跌傷其肘創甚行數百步逢一老人問何所苦也又𤣥具言且見其肘老人言偶有良藥可封之十日不開必愈如其言及解視一臂遂落又𤣥兄弟五六人互病病必出血月餘兄兩臂忽病瘡六七處小者如榆錢大者如錢皆成人面酉陽雜爼程山人孺文見一人手生了枝痛苦無奈一醫用通草為末以雞蛋清調塗上即消馬嗣明從駕往晉陽至遼陽山中數處見榜云有人家女病若有能治瘥者購錢十萬名醫多至問病狀不敢下手惟嗣明獨治之其病由云曽以手將一麥穟即見一赤物長三寸似蛇入其手指中因驚怖倒地即覺手臂疼腫漸及半身俱腫疼不可忍呻吟晝夜不絶嗣明為處方服湯比嗣明從駕還女平復北齊書正德間神樂觀陸道士生人面瘡在足外臁瘡口似唇而有舌無齒能言且索食但開口時必大痛垂絶口閉復蘇飲之以酒則四周皆紅啖以脂膏亦能消爍食畢則閉疼乃稍可但流膿血不止每日一度或二度其發無常極受苦楚貝母亦不能療如是者一年人問故答曰年十七時夜與本房老僕忿爭毆之死房後地曠而風烈吾師急聚薪焚之天明無知者今經十年瘡自言僕也忽七日不言以為將瘥矣有兄在牛首寺為僧因往訪之在寺幾半月忽復言痛絶尤甚曰我才出數日汝即避我使我尋之苦也雖然寃亦解矣汝明日下山遇一樵者可拜求治之明日果遇樵者懇焉樵者厲聲怒曰業畜敢言我也去半夜療汝忽不見恍然回觀夜夢金甲神人胸挂赤心忠良四字謂曰藥在案上可煎湯服以左手持藥查出水西門外第二十家門首有婦人撥水者即棄于道而返覺起視案有物如亂髮而無端者江云如亂髮者疑是青遂如戒果見婦人棄之歸瘡遂愈自後屢探本婦竟無他不知此何故也見聞紀訓吳江一農夫兩股赤腫痛甚不能坐立一醫與之剖開中有小蛤蜊四箇取出遂愈五湖漫聞有人腋下體氣五更時用精肉二片以甘遂末一兩拌之挾腋下至天明以生甘草一兩煎湯飲之良久瀉出穢物須在荒野之處恐𫝊他人依法三五次即愈虛弱者間為之外用搽藥枯礬一兩二錢輕粉五錢麝香一錢蜜陀僧二兩童便一碗浸鍛便盡為度各為細末津液調傳兩腋下無輕粉以海螵蛸代癘風李東垣治一人病癘風滿面連鬚極癢眉毛脫落須用熱水沃之稍緩或砭刺亦緩風論中云夫癘者榮衛熱胕其氣不消故鼻柱壞而色敗皮膚瘍潰風寒客於脉而不去名曰癘風當刺其腫上先刺以鋭針刺其處按出惡氣腫盡乃止宜蔬食糲飯用藥當破血去熱升陽去癢瀉榮以辛冷散之甘溫升之行陽明經瀉心火補肺氣乃治之正也升麻連翹各六分蘇木當歸全蝎黃連地龍黃茋各三分生黃芩四分甘草五分人參二分生地黃四分桃仁三枚桔梗五分麝香少許胡桐淚一分虻蟲去翅足微炒水蛭二箇炒令烟盡去子杵碎用石灰炒紫黃色去灰用之水蛭慎用製不得法入腹生子右銼除連翹另銼胡桐淚研白豆䓻二分為細末二味另放麝虻蟲水蛭三味為細末另放外都作一服水二盞酒一匙入連翹煎至一盞六分再入白豆蔲二味並麝等三味再煎一二沸去查稍熱早飯後午飯前服忌酒溼麵生冷硬物博按此案舊刻脫悮張子和治一人病癘風十餘年曰足有汗尚可治當發汗其汗當臭涎當腥以三聖散吐之大吐汗果臭痰腥如魚涎次以舟車丸濬川散下五七次數服乃安一人病風爬搔不已眉毛脫落刺其面大出血如墨刺三次血變色每刺自額至頤䤵針上下俱刺間日一次至二十餘日方已吕滄洲治一女子病癘診其脉來疾去遲上虛下實蓋得之酒醉接內而風毒乘之今雖髮秃眉墮然鼻根幸未陷肌肉幸未死遂以防風通聖散加以下藥下瘀血數升及蟲穢青黑等物并進蘄蛇長松等湯丸復佐以雄黃大楓子油作膏摩之逾月瘥丹溪治一貧婦寡居病癩曰是疾世號難治者不守禁忌耳是貧婦而無厚味寡而無欲庶幾可療也即自具藥治之後復投四物湯數百劑遂不發動一人面浮油光微腫色變眉脫癢二世癘風死者三人與醉仙散出涎水如盆而愈琇案此趙以德案一人面腫色變黑燥癢眉髮脫落手足皮燥厚拆痛癢無全膚有時癢入骨髓爬至血出稍止復作晝夜不眠與醉仙丹再造丸二藥而愈一婦兩足脛瘡潰眉落與再造散一服愈年少不能斷欲忌口一年復發其前二人不發者亦非能如法調攝由病得之未深鼻柱未壞瘡未潰腐故耳故人抱病不可不早治也羅謙甫治段庫使春初病大風滿面連頸極癢眉已脫落須以熱湯沃之則稍緩晝夜數次沃之或砭刺亦緩先師曰脈風者癘風也榮衛熱胕其氣不清故使鼻柱壞皮膚色敗大風者風寒客於脈而不去治之當刺其腫上以鋭針針其處按出其惡氣腫盡乃止瀉心火補肺氣方見東垣治案釋普明齊州人久止靈巖晚遊五臺得風疾眉鬚俱墮百骸腐潰哀號苦楚忽有異人教服長松明不知識復告之云長松生古松下取根餌之皮色如薺苨長三五寸味微苦類人參清香可愛無毒服之益人兼解諸蟲毒明採服旬日毛髮俱生顔貌如故今并代間土人多以長松雜甘草乾山藥為湯煎服甚佳然本草及諸方書皆不載獨釋慧祥作清凉𫝊始序之澠水燕談泉州有客盧元欽染大風惟鼻根未倒屬端午官取蚺蛇膽欲進或言肉可治風遂取一截蛇肉食之三五日頓漸可百日平復朝野僉載商州有人患大風家人患之山中為起茅舍有烏蛇墜酒罌中病人不知飲酒漸瘥罌底見蛇骨方知其由一僧得病狀如白癩卒不成瘡但每旦取白皮一升許如蛇蛻醫者謂多啖炙煿所致與局方解毒雄黃丸三四服愈趙瞿病癩歷年醫不愈乃齎糧送棄於山穴中瞿自怨不幸吁嗟歎泣經月有仙人經穴見而哀之具問其詳瞿知其異人叩頭自陳乞命於是仙人取囊中藥賜之教其服百餘日瘡愈顔色悅肌膚潤仙人再過視之瞿謝活命之恩乞遺其方仙人曰此是松脂彼中極多汝可煉服之長服身轉輕力百倍登危涉險終日不困年百嵗齒不墮髮不落夜卧常見有光如鏡枹朴子高駢鎮維揚之嵗有術士之家延火燒數千户主者録之當死臨刑謂監刑者曰某之愆一死何以塞責然某有薄技可以傳授一人俾其救濟後人死無恨矣時駢延待方士如飢渴監刑者即緩之馳白於駢駢召入親問之曰某無他術唯善醫大風駢曰何以核之對曰但於福田院選一最劇者可以試之遂如言乃置患者於隙室中飲以乳香酒數升則懵然無知以利刀開其腦縫挑出蟲可盈掬長僅二寸然後以膏藥封其瘡口别與藥服之而更節其飲食動息之候旬餘瘡盡愈才一月眉髮已生肌肉光淨如不患者駢禮術士為上客玉堂間話真臘國人尋常有病多入水浸浴及頻頻洗頭便自痊可然多病癩者比比道途間土人雖與之同卧同食亦不校或謂此中風土有此疾曽有國主患此疾故人不之嫌以愚意觀之往往好色之餘便入水澡浴故成此疾聞土人色欲才畢入水澡洗其患癩者十死八九亦有貨藥於市者與中國不類不知其為何物更有一等師巫之屬與人行持尤可笑說選江云南人或因縱酒居處卑溼或以蓋酒甕被以蓋身一夜遂成是疾者有之不可不知也癰腫汪石山治一人肥短紫淡年逾三十因勞感濕兩腿膝間結核痛甚醫用蒜片艾灸又針大敦肝穴三隂交脾穴又以藥水洗之遂致隂囊腫脹如升莖皮腫如水泡復進人參敗毒散皆不中病汪診之脉皆濡緩而弱略駛濡緩弱為陽為虛駛為熱宜石山之變例治也若見弦數大之脉又當别論不可執此一案為法也曰此濕氣乘虛而入鬱而為熱成結核也理宜補中行濕可免後患月餘左腿內臁厥隂經分腫痛如碗惡寒發熱復用蒜灸六日後腫潰膿出體倦頭面大汗手足麻木瘡下又腫如碗寒熱大作始信用人參三錢黃茋三錢白术錢半歸身尾牛膝茯苓各一錢青皮黃柏各七分甘草節五分煎服五六貼右額羊矢穴分腫痛長五寸許亦作寒熱醫謂補塞太過欲改前方彼不信鋭意服前藥月餘腫皆膿潰成痂而愈惟左腳委中筋急短縮艱於行步彼以為躄汪曰膿血去多筋失所養故也藥力足日當不躄矣果驗後覺隂囊腫縋他醫加茴香吳茱萸治疝等藥不效汪適至彼令守前方減去治疝等藥加升麻一錢服一二貼囊即縮彼願詳言之汪曰經云營氣不從逆於肉理乃生癰腫又云受如持虛蓋謂氣餒行遲血少留滯則阻逆肉理乃作癰腫也久則鬱而為熱化肉腐筋而成膿矣腫在厥隂雖曰多血亦難供給日之所耗夜之所損故邪乘虛留結不散如持虛器而受物也身之氣血如風與水風疾水急則頽陂潰隄莫之能禦風息水細則沙障石壅多所阻礙矣故今補其氣血使氣壯而行健血盛而流通又何腫之不散結之不行哉彼曰理也疣贅狄仁傑并州太原人性好醫藥尤妙針術顯慶中應制入關路傍有榜云有兒鼻端生贅如拳石綴鼻根蒂如筋痛楚危急能療之者酬千金狄公為腦後下針疣贅應手而落其父母輦千縑為夀此條已見前鼻門薛已治一老儒眉間患此二年後其狀如紫桃下墜蓋目按之如水囊刺出膿血目即開張以炒黑膽草山梔芎歸芍藥柴胡白术茯苓等類而愈一婦左項腫如雞卵不作痛不變色勞則發熱怒則寒熱經候不調三年矣用加味逍遙散加味歸脾湯間服間以削之佐以海藻散堅丸年許而消一男子鬱怒房勞左脅腫贅如赤桃服流氣化痰之藥其大愈甚虛症悉具此肝腎過虛也用前藥及地黃丸而消儒者朱宏仁年二十餘右手背近中指患疣五枚中一大者如黃豆餘皆如聚黍拔之如絲長三四寸許此血燥筋縮用清肝益榮湯五十餘劑而愈一婦人左手背并次指患五六枚如熟椹薛曰此因肝經血熱也果月經素不及期當生血凉血為主不信乃用艾灸手脹發熱手指皆攣兩腋項兼胸乳間皆患疣經行無期薛用加味逍遙散加黃連十餘劑各患漸愈乃去黃連百餘劑經行如期再用地黃丸三料而全消有人患此用知蛛絲纏七日消爛屢驗焦氏筆乘瘤臨川有人瘤生頰間癢不可忍每日火烘炙則差止已而復然苦甚一醫告之曰此真虱瘤也當剖而出之取油紙圍頂上然後施砭瘤方破小虱湧出無數最後一白兩黑兩大虱皆如豆殼中空空無血與頰了不相干略無瘢㾗但瘤所障處正白耳丁志浮梁李生得背癢疾隱起如覆盆無所痛苦惟竒癢不可忍飲食日減無能識其為何病醫秦德立見之曰此虱瘤也吾能治之取藥傅其上又塗一綿𢃄繞其圍經夕瘤破出虱斗許皆蠢蠕能行動即日體輕但一竅如箸端不合時虱湧出不勝計竟死唐小說載賈魏公鎮滑臺日州民病此魏公云世間無藥可療惟千年木梳燒灰及黃龍浴水乃能治耳正與此同處士蒯亮言其所知額角患瘤醫為剖之得一黑石碁子巨斧擊之不傷缺復有足脛生瘤者因至親家為猘犬所齗正齧其瘤其中得針百餘枚皆可用疾亦愈稽神録薛已嘗治一男子小腹患此膿水淋漓用補中益氣加麥冬五味以培脾土六味地黃丸以生腎水更用蘆薈丸以清肝火而斂腫癭安康伶人刁俊朝其妻巴嫗項癭初若雞卵漸巨如升積五年大如數斛之鼎重不能行有聲如音樂積數年癭外生小穴如針芒者不知幾千億每天隂欲雨則穴中吹白烟霏霏如絲縷漸高布散結為屯雲雨則立降其家少長懼之咸請逺送巖穴妻懼送請決拆之俊朝即淬利刃將及之中軒然有聲遂四分披裂有一大猱跳躍而去即以白絮裹之癭疾頓愈時大定中也後猶有說不具論續𤣥怪録汝州人多病頸癭其地饒風沙沙入井中飲其水則生癭故金房人家井以錫為欄皆以夾錫錢鎮之或沉錫其中則飲者免此患華亭有一老僧昔行腳河南管下寺僧童僕無一不病癭時有洛僧共寮每食取攜行苔脯同餐經數月僧頂贅盡消若未嘗病寺徒僕歎訶乃知海崖鹹物能除是疾癸志倪仲賢治顧顯卿妻年五十餘患癭始生如塊近三年如盆一首痛楚不可忍羣醫視之投藥不效老人曰是少陽經為邪所攻耳即投以其藥服之月餘而愈江應宿治一婦人頸癭知其為少陽厥隂肝膽因鬱怒痰氣所成治以海藻三兩昆布一兩五錢海𢃄一兩俱水洗淨半夏製小松蘿枯礬蛤粉通草各一兩龍膽草洗三兩小麥麵炒去濕四兩共為細末食後用酒調下三錢去枕睡片時或臨卧服以消止藥不必盡劑一月愈瘡瘍東垣治一人家貧形志皆苦時冬寒於手陽明大腸經分出癰第四日忽腫幼少有㿗疝其臂外皆腫痛甚先腫在陽明脈左右寸皆短中得之皆弦按之洪緩有力此癰得自八風之變以脉斷之邪氣在表然其症大小便如故飲食如常腹中如飢口知味知不在裏也不惡風寒止熱躁脉不浮知不在表也表裏既和邪氣在經脉之中也故凝于經絡為瘡癰出身半已上故風邪上受之故知是八風之變為瘡止經脉之中也治其寒邪調和經脉中血氣使無凝滯則已也炙甘草一分升麻桔梗五分白芷七分當歸尾生地一錢生芩一錢五分連翹一錢黃芩二錢中桂紅花各少許酒水各半同煎至稍熱臨卧服二服而愈吕滄洲治一僧偶搔膕中疥忽自血出汩汩如湧泉竟日不止醫治之不效請吕往視履時已困極無氣可語及持其脉惟尺部如蛛絲他部皆無即告之曰夫脉血氣之先也今血妄溢故榮氣暴衰然兩尺尚可按惟當益榮以瀉其隂火乃作四神湯加荆芥穗防風不間晨夜併進明日脉漸出更服十全大補一劑遂痊羅謙甫治牛經歷病頭面赤腫耳前後尤甚疼痛不可忍發熱惡寒牙關緊急涕唾稠黏飲食難下不得安卧一瘍醫於腫上砭刺四五百針腫赤不減其痛益甚不知所由羅診視其脉浮緊按之洪緩此症乃寒覆皮毛鬱遏經絡熱不得升聚而赤腫經云天寒則地凍水冰人氣在身中皮膚緻密腠理閉汗不出血氣强肉堅澀當是之時善行水者不能行冰善穿地者不能鑿凍善用針者不能取四厥必待天溫冰泮凍解而後水可行地可穿人脉亦如是也又云冬月閉塞用藥多而少針石也宜以苦溫之劑溫經散寒則已所謂寒緻腠理以苦發之以辛散之宜以托裏溫經湯麻黃苦溫發之者也故以為君防風辛溫散之者也升麻苦平葛根甘平解肌出汗専治陽明經中之邪故以為臣血留而不行者則痛以香白芷辛溫當歸身辛溫以和血散滯濕熱則腫蒼术苦甘溫體輕浮力雄壯能瀉膚腠間濕熱人參甘草甘溫白芍藥酸微寒調中益氣使托其裏故以為佐依方服之以薄衣覆其首厚被覆其身卧於暖處使經血溫腠理開寒乃散陽氣發大汗出後腫減八九分再服去麻黃防風加連翹黍黏子痛腫悉去經言汗之則瘡愈信哉衛生寶鑑丹溪治一人年近五十質弱憂患右一作左膊外側生核紅腫如栗脉浮大弦數重似澀此憂患傷血宜用補以防變症以人參膏下竹瀝他工以十宣五香間與後值大風核高大有膿中起紅線過肩脊及左一作右脅下急作參膏入芎术湯薑汁飲之盡參三片瘡潰又多與四物加參术芎歸陳皮甘草半夏生薑服之而愈一人面白神勞脅下生一紅腫如桃或教用補劑不信乃用流氣飲十宣散雜進血氣俱憊而死一人左絲竹空穴壅出一角如雞距此少陽經氣多血少朱戒其斷酒食解食毒須針灸以開發壅滯他工以大黃硝腦等冷藥貼之一夜裂開如蚶肉血濺出長尺餘而死此冷藥外逼熱不得發故也一士人於背臀腿節次生疽用五香連翹湯十宣散而愈後腳弱懶語肌上起白屑如麩脉洪稍鼓時冬月朱作極虛治令急作參茋歸术膏以二陳湯化下服盡藥一斤半白屑沒大半呼吸有力其家嫌效遲自作風病治之服青礞石等藥因致不救故書以為戒一老婦形實性急嗜酒腦生疽十五日脉緊急且澀用大黃細切酒炒為末以人參酒炒入薑煎湯調末一錢服少時再服得睡上身汗出而愈用大黃人參以汗解竒此案重見腦頂疽門橘泉翁治一人年八十餘有瘍發左耳後寒熱間作晝夜呼不可忍瘍醫欲與十宣散補托之翁曰此有餘之火無俟於補與防風通聖散加柴胡白芷下之腫消痛止皇祐中學究任道腿間患一瘡始發赤腫復絶便變黑後穴則有黃水出四邊浮漿起纍治不瘥醫王通看之此瘡狹長似魚臍下瘡也遂以大針針四向并中隨針有紫赤水汁出如豆汁言此一因風毒藴結而成二因久坐血氣凝澀而至三因食肉有人汗落其間也道曰某素好讀書而久坐此疾數嵗前夏月道中買猪脯味水飯疑似人肉食已後得此疾通曰與誤食人汗不逺矣以一異味散子用雞子清調傅其瘡日三易數日得愈道堅求其方通曰止用雪元一味自後纍訪名醫皆莫識雪元為何物道因至許鄭間㑹醫郝老曰嘗記聖惠有一方治此疾用獵月猪頭燒灰以雞子清調傅此方是也雪元之名非郝老博學多記後醫豈不惑耶名醫録南豐市民嚴黃七兩足生瘡臭氣潰膿衆皆驅斥不容迹出貨角器於村野而旅舍又不容至京潛投宿於五夫人祠下夜半遭黃衣吏訶逐曰何人敢以腐穢腳觸汚此間謝曰不幸纒惡疾無處見容冒死來此紛拏次夫人出抗聲令勿逐且呼使前曰吾授汝妙方用漏藍子一枚本草又名野蘭生乾為末入膩粉少許井水調塗當效嚴拜謝依而治之果愈類編陳斗嵓治金臺僧嗣真遍體生㾦㿔嵗久藥罔效陳曰此太隂之經藴風邪風化為蟲病也初猶未信翌日僧持瘡痂數片內有蟲如虱泣拜求治乃教以百部蛇床子草烏頭練樹葉煎湯一缸令僧坐湯中浴一二時落瘡痂蟲無數一月凡數浴僧遍體如白癜風狀而愈吳茭山治一男子年近三十病後遍發癤毒醫以敗毒散久服其毒遂收惟有瘡瘍而已忽一日食羊肉遂嘔過一夜滿口發瘡狀如膿窠寒熱時作羸瘦憔悴諸醫皆曰早間毒敗不盡故耳仍行敗毒凉劑渴熱轉生越數旬飲食減少因請吳治曰脉浮無力此乃虛陽若用凉劑不久危矣遂用附子理中湯服之少頃燥煩口開舉家歸咎於附子曰此無妨彼人虛甚况熱藥熱服故燥耳仍進一服此理可以貫通服藥之妙其症遂安連進二次次早口瘡俱收寒熱已定病遂愈此蓋虛陽染患不可不察也趙子固先生母劉氏年近八十左足面一瘡下連大指上延外踝以至臁骨每嵗輒數發發必屢月昏暮癢甚爬搔移時出血如泉呻吟痛楚殆不可忍夜分即漸已明日復然每一更藥則瘡轉大而劇百試不驗如是二十餘年淳熙間趙為大府丞一夕母病大作相對悲泣無計困極就睡夢四神僧默坐一室旁有長榻先生亦坐因而發歎一僧問其故先生答之以實僧云可服牛黃金虎丹又一僧云硃砂亦可既覺頗驚異試取藥半粒强服之良久腹大痛舉家且悔俄而下礧磈物如鐵石者數升是夕瘡但徹癢不痛而無血數日成痂自此遂愈硃砂之說竟不復試先生因圖僧像如所夢者而記其事金虎丹方出和劑本治中風痰涎壅塞所用牛黃龍膽膩粉金箔之類皆非老人所宜服今乃服竒效竟此疾積熱藏府而發於皮膚嵗久根深未易蕩滌故假凉劑以攻之不可以常瘡論也神僧之夢蓋誠孝感所致百一選方有人遍身生熱毒瘡痛而不癢手足尤甚至頸而止黏著衣被曉夕不可寐痛不可忍有人教以石菖蒲三㪷銼日乾之舂羅為末布席上使患者恣卧其間仍以衣被覆之既不黏著又復得睡五七日間其瘡如失後以此治患此者應手效其石菖蒲根絡石生者節密入藥須此等本草衍義有人患遍身風熱細疹癢痛不可任連胸脅臍腹及近隂處皆然痰涎亦多夜不得睡以苦參末一兩皂角二兩水一升揉攄取汁銀石器熬成膏和參末為丸梧桐子大二三丸溫水下食後次日便愈本草衍義有婦人患臍下腹上下連二隂遍滿生溼瘡如馬爪瘡他處並無癢熱而痛大小便澀出黃汁飲食已減身面微腫醫作惡瘡治用鰻鱺魚松脂黃丹之類藥塗上瘡愈熱痛愈甚治不對故如此問之此人嗜酒貪啖喜魚蝦發風之物急令用溫水洗拭去膏藥尋以馬齒莧四兩爛研細入青黛一兩再研勻塗瘡上即時熱減癢痛皆去仍服八正散日三服分散客熱每塗藥得一時久藥已乾燥又再塗新溼藥凡如此二日減三分之一五日減三分之二自此二十日愈或問曰此瘡何緣至此曰中下焦蓄風熱毒氣若不出當作腸癰內痔乃須當禁酒及發風物然不能禁後果患內痔本草衍義一人遍身忽然肉出如錐癢痛不能飲食名血擁用赤皮葱燒灰水淋汁洗內服淡豆豉湯數盞而愈一人渾身生泡如甘棠梨破則出水內有石一片如指甲大其泡復生抽盡肌肉不可治矣急用三稜莪术各五兩為末分三貼服酒調下一人頂上生瘡如櫻桃有五色瘡破則頂皮斷逐日飲牛乳自消一人患此瘡腳膝攣痛有人取蝦蟇治如食法令食之敗毒而攣痛自愈此亦偶中也又一人患此瘡腳痛而腫或令採馬鞭草煎湯薰洗此方妙湯氣才到患處便覺爽快後溫洗之痛腫隨減一人患此瘡愈後數年通身筋骨疼痛遇一道流問曰神色憔悴有病耶曰因瘡遍身痛也道流曰輕粉毒也遂示一方藥味不過數品但每貼入鉛五錢打扁同煎服之果驗薛己治四明屠夀卿孟夏當門齒如有所擊痛不可忍脉洪大而弦薛曰弦洪相搏欲發瘡毒也先用清胃散加白芷金銀花連翹一劑痛即止至晚鼻上發一瘡面腫黯痛更用前藥加犀角一劑腫至兩額口出穢氣脉益大惡寒內熱此毒熾血瘀藥力不能驟敵乃數砭患處出紫血服犀角解毒之劑翌日腫痛尤甚又砭患處與唇上并刺口內赤脉各出毒血再服前藥至數劑而愈若泥凥神不行砭刺或全仗藥刀鮮不誤矣翰林屠漸山年逾四十患溼毒瘡誤用輕粉之劑虧損血氣久不愈一日將晡診其肝脉忽洪數而有力薛告之曰何肝脉之如此侵晨瘡出紫血三四碗許體倦自汗雖甚可畏所喜血黯而脉靜此輕粉之熱血受其毒而妄行其毒亦得以泄矣但邪氣去真氣虛也當急用獨參湯主之屠惑於他言以致邪氣連綿不已竟不起一婦人性躁寒熱口苦脅痛耳鳴腹脹溺澀踰年矣症屬肝火用四君加柴胡炒山梔炒龍膽數劑乃與逍遙散兼服而瘡愈又與六味丸及逍遙散七十餘劑諸症悉退若有愈後身起白屑搔則肌膚如帛所隔此氣血虛不能營于腠理用大補之劑若有愈後發熱身起疙瘩癢痛搔破膿水淋漓經候不調此肝火血熱用四物加柴胡山梔白术茯苓丹皮甘草此二種亦要知之一婦人日晡身癢月餘口乾又月餘成瘡服祛風之劑膿水淋漓午前畏寒午後發熱殊類風症薛謂此肝經鬱火外邪所搏用補中益氣肝火未平參茋宜緩加山梔鉤藤又以逍遙散加川芎貝母而愈一男子年十六夏作渴發熱吐痰唇燥遍身生疥兩腿尤多色黯作癢日晡愈熾仲冬腿患瘡尺脉洪數薛曰疥腎疳也瘡骨疽也皆腎經虛症針之膿出其氣氤氲薛謂火旺之際必患瘵症遂用六味地黃十全大補不二旬諸症愈而瘵症具仍用前藥而愈抵冬娶妻正春其症復作父母憂之俾其外寢雖其年少謹疾亦服地黃丸數斤煎藥三百餘劑而愈石山治一人色蒼黃瘦年三十餘病遍身惡瘡因服輕粉而腳拘攣手指節腫額前神庭下腫如雞卵大方士令服孩兒膏謂能補也汪診視脈皆濡緩而弱虛協濕熱曰病已三年毒已盡矣但瘡潰膿血過多以致血液衰少筋失所養故腳為之拘攣况手指節間頭上額前皆血少運行難到之處故多滯而成腫理宜潤經益血行滯散腫今服孩兒猛火炮炙燥烈殊甚且向所服輕粉性亦躁急丹溪曰血難成易虧今外被瘡膿所涸內被輕粉所熯以難成易虧之血其何以當內外之耗不惟腫不能消恐天年亦為之損也時正仲夏乃用十全湯去桂附加紅花牛膝黃柏薏苡仁木香火麻仁羌活煎服百貼空心常服東垣四神丹加黃柏又少加蜀椒以其能采水銀然後腳伸能行指腫亦消惟額腫傅膏而愈烺按此案并下案當依石山醫案入楊梅瘡門一人年三十餘因患此瘡服輕粉致右腹脅下常有痞塊右眼黑珠時有疔子努出如雀屎許間或又消身有數瘡未痊一醫為治瘡毒而用硝黃一醫為治痞塊而用攻尅一醫為治眼疔而用寒凉諸症不減反加腹痛腸鳴大便滑泄胸膈壅悶不思飲食噯氣吐沫身熱怠倦夜卧不安季冬汪往視脉皆浮濡近駛曰誤於藥也前藥多係毒劑胃中何堪遂令棄去更用人參四錢黃茋二錢白术三錢茯苓炒芍藥各一錢陳皮神曲升麻各七分甘草肉豆䓻各五分煎服五貼為之痛定減去升麻又服五貼膈寬食進減去豆䓻再服五貼諸症皆除月餘痞塊亦散眼疔亦消一婦瘦長面紫每遇春末夏初兩腳生瘡濃泡根紅艱於行步經水不調汪診視脉皆濡弱而駛兩尺稍滑曰血熱也醫用燥劑居多故瘡不瘥合用東垣四神丹加黃柏蜜丸服之瘡不復作江篁南治旃田張氏子年二十餘因坐卧溼地遍身發瘡如血風狀醫與宣熱敗毒祛風之劑過多瘡雖稍愈而氣血侵損多矣身發寒熱步履艱難秋間輿來就治脉濡弱不任尋按尫瘠殊甚腹內作膨作瀉午後發寒熱至五更汗出而退初為滋補氣血兼扶脾清熱消導二劑膨去瀉止四服寒熱退但脾傷氣虛四肢無力泄瀉時作乃以參茋歸术陳皮枳實黃柏麥冬等藥出入加減遣歸二月而愈因以煮酒水洗手足致瘡痍復大發脉浮細而數初與防風通聖散二服及與去風溼藥洗之瘡痍漸瘳繼與托裏健脾清熱之劑月餘而安淞江一人生天泡瘡遍身越數日每泡中放出石子一箇隨其泡形為之大小吳城一人腰間生一癤膿中流出蛔蟲四條醫亦甚駭耳目所未經者癤後自愈不致傷生楓橋瘍醫龔生目覩人小腹生癤流出蛔蟲二條俱長六七寸後亦自愈五湖漫聞翻花瘡薛己治判官張承恩內股患癰將愈翻出一肉如菌薛曰此屬肝經風熱血燥當清肝熱養肝血彼不信乃內用降火外用追蝕蝕而復翻翻而復蝕其肉益大元氣益虛始信薛言治之而痊一男背瘡斂如豆許翻出肉一寸餘恪用消蝕藥并繫法屢去屢大三寸許矣用加味逍遙散三十餘劑外塗藜蘆膏而消瘡口將斂乃用八珍散倍用參茋歸术峻補而斂一婦人素善怒臂患癰瘡口出肉長二寸許用加味逍遙散藜蘆膏而愈後因怒患處脹悶遍身汗如雨此肝經風熱風能散氣而然耳仍用前散并八珍湯而愈一儒者頂患腫硬乃用散堅行氣化痰破血之劑腫硬愈甚喘氣發熱自汗盜汗形體倦怠飲食少思薛曰此屬足三隂虧損當滋化源彼惑衆論乃用追蝕患處開翻六寸許巉巖色赤日出鮮血三月餘矣肝脉弦洪緊實薛用十全大補湯加麥冬五味五十餘劑諸症稍得血止三四復因怒飲食頓少血自湧出此肝傷不能藏血脾傷不能攝血乃用補中益氣為主加五味麥冬飲食漸進其血頓止再以六味丸加五味常服瘡口漸斂疔瘡徐嗣伯嘗聞屋中呻吟徐曰此疾甚重乃往視之見一老姥稱體痛而處處有黯黑無數張還煮斗餘湯送令服之服訖痛勢愈甚跳投牀者無數須㬰所黯處皆拔出釘長寸許以膏塗瘡口三日而復云此名釘疽也郭氏治驗云一婦年近六十右耳下天窗穴間小腸患一疔瘡其頭黑靨四邊泡起黃水時流渾身麻木發熱譫語時時昏沉六脉浮洪用烏金散汗之就以鈹針先刺瘡心不痛周遭再刺十餘下紫黑血出方知疼痛就將寸金錠子絍入瘡內外用提疔錠子放於瘡上膏藥貼護次日汗後精神微爽却用破棺丹下之病即定其疔潰動後用守效散貼塗紅玉錠子絍之八日其疔自出矣兹所謂審脉症汗下之間治以次第如此視彼不察脉症但見發熱譫語便投凉藥與下或兼以香竄之藥遂致誤人者徑庭矣薛己治一婦左手指患疔麻癢寒熱惡心左半體皆麻脉數不時見曰凡瘡不宜不痛不可大痛煩悶者不治今作麻木尤其惡也用奪命丹二服不應又用解毒之劑麻癢始去乃作腫痛薛曰勢雖危所喜作痛但毒氣無從而泄乃針之諸症頓退又用解毒之劑而瘥蘇庠盛原博掌後患疔紅絲至腕惡寒發熱勢屬表症與奪命丹一服紅絲頓消又用和解之劑大勢已退彼又服敗毒藥發渴發熱紅絲仍見脉浮大而虛此氣血受傷而然以補中益氣湯主之而愈紅絲再見而用補亦須細審蓋奪命既服瘡邪已散而復用敗毒之劑是誅伐無過失內經之㫖矣一儒者患疔元氣素弱薛補其氣血出膿而愈後因勞役瘡痕作癢乃别服敗毒散一劑以致口噤舌强手足搐揉痰涎上湧自汗不止虛症悉見此氣血復傷而復痙也用十全大補加附子一錢灌服而蘇一男子患疔服奪命湯汗不止瘡不痛熱不止便不利此汗多亡陽而真氣傷矣用參茋歸术芍防五味二劑諸症悉退惟以小便不利為憂薛曰汗出不利小便汗止則陽氣復而自利矣仍用前藥去防風加麥冬倍用黃芩當歸四劑而便行瘡潰而愈一老婦手大指患疔為人針破出鮮血手背俱腫半體俱痛神思昏憒五日矣用活命飲二劑始知痛在手瘡勢雖惡元氣復傷不宜大攻用大補湯及活命飲各一劑外用隔蒜灸喜其手指皆赤腫而出毒水又各一劑赤腫漸潰又用托裏藥而瘥表甥居富右手小指患疔色紫或云小瘡針刺出血敷以凉藥掌指腫三四倍黯而不痛神思昏憒煩躁不寧此真氣虛而邪氣實也先以奪命丹一服活命飲二劑稍可薛因他往或遍刺其手出鮮血碗許腫延臂腕焮大如瓠手指腫數倍不能潰薛用大劑參茋歸术之類及頻灸遍手而腫漸消但大便不實時常泄氣以元氣下陷以補中益氣加骨脂肉䓻吳茱五味大便實而氣不泄又日以人參五錢麥冬三錢五味二錢水煎代茶飲之又用大補藥五十餘劑而漸愈此症初若不用解毒之劑後不用大補之藥欲生也難矣一人年二十脣患疔四日矣有紫脉自瘡延至口內將及于㗋薛曰此真氣虛而邪氣實也若紫脉過㗋則難治矣須針紫脉併瘡頭出惡血以泄其毒則可乃别用解毒之劑頭面俱腫求治甚篤薛曰先日之言不誣矣診其脉洪數按之如無口內腫脹針不能入為砭面與脣出黑血碗許勢雖少退略進湯終至不起都憲張恆山左足指患之痛不可忍急隔蒜灸三十餘壯即能行步欲速愈或用凉藥敷貼遂至血凝肉死毒氣復熾再灸百壯服活命飲出紫血毒才得解腳底通潰腐筋爛肉甚多將愈誤用生肌藥反助其毒元氣虧損而不能愈薛治以托裏藥喜其禀實客處三月餘方愈大凡疔患于肢節灸法有回生之功設投以凉劑收斂腠理隧道壅塞邪氣愈甚多致不起若毒未盡驟用生肌輕者反增潰爛重者必致危亡琇按與熱病新愈驟用溫補之誤同一男子足指患疔腫焮痛赤用隔蒜灸人參敗毒散加金銀花白芷大黃二劑痛止又用十宣散加天花粉金銀花去桂數劑而愈外科樞要有論宜考濮陽傳云萬厯丁亥金臺有婦人以羊毛遍鬻於市忽不見繼而都人身生泡瘤漸大痛死者甚衆瘤中惟有羊毛道人傳一方以黑豆蕎麥為末塗擦毛落而愈名羊毛疔名醫類案卷九
