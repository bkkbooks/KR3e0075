front:
  text: 名醫類案原序予讀禇氏遺書有曰博涉知病多診識脈屢用達藥嘗撫卷以為名言山居僻處博歴何由於是廣輯古今名賢治法竒騐之迹類摘門分世採人列為書曰名醫類案是亦禇氏博歴之意也自夫三墳墜而九丘湮方書繁而經論廢或指素難以語人鮮不以為迂者醫之術日益濫觴通經學古世不多見昔鄭公孫僑聘於晉適晉侯有疾卜云實沈臺駘為祟史莫之知乃問於僑僑具述高辛𤣥㝠之遺參汾主封之故四時節宣之道通國驚異以僑為博物君子太史公作史記傳淳于意備書其治病死生主名病狀診候方脈詳悉弗遺盖將以折同異極變化求合神聖之道以立權度於萬世軒岐俞扁之書匪直為虚詼已也今予斯編雖未敢僭擬先哲然宣明往範昭示來學既不詭於聖經復易通乎時俗指迷廣見或庶㡬焉耳學者譬之由規矩以求班因彀以求羿引而伸之溯流窮源推常達變將不可勝用矣書凡十二卷為門一百八十有竒間附説於其下云嘉靖已酉莫秋既望
