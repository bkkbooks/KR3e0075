body:
  text: 名醫類案原序凡例一是集乃披閲諸子百家之文中有案㑹心者輒手録以備遺忘積久成袠乃分門析類耳一前修時賢之案則係之曰某人示無掩也有案無人者則曰出某書示有據也一某人案惟先達著名者則書其字號或官如朱子注書例凡先達稱官稱爵稱字號之類案可採而聲未著者直書其名欲人易曉也一時賢案惟變法稍出竒者採之諸庸常者不録一案下附説或採前修之言或附管見與賢者共議耳非敢自以為是也一案中方法用古方加减者但載方名其方稍隠者註云出某書間有品味簡者直載其方其藥分兩製度或有或無或詳或略皆仍諸書之舊也一愚治騐諸案亦附諸條之末一得之愚弗敢隠秘後來者或有可採擇焉一案以世次為先後非有所頡頏也間有後先失次者無可考者也一諸門後各自分板不相連屬庶後可續編入不亂其成書也博按原刻亦有不分板者今刻悉連屬之以歸畫一述補一先君子以文名世而自驗諸案簡直不文非不欲文通乎時俗耳一不肖續編間附已案一遵凡例苟意見庸劣及徒有空文而無方法脈案可示後者不書倣春秋常事不書之㫖名醫類案凡例欽定四庫全書子部五名醫類案目録醫家類卷一中風虚風傷風迵風沓風附漏風中寒中熱傷寒瘟疫大頭天行沙舊刻作解㑊悞卷二内傷命門火衰暑濕消渴火熱鬱頥養醫戒卷三痰笑哭不常厥痓瞑目不食人漸縮小人暴長大人化為水卒死消癉癉欬嗽喘瘧卷四癨亂瀉痢嘔吐噎膈欬逆吞酸吐酸痞滿腫脹卷五癥瘕積塊虚損勞瘵汗不汗便濁附便數遺精麻木寒中惡寒惡熱熱氣病卷六首風附頭暈頭痛心脾痛腹痛中氣虧損心腹作痛腹鳴腰痛脇痛膝腫鶴膝風脚氣附腫痛脚發脚弱諸氣疝㿗不寐多夢消中卷七諸蟲哮遍身痛身癢面病附痄腮耳鼻睂睂髪自落鬚髪不白目咽喉口舌牙瘖皮膚皺裂骨哽悞吞金䥊悞吞水蛭蜈蚣蛇蟲獸咬卷八血症下血溺血痔附腸風臟毒脱肛腎臟風瘡臁瘡前隂病痛風痿癎鬼注邪祟顛狂心疾怔忡卷九淋閉秘結黄疸癍疹風癉四肢病癘風癰腫龎贅瘤腫癭瘡瘍翻花瘡疔瘡卷十背癰疽瘡癰疽腦頂疽多骨疽瘰􅕅鬢疽附骨疽肺癰胃癰腸癰懸癰便癰下疳瘡肩癰乳癰腹癰囊癰腰疽臋癰腿癰附腿腫脚跟瘡漏攧撲損傷死枕愈病尸蹷附鍼騐色診黴瘡附結毒漏爛卷十一婦人症經水熱入血室崩漏帶下求子娠症附男女辨騐轉胞交腸惡阻胎水胎腫胎漏墮胎胎産併病胎熱難産盤腸産胎肖附胎忌胎死作喘産後師尼寡婦寒熱卷十二小兒症博按此卷異症湯火金瘡食忌丹毒中毒五條附入小兒症中非是胎毒胎暈臍風腎縮咯血熱症寒症癖為潮熱汗附盜汗吐㵼驚搐驚風慢驚腹脹腹痛𠻳喘𠻳痛赤丹㿀疹瘛瘲癖積黄疸口瘡喫泥痘瘡疹瘡嗜卧異症湯火金瘡食忌丹毒中毒脾風疳積走馬牙疳臣等謹案名醫類案十二卷明江瓘編其子應宿增補瓘字民瑩歙縣諸生因病棄而學醫應宿遂世其業其書成於嘉靖已酉所採自史記三國志所載秦越人淳于意華佗諸人下迄元明諸名醫凡治騐之案見於諸書者捃摭殆徧分二百五門各詳其病情方藥瓘所隨事評論者亦夾註於下如傷寒門中許叔微治秘結而汗出一案衆醫謂陽明自汗津液已漏法當用蜜兑而叔微用大柴胡湯取效瓘則謂終以蜜兑為穏又如轉胞門中朱震亨治胎壓膀胱一案稱令産媪托起其胎瓘則謂無此治法其言不確凡斯之類亦多所駁正發明頗為精審其中如尸蹷門中附載鍼騐引及酉陽雜爼所載高句驪人言髪中虚事與治病毫無所涉難産門中引焦氏類林載于法開令孕婦食肥羊十餘臠針之即下事既不明食羊何義又不明所針何穴亦徒廣異聞無禆醫療皆未免驚博嗜竒然可為法式者固十之八九亦醫家之法律矣瓘初成是編未及刋刻瓘沒之後應宿又以瓘之醫案分類附之而應宿醫案亦附焉歲久板刓近時歙縣鮑廷博又為重刋其中間附考證稱琇案者乃魏之琇所加之琇字玉横錢塘醫人也乾隆四十五年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
