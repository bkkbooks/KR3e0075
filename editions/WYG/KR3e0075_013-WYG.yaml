body:
  text: 名醫類案䟦先君子清脩力學不偶於時抱疴攻醫數起人危疾未嘗以醫名家藏禁方及諸子列傳無慮百數十種披閲適窽手録以傋遺忘積二十年所遂成是書分門析類為卷十二為條二百有竒草創未就遽爾見背應宿不肖髫齓多病趨問難頗契其㫖弱冠奉方伯叔父之滇南尋逰吴越齊楚燕趙間博採徃哲竒驗之跡載還山中懼先集未梓乆而散逸因取遺稿編次補遺亦越嵗十九凡五易鈔更與伯兄參互考訂勒成全書傳之通都下邑俾肄業之士如遇隂陽顯晦未易辨之證水火徴兆疑似之難明者試觀前人已驗之成法准古酌今一證一方一案一論脗合相孚其應如響嗟乎醫貴權衡譬之用兵孫武論兵無出虛實兵識虛實則無不勝矣或者不師古人亦自為法唯司馬穰苴能之善之善者也抑或孳孳學古雖中律度如趙括徒能讀父書不知合變卒歸于敗耳是則存其人焉爾矣醫何以異此先君子以縫掖稱作者托于醫以隠孤不敏弗克繼志姑述手澤之遺間附見聞以廣其傳雖於時未必有濟然承先君子及物之仁則亦不敢私也謹志時萬厯辛邜閏三月朔旦之吉男應宿百拜撰述
