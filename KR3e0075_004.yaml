body:
  text: 名醫類案卷四明江瓘編癨亂琇按謂其病狀揮霍悶亂為邪正交爭之病夏秋多有江篁南治從叔於七月間得癨亂症吐瀉轉筋足冷多汗囊縮一醫以傷寒治之增劇江診之左右寸關皆伏不應吐瀉脉伏無礙尺部極微口渴欲飲冷水足冷囊縮似屬厥陰口渴亦似少陰引水自救何以辨之曰直中陰經無有上吐轉筋多汗症若少陰頭有汗則死矣乃以五苓散與之覺稍定向午猶渴以五苓加麥冬五味子滑石投之足冷囊縮似宜急溫然口渴飲冷又當清既非傷寒故如此治五苓妙加藥尤妙更以黃連香薷飲冷進一服次早脉稍出按之無根人脫形且吃忒手足厥冷即當溫飲食不入入則吐大便稍不禁為灸丹田八九壯囊縮稍舒手足稍溫當以理中湯二三服渴猶甚咽疼熱不解時或昏沉乃以竹葉石膏湯投之而愈用藥圓轉當熟玩之所謂見病治病江應宿治一婦人六月中旬病癨亂吐瀉轉筋一醫投藿香正氣散加煩躁面赤揭衣臥地豫診視脉虛無力身熱引飲此得之傷暑宜辛甘大寒之劑瀉其火熱以五苓散加滑石石膏吐瀉定再與桂苓甘露飲而愈凡治霍亂俱要辛熱寒涼並用一僕夫燕京人縱酒飲食無節病癨亂吐瀉轉筋煩渴幾殆時六七月淋雨晝夜飲簷溜水數升而愈千金方云輕者水瘥此偶合古方豫目擊其事後路途中及六合縣見一人服新汲井花水飲之良愈一人病癨亂欲吐不吐欲瀉不瀉心腹絞痛脉之沉伏如無此乾癨亂也急令鹽湯探吐宿食痰涎碗許遂瀉非吐瀉則死並針刺手足眉心出血為度與六和湯而愈瀉琇按內傷外感俱能作瀉惟虛寒者可溫補餘則隨症施治不可執一東垣治一人一日大便三四次溏而不多胃瀉有時作瀉腹中鳴小便黃以黃茋柴胡歸身益智陳皮各三分升麻六分炙甘草二錢先生得手處在此紅花少許紅花少用入心養血補火以生土引經妙作一服名曰黃茋補胃湯水二盞煎一盞稍熱食前服之一人五更初曉時必溏泄一次此名腎泄以五味子二兩吳茰半兩即二神丸用細粒緑色者二味炒香熟為度細末之每服二錢陳米飲下數服而愈內經曰腎者胃之關也關門不利故聚水而生病也東垣云豫病脾胃久衰視聼半失此陰盛乘陽加之氣短精神不足此言弦脉令虛多言之過陽氣衰弱不能舒伸伏匿於隂中耳又值淫雨陰寒時人多病泄利此溼多成五泄故也一曰體重肢痛大便泄并下者三而小便祕澀思其治法按經云大小便不利無問標本先分利之又云治溼不利小便非其治也皆當利其小便必用淡味滲泄之劑利之是其法也噫聖人之法雖布在方策其不盡者可以意求耳今客邪寒溼之淫從外而入裏以暴加之若從已上法度用淡滲之劑病雖即已是降之又降是益其陰而重竭其陽則陽氣愈削而精神愈短矣是陰重强陽重衰反助其邪也故必用升陽風藥以羌活獨活柴胡升麻各一錢防風根半錢炙甘草半錢煎稍熱服大法云寒溼之勝助風以平之又曰下者舉之得陽氣升騰而去矣又云客者除之是因曲而為之直也夫聖人之法可以類推舉一而知百也若不達升降浮沉之理而概施治其愈者幸也為後學廣間方便之門子和治一人瀉利不止如傾衆以為寒治近二十載非虛寒可知脉之兩寸皆滑子和不以為寒所以寒者水也以茶調散湧寒水五七升又以無憂散瀉水數十行當有所去下乃愈次以淡劑利水道後愈此通因通用法也一僧藏腑不調三年不愈此洞瀉也以謀慮不决而致肝主謀慮甚則乘脾脾溼下行乃上湧痰半盆又以舟車丸濬川散下數行仍使澡浴出汗自是日勝一日又常以胃風湯白术散調之郝允治夏英公病泄太醫皆為中虛郝曰風客於胃則泄名言殆藁本湯證也夏駭曰吾服金石等藥無數泄不止其敢飲藁本乎郝强進之泄止邵氏聞見録丹溪治一老人右手風攣多年積痰見症九月內患泄瀉百藥不效右手脉浮大洪數此太陰經有積痰肺氣壅遏不能下降大腸虛而作瀉當治上焦治上焦妙用蘿蔔子擂治漿水蜜探之而吐大塊膠痰碗許隨安一富兒面黃善啖易飢非肉不食泄瀉一月脉大以為溼熱當脾困而食少今反形健而多食不渴此必疳蟲也驗其大便果有蛔令其治蟲而愈至次年夏初復瀉不痛而口乾朱曰昔治蟲而不治疳故也以去疳熱之藥白术湯下三日而愈後用白术為君芍藥為臣川芎陳皮黃連胡黃連入蘆薈為丸白术湯下禁肉與甜瓜防其再舉一老人味厚傷脾常脾泄芍藥酒炒一兩白术炒二兩神曲一兩山查一兩五錢黃芩五錢炒半夏一兩湯泡為末荷葉飯丸一老人稟厚形瘦夏末患泄瀉至秋深治不愈神不悴溺澀少不赤脉澀頗弦膈微悶食減前案因手風孿見浮大洪數之脉以吐而愈瀉此案脉澀頗弦因䐔微悶而用吐可見不憑在脉因悟曰必多年沉積澼在腸胃詢之嗜鯉魚三年無一日缺朱曰此痰積在肺肺為大腸之藏宜大腸之不固也當澄其源而流自清以茱茰陳皮青葱鹿苜根生薑濃煎和沙糖飲一碗探吐痰半升如膠利減半次早又飲之又吐半升利止與平胃散加白术黃連調理旬日而安一人性狡躁素患下疳瘡或作或止夏初患自利膈微悶醫與理中湯悶厥而蘇脉澀重取略弦而數朱曰此下疳之深重者與當歸龍㑹丸去麝四貼而利減又與小柴胡去半夏加黃連白芍川芎生薑數貼而愈脉與前案同潘弦僅多數耳外症膈微悶亦同而治法各别宜細玩之一人暴氣脫而虛頓渴不知人口眼俱閉呼吸甚微殆欲死急灸氣海飲人參膏十餘斤而愈烺按此案疑誤入此呂滄洲治一人病下利完榖衆醫咸謂洞泄寒中日服四逆理中等彌劇診其脉兩尺寸俱弦長右關浮於左關一倍脾入逆肝其目外皆如草滋脉浮色青非風而何蓋知肝風傳脾因成飱泄非藏寒所致飲以小續命湯減麻黃加白术三五升痢止續命非止痢藥飲不終劑而痢止者以從本治故也一夫人病飱泄彌年醫以休息利治之苦堅辛燥之劑弗效時秋半脉雙弦而浮浮弦為風曰夫人之病蓋病驚風非飲食勞倦所致也肝主驚故虛風自甚因乘脾而成泄今金氣正隆尚爾至明春病益加法當平木之太過扶土之不及而泄自止夫人曰儂寓南閩時平章燕公以銅符密授因失心懼由是疾作公言信然以黃犉牛肝和以攻風健脾之劑服之踰月泄止滑伯仁治一人暑月患中滿泄瀉小便赤四肢疲困不欲舉自汗微熱口渴且素羸瘠衆醫以虛勞將峻補之伯仁診視六脉虛微曰此東垣所謂夏月中暑飲食勞倦法宜服清暑益氣湯投三劑而病如失項彥章治南臺治書郭公久患泄瀉惡寒見風輒仆日臥密室以氊䝉其首熾炭助之出語咿咿如嬰兒諸醫作沉寒痼冷治屢進丹附不時驗項診其脉告曰此脾伏火邪溼熱下流非寒也法當升陽散火以逐其溼熱乃煮升麻澤瀉柴胡羌活等劑而繼以神芎丸郭曰豫苦久泄今復利之恐非治也項曰公之六脉浮濡而弱且微數濡者溼也數者脾有伏火也病由溼熱而且加之以熱劑非苦寒逐之不可法曰通因通用吾有所試矣頃之利如木屑者三四出即去氊及炭病旋已黃子厚治一富翁病泄瀉彌年禮致子厚診療浹旬不效子厚曰豫未得其說求歸一日讀易至乾卦天行健朱子有曰天之氣運行不息故閣得地在中間如人弄碗珠只運動不住故在空中不墜少有息則墜矣因悟向者富翁之病乃氣不能舉為下脫也又作字持水滴汲水初以大指按滴上竅則水滿筒放之則水下溜無餘乃豁然悟曰吾能治翁症矣即往至則為治艾灸百㑹穴督脉穴未三四十壯而泄瀉止矣妙法虞恆德治一人泄瀉日夜無度諸藥不效偶得一方用針沙地龍猪苓三味共為細末生葱搗汁調方匕貼臍上小便長而瀉止一人吐瀉三日垂死為灸天樞胃穴氣海任穴二穴立止石山治一人於幼時誤服毒藥泄痢後復傷食腹痛大泄不止今雖能飲食不作肌膚每至六七月遇服毒之時痛泄復作善飢多食胸膈似冷夜間發熱嗜臥懶語聞淫欲言盜汗陽舉心動驚悸喉中有痰小便不利大便或結或溏過食則嘔吐瀉泄脉皆濡弱而緩右脉略大尤覺弱次日左脉三五不調或一二至緩三五至駛右脉如舊緩弱左脉不調者此必淫欲動其精也右脉尤弱者由於毒藥損其脾也理宜固腎養脾遂以人參錢半白术茯苓芍藥黃茋麥冬各一錢歸身澤瀉各八分黃柏知母山查各七分煎服旬餘而安博按此案舊刻微悮一人年五十餘形色蒼白五月間與人爭辨冒雨勞役受飢且有內事夜半忽病發熱惡食上吐下瀉昏悶煩躁頭身俱痛此症頭身俱痛症之不可恃也如是夫因自發汗汗遂不止遣書云脉皆洪數汪曰脉果洪數乃危症矣蓋吐瀉內虛汗多表虛兼之脉不為汗衰亦不為瀉減在法不治但古人云治而不活者有矣未有不治而活者令用人參五錢以救裏黃茋五錢以救表白术三錢乾薑七分甘草五分以和中安胃白茯苓一錢陳皮七分以清神理氣用理中湯水煎不時溫服一酒杯看其病勢如何服至六七貼則見紅斑吐瀉之後見斑而四肢尤甚面赤身及四肢脹悶告急於汪汪曰斑症自吐瀉者多吉謂邪從上下出也但傷寒發斑胃熱所致今此發斑由胃虛而無根失守之火逰行於外也可補而不可瀉可溫而不可凉妙斷宜詳味之若用化斑湯升麻元參之類則死生反掌矣仍令守前方服十餘貼諸症悉減斑則成瘡肢腫亦消而愈博按此案舊刻脫悮一孩孟秋泄瀉晝夜十數度醫用五苓散香薷飲胃苓湯加肉蔲罔效汪曰此兒形色嬌嫩外邪易入且精神倦怠明是胃氣不足而為暑熱所中胃虛挾暑安能分别水榖今專治暑而不補胃則胃愈虛邪亦著而不出經曰壯者氣行則愈怯者著而成病是也令濃煎人參湯飲之初服三四匙精神稍回再服半盞泄瀉稍減由是繼服數次乳進而病愈虞雍公并甫紹興間自渠州守召至行在憩北郭外接待院因道中冒暑得泄痢連月重九夢至一處類神仙居一人被服如仙官延之坐視壁間有韻語藥方一紙讀之數遍其詞曰暑毒在脾溼氣連腳不瀉則痢不痢則瘧獨煉雄黃蒸餅和藥甘草作湯服之安樂别作治療醫家大錯用之已見竒驗夢回尚能記即録之蓋治暑泄方也如方服遂愈乾道中江西有一士人赴調都下遊西湖民間一女子明豓動人求之於其父母重幣不納歸家不復相聞又五年赴調尋舊遊茫無所覩悵然空還忽遇女子於中途呼揖問訊甚喜扣其徙舍之由女曰我久適人夫坐庫事繫獄未解子能過我茶否士欣然並行過旅館女曰此可棲止無庸至吾家留半歲將欲挾以偕逝女始斂袵曰向自君去憶念之苦感疾而亡今非人也無由陪後乘但陰氣侵君深當暴瀉宜服平胃散補安精血士聞語驚惋曰藥味皆平何得功效女曰中用蒼术去邪氣乃為上品夷堅志有人每日早起須大瀉一行或時腹痛或不痛空心服熱藥亦無效後一智者察之令於晚食前更進熱藥遂安如此常服竟無恙蓋暖藥雖平旦空服至晚藥力已過一夜陰氣何以敵之於晚間再進熱藥則一夜暖藥在腹遂可以勝陰氣凡治冷疾皆如此例有人久患泄瀉以暖藥補脾及分利小水百法治之不愈醫診之心脉獨弱以益心氣藥補脾藥服之遂愈蓋心火也脾土也火生土脾之旺賴火之燥此少火生氣之說心氣不足則火不燥脾土受溼故令泄瀉今益心補脾而又能去溼豈有不效者有人患泄瀉作冷作積作心氣不足治之及服硫黃附子甚多皆不效因服火杴丸而愈此腸胃有風冷也胃風湯兼服暖藥亦佳有人患脾泄諸治不瘥服太山老李炙肝散而愈乃白芷升胃白术白芍平肝桔梗四味也歐陽文忠公常患暴下國醫不能愈夫人云市人有此藥三文一貼甚效公曰吾輩藏府與市人不同不可服夫人使以國醫藥雜進之一服而愈召賣者厚遺之求其方但用車前子一味為末米飲下二錢匕云此藥利水道不動真氣水道利清濁分榖臟自止矣良方一男子夜數如厠或教以生薑一兩碎之半夏湯洗與大棗各三十枚水一升磁瓶中慢火燒為熟水時時呷之數日便愈蓋半夏今人惟知去痰但不言益脾蓋能分水故也脾惡溼溼則濡而困困則不能制水經曰溼勝則瀉是也程明祐治一人下泄勺水粒米不納服湯藥即嘔程診之曰病得之飲酒脾惡溼湯藥滋溼矣以參苓白术和粳米為糕食之病旋已所以知其人溼得之飲酒過多切其脉濡緩而弱脾傷於溼也薛立齊治進士劉華甫停食腹痛泄黃吐痰服二陳山梔黃連枳實之類其症益甚左關弦緊諸緊為寒右關弦長乃肝木剋脾土用六君加木香治之而愈若食已消而泄未已宜用異功散以補脾胃如不應用補中益氣升發陽氣凡泄利色黃脾土虧損真氣下陷必用前湯加木香豆蔲溫補如不應當補其母宜八味丸光祿柴黼菴善飲泄瀉腹脹吐痰作嘔口乾此脾胃之氣虛先用六君加神曲痰嘔已止再用補中益氣加茯苓半夏瀉脹亦愈此症若溼熱壅滯當用葛花解酲湯分消其溼溼既去而瀉未已須用六君加神曲實脾土化酒積然雖因酒而作實緣脾土虛弱不可專主溼熱錢可久素善飲面赤痰盛大便不實此腸胃溼痰壅滯用二陳芩連山梔子枳實乾葛澤瀉升麻一劑吐痰甚多大便始實此後日以黃連三錢泡湯飲之而安但如此稟厚不多耳薛已治一儒者善飲便滑溺澀食減胸滿腿足漸腫症屬脾腎虛寒用加減金匱腎氣丸食進腫消更用八味丸胃强脾健而愈一羽士停食泄瀉自用四苓黃連枳實麯蘖益甚薛曰此脾腎泄也當用六君加薑桂送四神丸不信又用沉香化氣丸一服臥牀不食咳則糞出幾至危殆終踐薛言愈蓋化氣之劑峻厲猛烈無經不傷無臟不損豈宜輕服一人年六十面帶赤色吐痰口乾或時作瀉春就診謂薛曰僕之症或以為脾經溼熱痰火作瀉率用二陳黃連枳實神曲麥芽白术柴胡之類不應何也薛脉之左關弦緊腎水不能生肝木也右關弦大肝木乘脾土也此乃脾腎虧損不能生剋制化當滋化源不信薛謂其甥朱太守陽山曰令舅不久當隕於痢次年夏果患痢而殁長洲朱紹患肝木剋脾土面赤生風大臟燥結炎火衝上久之遂致臟毒下血腸鳴溏瀉腹脹喘急馴至絶榖瀕殆諸醫方以枳實黃連之劑投之輾轉增劇薛診之曰此脾腎兩虛內真寒而外虛熱法當溫補遂以人參白术為君山藥黃茋肉果薑附為臣茱茰骨脂五味歸苓為佐治十劑俾以次服諸醫皆曰此火病也以火濟火可乎服之浹旬盡劑而血止諸疾遄已先是三年前先生過紹謂曰爾面部赤風脾胃病也不治將深紹怠緩以須疾發又惑於衆論幾至不救羅山人治王厚宇一婢年三十餘長夏患泄瀉身凉四肢厥冷晝夜數次皆完穀不化清水如注飲食下咽即泄出不變已經六七日一醫用藥不效謂腸直症在不治請羅視之六脉沉伏無力而澀乃脾虛受溼為肝木所乘乃五泄之一非怪證也法當健脾疏風燥溼升提其下陷之氣以五苓散加蒼术羌活防風炮薑半夏厚朴芍藥加藥妙一服十去七八再以二陳加二术砂仁白芍厚朴麯蘖調理數劑而安程仁甫治一婦人七十歲清閒厚味六月患吐瀉腹痛口渴倦怠三日夜不止先醫用藿香正氣散不效程診六脉滑數不勻曰暑令西照受熱眀矣吐瀉三日夜脾胃傷矣用六君去甘草加麥芽山查薑連藿香烏梅煎熟徐徐服之再用香連丸頓止江篁南治一人病瀉困倦胸滿脹江切其脉告曰此寒凉傷脾胃也以四君加陳皮香附山查枳實薑棗蓮實數劑而安病者曰某嘗夏秋患滯下已而作瀉腹痛醫以茱茰補骨脂作丸服三四兩不效更醫以三黃丸服過五兩食減又更一醫以菊花芩連等藥投之一日作七八度遂病如是所以知其人脾胃傷者六脉浮大而右關尤甚也論脉妙江應宿治余氏僕年十七歲五月初患泄瀉至六月骨瘦如柴粒米不入者五日矣將就木診其脉沉細濡弱而緩告其主曰溼傷脾病也用五苓散加參术各三錢不終劑而索粥三劑而愈黃水部新陽公患脾腎泄十餘年五鼓初必腹痛數如厠至辰刻共四度巳午腹微痛而泄凡七八度日以為常食少倦怠嗜臥診得右關滑數左尺微弦無力此腎虛而脾中有積熱病也投黃連枳术丸腹痛除漸至天明而起更與四神丸八味丸滋其化源半年飲食倍進而泄愈矣痢琇按經名腸澼又名滯下亦內傷外感兼有之候唐貞觀中張寶藏為金吾長上嘗因下直歸櫟陽路逢少年畋獵割鮮野食倚樹歎曰張寶藏身年七十未嘗得一食酒肉如此者可悲哉傍有僧指曰六十日內官登三品何足歎也言訖不見寶藏異之即時還京師太宗苦氣痢諸治不效即下詔問殿庭左右有能治者重賞之寶藏曾困其疾即具疏以乳煎蓽撥方上服之立瘥宣下宰臣與五品官魏徵難之逾月不進擬上疾復發問左右曰吾前飲乳煎蓽撥有功復命進之一啜又平因思曰嘗令進方人五品官不見除授何也徵懼曰奉詔之際未知文武二吏上怒曰治得宰相不妨已授三品官我天子也豈不及汝耶乃厲聲曰與三品文官授鴻臚寺卿時正六十日矣其方每服用牛乳半升蓽撥三錢匕同煎減半空腹頓服獨異志東垣治一老僕面塵脫色神氣特弱病脫肛日久服藥未效復下赤白膿痢作裏急後重白多赤少不任其苦求治曰此非肉食膏粱必多蔬食或飲食不節天氣雖寒衣蓋猶薄不禁而腸頭脫下者寒也真氣不禁形質不收乃血滑脫也此乃寒滑氣泄不固故形質下脫也妙斷當以澀去其脫而除其滑惟醋之味固氣上收以大熱之劑而除寒水陽以補氣之藥升陽益氣用御米殼去蒂萼蜜炒橘皮已上各五分乾薑炮六分訶子煨去核七分為細末都作一服水二盞煎減半空心熱服從來痢無止法此案當玩神色及日久未效句可悟醫理之無方體也一人腸澼下血另作一𣲖其血唧出有力而逺射四散如篩春中血下行腹中大作痛乃陽明氣衝熱毒所作也當升陽去溼熱和血脉以陳皮二分熟地歸身蒼术秦芁桂各三分生地丹皮生甘草各五分升麻七分炙甘草黃茋各一錢白芍一錢五分名曰升陽去熱和血湯作一服水四盞煎至一盞空心稍熱服一人腸澼下血色紫黑腹中痛腹皮惡寒右關弦按之無力而喜熱物尉之內寒明矣以肉桂一分桂枝四分丹皮柴胡葛根益智仁半夏各五分歸身炙甘草黃茋升麻各一錢白芍一錢半乾薑少許名曰益智和中湯都作一服水三盞煎至一盞溫服一人太陰陽明腹痛大便常泄若不泄即祕而難見在後傳作溼熱毒下鮮紅血腹中微痛脅下急縮脉緩而洪弦中之下得之按之空虛以蘇木一分藁本益智各二分熟地炙甘草三分當歸身四分升麻柴胡各五分名曰和中益胃湯作一服空心溫服一人因傷冷飯水泄一夜十數行變作白痢次日其痢赤白腹中㽲痛減食熱躁四肢沉困無力以生黃芩三分當歸身四分肉桂炙甘草各五分猪苓茯苓各六分澤瀉一錢白芍一錢半蒼术生薑升麻柴胡各二錢分作二服食前稍熱服海藏治楊師三朝三大醉至醒發大渴飲冷水三巨杯次又飲冷茶三碗後病便鮮血四次約一盆先以吳茱茰丸翌日又與平胃五苓各半散三服血止復變白痢又與神應丸四服白痢乃止其安如初或曰何為不用黃連之類以解毒所用者溫熱之劑海藏曰若用寒凉其疾大變難療寒毒內傷復用寒藥非其治也况血為寒所凝浸入腸間而便下得溫乃行所以用溫熱其血自止經曰治病必求其本此之謂也胃既溫其血不凝而自行各守其鄉也衍義云有一男子暑月患血痢醫妄以凉藥逆治專用黃連阿膠木香治之此藥始感便治則可今病久腸虛理不可服踰旬幾至委頓故曰理當别藥知是論之誠在醫之通變矣循經則萬無一失引此為例餘皆倣此暑月久病血痢不用黃連陰在內也宋孝宗嘗患痢衆醫不效德壽憂之過青宫偶見小藥肆遣使問其能治痢否對曰專科遂宣之請得病之由語以食湖蟹多故致此疾遂令診脉曰此冷痢也遂進一方用蓮藕一味不拘多少取新採者為佳細搗取汁以熱酒調服搗時用金杵臼酒調服數次而愈德壽大喜就以金杵臼賜之仍命擢醫官人呼為金杵臼嚴防禦家云仇逺稗史參政陸公容嘗於客座聞一醫者云酒不宜冷飲陸頗訝之謂其未知丹溪之論而云然耳二三年後秋間陸偶得痢疾延此醫治之云公得非多飲冷酒乎陸以實告謂信丹溪之論暑月常飲冷醇酒醫云丹溪但知熱酒之為害而不知冷酒之為害尤甚也服藥數劑而止羅謙甫治亷臺王千户年四十五領兵鎮漣水此地卑溼因勞役過度飲食失節至秋深瘧痢並作月餘不愈飲食全減形羸瘦仲冬輿疾歸羅診脉弦細而微如蛛絲身體沉重溼也手足寒逆寒也時復麻痺虛皮膚痂疥如癘風之狀無力以動心腹痞滿嘔逆不止皆寒溼為病久淹斷之寒溼妙宜細玩之真氣衰弱形氣不足病氣亦不足針經云陰陽皆不足也針所不為灸之所宜內經曰損者益之勞者溫之十劑云補可去弱先以理中湯加附子溫養脾胃散寒溼澀可去脫養臟湯加附子固腸胃止瀉痢仍灸諸穴以併除之經云府㑹太倉即中脘也先灸五七壯以補養脾胃之氣進美飲食次灸氣海百壯生發元氣滋榮百脉充實肌肉復灸足三里胃之合也三七壯引陽氣下交陰分亦助胃氣後灸陽輔足少陽膽穴二七壯接續陽氣令足脛溫暖散清溼之邪逮月餘病氣去神完如初有人患痢赤白兼下或純白純赤百藥不愈者病久服藥已多治痢多用毒藥攻擊致臟氣不和所以難愈史載之用輕清和氣藥與之遂愈屢試有驗病久百藥不效所以清補取效若初起則又當别論其方用罌粟殼蜜炙人參白术茯苓川芎甘草炙黃茋等分為細末二錢水一盞生薑棗烏梅半箇煎八分溫不拘時憲宗賜馬總治瀉痢腹痛方以生薑和皮切碎如粟米大用一大盞并芽茶相等煎服之元祐二年文潞公得此疾百藥不效用此方而愈丹溪治一小兒八歲下痢純血作食積治用蒼术白术黃芩白芍滑石茯苓甘草陳皮神曲煎湯下保和丸一人患痢後甚逼迫正合承氣症朱曰氣口脉虛形雖實而面黃稍白必平昔過飽胃傷遂與參术陳皮芍藥等補藥十餘貼三日後胃氣稍完與承氣湯二貼而安若不先補雖愈未免瘦憊一人患痢善食易飢朱曰當調補自養豈可恣味戕賊令用熟蘿蔔喫粥調理而安一人患痢久不愈脉沉細弦促右為甚日夜數十行下清涕有紫黑血絲食少朱曰此瘀血痢也凡飽食後疾走或極力呌號毆跌多受疼痛大怒不泄補塞太過火酒火肉皆致此病此人以非罪受責故也乃以乳香沒藥桃仁滑石佐以木香檳榔神曲糊丸米飲下百丸再服大下穢物如爛魚腸二三升愈此方每用之不加大黃則難下一老人面白脉弦數獨胃脉沉滑因飲白酒作痢下淡水膿血腹痛小便不利裏急後重參术為君甘草滑石檳榔木香蒼术為佐使煎湯下保和丸三十粒次日前症俱減獨小便未利以益元散服之而愈一人飲水過多腹脹瀉痢帶白用蒼术白术厚朴茯苓滑石煎湯下保和丸一人年踰五十夏間患痢腹微痛所下褐色後重頻併食減或微熱脉弦而澀似數且稍長喜不浮大兩手相等神氣大減朱曰此憂慮所致心血虧脾氣弱耳以參术為君歸身陳皮為臣川芎白芍炒茯苓為佐使時暄熱甚少加黃連二日而安一壯年奉養厚夏秋患痢腹大痛或令單煮乾薑與一貼痛定屢痛屢服之而定八日服乾薑三斤左脉弦而稍大似數右脉弦而大稍減亦似數重取似緊朱曰必醉飽後食寒凉太多當作虛寒治之因服乾薑多以四物去地黃加參术陳皮酒紅花茯苓桃仁煎入薑汁飲之一月而安一婦年近四十秋初尚熱患痢腹隱痛夜重於日全不得臥虛食減口乾不飲已服靈砂二貼矣兩手脉皆澀且不勻憊甚飲食全減用四物湯倍加白术為君陳皮佐之十貼愈以上三症乃大虛寒者若因其逼迫而用峻劑豈不誤哉一人年五十質弱多怒暑月因怒後患痢口渴自飲蜜水病緩數日後脉稍大不數令以參术湯調益元散飲之痢減數日後倦甚發咳逆知其久下陰虛令守前藥痢尚未止以煉蜜與之衆欲用薑附朱謂陰虛服之必死待前藥力到自愈又四日咳逆止痢除滑伯仁治二婢子七八月間同患滯下診視一婢脉鼓急大熱喘悶曰此婢不可療一婢脉洪大而虛軟微熱熱雖微亦當解表且小便利滑曰此婢可治即下之已而調以苦堅之劑果一死一愈一婦盛暑患洞泄厥逆惡寒胃脘當心而痛自腹引脅轉為滯下嘔噦不食人以中暑癨亂療之益劇攖寧生論其脉三部俱微短沉弱不應呼吸曰此陰寒極矣不亟溫之則無生理內經雖曰用熱遠熱又曰有假其氣則無禁也於是以薑附溫劑三四進間以丹藥脉稍有力厥逆漸退更服薑附七日諸症悉去遂以丸藥除其滯下而臟腑自安矣劉宗序治一富人年三十時七月間患血痢日夜百餘度日夜百餘度即當溫補肚腹中㽲痛醫悉用芩連阿膠粟殼之劑皆不效反增劇劉脉之曰脾胃受傷苦用寒涼病安得愈投以四君子湯加乾薑附子其夕病減半旬日而愈或問其故劉曰病者夏月食冰水瓜果太多致令脾胃傷冷血不行於四肢八脉滲入腸胃間而下吾所用附子乾薑補中有發散其所傷冷毒故得愈也王汝言雜著有云芩連芍藥為痢疾必用之品豈其然乎此脾胃傷冷致痢禁用寒凉也傅滋治一人年近四十患下血或以痔治百治不效詢之因厚味所致因悟此必食積也遂以保和丸加白术服之加白术即大安丸漸愈後又治數人皆驗有人日飲酒遂成酒痢骨立不食但飲酒一二盞痢作幾年矣因與香茸丸一兩服遂止蓋麝能治酒毒也壺仙翁治四川髙太守命婦病滯下腹痛腰脹召翁診其脉曰此氣血滯鬱而然當調經和氣經調氣和則痢自止所以知其病者切其脉沉而滯循其尺尺澀沉滯則氣不和澀則精血傷病得積菀而强食故氣血俱傷乃投以四物五苓木香痛少止倍當歸經通而滯下已虞恆德治一人年五十夏秋間得痢疾月餘服藥而少愈穢積已盡但糟粕不實晝夜如厠六七次兼脫肛不安又半月諸藥不效虞以祖方用池塘中鱉一箇如法修事多用生薑米􅖲作羮入砂糖一小塊不用鹽醬熟煮喫一二碗三日不登厠大腸自此實矣肛門亦收而不脫蓋此症緣脾土受虛致肺與大腸俱失化源之所滋養故大腸不行收令也此母令子虛耳鱉乃介蟲屬金有土性溫能補脾肺又况肺惡寒先得芩連等寒凉之味已多今用生薑之辛以補肺金用砂糖之甘以補脾土肺氣既實其大腸亦隨而實故得以行收令也一婦患滯下晝夜五十餘起後重下迫且妊九月衆醫率為清暑散滯痛苦尤甚滑診之曰須去下滯衆以妊難之滑曰經云有故無損亦無損也動則正産乃以消滯導氣丸藥進之得順利再進滯去繼以清暑利溲苦堅之劑病愈而孕果不動足月乃産徐可豫治㑹稽老鐵楨病寒疾十七日變滯下一晝夜百餘度他醫視疾曰元氣脫矣已而徐切脉告曰頃吾於西門視一劇證其脉與公等然公七日當起彼不出三日當殂遂投劑至期果獲平復而越三日者殂矣汪石山治一婦病痢瘦弱久伏枕粥食入胃即腹痛嘔吐必吐盡所食乃止由是粒食不下咽者四十餘日醫皆危之汪診曰病與脉應無慮也不勞以藥惟宜飼以米飲使胃常得榖氣白露節後症當獲安如期果愈一婦人年踰五十病痢半載餘醫用四物凉血之劑及香連丸愈增胃脘腹中痛甚裏急後重下痢頻併噯氣亦或咳嗽遍身煩熱汪診之脉皆細弱而數曰此腸胃下久而虛也醫用寒凉愈助降下之令病何由安經云下者舉之虛者補之以參术為君茯苓芍藥為臣陳皮升麻為佐甘草為使研末研末妙胃虛非煎劑所宜每服二錢清米飲調下一日二次或三次乃安一人八月患滯下醫用調胃承氣大承氣湯下之不利汪視之面色痿黃食少無味大便不通惟後重甚痛脉皆細弱近滑細弱為氣滑為氣滯右脉覺弱汪曰此氣滯非血滯也醫用硝黃利血宜其氣滯於下而愈不通矣遂令吞黃連清熱阿膠養血丸再用蓮子升麻提氣白芍黃苓枳殼行滯歸身煎服而安後用白术人參各二兩白芍陳皮山查各一兩為末粥丸常服調理石山兄年踰六十蒼古素健九月患滯下自用利藥三貼病減延至十月後重未除滯下未止診之脉皆濡散頗緩初用人參二錢歸身升麻白芍桃仁黃茋各一錢檳榔五分煎服後重已除再減桃仁檳榔加白术錢半滯下亦定惟糞門深入寸許近後尾閭穴傍內生一核如梅頗覺脹痛不爽汪曰此因努責氣血下滯於此耐煩數日膿潰自安果如所言後服槐角丸痔痛如故仍用人參三錢歸茋升麻等劑而愈一人病滯下腹痛後重日夜四五十行診之脉皆濡弱近駛駛為血熱曰此熱傷血也以四物加檳榔大黃下之四五行腹痛稍減後重不除仍用前方除大黃服十餘貼繼吞香連丸獲安吳茭山治一婦長夏患痢痛而急迫其下黃黑色諸醫以薷苓飲倍用枳殼黃連其患愈劇吳診其脉兩尺緊諸緊為寒而澀澀為血少知寒傷榮也問其病由乃行經之時因渴飲冷水一碗遂得此症蓋血被冷水所凝瘀血歸於大腸熱氣所以墜下故用桃仁承氣湯內加馬鞭草元胡索何以不加桂一服次早下黑血升許痛止臟清次用調脾活血之劑其患遂痊此蓋經凝作痢不可不察也此案竒有下痢色如墨者俞子容治王一山年六十餘因多食蟹蓄毒在臟秋患大便膿血日夜三四十度醫率用止血之劑不效延及半載氣血漸弱飲食漸減肌肉漸瘦服熱藥則腹愈痛血愈下服涼藥則瀉注諸醫技窮如遇此症溫凉不效當思調元化毒俞治之遂用人參一兩椿白皮五錢甘草一錢半一服病減十之五二服飲食如常脉息平和矣薛已治一婦人五月患痢日夜無度虛小腹墜痛發熱惡寒用六君子湯送香連丸二服漸愈仍以前湯送四神丸四服全愈至七月中怠惰嗜臥四肢不收體重節痛口舌乾燥飲食無味大便不實小便頻數灑淅惡寒悽慘不樂此脾肺之虛而陽氣寒不伸也用升陽益胃湯而痊少宗伯顧東江停食患痢腹痛下墜或用疏導之劑兩足腫脹飲食少體倦煩熱作渴脉洪數按之微細以六君加薑桂各二錢吳茰五味各一錢煎熟冷服之睡覺而諸症頓退再劑全退此假熱而治之以假寒也太常邊華泉公嘔吐不食腹痛後重自用大黃等藥一劑腹痛益甚自汗發熱昏憒脉大虛用參术各一兩炙甘草炮薑各三錢升麻一錢一服而蘇又用補中益氣加炮薑二劑而愈廷評曲汝為食後入房翌午腹痛去後似痢非痢次日下皆膿血煩熱作渴神思昏倦用四神丸一服頓減又用八味丸料加五味吳茰骨脂肉蔲二劑全愈非痢必大小便牽痛如無大小便牽痛初起豈有投四神丸之理此案不過指學者之迷耳因倒變通在乎人之神明不然是死於立齊先生言下矣通判汪天錫年六十餘患痢腹痛後重熱渴引冷飲食不進用芍藥湯內加大黃一兩四劑稍應仍用前藥大黃減半數劑而愈此等元氣百無一二此說在膏粱自奉者則然非可以概天下之病也一老人素以酒乳同飲去後似痢非痢胸膈不寬用痰痢等藥不效薛思本草云酒不與乳同飲為得酸則凝結得苦則行散乃以茶茗為丸時用清茶送三五十丸不數服而瘥一老婦食後因怒患痢裏急後重屬脾氣下陷與大劑六君加附子肉蔲煨木香各一錢吳茱茰五分骨脂五味各一錢五分二劑諸症悉退惟小腹脹悶此肝氣滯於脾也與調中益氣加附子木香五分四劑而愈後口內覺鹹此腎水泛與六味地黃丸二劑頓愈此等治法何由真知其屬脾氣下陷不明言所以然之故實足以誤後學薛母年八十仲夏患痢腹痛作嘔不食熱渴引湯手按腹痛稍止脉鼓指即鼓指已屬虛况八十之老人耶而有力真氣虛而邪氣實也急用人參五錢白术茯苓各三錢陳皮升麻附子炙甘草各一錢服之睡覺索食脉症頓退再劑而安此取症不取脉也凡暴症毋論其脉當從其症亦有暴病當從脉者石閣老太夫人其年歲脉症皆同彼乃專治其痢遂致不起方䕃山治一小兒八歲患滯下每夜百度食入即吐乃以熟麵作果分作二片以一片中空之用木鱉子三箇去殼搗如泥加麝香三厘填入果心貼臍上外以帕繫上用熱鞋尉之噤口痢外治神方待腹中作響喉中知有香氣即思食能進是夜痢大半二三日漸愈後以此治噤口痢多驗江篁南治吳元靜患痢腹痛用煎藥下二次又用巴豆丸更下二次即覺怕風不安下後非又感冒也然何以怕風曰肺大腸為表裏裏虛則表亦虛故怕風雖然藥中必配解表之品五日後診之脉左三部俱弦左關浮弱而澀證見惡風自汗肢節痛似表症裏急後重用參茋歸术枳殼檳榔砂仁山查陳皮防風甘草扁豆神曲芩連木香加薑一片一服遂不畏風汗止腹痛頓除後重亦減二服而愈江應宿治許翰林潁陽公令叔年六十三歲患血痢三越月四肢面目浮腫血水淡如莧菜汁漏下不知諸藥不效粒米不進者五日診其脉沉細代絶沉細代絶豈有不用溫補之理即告之曰六脉代絶而少隂脉久久如蛛絲至者胃中有寒溼也寒溼傷脾脾虛則不能攝血歸源而下行胃寒則不能食也投人參白术各二錢為君茯苓澤㵼木瓜各八分為臣以補脾滲溼當歸五分和血炮薑附子為佐散寒溼甘草升麻舉下陷之元氣一匕而飲食進再飲而血減用樗根白皮人參等分為丸每空心滚水送三五十丸三服而愈嘔吐琇按經曰諸逆衝上皆屬于火症用燥熱極宜詳慎錢仲陽治王子病嘔泄他醫以剛劑加喘焉乙曰是本中熱脾且傷燥之將不得前溲與之石膏湯王不信謝去信宿寖劇竟如言而效滑伯仁治一婦病反胃每隔夜食飲至明日中昃皆出不消化他醫悉試以暖胃之藥罔效滑視脉在肌肉下即沉且甚微而弱竊揆諸醫用藥於病無遠何至罔效心歉然未決一日讀東垣書謂吐證有三氣積寒也上焦吐者從於氣中焦吐者從於積下焦從於寒脉沉而遲朝食暮吐暮食朝吐小溲利大便祕為下焦吐也法當通其祕溫其寒復以中焦藥和之滑得此說遂復往視但大便不祕專治下焦散寒以吳茰茴香為君丁桂半夏為佐服至二三十劑而飲食晏如所謂寒淫所勝平以辛熱是也丹溪治一人年五十餘因溼氣嘔吐酸水如醋素飲酒以二陳湯加白术蒼术砂仁藿香黃連二貼而安一少年好酒每早嘔吐以瓜蔞貝母梔子炒石膏煅香附南星神曲炒山查一兩枳實薑黃蘿蔔子連翹石􅜮半兩升麻二錢半神曲糊丸服項彥章治建康萬夫長亷君病醫投薑桂愈甚診其脉告曰此得之酒病當噦作聲食入即出而後溲不利此關格病亷曰然豫生平所嗜燒酒乃進葛花解酲加黃芩飲三升所勢減衆醫以藥性過寒交沮之項以論不協辭去歎曰實實而虛虛過二月當入鬼録矣果驗所以知亷病者切其脉細數而且滑數為熱滑為嘔為胃有物酒性大毒大熱而反以熱劑加之是以火濟火也且溲祕為陽結今反治故二月死也史載之治朱思古眉州年三十歲得疾不能食聞葷腥即嘔惟用大鐺旋煮湯沃淡飯數數食之醫莫能治史曰俗輩不讀醫經而妄欲療人之疾可歎也君之疾正在素問經中名曰食挂凡人之肺六葉舒張而蓋下覆於脾子母氣和則進食一或有戾則肺不能舒脾為之敝故不嗜食遂授一方清氣潤肺為治服之三日病者鼻聞肉味覺香取啖之甚美此事宋人載於傳記余考之岐黃書皆無食挂之說或記者假托耳或史公大言以欺世歟皆未可知也虞恆德治一婦年將三十産後因食傷致胃虛不納榖四十餘日矣聞榖氣則惡心而嘔聞藥氣亦嘔求治虞曰藥不能入口又將何法以治之乎懇求不已遂用人參白术茯苓各一錢甘草二分陳皮藿香砂仁各五分炒神曲一錢十年以上陳倉米一合順流水二大盞煎沸泡伏龍肝研細攪渾放澄清取一盞加薑棗同煎前藥至七分稍冷服看他用藥輕重之法此藥遂納而不吐别以陳倉米煎湯時時咽之日進前藥二三服漸能喫粥而安後以此法治十數人悉驗汪石山治一人年三十形瘦淡紫才覺氣壅腹痛背脹則吐腹中氣塊翻動嘈雜數日乃吐黑水一盥盆而作酸氣吐後噯氣飲食不進過一二日方食大便二三日不通小便一日一次常時難向右臥此症不同于弱症午後怕食食則反飽脹痛行立坐臥不安日輕夜重二年後汪診之脉皆浮弦細弱曰此脾虛也脾失健運故氣鬱而脹痛吐黑水者蓋因土虛不能制水故膀胱之邪乘虛而侮其脾土經曰以不勝侮其所勝是也酸者木之所司脾土既虛水挾木勢而凌之焉醫作痰治而用二陳剛劑則脾土愈虛又作血治而用四物柔劑則是以滯益滯又作熱治而用黃連解毒則過於苦寒又作氣治而用丁沉藿香則過於香燥俱不中病辨駁精切詳明遂以人參三錢黃茋一錢半歸身一錢香附陳皮神曲各七分黃芩甘草各五分吳茰三分煎服旬餘又犯油膩病作如前而尤重仍以前方加減或湯或丸散服至半年而愈薛已治大司馬王浚川嘔吐宿滯臍腹痛甚手足俱冷脉微細用附子理中丸一服愈甚脉浮大按之而細用參附湯一劑而愈用而愈甚復投而愈始信藥力有輕重耳今人用而不愈即不肯再投矣欲其疾之瘳也難哉趙吏部文卿患嘔吐不止吐出皆酸味氣口脉大於人迎二三倍速薛投劑薛曰此食鬱在上宜吐不須用藥乃候其吐清水無酸氣寸脉漸減尺脉漸復翌早吐止至午脉皆平復不藥自愈一儒者場屋不利胸膈膨悶飲食無味服枳术丸不時作嘔用二陳黃連枳實痰湧氣促加紫蘇枳殼喘嗽腹脹加厚朴腹皮小便不利加檳榔蓬术泄瀉腹痛悉屬虛寒用六君加薑桂二劑不應更加附子一錢二劑稍退數劑十愈六七乃以八味丸全愈博按此案舊刻脫悮一上舍嘔吐痰涎發熱作渴胸膈痞滿或用清氣化痰降火前症益甚痰涎自出薛曰嘔吐痰涎胃氣虛寒發熱作渴胃不生津胸膈痞滿脾氣虛弱須用參茋歸术之類溫補脾胃生發陽氣諸病自退渠不信仍服前藥虛症悉至復請治薛曰飲食不入吃逆不絶泄瀉腹痛手足逆冷是謂五虛煩熱作渴虛陽越於外也脉洪大脉欲絶也死期迫矣或曰若然殞於日乎夜乎薛曰脉洪大殞於晝果然薛母太宜人年六十有五春三月飲食後偶聞外言忤意嘔吐酸水內熱作渴飲食不進惟飲冷水氣口脉大無倫面色青赤此胃中溼熱鬱火投之以藥入口輒吐第三日吐酸物第七日吐酸黃水十一日吐苦水脉益洪大仍喜冷水此症得生以有鬱火耳故喜冷水以黃連煎湯冷飲少許至二十日加白术茯苓至二十五日加陳皮三十七日加當歸炙甘草至六十日始進清米飲半盞漸進薄粥飲調理得愈一婦人吞酸噯腐嘔吐痰涎面色純白或用二陳黃連枳實之類加發熱作渴肚腹脹滿薛曰此脾胃虛損末傳寒中不信乃作火治肢體腫脹如蠱以六君加附子木香治之胃氣漸醒飲食漸進虛火歸經又以補中益氣加炮薑木香茯苓半夏兼服全愈一婦人久患心腹疼痛每作必胸滿嘔吐厥逆面赤唇麻咽乾舌燥寒熱不時而脉洪大此症與脉旬當作虛治衆以痰火治之屢止屢作逮至春發熱頻甚用藥反劇有欲用參术等劑或疑痛無補法薛診而歎曰此寒凉損真之故內真寒而外假熱也且脉息弦洪有怪狀乃脾氣虧損肝脉乘之而然惟當溫補其胃遂與補中益氣加半夏茯苓吳茰木香一服而效一婦人年三十餘忽不進飲食日飲清茶三五碗并少用水果三年矣經水過期而少薛以為脾氣鬱結用歸脾加吳茰不數劑而飲食如常若人脾腎虛而不飲食當以四神丸治之一婦人年踰二十不進飲食二年矣日飲清茶果品之類面部微黃浮腫形體如常仍能履步但體倦怠肝脾二脉弦浮按之微而結滯薛用六君子加木香吳萸下痰積甚多用六君子而見痰積甚多得生在此飲食頓進形體始瘦臥牀月餘仍服六君之類而安烺按以上二案但云不進飲食並無嘔吐之症何以入此一人粥食湯藥皆吐不停灸手間使手間使穴手厥陰穴也在掌後三寸身用同寸法三十壯若四肢厥脉沉絶不至者灸之便通此起死之法千金方江篁南治一婦人患嘔吐粒米不入者六日矣兼頭眩胸膈如束而不紓診其脉沉弦而駛且無力王中陽治吐痰嘔症用滚痰丸因脉長此脉無力作虛而協痰症不同脉亦不同此屬中氣虛挾痰鬱耳以人參三錢陳皮川歸各一錢加烏藥炒人乳竹瀝薑汁一服膈紓如解其束二服吐止能食十劑而安江應宿治一婦人年近四十小産後嘔吐不食發寒熱他醫作瘧治反增劇宿診之脉浮數按之無力此虛症虞恆德案亦産後症無寒熱亦作虛治投六君加薑汁炒山梔煎調木香散嘔吐止熱不退用當歸養血丸補中益氣而愈噎膈齊王中子諸嬰兒小子病召臣意診切其脉告曰氣膈病病使人煩悶食不下時嘔沫病得之少憂數忔忔音疑乞反食飲意即為之作下氣湯以飲之一日氣下二日能食三日即病愈所以知小子之病者診其脉心氣也濁躁而經也此絡陽病也脉法曰脉來數病去難而不一者病主在心周身熱脉盛者為重陽重陽者蕩逖音唐蕩也心主故煩悶食不下則絡脉有過絡脉有過則血上出血上出者死此悲心所生也病得之憂也脉法妙史記華他道見一人病噎嗜食而不得下家人車載欲往就醫他聞其呻吟駐馬往語之曰向來道傍有賣餅者蒜􅐽大酢從取三升飲之病當自瘥即如他言立吐蛇一條懸之車邊欲造他他尚未還他家小兒戲門前迎見自相謂曰客車傍有物必是逢我翁也疾者前入見他壁北懸此蛇以十數他傳吳廷紹為太醫令烈祖因食飴喉中噎國醫皆莫能愈廷紹尚未知名獨謂當進楮實湯一服疾失去羣醫默識之他日取用皆不驗或扣之答曰噎因甘起故以楮實湯治之南唐書一村夫因食新筍羮咽納間忽為一噎延及一年百藥不效王中陽乃以蓽撥麥芽炒青皮去穰人參苦梗柴胡白蔲南木香髙良薑半夏曲共為末每服一錢水煎熱服次日病家來告曰病者昨已病極自已津唾亦咽不下服藥幸納之胸中沸然作聲覺有生意敢求前劑况數日不食特遊氣未盡擬待就木今得此藥可謂還魂散也王遂令其搗碎米煮粥將熟即入藥再煎一沸令啜之一吸而盡連服數劑得回生因名曰還魂散後因之治七情致病吐逆不定面黑目黃日漸瘦損傳為噎症者多驗但忌油膩魚腥粘滑等物外臺載昔幼年經患此病每食餅及羮粥等須㬰吐出貞觀中許奉御兄弟及柴蔣等時稱名醫奉敕令治窮其術不能療漸至羸憊危在旦夕忽一衛士云服驢溺極驗黃疸服牛尿效亦同旦服二合後食惟吐一半晡時又服二合人定時食粥吐即定迄至次日午時奏之大內五六人患翻胃同服一時俱瘥此溺稍有毒服時不可過多盛取及熱服二合病深七日以來服之良驗本事方孫道祕傳翻胃方州鈐轄苦此病危甚孫為診之數服愈其法用一附子去其蓋刳中使淨納丁香四十九粒復以蓋覆之線縛定著置銀石器中浸以生薑自然汁及蓋而止慢火煮乾細末一錢匕糝舌上漱津下若煩熱則徐食糜粥忌油膩生冷纍試纍驗類編廣五行記治噎疾永徽中絳州有僧病噎數年臨死遺言令破喉視之得一物似魚而有兩頭遍體悉是肉鱗致鉢中跳躍不止以諸味投鉢中須㬰化為水時寺中刈藍作靛試取少靛置鉢中此蟲繞鉢畏避須㬰化為水是人以靛治噎疾多效良方丹溪治一少年食後必吐出數口却不盡出膈上時作聲面色如平人病不在脾胃而在膈間其得病之由乃因大怒未止輒食麵故有此症想其怒甚則死血菀於上積在膈間礙氣升降津液因聚為痰為飲與血相搏而動故作聲也用二陳加香韭汁蘿蔔子二日以瓜蒂散敗醬吐之再一日又吐痰中見血一盞次日又吐見血一鍾而愈一中年婦人中脘作痛食已乃吐面紫霜色兩關脉澀乃血病也因跌仆後中脘即痛投以生新血推陳血之劑吐血片碗許而愈一中年婦人反胃以四物湯加帶白陳皮留尖桃仁去皮生甘草酒紅花濃煎入驢尿以防生蟲與數十貼而安一人勤勞而有艾妻且喜酒病反胃半年脉澀不勻重取大而無力便燥面白形瘦精血耗故也取新溫牛乳細飲之每次盡一杯晝夜五七次漸至八九次半月便潤月餘而安然或口乾蓋酒毒未解間飲以甘蔗汁少許一云先與六君子湯加附子大黃甘蔗汁飲之便潤乃以牛乳飲之二月而安一人年四十病反胃二月不喜飲食或不吐或吐涎裹食出得吐則快脉澀重取弦大因多服金石房中藥所致時秋熱以竹瀝御米御米即罌粟米治反胃為粥二三啜而止頻與之遂不吐後天氣稍凉以流水煮粥少入竹瀝與之間與四物加陳皮益其血月餘而安一人咽膈間常覺物閉悶飲食妨礙脉澀稍沉形色如常以飲熱酒所致遂用生韭汁每服半盞日三服至二斤而愈一人不能頓食喜頻食一日忽咽膈壅塞大便燥結脉澀似真藏脉喜其形瘦而色紫黑病見乎冬却有生意以四物湯加白术陳皮濃煎入桃仁十二粒研再沸飲之更多食諸般血以助藥力三十貼而知至五十貼而便潤七十貼而食進百貼而愈一人食必屈曲下膈梗澀微痛脉右甚澀而關沉左却和此汚血在胃脘之口氣因鬱而為痰必食物所致詢其去臘日飲㓠刴酒三盞遂以生韭汁半盞冷飲細呷之盡二斤而愈已上三人皆滯血致病而脉澀應之乃噎膈之漸也一人止能喫稀粥一匙即可下膈若雜喫一菜則連粥俱吐起居如常用凉膈散加桔梗服虞恆德治一人年五十餘夏秋間得噎症胃脘痛食不下或食下良久復出大便燥結人黑瘦甚右關前脉弦滑而洪關後略沉小左三部俱沉弦尺帶芤此中氣不足木來侮土上焦溼熱鬱結成痰下焦血少故大便燥結陰火上衝吸門故食不下用四物以生血四君以補氣二陳以祛痰三合成劑加薑炒黃連枳實括蔞仁六君四物合小陷胸湯可法少加砂仁又間服潤腸丸或服丹溪墜痰丸半年服前藥百貼而全愈一婦年近五十身材略瘦小勤於女工得膈噎症半年矣飲食絶不進而大便結燥不行者十數日小腹隱隱疼痛六脉皆沉伏以生桃仁七箇令細嚼杵生韭汁一盞送下作血瘀治片時許病者云胸中略見寬舒以四物六錢加括蔞仁一錢桃仁泥半錢酒蒸大黃一錢酒紅花一分煎成正藥一盞取新溫羊乳汁一盞合而服之半日後下宿糞若干明日腹中痛止漸可進稀粥而少安後以四物出入加減合羊乳汁服五六十貼而愈古朴治一人患噎人咸意其不起古朴視以此正合丹溪胃口乾槁之論例五膈寬中平胃散病在不治若能滋陰養血補脾開胃加之竹瀝以清痰人乳以潤燥庶或可生其家依法治之而愈汪石山治一人形瘦而蒼年踰五十診其脉皆弦澀而緩尺脉浮而無根曰尺脉當沉反浮所主腎水有虧其餘脉皆弦澀而緩者弦脉屬木澀為血少緩脾脉也以脉論之此係血液枯槁而有肝木凌脾非膈則噎也問之胸膈微有礙曰不久膈病成矣病成非藥可濟後果病膈而卒一人瘦長而色青性剛急年三十餘病反胃每食入良久復出又嚼又咽但不吐耳或作氣治而用丁香藿香或作痰治而用半夏南星或作寒治而用薑附俱罔效汪脉之皆緩弱稍弦曰非氣非痰亦非寒也乃肝凌脾之病經云能合色脉可以萬全君面青性急肝木盛也脉緩而弱脾土虛也遂用四君子湯加陳皮神曲少佐薑炒黃連以泄氣逆月餘愈一人年踰六十形色紫平素過勞好飲病膈食至膈不下則就化為濃痰吐出食肉過宿吐出尚不化也初臥則氣壅不安稍久則定醫用五膈寬中散丁沉透膈湯或用四物加寒涼之劑或用二陳加耗散之劑罔效汪診之脉皆浮洪弦虛曰此大虛症也醫見此脉以為熱症而用涼藥則愈助其陰而傷其陽若以為痰為氣而用二陳香燥之劑則益耗其氣而傷其胃是以病益甚也况此病得之酒與勞酒性酷烈耗血耗氣莫此為甚又加以勞傷其胃且年踰六十血氣已衰脉見浮洪弦虛非吉兆也宜以人參三錢白术歸身麥冬各一錢白芍八分黃連三分乾薑四分黃芩五分陳皮七分香附六分煎服五貼脉斂而膈頗寬飲食亦進矣吳茭山治一婦人患宿痰嘔吐作噎膈治以陳皮海粉枳實白术香附半夏麯愈後以清氣化痰丸常服其患不復舉矣江應宿治一老婦近七旬患噎膈胃脘乾燥屬血虛有熱投五汁湯二十餘日而愈其方蘆根汁藕汁甘蔗汁牛羊乳生薑汁少許餘各半盞重湯煮溫不拘時徐徐服咳逆咳逆連屬不絶俗謂之厄忒是也噦者即乾嘔也胃氣逆為乾嘔厄逆是肺病戴復菴云傷寒發厄或有熱症雜病發厄本屬虛寒壺仙翁治鄉進士許崇志病􅀈逆醫以雄黃烟燻其鼻倐然目暗火症熱劇甚召翁診之曰此得怒氣傷肝肝氣上逆而􅀈木挾相火直冲清道經云木鬱達之即投以湧劑更為之䟱肝平氣數服而愈所以知崇志病者切其脉左關沉而弦右寸微而數沉弦為鬱微數為熱鬱不行故病􅀈逆此怒氣所生也丹溪曰諸逆冲上皆屬干火然亦有數者不同或痰或食或汗吐下後或中氣大虛或陽明失下或痢後胃虛陰火上冲清道宜細閲凖繩治法有病癨亂吐痢垂困忽發咳逆半月間遂至危殆一醫云凡傷寒及久病得咳逆皆惡候投藥不效者灸之愈遂令灸之火至肌咳逆隨定元豐中壺為鄜延經略使有幕官張平序病傷寒已困咳逆甚氣已不屬忽記灸法試令灸之未食頃遂瘥其法乳下一指許足陽明乳根穴正與乳相直骨間陷中婦人即屈乳頭度之乳頭齊處是穴艾炷如小豆大灸三壯男左女右只一處火到肌即瘥若不瘥則多不救矣灸法丹溪治一老人素厚味有久喘病作止不常新秋患痢食大減數日咳逆作脉豁大痢見厄逆從補况脉大耶仲景云大則為虛以其形瘦可治用參术湯下大補丸以補血至七日而安一女子年踰筓性躁味厚暑月因大怒而咳逆怒見厄逆治痰從吐每作一聲則舉身跳動神昏凡三五息一作脉不可診視其形氣實以人參蘆二兩煎飲大吐頑痰數碗大汗昏睡一日而安虞恆德治一人病傷寒陽明內實醫以補藥治之而成發咳逆十日後召虞診其脉長而實大與大承氣湯大下之熱退而咳亦止傷寒陽明內實失下一人得傷寒症七日熱退而咳連聲不絶舉家倣徨召虞診其脉皆沉細無力人倦甚以補中益氣湯作大劑加炮薑附子一錢一日三貼兼與灸氣海任穴乳根胃穴三處當日咳止脉亦充而平安胃虛呂元膺治一人病噦十餘日諸醫以附子丁香等劑療之益甚切其脉陽明大而長右口之陽數而躁因告之曰君之噦即古之咳逆由胃熱而致或者失察反助其熱誤矣飲以竹茹湯未終劑噦止胃火寶鑑治一人中氣本弱病傷寒八九曰醫見其熱甚以涼藥下之又食梨三枚痛傷脾胃四肢冷時發昏憒脉動而中止有時自還乃結脉也心亦悸動咳逆不絶丹溪云此症唯傷寒痢疾胃氣虛衰為至重色變青黃精神減少目不欲開踡足惡人語以炙甘草生薑桂枝人參生地阿膠麥門冬麻仁大棗水煎再服而愈傷寒下後吞酸吐酸琇按酸乃肝味是症多由肝經火鬱如食物遇鬱蒸則易酸也丹溪治一人因心痛久服熱藥多兼患吞酸以二陳湯加芩連白术桃仁郁李仁澤㵼服之纍湧出酸苦黑水如爛木耳者服久心痛既愈酸仍頻作有酸塊自胸膈間築上咽喉甚惡以黃連濃煎冷俟酸塊欲上與數滴飲之半日許下數次而愈乃罷藥淡粥調之一月時已交春節旬餘中脘處微脹急面帶青氣急喘促時天尚寒蓋脾土久病衰弱木氣行令此肝凌脾也急以索矩六和湯與之四日而安薛已治一儒者面色痿黃胸膈不利吞酸噯腐恪服理氣化痰之藥大便不實食少體倦此脾胃虛寒用六君加炮薑木香漸愈更兼用四神丸而元氣復此症若中氣虛弱者用人參理中湯或補中益氣加木香乾薑不應送左金丸或越鞠丸若中氣虛寒必加附子或附子理中湯無有不愈一上舍飲食失宜胸腹膨脹噯氣吞酸以自知醫用二陳枳實黃連蒼术柏皮之類前症益甚更加足指腫痛指縫出水薛用補中益氣加茯苓半夏治之而愈若腿足浮腫或焮腫寒熱嘔吐亦用前藥痞滿琇按案中與後腫脹亦無甚區别東垣治一貴婦八月中先因勞役飲食失節加之憂思病結痞心腹脹滿旦食則不能暮食兩脅刺痛琇按兩脅刺痛終是木氣乘土診其脉弦而細至夜濁隂之氣當降而不降䐜脹尤甚大抵陽主運化飲食勞倦琇按先生平生只主此四字損傷脾胃陽氣不能運化精微聚而不散故為脹滿先灸中脘乃胃之募穴引胃中生發之氣上行陽道又以木香順氣湯助之使濁陰之氣自此而降矣滑伯仁治一人病肺氣焦滿視之曰病得之多欲善飲且殫營慮中積痰涎外受風邪發為喘喝痰咳不能自安為製清肺泄滿降火潤燥苦辛等劑而愈一人苦胸中痞滿憒憒若怔忡狀頭目昏痛欲吐不吐忽忽善忘時一臂偏痺脉之關已上溜而滑按之沉而有力曰積飲滯痰橫於胸膈蓋得之厚味醇酒肥膩炙煿蓄熱而生溼溼聚而痰涎宿飲皆上甚也王冰云上甚不已吐而奪之治法宜吐候春日開明如法治之以物探吐喉中須臾大吐異色頑痰如膠飴者三四升一二日更吐之三四次則胸中洞爽矣羅謙甫治真定趙客六月間乘困傷溼麵心下痞滿躁熱時作臥不安宿於寺中僧以大毒熱藥數十丸下十餘行痞稍減越日困睡為盜劫其資心動遂躁熱而渴飲水一大甌是夜臍腹脹痛僧再以前藥復下十餘行病加困篤四肢無力躁熱身不停喜冷水米榖不化痢下如爛魚腸腦赤水相雜全不思食强食則嘔痞甚於前噫氣不絶足胻冷小腹不任其痛羅診脉浮數八九至按之空虛曰豫遡流尋源蓋暑熱已傷正氣以有毒大熱之劑下之一下之後其所傷之物已去而無餘矣遺巴豆之氣流毒於腸胃間使嘔逆而不能食胃氣轉傷而然及下膿血無度大肉脫下皮毛枯槁脾氣弱而衰矣舌上赤澀口燥咽乾津液不足下多亡陰之所致也陰既已亡心火獨旺故心胸躁熱煩亂不安經曰獨陽不生獨陰不長夭之由也遂辭去易一醫不審脉究原惟見痞滿即以枳殼丸下之病添喘滿利下不禁而死金匱云不當下而强下之令人開腸洞泄便溺不禁而死此之謂也虞恆德治一人年三十餘身材肥盛夏秋間因官差勞役至冬得痞滿症兩脅氣攻胸中飽悶不能臥欲成脹滿症厯數醫皆與䟱通耗散之藥不效十一月初旬虞診兩手關前皆浮洪而弦澀兩關後脉皆沉伏此膈上有稠痰脾土之氣敦阜肝木鬱而不伸當用吐法木鬱達之之理也奈值冬月降沉之令未可行此法且與豁痰䟱肝氣瀉脾胃敦阜之氣用平胃散加半夏青皮茯苓川芎甘草龍膽香附砂仁柴胡黃連栝樓仁等藥病退十之三四待次年二月初旬為行倒倉法安石山治一人年踰三十病中滿朝寬暮急屢醫不效汪診視脉浮小而弦按之無力曰此病宜補人參二錢白术茯苓各一錢黃芩木通歸尾川芎各八分梔子陳皮各七分厚朴五分煎服且喻之曰初服略脹久則寬矣彼疑氣無補法汪曰此俗論也氣虛不補則失其健順之常痞滿無從消矣經曰塞因寒用正治此病之法也服之果愈一人長瘦體弱病左腹痞滿穀氣偏行於右不能左達飲食減大便滯汪診其脉浮緩而弱不任尋按曰此土虛木實也用人參補脾枳實泄肝佐以芍藥引金泄木輔以當歸和血潤燥加厚朴陳皮以寬脹兼川芎山梔以散鬱服十餘貼稍寬因糞結思飲人乳汪曰恐大便滑耳果然遂停乳仍服前藥每貼加人參四五錢後思香燥物曰脾病氣結香燥無忌也琇按香燥無忌與前潤燥矛盾每日因食燥棐琇按棐何嘗燥一二十枚炙蒸餅十數片以助藥力年餘而安項彥章治一人病胸膈壅滿甚篤昏不知人醫者人人異見項以杏仁薏苡之劑灌之立蘇繼以升麻黃茋桔梗消其脹服之逾月瘳所以知其病者以陽脉浮滑陰脉不足也浮為風滑為血聚始由風傷肺故結聚客於肺陰脉之不足則過於宣逐也諸氣本乎肺肺氣治則出入易菀陳除故行其肺氣而病自已江汝潔治程秋山夏末因腹內有滯氣醫用硝黃之類下之遂成脹滿之症江診其脉右關舉按弦緩無力餘脉弦緩按之大而無力經曰諸弦為飲為勞為怒又曰緩而無力為氣虛又曰大而無力為血虛又曰脹滿者浮大則吉據脉論症則知弦為木緩為土木來侵土熱脹無疑也且此時太陰溼土主令少陽相火加臨溼熱太盛疾漸加劇急宜戒怒却厚味斷妄想待至五氣陽明燥金主令客氣燥金加臨疾漸減可治須大補脾土兼滋肺金更宜補中行溼以薏苡三錢白术蓮肉各二錢人參茯苓山藥各一錢赤豆一錢半水煎熱服一服是夜能轉動次早即視見臍二服脹消大半州守王用之先因肚腹膨脹飲食少思服二陳枳實之類小便不利大便不實咳痰腹脹用淡滲破氣之劑手足俱冷此足三陰虛寒之症用金匱腎氣丸不月而康一男子胸膈痞悶專服破氣之藥薛曰此血虛病也血生於脾土若服前藥脾氣弱而血愈虛矣不信用內傷藥吐血而歿腫脹琇按靈樞十二經皆有脹病丹溪治一人嗜酒病瘧半年患脹滿脉弦而澀重取則大手足瘦腹狀如蜘蛛以參术為君當歸芍藥川芎為臣黃連陳皮茯苓厚朴為佐生甘草些少日三次飲之嚴守戒忌一月後汗而瘧愈又半月小便長而脹退一人年四十餘嗜酒大便時見血春患脹色黑而腹大形如鬼狀脉澀而數重似弦而弱以四物加芩連木通白术陳皮厚朴生甘草作湯服之近一月而安一人因久病心痛咽酸治愈後至春中脘微脹面青氣喘意謂久病衰弱木氣凌脾以索矩三和湯而安琇按此案與吞酸首條之尾同一女子稟厚患胸腹脹滿自用下藥利十數行脹滿如故脉皆大按則散而無力朱曰此表證反攻裏當死賴質厚時又在室可救但壽損矣以四物湯加參术帶白陳皮炙甘草煎服至半月後尚未退自用蘿蔔種煎浴二度又虛其表稍增事急矣前方去芍藥地黃加黃茋倍白术大劑濃煎飲之又以參术為丸吞之十日後如初病時又食難化而自利以參术為君稍加陳皮為佐又與肉豆蔲訶子為臣山查為使粥丸吞之四五十貼而安一人因久瘧腹脹脉微弦重取澀皆無力與三和湯三倍术入薑汁數貼而瘧愈小便利腹稍減隨又小便短此血氣兩虛於前方入人參牛膝歸身尾大劑百貼而安俞仁叔年五十患鼓脹自制禹餘糧丸服之診其脉弦澀而數曰此丸新製煆煉之火邪尚存溫熱之藥太多宜有加減不可徒執其方琇按據脉乃陰虛內熱而為䐜脹誤服燥石以死與中熱門內倉公論齊王侍醫正同俞歎曰今人不及古人此方不可加減服之一月口鼻見血而死琇按可為泥古之鑒項彥章治一女腹痛脹如鼓四體骨立衆醫或以為娠為蠱為瘵也診其脉告曰此氣薄血室其父曰服芎歸輩積歲月非血藥乎曰失於順氣也夫氣道也血水也氣一息不運則血一息不行經曰氣血同出而異名故治血必先順氣俾經隧得通而後血可行乃以蘇合香丸投之三日而腰作痛曰血欲行矣急治芒硝大黃峻逐之下汚血纍纍如瓜者可數十枚而愈其六脉弦滑而且數弦為氣結滑為血聚實邪也故氣行而大下之又一女病名同而診異項曰此不治法當數月死向者鍾女脉滑為實邪今脉虛元氣奪矣又一女子病亦同而六脉獨弦項曰真藏脉見法當踰月死後皆如之茶商李富人也啖馬肉過多腹脹醫以大黃巴豆治之增劇項診之寸口脉促而兩尺將絶項曰胸有新邪故脉促宜引之上達今反奪之誤矣急飲以湧劑且置李中坐使人環旋頃吐宿肉琇按吐法奇仍進神芎丸大下之病去徐希古治遊擊將軍楊洪疾於口外蠱滿喘甚方春木令王土受伐金不能制當補中氣毋庸疏利議不與衆合藥至百五十餘貼乃效遂漸平復徐可豫治郭推府腹䐜脹體弱瘠足不任身徐診脉曰病始弗劇殆醫過耳病由怒傷肝肝傷在法當補補而元氣完邪必自潰醫不如此泄以苦寒劑下虛不收濁氣干上故愈泄病愈熾猶幸脉未至脫非緩以旬月不能也既投藥漸平復虞恆德治一族兄素能飲酒年五十得腫脹病通身水腫腹脹尤甚小便澀而不利大便滑泄召虞治虞曰若戒酒色鹽醬此病可保無危不然去生漸遠兄曰自今日戒起豫以丹溪之法而以參术為君加利水道制肝木清肺金等藥十貼而小水長大便實腫退而安又半月有二從弟平日同飲酒者曰不飲酒者山中之鹿耳我與兄水中之魚也鹿可無水魚亦可以無水乎三人遂痛飲沉醉而止次日病復作如前復求治虞曰不可為矣挨過一月而逝一人得腫脹病亦令戒前四事用前法服藥五十貼而愈頗安五年一日歎曰人生不食鹽醬與死等爾遂開鹽十數日後舊病大作再求治不許又欲行倒倉法虞曰脾虛之甚此法不可行於今日矣踰月膨脹而死虞用丹溪之法治腫脹愈者多矣不能盡述特書此二人不守禁忌者以為後人病此者之元龜傅滋治一人能大飱食肉必泄忽頭腫目不可開膈如築足麻至膝惡風陰器挺長脉左沉重取不應右短小却和滑令單煮白术湯空心服探吐之琇按陽明風熱症也以盛於上故宜吐之後以白术二錢麻黃川芎各五分防風三分作湯下保和丸五十丸吐中得汗上截居多腫退眼開氣順食進以前方去麻黃防風加白术三錢木通甘草各五分下保和丸五十丸五日而安一婦素多怒因食燒肉面腫不食身倦脉沉澀左豁大此體虛有痰所隔不得下降當補虛利痰為主每早以二陳加參术大劑與之探出藥琇按亦用吐法辰時後用三和湯三倍术睡後以神祐丸七丸撓其痰一月而安壺仙翁治瓜洲趙按察病䐜脹不能食溲遺血衆醫以為熱下以大黃之劑神乏氣脫而不能寐召翁診其脉告曰病得之勞傷心血久則脾胃俱傷所以知按察之病者切其脉時左寸沉右寸過左一倍兩關弦澀尺反盛不絶蓋煩勞不勝則逆鬱而不通不通則不能升降而作䐜脹䐜脹則不食肉沸而不下則關槖閉而溲且不輸故溲遺血乃和以八補之劑兼五鬱之藥不數日而愈越三日後復作如前治立除琇按此案再見第九卷淋閉門第一頁薛已治儒者痢後兩足浮腫胸腹脹滿小便短少用分利之劑遍身腫兼氣喘非水腫而分利之則氣愈傷而喘作薛曰兩足浮腫脾氣下陷也胸腹脹滿脾虛作痞也小便短少肺不能生腎也身腫氣喘脾不能生肺也用補中益氣湯加附子而愈半載後因飲食勞倦兩目浮腫小便短少仍服前藥頓愈欽天監臺官張景方成化丁酉七月間領朝命往陜西秦邸興平王治葬張至中途偶得腹脹之疾醫莫能療寓居臥龍寺待盡而已抵夜見龎眉一叟忽過訪自云能治此疾延視兩手脉即口授一方以杏仁陳皮海螵蛸等分為細末佐以榖樹葉槐樹葉桃枝各七件至翌日正午時汲水五桶煎三四沸至星上時再煎一沸患者就浴令壯人以手湯中按摩臍之上下百數少時轉矢氣病即退矣張如其法黎明此老復至病去十之七八矣酬以禮物俱不受是夕腫脹平復此老更不復見矣或謂張景芳遇仙云客座新聞象山縣村民有患水腫者咸以為祟訊之卜者卜者授以此方良效用田螺大蒜車前草和研為膏作大餅覆於臍上水從便旋而出數日頓愈琇按此方又治大小便不通見淋閉門一人客游維揚患腹脹百藥無效反加胃嘔食減尫羸有一澤醫自謂能治此疾躬煎藥餌以進服之便覺爽快熟寐踰時溲溺滿器腫脹漸消食知其味矣因訪其方曰客富商也酒色過度夏多食冰浸瓜果取涼太過脾氣受寒故有此證醫復用寒凉重傷胃氣是失其本也安能去病吾以丁香木香官桂健脾和胃肺氣下行由是病除無他術也若澤醫亦可謂有識鑒矣一人病氣蠱四肢不浮惟腹膨脹大戴原禮所謂蜘蛛病是也進泄水之劑病轉劇時值炎暑或進以清暑益氣當煎藥時偶墮蜘蛛腐熟其中童子懼責潛去蜘蛛尋以藥進病者鼻聞藥香一啜而盡少間腹中作聲反覆不能安枕家人疑藥之誤用然也既而溲溺斗許腹脹如削康健若平日矣此偶中者故志之續醫說汪石山治一人年踰四十春間患脹醫用胃苓湯及雄黃傅貼法不效汪診視脉皆緩弱無力曰此氣虛中滿也曾通利否曰已下五六次矣曰病屬氣虛醫顧下之下多亡陰是謂誅罰無過也故脉緩知其氣虛重按則無知其陰亡陽虛隂亡藥難倚仗八月水土敗時實可慮也病者曰不與藥病不起耶嘗聞脹病臍突不治肚上青筋不治豫病今無是二者可慮謂何汪曰然但久傷於藥故且停服言歸如期而殁琇按病不可治則勿與藥業醫者宜知之一婦形弱瘦小脉細濡近駛又一婦身中材頗肥脉緩弱無力俱病鼓脹大如箕垂如囊立則垂墜遮攔兩腿有礙步履汪視之曰腹皮寬縋已定非藥可斂也惟宜安心寡欲以保命耳後皆因産而卒或曰病患鼓脹有孕謂何汪曰氣病而血未病也産則血亦病陰陽兩虛安得不亡又一婦瘦長蒼白年五十餘鼓脹如前頗能行立不耐久逺越十餘年無恙恐由寡居血無所損故能久延一婦年踰四十瘦長善飲診之脉皆洪滑曰可治脉訣云腹脹浮大是出厄也得溼熱太重宜逺酒色可保終吉遂以香連丸令日吞三次每服七八十丸月餘良愈一人年三十餘酒色不謹腹脹如鼓醫用平胃散廣荗潰堅湯罔效汪診脉皆浮濡近駛曰此溼熱甚也痛遠酒色庶或可生渠謂甚畏煎藥汪曰丸藥亦可遂以枳术丸加厚朴黃連當歸人參荷葉燒飯丸服一月果安越三月餘不謹復診之曰無能為矣臍突長二尺餘逾月而卒夫臍突寸餘者有矣長餘二尺者亦事之異故志之一人年三十餘病水腫面光如胞腹大如箕腳腫如槌飲食減少汪診之脉浮緩而濡兩尺尤弱曰此得之酒色宜補腎水家人駭曰水勢如此視者不曰通利則曰滲泄先生乃欲補之水不益劇耶曰經云水極似土正此病也水極者本病也似土者虛象也今用通利滲泄而治其虛象則下多亡陰滲泄耗腎是愈傷其本病而增土溼之勢矣豈知亢則害承乃制之旨乎遂令空腹服六味地黃丸再以四物湯加黃柏木通厚朴陳皮參术煎服十餘貼腫遂減半三十貼而愈江篁南治一富婦因夫久外不歸胸膈作脹飲食難化腹大如娠青筋露年五十四天癸未絶大便常去紅六脉俱沈小而駛兩寸無力與二术參苓陳皮山查薏苡厚朴木香煎服七劑腹覺寬舒繼以補中除溼開鬱利水出入調理兩月而愈乙巳初夏家君因久喘嗽痰中見血忽小溲短少小腹作脹皮膚浮腫思經云肺潮百脉通調水道下輸膀胱又云膀胱者州都之官津液藏焉氣化則能出矣是小溲之行由於肺氣之降下而輸化也今肺受邪而上喘則失降下之令故小溲漸短以致水溢皮膚而生腫滿此則喘為本而腫為標治當清金降氣為主而行水次之以白术麥冬陳皮枳殼蘇子茯苓黃芩桔梗猪苓澤瀉桑皮蘇梗出入數服而安豫次兒素食少五月間因多食楊梅至六月遍身面目浮腫腹亦膨脹用蒼白二术土炒為君木通赤茯苓澤瀉為臣半夏陳皮大腹皮桑白皮白芍桔梗為佐蘇梗厚朴草果為使加薑水煎一日二服其查汁加水煎第二服每日用紫蘇忍冬藤蘿蔔種煎水浴一次服四日腫脹消十之八乃用參苓白术散以生紫蘇煎湯調日服二次小水黃加木通煎湯煎藥六貼去紫蘇加木瓜滑石最後加連翹梔子八貼全愈名醫類案卷四
