body:
  text: 名醫類案卷六明江瓘撰首風附頭暈頭痛菑川王病召臣意診脉曰厥上為重頭痛身熱使人煩悶臣意即以寒水拊其頭刺足陽明脉左右各三所病旋已病得之沐髮未乾而臥診如前所以蹶頭熱至肩史記蹶又見尸門魏王操苦頭風作輒心亂目眩華他針膈膈上痰隨手而愈魏志有人每頭眩則頭不得舉目不能視積年華他悉解其衣且倒懸頭去地一二寸以濡布拭體令周匝視諸脉盡出五色仍命其徒以鈹刀決脉五色血盡視赤血乃下以膏摩被覆汗出周匝以葶􅐗犬血散飲之立愈三國志一人稚年氣弱於氣海三里穴時灸之及老成熱厥頭痛雖嚴冬喜朔風吹之其患輒止少處暖及近烟火其痛輒作此灸之過也東垣治以清上瀉火湯尋愈一婦人疇昔有脾胃之症煩躁間顯胸膈不利而大便祕結時冬初外出晚歸為寒氣拂鬱悶亂大作此火不得伸故也醫漫投疏風丸大便行而其患猶爾繼疑藥力微益以七八十丸下兩行而其患猶爾且加吐逆食不能停痰甚稠黏而湧吐不已眼黑頭旋惡心煩悶氣促上喘無力心神顛亂兀兀不休口不欲言目不欲開如坐風雲中虛頭痛難堪身苦山重溼四肢厥冷寒寢不能安夫前證胃氣已損復兩下之則重虛其胃而痰厥頭痛作矣以白朮半夏天麻湯方載丹溪近代曹州觀察判官申光遜言家本桂林有官人孫仲敖寓居於桂交廣人也申往謁之延於臥內冠簮相見曰非慵於巾櫛也蓋患腦痛爾即命醇酒升餘以辛辣物洎胡椒乾薑等屑僅半杯以溫酒調又於枕函中取一黑漆筒如今之笙項安於鼻竅吸之至盡方就枕有汗出表其疾立愈蓋鼻飲蠻獠之類也玉堂閒話羅謙甫治柏參謀年踰六旬春患頭痛晝夜不得休息詢其由云近在燕京初患頭昏悶微痛醫作傷寒解之汗後其痛彌篤再汗之不堪其痛矣虛遂歸每過郡邑必求治療醫藥大都相近至今痛不能臥且惡風寒而不喜飲食羅診之六脉弦細而微氣短促懶言語內經云春氣者病在頭年髙氣弱清氣不能上升頭面故昏悶爾且此症本無表邪汗之過多則清陽之氣愈受虧損不能上榮亦不得外固所以頭痛楚而惡風寒氣短弱而憎飲食以黃茋錢半人參一錢炙甘草七分白朮陳皮當歸白芍各五分升麻柴胡各三分細辛蔓荆子川芎各二分名之曰順氣和中湯食後進之一飲而病減再飲而病却定方君臣佐使之妙可以類推吕元膺診一貴者兩寸俱浮弦夫浮為風弦為痛且兩寸屬上部告之曰明公他無所苦首風乃故病也蓋得之沐而中風當發先一日則劇劇必吐而後已渠曰然余少年喜沐每迎風以晞髮故頭痛之疾因之而起誠如公言乃製龍腦芎犀丸遂瘳戴人治一婦頭偏痛五七年大溲燥結雙目赤腫眩暈實凡療頭風之藥靡所不試且頭受針灸無數戴人診之急數而有力風熱之甚也此頭角痛是三焦相火之經乃陽燥金勝也燥金勝乘肝則肝氣鬱肝氣鬱則氣血壅氣血壅則上下不通故燥結於中尋至失明以大承氣湯投之入河水煎二兩加芒硝一兩頓使飲三五服下泄如湯且二十餘行次服七宣丸神功丸以潤之菠菱葵菜猪羊血以滑之三劑外目豁首輕燥澤結釋而愈按此所以治之症既已多年不解豈非風溼熱三氣鬱滯膠固而然耶故其所施之法雖峻而於中病之情則得也祝仲寧治耿祭酒病頭暈翕翕發熱淅淅惡寒醫以為感冒投辛甘發汗之劑汗出不已腹滿作渴讝語發瘢醫繼以為暑所中祝曰此非一時寒暑可致乃積溼熱在足陽明太陰經故疹乃見投以除溼熱補脾胃瀉陰火之劑尋愈秦鳴鶴侍醫也髙宗苦風眩頭重目不能視召鳴鶴診之鶴曰風毒上攻若刺頭出少血即愈矣實太后自簾中怒曰此賊可斬天子頭上豈試出血處耶上曰醫之議病理也不加罪且吾頭重悶甚苦不堪出血未必不佳命刺之鳴鶴刺百會及腦户出血腦戶禁刺非明眼明手不能上曰吾眼明矣言未竟后自簾中稱謝曰此天賜我師也賜以繒寶裕陵傳王荆公偏頭痛禁中祕方用生萊蔔汁一蜆殼仰臥注鼻中左痛則注之右右痛則注之左或注之左右皆可數十年患皆二注而愈荆公云曽愈數人矣俞子容治一婦人年踰五旬病頭痛厯嵗寖久虛有治以風者有治以痰者皆罔效脉之左沉寸沈遲而芤曰此氣血俱虛也用當歸二兩附子三錢一飲報效再飲其病如失薛已治尚寶劉毅齊怒則太陽作痛虛用小柴胡加茯苓山梔以清肝火更用六味以生腎水更不復作一人舊服芎藭醫鄭叔能見謂之曰芎藭不可久服多令人暴亡後其人無疾而卒又一婦以腦風而久服芎藭其死亦如之張杲云此二事皆渠所目擊者筆談潔古治一人病頭痛舊矣發則面頰青黃厥陰暈眩目慵張而口懶言似虛症體沉重太陰且兀兀欲吐此厥陰肝太陰脾合病名曰風痰頭痛痰以局方玉壺丸治之更灸俠溪穴足少陽膽穴尋愈子和治一僧頭熱而痛且畏明以布圜其巔上置冰於其中日數易之此三陽畜熱故也熱乃灼炭火於暖室出汗涌吐三法併行七日而瘥一婦人患偏頭痛一邊鼻塞不聞香臭常流清涕或作臭氣一陳治頭痛之藥靡所不試罔效人莫識其病有以為腦癰者一醫云但服局方芎犀丸不數十服忽作嚏涕突然出一鋌稠膿疾愈一人患頭風自頤下左右有如兩蚯蚓徐行入耳復從耳左右分上頂左過右右過左頂上起疙瘩二塊如猪腰然前後腦如鼓聲鼕鼕然冷痛甚須重綿帕包裹疼甚四肢俱不為用冷痛疼甚四肢不為用似乎虛寒症不知屬乎實毒須細心臨症醫效罔奏後得一方用四物各一錢皂角刺一錢萆薢四兩猪肉四兩作一服水六碗煎四碗去查其藥汁併肉作三四次服服至二十劑減十之三四十劑減十之六百劑乃安愚詳此證非頭風也其人曽患黴瘡頭塊墳起皆輕粉結毒故萆薢為君用萆薢非熟讀本草不知其妙四物養血皂刺為引用多服取效也江篁南治從嬸年四十冬月産後以傷寒發熱自汗兩太陽痛上連於腦徹痛甚日夕呻吟不得安寢以補中益氣湯加蔓荆子川芎當歸細辛少許一服痛減再服乃安翟文炳治陸母年七十頭響耳鳴頂疼目眩面麻腮腫齒蘇脣燥口苦舌强咽腫氣促心驚膽怯胸滿痰滯脅腫腰痛足軟膝疼已二年矣近一月來至不得眠惟人扶而坐稍稍欹臥即垂絶翟診視知氣挾肝火而然先與抑青丸一服即時熟睡醒後諸症如失仍服補中益氣調理而痊程文彬治一婦人患頭風雖盛暑必以帕蒙其首稍止略見風寒痛不可忍百藥不效蓋因腦受風寒氣血兩虛氣不能升故藥不效令病人口含冷水仰臥以生薑自然汁少許灌入鼻中其痛立止妙法遂與防風羌活藁本川芎甘草數服而愈江少微每治火症頭痛用白蘿葡心自然汁王荆公法吹入鼻中即止有兼眼目不明者加雄黃細末調勻如左患滴右耳右患滴左耳又有頭風兼睂骨痛者用活龜一個用新瓦二片置龜於中四圍鹽泥固濟烈火煆出青烟為度待冷去腸殼用四足併腹肉入小口瓶封固如遇此症先吹蘿葡汁次以龜末吹入鼻即愈妙方又豫每勞役失飢則額頭痛用補中益氣湯立愈心脾痛即胃脘痛琇按是症多有肝木挾火上乘於胃時師不察類以香燥投之暫愈復作致成關格勞瘵者多矣東垣治一婦人重娠六個月冬至因慟哭口吸風寒忽病心痛不可忍渾身冷氣欲絶曰此乃客寒犯胃故胃脘當心而痛急與草豆蔲半夏乾生薑炙甘草益智仁之類或曰半夏有小毒重娠服之可乎曰乃有故而用也岐伯曰有故無損故無損也服之愈羅謙甫治江淮漕運使崔君長子年二十五體豐肥奉養膏粱時有熱證友人勸食寒涼物因服寒藥至元庚辰秋病瘧久不除醫投以砒霜等藥新汲水送下禁食熱物瘧病不除反加吐利脾胃復傷中氣愈虛腹痛腸鳴時復胃脘當心而痛屢易醫罔效至冬還家百療不瘥延至四月間瘧病久因勞役煩惱前症大作羅診之脉弦細而微弦主痛微細則為虛寒手足稍冷面色青黃而不澤情思不樂惡煩冗食少微飽則心下痞悶嘔吐酸水發作疼痛冷汗時出氣促悶亂不安須人頞相扺而坐少時易之內經云中氣不足溲為之變腸為之苦鳴下氣不足則為痿厥心􅀢又曰寒氣客於腸胃之間則卒然而痛得炅則已炅者熱也非甘辛大熱之劑則不能愈乃製扶陽助胃湯方以炮乾薑錢半人參豆蔲仁炙甘草官桂白芍各一錢陳皮白朮吳茱萸各五分黑附子炮去皮二錢益智仁五分作一服水三盞薑三片棗二枚食前溫服三服大勢皆去痛減過半至秋先灸中脘三七壯以助胃氣次灸氣海百餘壯生發元氣滋榮百脉以還少丹服之則善飲食添肌肉潤皮膚明年春灸三里二七壯乃胃之合穴也亦助胃氣又引氣下行春以芳香助脾復以育氣湯加白檀香平治之戒以懲忿窒欲慎言節食一年而平復滑伯仁治一婦人盛暑洞泄裏厥逆惡寒表胃脘當心而痛自腹引脅轉為滯下嘔噦不食醫以中暑癨亂療之益劇脉三部俱微短沉弱不應呼吸曰此陰寒極矣不亟溫之則無生理舍時從症內經雖曰用熱逺熱又曰有假其氣則無禁也於是以薑附溫劑三四進間以丹藥脉稍有力厥逆漸退更服薑附七日衆症悉去遂以丸藥除其滯下而安先固其原乃攻其邪丹溪治一人以酒飲牛乳患心疼年久飲食無礙非大虛寒雖盛暑飲食身無汗身無汗而大便或祕結非寒可知醫多以丁附治之羸弱食減每痛以物拄之脉遲弱弦而澀遲弱似虛寒弦主痛澀屬血虛若但主脉而不合症則用丁附矣大便或祕結或泄有飲又苦吞酸時七月以二陳湯加芩連白朮桃仁郁李仁澤㵼每旦服之屢涌出黑水若爛木耳者服至二百餘貼脉澀漸退至數漸添純弦而漸充滿時冬暖意其欲汗而血氣未充以參茋歸芍陳皮半夏甘草服之痛緩每旦夕一二作乃與麻黃蒼朮芎歸甘草等藥才下咽忽暈厥須臾而蘇大汗痛止從盛暑身無汗用藥仍以汗解竒不用藥次第之妙可不知許文懿公因飲食作痰成心脾疼後觸冒風雪腿骨痛醫以黃牙嵗丹烏附等藥治十餘年艾灸萬計又冒寒而病加胯難開合脾疼時胯痛稍止胯痛則脾疼止初因中脘有食積痰飲續冒寒溼抑遏經絡氣血不行津液不通痰飲注入骨節往來如潮湧上則為脾疼降下則為胯痛辨症精確在此須湧泄之時秋深而以甘遂末一錢入猪腰子內煨食之煨腎散方連泄七行次早足便能步下之見效後嘔吐大作不食煩躁氣弱不語似乎虛金匱云病人無寒熱而短氣不足以息者實也此一轉難極非細心審症不能其病多年鬱結一旦泄之徒引動其猖狂之勢無他制禦之藥故也仍以吐劑逹其上焦次第治及中下二焦連日用瓜蒂藜蘆苦參俱吐不透而噦躁愈甚乃用附子尖三枚和漿水與蜜飲之方大吐膏痰一大桶以朴硝滑石黃芩石膏連翹等一斤濃煎置井中極冷飲之四日服四斤此等用藥非神明不能後腹微滿二溲祕用涼藥而二溲祕為實脉歇至於卯酉時夫卯酉為手足陽明之應手陽明大腸在卯足少陰腎在酉此乃胃胃乃腎之關與大腸有積滯未盡當速瀉之俗醫看歇至脉則云元氣脫矣歇至屬積滯者有之但有時候羣醫惑阻乃作紫雪二日服至五兩神思稍安腹亦減安後又小溲閉痛飲以蘿葡子汁半盂得吐立通又小腹滿痛不可捫摸實症神思不佳以大黃牽牛等分水丸服至三百丸下如爛魚腸二升許神思稍安診其脉不歇又大溲迸痛小腹滿悶又與前丸百粒腹大絞痛腰胯重眼出火不言語瀉下穢物如桕油條一尺許肛門如火以水沃之自病半月不食不語至此方啜稀粥始有生意數日平安自嘔吐至安日脉皆平常弦大次年行倒倉法全愈合痰症虞恆德案看方妙一童子久瘧方愈十日而心脾疼六脉伏痛稍減時氣口緊盛氣口緊盛傷於食餘皆弦實而細意其宿食詢之果傷冷油麵食以小胃丹久瘧之後元氣已虛小胃丹太峻津咽十餘粒禁飲食三日凡與小胃丹十二次痛止後與榖太早忽大痛連脅乃禁食亦不與藥蓋宿食已消新榖與餘積相併而痛若再藥攻必傷胃氣所以不與藥又斷食三日至夜心􅝽索食先以白朮黃連陳皮為丸熱湯下八九十丸以止其􅝽此非飢也乃餘飲未了因氣而動遂成􅝽雜耳若與食必復痛詢其才飢必繼以膈間滿悶今雖未甚快然常思食又與前丸子一日夕不飢而昏睡後少與稀粥減平日之半兩日嗣後禁其雜食半月而安一婦因久積憂患後心痛食減羸瘦渴不能飲氣分心與頭更換而痛不寐大溲燥結與四物湯加陳皮甘草百餘貼亦穩未效朱曰此肺久為火所鬱病久屬鬱火氣不得行血亦蓄塞遂成汚濁氣壅則頭痛血不流則心痛通一病也治肺當自愈遂效東垣清空膏例以黃芩細切酒浸透炒赤色為細末以熱白湯調下頭稍汗十餘貼汗漸通身而愈以汗解奇因其膝下無汗瘦弱脉澀小溲數大溲澀當補血以防後患以四物湯加陳皮甘草桃仁酒芩服之一婦春末心脾疼自言腹脹滿手足寒過肘膝須綿裹火烘胸畏熱喜掀露風涼亦屬鬱火脉沉細澀稍重則絶輕似弦而短渴喜熱飲血分不食以草豆蔲辛溫丸三倍加黃連苦寒滑石神曲為丸白朮為君茯苓為佐陳皮為使作湯下百丸服至二斤而愈一老人心腹大痛昏厥脉洪大不食不勝一味攻擊之藥用四君加川歸沉香麻黃服愈虞恆德治一男子年三十五胃脘作痛久矣人形黃瘦食少胸中常若食飽求治與加味枳朮丸不效而日漸大痛叫號聲徹四鄰自分死矣與桃仁承氣湯若非大痛叫號承氣湯斷不可用此症亦急則治標之故作大劑與之連二服大下瘀血四五碗許困倦不能言者三日教以少食稀粥漸次將理而安琇按瘀血不下定成血膈幸其人尚少壯可用承氣否則以四物入桃仁紅花五靈脂歸尾酒大黃韭汁為妥福唐梁緄心脾疼痛數年不愈服藥無效或教事佛久之夢神告曰與汝良劑名一服飲可取髙良薑逐寒香附子散氣等分如本條修製細末二錢溫陳米飲送下空心服為佳不煩再服已而果驗後常以濟人皆效類編百一選方云二味須各炒然後合和同炒即不驗張思順盛夏調官都城苦熱食冰雪過多又飲木瓜漿積冷於中遂感脾疼之疾藥不釋口殊無退證纍嵗日齊一道人適一道人曰但取漢椒二十一粒浸於漿水碗中一宿漉出還以水漿吞之引經佐使妙用可以觸類若是而已張如所戒明日椒才下腹即脫然更不復作崔元亮海上方治一切心疼無問久新以生地黃一味隨人所食多少搗取汁搜麵作䬪飥或合冷淘冷淘即角子類食之良久當利下蟲長一尺許頭似壁宫壁宫即守宫後不復患劉禹錫𫝊信方貞元十年通事舍人崔抗女患心疼垂氣絶遂作地黃冷淘食之便吐一物可方一寸以來如蝦蟆狀無目足等微似有口蓋為此物所食自此頓愈麵中忌用鹽本事方汪石山治一婦人年三十餘性躁多能素不孕育每啜粥畏飯時或心痛春正忽大作或作氣而用香燥或作痰而用二陳或作火而用寒涼琇按治法俱左因糞結進潤腸丸遂泄不禁前許文懿公案進涼瀉藥而便反祕此進潤腸丸而泄不禁虛實可知矣小便不得獨行又發寒熱熱則咳痰不止寒則戰栗鼓頷肌肉瘦削皮膚枯燥月水不通食少惡心或煩躁而渴或昏昏嗜臥或小腹脹痛諸治罔效汪診右脉浮大弦數非外感而脉浮大虛無疑但宜黃蓍建中湯不宜分利或配入升麻柴胡青皮神麯左脉稍斂而數熱來左右脉皆大而數博按舊刻脫此句寒來脉皆沉微似有似無經言脉浮為虛脉大必病進丹溪謂脉大如葱管者大虛也經又謂弦脉屬木見於右手肝木乘脾土也又以數脉所主為熱其症為虛左脉稍斂者血分病輕也今患素畏飯者是胃氣本弱矣心痛即胃脘痛由脾虛不運故胃脘之陽不降博按舊刻此句悮鬱滯而作痛也瀉泄不禁小便不得獨行者蓋陽主固且經言膀胱者津液之府氣化則能出矣今陽虛不固於內故頻泄也膀胱氣虛不化故小便不得獨行也又寒熱互發者蓋氣少不能運行而滯於血分故發熱血少不得流利而滯於氣分故發寒仲景曰陽入於陰則熱陰入於陽則寒是也寒則戰栗鼓頷者陰邪入於陽明也熱則咳嗽不已者陽邪入於陰分也此則陰陽兩虛故相交併而然也肌肉瘦削者蓋脾主身之肌肉脾虛食少故瘦削也皮膚枯燥者經曰脾主於胃行其津液脾虛不能運行津液灌溉於肌表故枯燥也月水不通者經曰二陽之病發心脾男子少精女子不月二陽手足陽明腸與胃也陽明虛則心脾皆失所養而血不生故不月也食少惡心躁渴嗜臥皆脾胃所生之症也小腹脹痛者乃陽虛下陷使然也經曰陽病極而下是也乃用人參五錢黃茋四錢白朮三錢為君升麻八分茯苓一錢猪苓澤瀉各七分為臣蒼朮五分香附七分為佐歸身七分麥冬一錢為使煎服三貼不效此案不效之故當細心參閲王海藏離珠丹錢仲陽安神丸并氣不化氣走治法三條及甘露散為迫津液不能停當致津液之說一醫曰此病不先驅邪一主於補所謂閉門留賊一曰此屬陰虛火動今不滋陰降火而徒補氣將見氣愈盛火愈熾矣其夫告汪曰每日扶之似身漸重皮枯黑燥恐不濟矣汪曰仲景有曰泄利不止五藏之陰虛于內寒熱互發六府之陽虛于外是則內外兩虛在法不治所恃者年尚壯能受補而已然補藥無速效今服藥不滿四五劑奈何遽責以效乎因令勉服前藥六七貼寒已除但熱不減汗出不至足令壺盛熱水蒸其足汗亦過於委中矣續後前症漸減始有生意追思醫謂不先去邪者因其寒熱往來也然去邪不過汗吐下三法今病自汗吐痰泄利三者備矣再有何法之可施乎且病有實邪有虛邪虛可補而實可㵼今病屬虛而以實邪治之所謂虛虛之禍也一謂當滋陰降火因其月事不通病發於夜也且服降火藥遂小腹脹而大便泄是不宜於此矣殊不知滋陰降火皆甘寒苦瀉之劑今病食少泄利明是脾虛且脾胃喜溫而惡寒今泥於是寧不愈傷其胃而益其泄乎吁危哉故不得不辨博按此案舊刻脫悮江汝潔治會中夫人病心氣痛甚劇醫治不效江視其症乃心脾疼也夫心主血脾裹血二經陰血虛生內熱耳以阿膠一錢五分滋二經之虛白螺螄殼火煆一錢五分以瀉二經之火二味為末好酒調服一二盞即愈匡掌科夫人年三十餘病胃脘連胸脅痛日輕夜重兩寸關弦滑有力醫皆以積滯凝寒用發散及攻下之劑不效繼用鐵刷散四磨飲等方並莫應及用湯水皆吐而不納經日不食痛益甚非痰而何一醫謂五靈脂沒藥素用有效試用酒調病者到口便吐隨吐出緑痰兩碗許痛即止納飲食此蓋痰在膈上攻下之不去必得吐法而後愈醫統江篁南治一婦患心脾疼弱甚醫以沉香木香磨服之其痛益增且心前橫痛又兼小腹痛甚其夫灼艾灸之痛亦不減江以桃仁承氣湯去芒硝投之一服而愈江應宿治中年男子患心脾痛積十年所時發則連日呻吟減食遍試諸方罔效診之六脉弦數弦數為火鬱豫曰此火鬱耳投薑汁炒黃連山梔瀉火為君川芎香附開鬱陳皮枳殼順氣為臣反佐以炮薑從治反佐妙一服而愈再與平胃散加薑炒黃連山梔神曲糊丸一料刈其根不復舉矣豫長子年三十二嵗素飲食無節性懶於動作丙戌秋從豫自燕都抵家舟行飽餐多晝寢有時背脹腹微痛初冬過蘇州夜赴酒筵後脫衣用力次早遂覺喉口有敗卵臭厭厭成疾瘦減日吐酸水背脹腹痛一日忽大痛垂死欲人擊打又炒熱鹽尉之稍寬快頃刻吐紫黑血二碗許連日不食食入即吐痛止即能食生機在此食飽又復痛諸藥不應遞發遞愈六脉弦而搏指此食傷太陰脾虛氣滯與香砂橘半枳朮丸灸中脘夾臍膏肓禁飽食兩月而愈腹痛華他治一人病腹中攻痛十餘日鬢髮墮落他曰是脾半腐可刳腹治也使飲藥令臥破腹就視脾果半腐壞以刀斷之割去惡肉以膏傅之即瘥獨異志元豐中丞相王郇公小腹痛不止太醫攻治皆不效凡藥至熱如附子硫黃五夜義丸之類用之亦不瘥駙馬張都尉令取婦人油頭髮燒如灰細研篩過溫酒調二錢此治陰虛即時痛止良方羅謙甫治真定一士人年三十餘肌體本弱左脅下有積氣不敢食冷物覺寒則痛或嘔吐清水眩暈欲倒目不敢開惡人煩冗靜臥一二日及服辛熱之劑則病退延至初秋因勞役及食冷物其病大作腹痛不止冷汗自出四肢厥冷口鼻氣亦冷面色青黃不澤全不得臥扶几而坐又兼咳嗽咽膈不利與藥則吐不得入口無可奈何遂以熟艾半斤白紙一張鋪於腹上紙上攤艾令勻又以憨葱數枝批作兩片置艾上數重再以白紙覆之以慢火尉斗尉之冷則易之外治法妙覺腹中熱腹皮暖不禁以綿三襜多縫帶繫之待冷方解初尉時得暖則痛減大暖則痛止至夜得睡翌日再與對症藥服之良愈內經云寒氣客於小腸募原之間絡血之中血泣而不得注於大經血氣潜留不得行故宿昔而成積也又寒氣客於腸胃厥逆上出故痛而嘔也諸寒在內作痛得炅則痛立止李子豫治豫州刺史許永之弟患心腹痛十餘年殆死忽一日夜間聞屏風後有鬼謂腹中鬼曰明日李子豫從此過以赤丸殺汝汝其死矣腹中鬼曰吾不畏之於是使人候子豫豫果至未入門患者聞腹中有呻吟聲及子豫入視鬼病也遂以八毒赤丸與服方見鬼疰門須臾腹中雷鳴彭轉大下數行遂愈今八毒丸方是也續搜神記虞恆德治一婦年五十餘小腹有塊作痛二月餘一醫作死血治與四物加桃仁等藥不效又以五靈脂元胡索乳香沒藥三稜莪朮等丸服又不效其六脉沉伏兩尺脉絶無豫曰乃結糞在下焦作痛耳非死血也可見死血脉必短澀亦兩尺絶無而斷為結糞竒用金城稻藁燒灰淋濃汁一盞服之過一時許與枳實導滯丸一百粒催之下黑糞如梅核者碗許痛遂止後以生血潤腸之藥十數貼調理平安一男子壯年寒月入水網魚飢甚遇涼粥食之腹大痛二晝夜不止醫與大黃丸不通與大承氣湯下糞水而痛愈甚診其六脉沉伏而實面青黑色青黑為寒得溫即行虞曰此大寒症及下焦有燥屎作痛先與丁附治中湯一貼又與灸氣海穴二十一壯痛減半繼以巴豆巴豆行寒積沉香木香作丸如菉豆大生薑汁送下五粒下五七次而愈丹溪治一老人腹痛不禁下者用川芎蒼朮香附白芷乾薑茯苓滑石等劑而愈一人於六月投淵取魚至秋深雨涼半夜小腹痛甚大汗脉沉弦細實重取如循刀責責然與大承氣湯加桂二服微利痛止仍連日於申酉時申酉為足太陽少陰復痛堅硬不可近每與前藥得微利痛暫止於前藥加桃仁泥下紫黑血升餘痛亦止脉雖稍減而責責然猶在又以前藥加川附子下大便五行亦得溫即行有紫黑血如破絮者二升而愈又傷食於酉時復痛在臍腹間脉和與小建中湯一服而愈一少年自小面微黃夏間腹大痛醫與小建中湯加丁香三貼不效加嘔吐清汁又與十八味丁沉透膈湯二貼食全不進困臥痛無休止如此者五六日不可按又與阿魏丸百粒夜發熱不得寐口却不渴脉左三部沉弦而數實關尤甚右沉滑數實遂與大柴胡加甘草四貼下之痛嘔雖減食未進與小柴胡去參芩加芍藥陳皮黃連甘草二十貼而愈加減法妙一婦年四十患腹隱痛常燒磚瓦尉之面胸畏火氣六脉和皆微弦苦夜不得寐悲憂一年衆作心病治遂覺氣復自下衝上病雖久形不瘦此肝受病也脾主肌肉病在肝不瘦與防風通聖散吐之時春寒加桂木得桂而和入薑汁調之日三四次夏稍熱與當歸龍膽丸間與枳朮丸一月而安一人中脘作疼食已口吐血紫霜色二關脉澀乃血病也跌仆而致治以生新去陳之劑吐出片血碗許而安吳茭山治一婦患臍下虛冷腹痛用川芎歸身炙芍炒延胡丁皮乾薑服之效張至和吳郡人精於醫嘗治人腹疾為庸醫誤用熱藥張知不可療辭之其人别延周濟廣不再藥而愈乃遣從者市肴羞故令迂路經張門張問之曰吾主疾愈置以謝周某者張笑曰亟回家此當大便下膿若恐不及見矣果然程明佑治王汝恭夜御內詰旦煎寒腹痛醫投五積散熱甚又投十神湯小柴胡遂瞶程教以飲水一醫曰病得之入房內有伏陰復投以水必死及一飲腹不痛再飲至一斗病已非神明者不能治法不可為訓所以知汝恭當飲水而解者切其脉陽盛格陰熱入厥陰也汪石山治一人年五十餘形瘦而黑理疏而澀忽腹痛午後愈甚醫曰此氣痛也治以快氣之藥痛益加又曰午後血行於陰分加痛者血滯於陰也以四物加乳沒服之亦不減汪診之脉浮細而結或五七至一止或十四五至一止經論止脉漸退者生漸進者死今止脉頻則反輕疏則反重與脉經實相矛盾汪熟思少頃曰得之矣止脉疏而痛甚者以熱動而脉速為病脉屬邪盛頻而反輕者以熱退而脉遲故耳為本脉屬元虛病屬陰虛火動無疑熱動脉速非止疏也因脉速而止不覺耳熱退脉遲而止脉愈覺頻耳前為邪盛之脉後為元虛之脉且察其病起於勞欲勞則傷心而火動欲則傷腎而水虧以參芍補脾為君熟地歸身滋腎為臣黃柏知母麥冬清心為佐山查陳皮行滯為使人乳童便出入加減惟人參加至四五錢遇痛進之則愈或曰諸痛與瘦黑人及陰虛火動參茋在所當禁今用之顧效謂何曰藥無常性以血藥引之則從血以氣藥引之則從氣佐之以熱則熱佐之以寒則寒在人善用之耳況人參不特補氣亦能補血故曰氣血弱當從長沙而用人參是也東垣治中湯人參與乾薑用亦謂裏虛則痛補不足也所謂諸痛禁用參茋者以暴病形實者言耳若年髙氣血衰弱不用補法氣何由行病何由止經曰壯者氣行則愈是也一人體弱色脆常病腹痛惡寒發熱嘔泄踡臥時或吐蟲至三五日或十數日而止或用丁沉作氣治或用薑附作寒治或用削剋作積治或用燥烈作痰治俱不效診其脉皆濡小近駛數曰察色診脉觀形乃氣虛兼鬱熱也遂用參茋歸朮川芎茯苓甘草香附陳皮黃芩芍藥服之而安或曰諸痛不可用參茋并酸寒之劑今犯之何也曰病久屬鬱鬱則生熱又氣屬陽為表之衛氣虛則表失所衛而賊邪易入外感激其內鬱故痛大作今用甘溫以固表則外邪莫襲酸寒以清內則鬱熱日消病由是愈博按此案原刻脫悮一人面色蒼白年四十六素好酒色犬肉三月間因酒兼有房事遂病左腹痛甚後延右腹續延小腹以及滿腹皆痛日夜叫號足不能伸臥不能仰汗出食阻此案終無身熱表症自用備急丸利二三行而隨止痛仍不減醫見利之痛不止決疑虛症汪診其脉皆細駛右脉頗大於左獨脾脉弦而且滑扶起診之右脉亦皆細數恐傷酒肉用二陳加芩查麯蘖進之不效再用小承氣湯仍不利蜜棗道之仍不利乃以大承氣湯利二三行痛減未除凡此治法皆急則治標不然痛安能減令其住藥只煎山查湯飲之次日煩躁嘔惡渴飲涼水則覺惡止爽快詰朝診脉皆隱而不見見此症總屬痛傷元氣脉亦不見四肢逆冷煩躁不寧時復汗出舉家驚愕疑是房後陰症擬進附子理中湯汪曰此治內寒逆冷也活人書云四逆無脉當察症之寒熱今觀所患多屬於熱況昨日脉皆細數面色近赤又兼酒後而病六脉雖絶蓋由壯火食氣也四肢者諸陽之末氣被壯火所食不能營於四肢故脉絶而逆冷也此類傷暑之症正合仲景所謂熱厥者多寒厥者少急用大承氣湯下之之類向雖下以大承氣其熱尚未盡難以四逆湯症與比今用附子熱藥寧不助火添病耶如不得已可用通脉四逆湯尚庶幾焉以其內有童便猪膽汁監制附毒不得以肆其虐也連進二服脉仍不應逆冷不回渴飲煩躁小便不通糞溏反頻腹或時痛更進人參白虎湯二貼白虎湯如何敢用躁渴如舊更用參朮各三錢茯苓麥冬車前各一錢五味當歸各五分煎一貼脉漸見如蛛絲汪曰有生意矣仲景論絶脉服藥微續者生脉暴出者死是也左手足亦略近和不致冰人右手足逆冷如舊但口尚渴便尚溏一日夜約十餘度小便不通汪曰渴而小便不利者當利其小便此非傷寒發熱以痛為準以渴為憑故曰利其小便倘傷寒發熱而用此案為法何異癡人說夢遂以天水散冷水調服三四劑不應再以四苓散加車前山梔煎服二貼小便頗通但去大便而小便亦去不得獨利汪曰小便未利煩渴未除蓋由內熱耗其津液也大便尚溏者亦由內熱損其陽氣陽氣不固而然也遂用參朮各三錢茯苓錢半白芍車前門冬各一錢山梔七分五味五分連進數服至第九日逆冷回脉復見諸症稍減漸向安琇按是症外無寒熱因利而渴而厥而躁汗遂乃寒熱雜進幸而不死必其人元氣素强否則參苓麥味緩不及矣一婦人年近五十病腹痛初從右手指冷起漸上至頭頭如冷水澆灌而腹大痛則遍身大熱熱退則痛止非石翁不能講明此症或過食或不食皆痛每常或一年一發近來二三日一發逺不過六七日醫用四物加柴胡香附不應更醫用四君木香檳榔亦不應又用二陳加紫蘇豆蔲又用七氣湯等劑皆不應汪診脉皆微弱似有似無或一二至一止或三五至一止乃陽氣大虛也憑脉斷症獨參五錢陳皮七分煎服十數貼而愈夫四肢者諸陽之末頭者諸陽之會經曰陽虛則惡寒又曰一勝則一負陽虛陰往乘之則發寒陰虛陽往乘之則發熱今指稍逆冷上至於頭則陽負陰勝可知矣陽負則不能健運而痛大作痛作而復熱者物極則反也及其陰陽氣衰兩不相爭則熱歇痛亦息矣况脾胃多氣多血經也氣能生血氣不足則血亦不足仲景曰血虛氣弱以人參補之故用獨參湯服而數年之痛遂愈矣江篁南治一婦年四十餘常患腹疼先從心前痛入腹既而腰俞盡痛兼吐清水或吐食每吐而後愈合眼則覺麻木食入反出是無火也合眼麻木陽虛而氣不行也其經水將行之前腰腹作痛行或帶紫凝結赤帶兼有白帶或一月再至虛初用二陳合四物除地黃加烏藥香附三服不驗乃投東垣當歸附子湯四服稍愈遂加分兩作丸服之當歸附子湯治臍下冷痛赤白帶下當歸二分炒鹽三分蠍稍升麻各五分甘草六分柴胡六分黃柏少許附子一錢乾薑六分中氣虧損心腹作痛薛已治唐儀部胸內作痛月餘腹亦痛左關弦長右關弦緊此脾虛肝邪所乘以補中益氣湯加半夏木香二劑而愈又用六君子湯二劑而安此面色黃中見青李儀部常患腹痛以補中益氣加山梔即愈一日因怒肚腹作痛胸脅作脹嘔吐不食肝脉弦緊此脾氣虛弱肝火所乘仍用前湯吞左金丸一服而愈此面色黃中見青兼赤太守朱陽山因怒腹痛作瀉或兩脅作脹或胸乳作痛或寒熱往來或小便不利飲食不入嘔吐痰涎神思不清此肝木乘脾土用小柴胡加山梔子炮薑茯苓陳皮製黃連黃連吳茱萸等分用熱水拌溼罨二三日同炒焦取連用一劑即愈陽山之內善怒胸膈不利吐痰甚多吞酸噯腐飲食少思手足發熱十餘年矣所服非芩連枳實即檳蘇厚朴左關弦洪右關弦數此屬肝火血燥木乘土位朝用六味丸以滋養肝木夕用六君加當歸芍藥以調補脾土不月而愈癸卯夏患背疽症屬虛寒用大溫補之藥而愈乙巳夏因大怒吞酸噯腐胸腹脹滿或用二陳石膏治之吐涎如湧肌熱如灼旬日將用滾痰丸下之脉洪大按之如無舊刻訛無力薛曰此脾胃舊刻改中氣虧損而發熱脾弱而涎泛出也用六君加薑桂一鍾即睡覺而諸症如失又數劑而康儒者沈尼文內停飲食外感風寒頭痛發熱惡心腹痛薛用人參養胃加芎芷麯蘗香附桔梗一劑而愈次日仍作腹痛以手重按痛即止此客寒乘虛而作也乃以香砂舊刻訛香附六君子加木香炮薑服之睡覺痛減六七去二香再服飲食少進加黃茋當歸少佐升麻而愈徐道夫母病胃脘當心痛劇右寸關俱無舊刻改作不應指左雖有微而似絶手足厥冷痛甚而伏者手足冷者未可盡為虛症病勢危篤察其色眼胞上下青黯眼胞色青乃肝木乘脾此脾虛肝木所勝用參朮茯苓陳皮甘草補其中氣木香和胃氣以行肝氣吳萸散脾胃之寒止心腹之痛急與一劑俟滚先服煎熟再進諸病悉愈向使泥其痛無補法而反用攻伐之劑禍不旋踵矣一婦人懷抱鬱結不時心腹作痛年餘不愈諸藥不應用歸脾加炒山梔而愈腹鳴陳子直主簿妻有異疾每腹脹則腹中有聲如擊鼓逺聞於外行人過者皆疑其作樂腹脹消則鼓聲亦止一月一作經十餘醫皆莫能明其疾一婦人有孕腹內鐘鳴醫莫能治偶一士人攜一方書其間有一方能治此用鼠窟前畚土研羅為末每服二錢麝香湯調其疾立愈腰痛淳于意治濟北王侍者韓女病腰背痛寒熱衆醫皆以為寒熱也臣意診脉曰內寒月事不下也即竄以藥旋下病已病得之欲男子而不可得也所以知韓女之病者診其脉時切之腎脉也澀而不屬琇按氣滯血不流而脉澀是為鬱病澀而不屬者其來難堅故曰月不下肝脉弦出左口故曰欲男子不可得也琇按脉訣所謂溢上魚際唯師尼室女嫠婦有之然今人無論男婦多有此脉此案又見經水門郝允治殿中丞姚程腰脊痛不可俯仰郝曰榖濁氣也當食發怒四肢受病傳於大小絡中痛而無傷法不當用藥以藥攻之則益痛須一年能偃仰二年能坐三年則愈矣果然東垣治一人露宿寒濕之地腰痛不能轉側脅搐急作痛月餘腰痛論云皆足太陽膀胱足少陰腎血絡有凝血作痛間有一二證屬少陽膽經外絡脉病皆去血絡之凝乃愈經云冬三月禁針只宜服藥通其經絡破血絡中敗血以漢防已防風各三分炒曲獨活膽各五分川芎柴胡膽肉桂腎當歸炙草蒼朮各一錢羌活膀胱錢半桃仁五粒作一服酒煎服愈配方精妙後學當觸類而長之韓􅐂治一人患腰疼痛以胡桃仁佐破故紙用鹽水糊丸服之愈丹溪治徐質夫年六十餘因墜馬腰痛不可轉側六脉散大重取則弦小而長稍堅朱以為惡血雖有未可驅逐且以補接為先遂令煎蘇木人參黃茋川芎當歸陳皮甘草服至半月後散大漸斂食亦進遂與熟大黃湯調下自然銅等藥一月而安王紹顔信效方云頃年得腰膝痛不可忍醫以腎風攻刺諸藥不效見傳相方有此驗立製一劑神效方以海桐皮二兩牛膝一兩羌活地骨皮五加皮薏苡仁各一兩甘草五錢生地十兩右淨洗焙乾細銼生地黃以蘆刀子切用綿一兩都包裹入無灰酒二斗浸冬二七日夏七日候熟空心飲一杯或控乾焙末蜜丸亦可戊戌秋淮南大水城下浸灌者連月王忽臟腑不調腹中如水吼數日調治得愈自此腰痛不可屈折雖沐亦相妨遍藥不效凡三月此必水氣陰盛腎經感此而得乃灸腎俞三七壯服鹿茸丸而愈醫學綱目脅痛丹溪治一人年三十六虛損瘦甚右脅下疼四肢軟弱二陳湯加白芥子枳實薑炒黃連竹瀝八十貼安治虛人有痰此方可法項彥章治一人病脅痛衆醫以為癰投諸香薑桂之屬益甚項診之曰此腎邪也法當先溫利而後竭之以神保丸下黑溲痛止即令更服神芎丸或疑其太過項曰向用神保丸以腎邪透膜非全蝎不能引導然巴豆性熱非得芒硝大黃蕩滌之後遇熱必再作乃大泄滯數出病已所以知之者以陽脉弦陰脉微澀弦者痛也澀者腎邪有餘也腎邪上薄於脅不能下且腎惡燥今以燥熱發之非得利不愈經曰痛隨利減殆謂此也琇按虛人恐不勝此虞恆德治一人年四十餘因騎馬跌撲次年左脅脹痛醫與小柴胡湯加草龍膽青皮等藥不效診其脉左手寸尺皆弦數而澀關脉芤而急數右三部唯數而虛虞曰明是死血症脉澀為血少又云失血之後脉必見芤又曰關內逢芤則內癰作論脉固屬血病然斷之曰死血亦因跌撲脅脹痛故耶用抵當丸一劑下黑血二升許後以四物湯加減調理而安橘泉治一老八十餘左脅大痛腫起如覆杯手不可近實症醫以為滯冷投香桂薑黃推氣之劑小腹急脹痛益甚翁曰此內有伏熱瘀血在脾中耳經所謂有形之腫也有形之腫宜以削之然痛隨利減與承氣湯加當歸芍藥柴胡黃連黃柏下之得黑瘀血二升立愈張戴人治一人病危篤張往視之其人曰我别無病三年前當隆暑時出村野有以煮酒饋豫者適村落無湯器冷飲數升便覺左脅下悶漸作痛結硬如石至今不散針灸磨藥殊無寸效戴人診之兩手俱沉實而有力先以獨聖散吐之一涌二三升氣味如酒其痛即止後服和脾安胃之劑而愈儒門事親張文仲則天初為侍御醫特進蘇良嗣因拜跪便絶倒文仲候之曰此因憂憤邪氣激也若痛衝脅則劇難救自晨至食時即苦衝脅絞痛文仲曰若入心即不可療俄而心痛日旰而卒薛已治一婦人脅下腫痛色赤寒熱用小柴胡加芍藥山梔川芎以清肝火而愈但經行之後患處仍痛用八珍湯以補氣血而安若因肝膽二經血燥所致當用小柴胡加山梔膽草芎歸主之久而脾胃虛弱補中益氣為主若兼氣鬱傷脾間以歸脾湯朝寒暮熱飲食少思須以逍遙散為主庠生馬伯進之母左胛連脅作痛背胛上胯骨連側脅是小腸與膽連脅是肝脾似瘡毒狀薛曰此鬱怒傷肝脾與六君加桔梗枳殼柴胡升麻彼另用瘡藥其痛甚乃請治其脉右關弦長按之軟弱左關弦洪按之澀滯果肝脾之疾飲食之毒七情之火也仍用煎藥加以大補之劑脉症悉退再加芎歸全愈一人年近六十素鬱怒脾胃不健服香燥行氣飲食少思兩脅脹悶服行氣破血飲食不入右脅脹痛丹溪云右脅悉屬痰左脅瘀血喜用手按彼疑為膈氣痰飲內傷薛曰乃肝木剋脾土而脾土不能生肺金也若內有瘀血雖單衣亦不敢著肉妙别用滋化源之藥四貼諸症頓退彼以為愈薛曰火令在邇當健脾土以保肺金彼不信後復作另用痰火之劑益甚求治左關右寸滑數此肺內潰矣仍不信乃服前藥吐穢膿而死一婦人飲食後因怒患瘧嘔吐用藿香正氣散二劑而愈後復怒吐痰甚多狂言熱熾胸脅脹痛手按少止脉洪大無倫無倫為虛按之微細此屬肝脾二經血虛以加味逍遙散加熟地川芎二劑脉症頓退再用十全大補而安此症若用疏通之劑是犯虛虛之戒矣一男子房勞兼怒風府脹悶兩脅脹痛薛作色欲損腎怒氣傷肝用六味地黃丸料加柴胡當歸一劑而愈琇按此法移治腹痛門中石山治一人面色蒼白之症宜收捷效石山治一人客維揚病脅痛醫以為虛用人參羊肉補之其痛愈甚一醫投龍㑹丸痛減汪診脉弦濡而弱曰脾胃為痛所傷尚未復遂以橘皮枳朮丸加黃連當歸服之而安越五年腹脅復痛彼思頗類前病欲服龍會丸未訣汪診之脉皆濡弱而緩曰前病屬實今病屬虛非前藥可治也以人參為君芎歸芍藥為臣香附陳皮為佐甘草山梔為使煎服十餘貼痛止食進黟縣縣丞年踰五十京回兩脅肋痛肋與脅不同醫用小柴胡湯痛止續後痛作前方不效汪診之脉皆弦細而濡按之不足曰此心肺為酒所傷脾腎為色所損兩脅脹痛相火亢極肝亦自焚經曰五藏已虛六府已竭九候雖調者死此病之謂歟尋卒休寧金上舍環海自述云曾因送殯忍飢過勞患腰肋連脅腫痛不能轉側醫治不效有一儒者診視曰此肝火也投龍膽瀉肝湯當歸龍會丸而愈膝腫徐可豫治吳興沈仲剛內子膝腫痛右先劇以熱尉則攻左尉左攻右俱尉則腹雷鳴上胸已而背悉若受萬箠者獨元首弗及發則面黛色脉罔辨昏作旦輟日尫弱甚醫望色輒卻謂弗救徐視脉竟曰是溼淫所中繼復驚傷膽疾雖劇可治即令以帛纏胸少選探咽喉間湧青白涎沫幾斗許湧定徐曰今兹疾發至腹則弗上面面弗青矣至昏膝痛仍加尉鳴果弗及胸止三鼓已定皆如徐言越三昏不復作遂痊痰隨氣升降作痛所以一吐而愈鶴膝風州守張天澤左膝腫痛胸膈痞滿飲食少思時作嘔頭眩痰壅日晡殊倦用葱尉法及六君加炮薑諸症頓退飲食稍進用補中益氣加蔓荆子頭目清爽肢體康健間與大防風湯十餘劑補中益氣三十餘劑而消一婦人發熱口乾月經不調半載後肢體倦怠二膝腫痛作足三陰血虛火燥治之用六味地黃丸兩月餘形體漸健飲食漸進膝腫漸消半載而痊腳氣附腫痛有人病兩腳躄不能行舉詣他他望見云已飽針灸服藥矣不須復看脉便使解衣㸃背數十處相去或一寸或五分縱邪不相當言灸此各十壯灸瘡愈即行後灸處夾脊一寸上下行端直均調如引繩也漢書華他傳徐之才治一人患腳跟腫痛諸醫莫能識徐曰蛤精疾也由乘舟入海垂腳水中疾者曰實曽如此之才為剖得蛤子二大如榆莢太原故事有范光祿得腳腫不能飲食忽有一人不通名徑入齊中謂曰佛使我來理君疾也光祿廢衣示之因以刀針腫上倐忽間頓針兩腳及膀胱百餘下出黃膿水三升許而去至明並無針傷而患漸愈齊諧録王薿守會稽童貫時方用事貫苦腳氣或云楊梅仁可療是疾薿裒五十石獻之後擢待制揮麈録道士王裕曰有忽患腳心如中箭發歇不時此腎之風毒㵼腎愈瀉肝即瀉腎董守約苦腳氣攻注或教之捶數螺傅兩股上便覺冷氣趨下至足踰時而安寒涼法類編唐栁栁州纂救三死方元和仲春得乾腳氣腳氣有乾溼之分夜半痞絶左脅有塊大如石且死因大寒不知人三日家人號哭滎陽鄭洵美傳杉木湯服半食頃大下三次氣通塊散用杉木節一大升橘葉一升無葉以皮代大腹檳榔七箇合而碎之童便三大升共煮一升半分二服若一服得快利停後服此乃死病㑹有教者乃得不死本事方董系治安國軍節度使程道濟患腰腳疼病將二年服湯藥皆薑附硫黃燥熱之藥中脘臍下艾炷十數無效愈覺膝寒胃冷少力多睡食少神減羣醫曰腎部虛寒非熱藥不能療及自體究亦覺惡寒喜暖但知此議為是因咨於董董曰腎經積熱血氣不通故也程不甚見信試用通經涼藥但見臟腑滑利伏困愈甚棄而不服人情大抵皆然後因陳五行造化勝負之理方始不疑再用辛甘寒藥瀉十二經之積熱日三四服通利十餘行數十日後覺痛減飲食有味精力爽健非昔之比心神喜悅服藥不輟迤邐覺熱自後服餌皆用寒涼數年之間疾去熱除神清體健寒涼法蔡元長知開封正據案治事忽如有蟲自足心行至腰間即墜筆暈絶久之方蘇掾屬云此病非俞山人不能療趣使召之俞曰此真腳氣也法當灸風市風市在奇腧經絡在膝上七寸外側兩筋間為灸一壯蔡晏然復常明日病如初再召俞曰除病根非千艾不可從其言灸五百壯自此遂愈仲兄文安公守姑蘇以鑾輿巡幸虛府舍暫徙吳縣縣治卑溼旋感足痺痛掣不堪服藥弗效乃用所聞灼風市肩髃大腸穴二穴同曲池三穴終身不復作僧普清苦此二十年每發率兩月用此灸三七壯即時痛止其他驗者益衆夷堅志一人患腳轉筋時發不可忍灸腳踝上一壯內筋急灸內外筋急灸外顧安中廣德軍人久患腳氣筋急腿腫行履不得因至湖州附船船中有一袋物為腿痠痛遂將腿閣袋上微覺不痛及筋寬而不急乃問艄人袋中何物應曰宣木瓜自此腳氣頓愈名醫録衍義治一人嗜酒後患腳氣甚危乃以巴㦸半兩糯米同炒米微轉色去米大黃一兩銼炒同為末煉蜜為丸溫水送下五七十丸仍禁酒遂愈溫利法東垣治一朝貴年近四十身體充肥腳氣始發頭面渾身支節微腫皆赤色足脛赤腫痛不可忍手近皮膚其痛轉甚起而復臥臥而復起日夕苦楚春間李為治之其人以北土髙寒故多飲酒積久傷脾不能運化飲食下流之所致投以當歸拈痛湯一兩二錢其痛減半再伏腫悉除只有右手指末微赤腫以三稜針刺指爪甲端多出黑血赤腫全去數日後因飲食溼麵肢體覺痛再以枳實五分大黃酒煨三錢當歸身一錢羌活錢半名曰枳實大黃湯只作一服水二盞煎一盞溫服穴心食前利下兩行痛止夫腳氣水溼之為也麵滋其溼血壅而不行故支節煩痛經云風能勝溼羌活辛溫透關節去溼故以為主血留而不行則痛當歸之辛溫散壅止痛枳實之苦寒治痞消食故以為臣大黃苦寒以導麵之溼熱併治諸老血留結取其峻快故以為使也下汗法丹溪治一婦足腫用生地黃黃柏蒼朮二妙可法南星紅花牛膝龍膽草川芎治之清法一人兩足痠重不任行動發則腫痛一日在不發中診脉三部皆大搏手如葱管無力身半已上肥盛蓋其膏粱妾御嗜欲無窮精血不足溼熱太盛因用益精血於其下清溼熱於其上二方與之誰謂丹溪法無補於世哉或言腳氣無補法故不肻服三月後痛作一醫用南方法治汗不效一醫用北方法治之下即死於溺器上吁業岐黃者虛實之辨蓋可以忽乎哉補法項彥章治一人足病發則兩足如柱潰黃水踰月乃己巳輒發六脉沉緩腳氣不得疑脉之沉緩為虛寒沉為裏有溼緩為厥為風此風溼毒俗名溼腳氣是也神芎丸竭之繼用舟車神佑丸下濁水數十出而愈下法一婦腳底如錐刺痛或胕腫足腕亦痛而腫大便泄滑裏急此血少又下焦血分受溼氣為病健步丸主之以生地一兩半歸尾白芍陳皮蒼朮各一兩牛膝茱萸條芩各半兩大腹子三錢桂枝二錢為丸每服百丸以白朮通草煎湯食前下之溫法腹琇按此丹溪案大子原刻悮大附子戴人治一人病腰腳大不伸傴僂蹩躄而行已數年矣服藥無功止藥却愈因秋暮涉水病復作醫用四斤丸其父求治於戴戴曰近日服何藥曰四斤丸曰目昏赤未其父驚曰目正暴發戴曰宜速來否則失明矣既來目腫無所見戴人先令湧之藥下忽走三十行兩目頓明再湧泄能認字調一月令服當歸丸健步而歸吐法子和治息帥腰股沉痛行步坐馬皆不便或作腳氣寒溼治之或作虛損治之烏附乳沒活血壯筋骨之藥無不用之至兩月餘目赤上熱大小便俱澀腰股之病如故診其兩手脉皆沉遲若據脉經則沉遲為寒今以凉瀉而愈故脉必當合症而斷沉者在裏也宜瀉之以舟車丸濬川散各一服去積水二十餘行至早晨咽白粥一二頓與之即能矍鑠矣下法魏德新因赴冬選犯寒而行真元氣衰加之坐臥冷溼食飲失節以冬遇此遂作骨痺骨屬腎腰之髙骨壞而不用兩胯似折而黑如炭面黑為溼氣上侵前後臁痛痿厥嗜臥遍問諸醫皆作腎虛治之乃先以玲瓏竈尉蒸數日次以苦劑上湧寒痰二三升汗吐兼用下虛上實明見矣次以淡劑使白朮除脾溼茯苓養腎水官桂伐風木然後溫補寒氣偏勝則加薑附否則不加又刺腎俞膀胱穴太溪腎穴二穴二日一刺前後一月半平復如初薰法毗陵有馬姓鬻酒為業者患腎臟風忽一足發腫如瓠自腰以下巨細通為一律痛不可忍欲轉側兩人扶方可動或者欲以鈹刀决之張曰未可此腎臟風攻注腳膝也乃以連珠甘遂一兩木鱉子二箇一雄一雌為末獖猪腰子二箇批開藥末一錢糝勻溼紙裹數重慢火煨熟放溫煨腎散加木鱉五更初細嚼米飲下積水多則利多少則少也宜軟飯將息若病患一腳切看左右如左腳用左邊腰子右腳用右邊腰子藥末只一錢辰巳間下膿如水晶者數升即時痛止一月後尚拄拐而行再以赤烏散令塗貼其膝方愈十年相見行步自若商州有人重病足不履地者數十年良醫殫技莫能治所親置之道傍以求救者遇一新羅僧見之謂曰此疾一藥可救但不知此土有否因為之入山採取乃葳靈仙也靈仙能通行十二經使服之數日能步履其後山人遂傳其事海上方著其法云採之陰乾月餘搗末酒和服二錢匕利空心服之如人本性殺藥可加及六七錢匕利過兩行則減之病除乃停服其性甚善不觸諸藥但惡茶及麵湯以甘草巵子代飲可也羅治中書粘合公年四旬體幹魁梧春間從征至揚州偶腳氣忽作遍身肢體微腫其痛手不能近足脛尤甚履不任穿跣以騎馬控兩蹬而以竹器盛之困急東垣曰內經有云飲發於中胕腫於上妙理又云諸痛為實血實者宜决之以三稜針數刺其腫上血突出髙二尺餘漸漸如線流於地約半升許其色紫黑頃時腫消痛減以當歸拈痛湯一兩半服之夜得睡明日再服而愈針法孫少府治韓彥正暴得疾手足不舉諸醫皆以為風針手足亦不去痛孫曰此腳氣也用檳榔末三錢生薑三片乾紫蘇葉七片陳皮三錢水一大盞煎七分熱服數服而愈清薛已治一婦人腿患筋攣骨痛諸藥不應脉緊用大防風湯二劑大防風湯八珍加附子羌防牛膝杜仲黃茋頓退又二劑而安汗江應宿治一婢春初患腳氣腰腳赤腫墳起疼痛難於步履豫曰此因飲食傷脾不能運化溼熱下注之所致也利水行溼消導食滯用平胃散加茯苓澤瀉薏苡木瓜山查麥芽神曲二劑腰腳消而能步再以木通白朮湯送保和丸而愈豫友人佘近峰賈秣陵年五十餘患腳痛臥不能起年餘脛與腿肉俱消邑醫徐古塘昔患痺疾治愈求其成方初用當歸拈痛湯二服效次用十全大補湯加枸杞子防己牛膝草薢朝用六味地黃丸加虎脛骨牛膝川草薢鹿角膠服三年矍鑠如初徐書云久久服之自獲大益幸勿責效於旦夕信然宿曰今人謂之腳氣者黃帝所謂緩風溼痺也千金云頑弱名緩風疼痛為溼痺大抵腳氣無補法乃風毒在內不可攻故當先㵼之皆溼熱之為也腳發薛已治閣老靳介庵腳指縫作癢出水腫焮腳面敷止癢之藥不應服除溼之藥益甚薛診之曰陰虛溼熱下注也用六味地黃補中益氣而愈大參李北溪足赤腫作痛先用隔蒜灸飲活命散一劑痛頓止灸處出水赤腫頓消次用托裏消毒散四劑灸處出膿而愈一儒者腳踝腫硬色白兩月餘矣用大防風湯及十全大補兼服而消後場屋不利飲食勞倦症復作盜汗內熱飲食不化便滑肌瘦復加頭暈或頭痛痰湧此腎不納氣用八味丸益氣湯百餘劑而安一男子腳心發熱作渴引飲或用四物芩連黃柏知母之類腹痛作嘔煩熱大渴此脾胃復傷先用六君炮薑數劑而脾胃醒再用補中益氣加茯苓半夏而脾胃健乃以加減八味丸兼服半載而愈一儒者腳心發熱作癢搔搯滚水浸漬而出水肌體骨立作渴吐痰用益氣湯六味丸年餘元氣復而諸症愈少宗伯顧東江面黧作渴薛曰此腎經虧損當滋化源以杜後患顧公不信次年九月左足面患疽色黯不痛腳腿沉重用隔蒜灸三十餘壯足腿即輕瘡出血水七日而消色仍黯時顧將北行賀萬夀薛診之曰脾脉衰憊陽氣虧極不宜逺行公曰豫得夢屢驗向夢羣仙待我此夀徵也至河間驛聚仙堂病亟歎曰數定於此立齊豈能我留尋卒江應宿治程文學子腳腿墳起如瓜瓠焮赬痛楚難支豫用廣膠四兩入麝少許熔如稠膏攤油紙貼之外用好醋煮青綿布三片乘熱貼膏外輪遞更換腿癢如蛆頃刻盡消而愈外治法較張子和法更佳然二法不可偏廢薛已曰腳發色赤腫痛而潰膿者屬足三陽溼熱下注可治微赤微腫者膿清者屬足三陰虧損難治若黑黯不腫痛不潰膿煩熱作渴小便淋漓者陰敗末傳惡症為不治其法溼熱下注者先用隔蒜灸活命飲以解壅毒次服益氣湯六味丸以補精氣若赤黯不痛者著肉灸桑枝灸以行壅滯助陽氣更用大補湯八味丸壯脾腎滋化源多有生者數種治法皆當熟玩切記切記若專治瘡復傷正氣誤人多矣腳弱一士人得腳弱病方書羅列積藥如山疾益甚張杲曰汝當盡屏去但用杉木為桶濯足又令排樟腦於兩股間以腳䙀繫定月餘而安健如初南方多此疾不可不知遁齊閒覽孫琳治一少年娶妻不久得軟腳病疼特甚醫以為腳氣孫聞之曰吾不必診視但用杜仲一味寸斷片析每一兩用半酒半水合一大盞煮六分頻服之三日能行又三日而愈孫曰第宅寢處髙明衣履燥潔無受溼之理乃新婚縱欲致然杜仲專治腰膝以酒行之則奏效易矣諸氣子和治一婦人勞苦太過大便結燥咳氣上逆時喝喝然有音唾嘔鮮血以苦劑解毒湯加木香漢防己煎服時時啜之復以木香檳榔丸泄其逆氣一月而安今人見嘔鮮血以滋陰降火為主稱曰弱症焉知為氣病乎故曰風寒燥火六氣皆令人吐血莊先生治喜樂之極而病者莊切其脉為之失聲佯曰吾取藥去數日更不來病者悲泣辭其親友曰吾不久矣莊知其將愈慰之詰其故莊引素問曰懼勝喜可謂得元關者石山治一婦瘦弱年四十餘患走氣遍身疼痛或背脹痛或兩脅插痛或一月二三發發則嘔盡所食方快飲食不進久伏牀枕醫作氣治用流氣飲或作痰治用丁藿二陳病甚汪診之脉皆細微而數右脉尤弱曰此恐孀居憂思傷脾而氣鬱也理以補脾散鬱鬱則致火鬱則痛久則虛誰曰諸痛無補法哉以人參三錢香附黃連甘草砂仁各五分黃茋二錢歸身錢半川芎八分乾薑四分煎服十餘貼脉之數而弱者稍緩而健諸痛亦減仍服前方再用參茋川芎香附山梔甘草以神曲糊丸服之病除烺案石山醫案黃連元作黃芩未知孰是蕭司訓年踰五十形肥色紫病氣從臍下冲逆而上腎虛睡臥不安飲食少精神倦汪診之脉皆浮濡而緩曰氣虛也問曰丹溪云氣從臍下起者陰火也何謂氣虛陰火與元氣不兩立汪曰難執定論丹溪又云肥人氣虛脉緩亦氣虛今據形與脉當作氣虛論治遂以參茋為君白朮白芍為臣歸身熟地為佐黃柏甘陳為使煎服十餘貼稍安彼以胸膈不利陳皮加作七分氣冲上琇按陳皮加至七分便復氣冲上細玩之可知用藥之道仍守前方月餘而愈一人遍身皮底渾渾如波浪聲癢不可忍抓之血出不止名氣奔用人參苦杖杜牛膝青鹽細辛各一兩水二碗煎取清汁飲之而愈疝㿗齊郎中令循病衆醫皆以為蹶人中而刺之臣意診之曰湧疝也令人不得前後溲循曰不得前後溲三日矣臣意飲以火齊湯即黃連解毒湯一飲得前溲再飲大溲三飲而疾愈病得之內所以知循病者切其脉時右口氣急寸口乃氣口也脉無五臟氣右口脉大而數數者中下熱而湧左為下右為上皆無五藏應故曰湧疝中熱故溺赤也史記齊北宫司空命婦出於病衆醫皆以為風入中病主在肺刺其足少陽脉臣意診其脉曰病氣疝客於膀胱難於前後溲而溺赤病見寒氣則遺溺使人腹腫出於病得之欲溺不得因以接內所以知出於病者切其脉大而實其來難是厥陰之動也脉來難者疝氣之客於膀胱也腹之所以腫者言厥陰之絡結小腹也厥陰有過則脉結動動則腹腫臣意即灸其足厥陰之脉宜灸急脉左右各一所即不遺溺而溲清小腹痛止即更為火齊湯以飲之三日而疝氣散即愈史記安陵阪里公乘項處病臣意診脉曰牡疝牡疝在膈下上連肺病得之內臣意謂之慎毋為勞力事為勞力事則必嘔血死處後蹴踘要蹶寒汗出多即嘔血臣意復診之曰當旦日日夕死即死病得之內所以知項處病者切其脉得番陽番陽入虛裏處旦日死一番一絡者牡疝也史記索隱曰脉病之名曰番陽者以言陽脉之翻入虛裏也羅謙甫治火兒赤憐歹久患疝氣復因秋間飢飽勞役過飲潼乳所發甚於初面色青黃不澤臍腹陳痛搐撮不可忍腰曲不能伸熱物尉之稍緩脉得沉小而急難經有云任之為病男子內結七疝皆積寒於小腸間所致也非大熱之劑則不能愈遂製沉香桂附丸以沉香附子川烏炮去皮臍炮薑良薑茴香炒官桂吳萸湯浸去苦各一兩醋丸如桐子大每服五十丸至七八十丸空心食前熱米飲湯送下日二服忌冷物間服天台烏藥散以烏藥木香茴香炒良薑炒青皮各五錢檳榔二箇川練十箇巴豆七十粒微打破同川練用麩炒候麩黑色去麩為末每服一錢溫酒調下痛甚者炒生薑熱酒調下服此二藥旬日良愈溫法趙運使夫人年近六十三月日病臍腹冷痛相引脅下痛不可忍反復悶亂不得安臥乃先灸中庭穴任穴在膻中下寸六分陷者中任脉氣所發灸五壯或二七三七壯次以當歸四逆湯以當歸尾七分炮附子官桂茴香柴胡各五分芍藥四分茯苓元胡川練子酒煮各三分澤瀉一分水煎溫數服而愈許學士治歙縣尉宋荀甫膀胱氣作痛不可忍醫以剛劑與之痛益甚溲溺不通三日許視其脉曰投熱藥太過適有五苓散一分為三易其名用連鬚葱一莖茴香及鹽少許水一盞半煎七分連服之中夜下小便如黑汁一二升劑下寬得睡明日脉已平續用碙砂丸數日愈蓋是疾本因虛得不宜驟進補藥邪之所凑其氣必虛留而不去其病則實妙妙故先滌所蓄之邪然後補之清法方本事滑伯仁治一婦病寒為疝自臍下上至心皆脹滿攻痛而脅疼尤甚此等痛切記作疝治嘔吐煩悶不進飲食脉兩手沉結不調此由寒在下焦宜亟攻其下毋攻其上為灸章門氣海中脘服元胡桂椒佐以蘹木諸香茯苓青皮等十日一服溫利丸藥聚而散之也果效一老人病臍腹㽲痛醫為溫中散寒卒無驗診之脉兩尺搏堅而沉曰此大寒由外入也寒喜中下故為疝治宜在下加沉降之劑引入下焦數服尋愈一人病疝氣發則臍下築築漸上至心下嘔湧痛憊手足青色喉中淫淫而癢睂本疼痠目不欲視頭不欲舉神昏昏欲睡而不寐惡食氣睪丸控引小便數而短年未三十尫瘠一若衰耄人劣劣不自持診其脉沉弦而澀曰是得之憂鬱憤怒內因寒溼風雨乘之外因為肝疝也屬在厥陰故當脉所過處皆病焉厥陰肝也張從正云諸疝皆屬肝肝欲散急以辛散之遂以吳萸佐以薑桂辛散及治氣引經藥兼製茴練原刻誤回陳等丸每十日一溫利之三月而愈丹溪云豫舊有甘橘積後因山行飢甚遇橘芋食之橘動舊積芋復滯氣即時右丸腫大寒熱先服平胃散一二貼次早神思清氣至下焦嘔逆覺積動吐之復吐後和胃氣疏通經絡而愈一人虛損潮熱腎偏墜小腸氣四物加小茴香吳萸胡蘆巴各五分枳子青皮山查漸愈一人病後飲水病左丸痛甚灸大敦以摩腰膏摩囊上上抵橫骨腎穴炙溫帛覆之痛即止一宿腫亦消汪石山治一人年二十餘因水中久立過勞病疝痛痛時腹中有磊塊起落如滚浪其痛尤甚診之脉皆細弦而緩按之似澀曰此血病也考之方書疝有七皆不宜下所治多是溫散之藥以氣言也兹宜變法治之石翁妙處在變法乃用小承氣加桃仁下之其痛如失三日復作比前加甚脉之輕則弦大重則散澀思之莫得其說問曽食何物曰食雞蛋二枚而已曰已得之矣令以指探吐出令盡而痛解矣下法一小兒八嵗㿗疝陰囊腫脹核有大小汪令燒荔枝核灰茴香炒為末等分食逺溫酒調服二錢不過三服一兒六歲陰囊脹大如盞莖皮光腫如泡一醫為之滲溼行氣不效汪診視脉皆濡緩曰脉緩無力者氣虛也痛脉皆弦不弦宜補經曰膀胱者津液之府氣化則能出焉氣虛不足無能運化而使之出矣宜升陽補氣可也遂以人參黃茋白朮茯苓牛膝升麻陳皮甘草稍煎服一二貼囊皺腫消三貼全愈補法程比部羅雲公乃郎年十五嵗疝痛何醫官按以蕃葱散四服而愈此童幼之年從積治積羅山人年四旬居憂怫鬱致胸膈凝聚月餘流於肋下漸下墜入陰囊不時作痛謾試諸方二年餘不效偶撿奇效良方聚香飲子一匕而豁然如失此七情所傷從氣治氣祠部黃新陽公夙有脾泄便血腳痛六脉滑數曾用酒煮黃連為君佐以參朮等而泄血止越年餘患狐疝晝出囊中夜臥入腹不時疼痛吳心所投以虎潛丸還少丹而愈此始為熱中久為寒中藥物寒熱逈别而俱效久病從虛治也虛江少微自患狐疝用八味地黃丸而痛止繼服打老兒丸而愈時年五十餘此衰弱之軀正氣旺而邪無所容矣不寐許叔微治四明董生者患神氣不寧臥則魂飛揚身雖在牀而神魂離體驚悸多魘通宵不寐更數醫莫效羅診視之問曰醫作何病治之董曰衆皆以為心病許曰以脉言之肝經受邪非心也肝經因虛邪氣襲之肝藏魂者也遊魂為變平人肝不受邪臥則魂歸於肝神靜而得寐今肝有邪魂不得歸是以臥則飛揚若離體也肝主怒故小怒則劇論症精確董生欣然曰前此未之聞也雖未服藥似覺沉痾去體矣願求藥以治之許曰公且持此說與衆醫議所治之方而徐質之閲旬日復至云醫遍考古今方書無與對病者許乃為處二方服一月而病悉除方以真珠母為君龍齒佐之方內以人參為臣方妙真珠母入肝為第一龍齒與肝同類故也龍齒虎睛今人例以為鎮心藥殊不知龍齒安魂虎睛定魄各言其類也東方蒼龍木也屬肝而藏魂西方白虎金也屬肺而藏魄龍能變化故魂遊而不定虎能專靜故魄止而能守許謂治魄不寧者宜以虎睛治魂飛揚者宜以龍齒萬物有成理而不失亦在夫人達之而已一人忽覺自形作兩並臥不别真假不語問亦無對乃離魂也用硃砂人參茯苓濃煎服真者氣爽假者即化一老人患虛煩不得睡大便不通常有一道熱氣自臍下衝上心隨即昏亂欲絶醫一月不愈用大黃通利大便幾致殞殆羅診之六脉沉緩遂投竹茹溫膽湯十一臟取决於膽也自午服一盞熱氣至心下而不至心上晡時一盞熱氣至臍下而不至臍上戌初又一盞熱氣不復上升矣次日早間以檳榔疏氣琇按四字可商之藥調之大府遂通而愈此症虛而協熱者居多若因大便不通熱氣冲上而用宣通之藥斷斷不可況沉緩之脉見乎沉為裏病緩則為虛溫膽外宜養陰潤下為是吕滄洲治一人病無睡睡則心悸神懾如處孤壘而四面受敵達旦目眵眵無所見耳聵聵無所聞雖堅臥密室睫未嘗交也諸醫罔效吕切其脉左關之陽浮而虛察其色少陽之支外溢於目眥足厥陰手少陽手太陽三經之支結目外眥即告之曰此得之膽虛而風諸公獨治其心而不祛其膽之風非法也因投禁方烏梅湯抱膽丸日再服遂熟睡比寤病如失汪石山治一女年十五病心悸常若有人捕之欲避而無所其母抱之於懷數婢護之於外猶恐恐然不能安寐醫者以為病心用安神丸鎮心丸四物湯不效汪診之脉皆細弱而緩曰此膽病也用溫膽湯服之而安多夢錢丕少卿忽夜多惡夢但就枕便成輒通夕不止後因赴官經漢上與鄧州推官胡用之遇同宿驛中言近多夢慮非吉胡曰昔嘗如此懼甚有道士教戴丹砂初任辰州推官求得靈砂雙箭鏃者戴之不涉旬驗四五年不復有夢至今祕惜因解髻中一綘紗囊遺之即夕無夢神魂安靜真誥及他道書多載丹砂避惡信然類編宿述夢者因也晝之所思夜之所夢至人無夢以其恬淡虛無少思寡慮何夢之有消中羅謙甫治韓子玉父年踰六旬病消渴至冬添躁熱須裸袒以冰水噴胸腋乃快日食肉麵數四頃時即飢如此月餘羅診得脉沉細而疾羅以死决之子玉兄弟跪泣曰病固危篤君盡心救之則死而無恨羅曰夫消之為病其名不一曰食㑊曰消中曰宣疾此膏粱之所致也陽明化燥火津液不能停自汗小便數故飲一溲二胃熱則消榖善飢能食而瘦王叔和云多食亦飢虛是也此病仲景所謂春夏劇秋冬瘥時制故也令尊今當瘥之時反劇乃腎水乾涸不能制其心火而獨旺於不勝之時經曰當所勝之時而不能制名曰真强乃孤陽絶陰者也且人之身元氣為主天令為客此天令大寒尚不能制其熱何藥能及內經主勝逆客勝從正以此也琇按見解超詣宜熟玩之設從君治療徒勞而已固辭而歸遂易醫與灸數日而卒吳茭山治一老人年踰七十素有痰火過思鬱結因得消中之患晝夜飲食無度時時常進則可若少頃缺食則不安每服寒涼俱罔效人皆以年老患消中危之吳診其脉左寸關弦右寸關弦滑尺浮大府燥結吳疑之此大腸移熱於胃胃火內消故善食而不發渴也斷曰消中善食而肌肉削消脉虛無力者不治此痰火內消肌色如故依法治之可生也妙斷脉能合色可以萬全斯言誠然遂用白虎湯倍入石膏服之胃火漸平飲食漸減次以坎離丸養血四物湯調理二月而安江汝潔治介塘程濋六脉舉指皆弦長重指俱大而略實二尺盛於寸關脉若沉細必死經曰弦者陽也長者陽也實大皆陽也又曰下堅上虛病在脾則知陽勝而陰虛足陽明胃太陰脾俱有火邪是以土得火則燥虧生發之源失轉運之機上焦不行下脘不通濁氣下流肌肉銷鑠日久失療漸成下消之候良醫弗為也治須滋足陽明太陰之營氣兼發散土中之火邪俾得以行乾健之運則陰陽升降氣血調和也以甘草六分白芍二錢人參三錢補脾血升麻乾葛各一錢半散陰火水煎服數劑而安名醫類案卷六
