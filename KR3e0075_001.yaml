body:
  text: 名醫類案卷一明江瓘編中風琇案南方中風絶少多屬非風類風皆風木內病臨症之工宜詳審焉凡風由內發皆屬氣與火若後之虛風迵風是也許𦙍宗治王太后病風不能言口噤而脉沈事急矣非大補不可也若用有形之湯藥緩不及事乃以防風黃茋煎湯數斛置於牀下湯氣薰蒸滿室如霧使口鼻俱受之其夕便得語此非智者通神之法不能回也蓋人之口通乎地鼻通乎天口以養隂鼻以養陽天主清故鼻不受有形而受無形地主濁故口受有形而兼乎無形也元羅謙甫治太尉忠武史公年近七十於至元戊辰十月初侍國師於聖安寺丈室中煤炭火一爐在左側邉遂覺面熱左頰微有汗師及左右諸人皆出因左頰䟱緩傷熱故也被風寒客之右頰急口喎於右脉得浮緊按之洪緩羅舉醫學提舉忽君吉甫専科針灸先於左頰上灸地倉穴胃穴一七壯次灸頰車穴胃穴二七壯後於右頰上熱手尉之議以升麻湯加防風秦芁白芷桂枝發散風寒數服而愈琇按非真中風故但升散火邪自愈或曰世醫多治以續命等湯今用升麻湯加四味其理安在曰足陽明經胃起於鼻交頞中循鼻外入上齒中手陽明經大腸亦貫於下齒中況兩頰皆屬陽明升麻湯乃陽明經藥香白芷又行手陽明之經秦芁治口噤防風散風邪桂枝實表而固榮衛使邪不能傷此其理也夫病有標本經絡之别藥有氣味厚薄之殊察病之源用藥之宜其效如桴鼓之應不明經絡所過不知藥性所主徒執一方不惟無益而反害之者多矣學者宜深思之張安撫年六十餘已未仲冬患風症半身不遂語言蹇澀心神昏憒煩躁自汗表虛惡風如灑冰雪如灑冰雪隂中也口不知味鼻不聞香臭聞木音則驚怖小便頻多大便結燥若用大黃之類下之平日飲食減少不敢用不然則滿悶晝夜不得寐此症難治約三月餘凡三易醫病全不減至庚申三月下後又因風邪加之痰嗽嗌乾燥疼痛不利唾多中脘氣痞似噎豫思內經有云風寒傷形憂恐忿怒傷氣氣傷臟乃病臟病形乃應又云人之氣以天地之疾風名之此風氣下陷入隂中不能生發上行氣不能升則為病矣又云形樂志苦病生於脉神先病也邪風加之邪入於經動無常處動有常則知邪不入經前證互相出見治病必求其本邪氣乃服論時月則宜升陽補脾胃㵼風木仲冬至季春論病則宜實表裏養衛氣瀉肝木潤燥益元氣慎喜怒是治其本也以柴胡黃茋各五分升麻當歸甘草灸各三分半夏黃蘗酒洗黃芩人參陳皮芍藥各二分名曰加減沖和湯煎服自汗加黃茋五分嗽加五味子二十粒夜不得寐乃心事煩擾心火內動上乘陽分衛氣不得交入隂分使然也以硃砂安神丸服之由是晝亦得睡此風中腑兼中臟也真定府臨濟寺趙僧判於至元庚辰八月間患中風半身不遂精神昏憒面紅頰赤面紅頰赤陽中也耳聾鼻塞語言不出診其兩手六脉弦數中風此脉甚多潔古有云中臟者多滯九竅中腑者多著四肢今語言不出耳聾鼻塞精神昏憒是中臟也半身不遂是中腑也此臟腑俱受病邪先以三化湯一兩內疏三兩行散其壅滯先下使清氣上升充實四肢次與至寶丹加龍骨南星安心定志養神治之後補使各臟之氣上升通利九竅五日聲音出言語稍利後隨四時脈證加減用藥不旬即稍能行步日以繩絡其病腳如履閾或高處得人扶之方可踰也又刺十二經之井穴臟井商穴肺少心少冲穴穴肝大敦穴膽脾隱白穴胃腎湧泉穴三包絡中冲腑井竅隂穴厲兑穴焦關冲穴陽小腸少澤穴隂大腸商穴膀胱至穴以接經絡翌日捨繩絡能步幾百步大勢皆去戒之慎言語節飲食一年方愈丹溪治一人患滯下下多亡隂一夕昏仆手舒撒目上視溲注汗大泄喉如拽鋸脈大無倫次此隂虛陽暴絶也此症死者居多蓋得之病後酒色急灸氣海穴氣海臍下一寸半以續陽氣漸蘇服人參膏數斤而愈作大虛治一肥人中風口喎手足麻木左右俱廢作痰治以貝母瓜蔞南星半夏陳皮白术黃芩黃連黃柏羌活防風荆芥威靈仙薄桂甘草天花粉好喫麵加白附子入竹瀝薑汁更加少酒行經一肥人中風用蒼术南星酒芩酒柏茯苓木通升麻厚朴甘草牛膝紅花水煎先吐後藥一婦年六十餘手足左癱不言而健有痰以防風荆芥羌活南星沒藥乳香木通茯苓厚朴桔梗甘草麻黃全蝎紅花為末酒下未效時春脉伏而微又以淡鹽湯韭汁每早一碗吐之至五日仍以白术甘草陳皮茯苓厚朴菖蒲日進二服吐後必用清補二劑亦是一法又以川芎山梔豆䜴瓜蒂菉豆粉韭汁鹽湯吐甚快後以四君子湯服之又以川歸酒芩紅花木通厚朴鼠粘子蒼术南星牛膝茯苓為末酒糊丸服十日後微汗仍以汗解手足微動而言作實痰治一人中風口眼歪斜語言不正口角涎流或半身不遂或全體如是此因元氣虛弱而受外邪又兼酒色之過也以人參防風麻黃羌活升麻桔梗石膏黃芩荆芥天麻南星薄荷葛根赤芍藥杏仁川歸川芎白术細辛皂角等分加葱薑水煎入竹瀝半盞隨灸風市竒俞穴百㑹督脈曲池大腸穴合絶骨膽穴去絶骨即懸鐘穴環跳膽穴肩髃大腸穴三里胃穴等穴以鑿竅疏風得微汗而愈亦以汗解李真三患中風半身不遂羌活愈風湯加天麻荆芥僵蠶各一錢而愈吳能三患中風卒中昏不知人口眼喎斜半身不遂痰厥氣厥二陳湯加薑汁炒黃連天麻羌活麥冬僵蠶南星荆芥獨活薑汁竹瀝方甚佳作痰治姜晟年五十三歲好飲酒濕熱患中風口喎斜搜風湯內加薑汁炒黃連地龍全蝎各八分羌活荆芥各一錢作濕熱治邱信年四十三歲患中風肚甚疼口眼喎斜蘇合香丸服之就愈後加薑汁竹瀝全愈作氣治徐浦三好色妾四人有色患中風四肢麻木無力半身不遂四物湯治風先治血血生風自滅加天麻苦參黃柏知母麥冬人參白术黃茋僵蠶全蝎地龍而愈顧京一年三十二歲患中風半身不遂臂如角弓反張二陳加麥冬川芎當歸各一錢天麻羌活黃連薑汁炒黃芩各七分荆芥烏藥各五分疏肝氣養肝血清肝火數十貼而愈邱敏六年三十六歲患中風四肢如癱此人好色從幼做買賣有外事此風非自外來由內燥火而卒中也二陳與四物湯加人參黃茋白术麥冬薑汁竹瀝百十貼而愈周忠信患中風頭疼如破清氣不上升言語蹇澀小續命湯加防己肉桂黃芩杏仁去皮尖芍藥甘草芎藭麻黃去根節人參防風一兩半羌活大附子炮去皮臍半兩水三鍾棗二枚食前煎服方延一年三十九歲患中風一身俱麻麻由虛而氣不行烏藥順氣散加人參白术麥冬川芎當歸而愈一則頭疼如破一則一身俱麻看他用藥俱有分寸陶文三年五十六歲患中風身如刺疼四物湯加防風荆芥蟬蛻麥冬蔓荆子血虛協溼王從一年四十二歲十指盡麻木併面麻乃氣虛症補中益氣湯加木香附子各五分愈又加麥冬羌活防風烏藥服之全愈一則一身如刺疼一則十指盡麻面麻又如此用藥汪文富年四十六歲患中風偏枯四肢不隨手足攣拳二陳湯加防風虎脛骨當歸杜仲牛膝續斷金毛狗脊巴㦸石斛各一錢養血暖筋治法一小變言清一年三十七歲乃匠者勤於動作能飲酒患中風頭目眩暈二陳湯加防風羌活當歸芍藥人參白术黃連熟地薑汁製川芎甘蔗汁胡清年三十六歲平日好飲酒大醉一時暈倒手足俱麻痺用黃茋一兩天麻五錢甘蔗汁半盞時付三患中風雙眼合閉暈倒不知人子也不識四君子湯加竹瀝薑汁二合愈鄧士付患中風卒暴涎流氣閉牙關緊急眼目俱被損傷二陳湯加白芷天南星甜葶藶薑汁竹瀝二合愈又治痰㵼肺法金付七患中風攻注四肢骨節痛濕痰流注關節故痛遍身麻木語言蹇澀二陳湯加川芎羌活僵蠶枳殼麻黃去節桔梗烏藥服之愈又治氣法徐太一年二十三歲患中風一時暈倒不知人母也不識二陳湯加當歸南星芍藥黃茋熟地薑汁製痰虛而協孫文正年六十一歲患中風手足癱瘓痰壅盛頭眩二陳加南星薑汁竹瀝服之愈痰火宗京舍年二十九歲患中風四肢麻木雙足難行二陳湯加當歸人參麥冬黃柏杜仲牛膝白术虛何澄患中風四肢不知痛癢麻木乃氣虛大劑四君子湯加天麻麥冬八分黃茋當歸身虛穆林年五十四歲患中風併小腸疝氣二陳湯加吳茰葫蘆芭小茴香熟地各一錢加藥妙祝橘泉治英國公病左癱不語氣上壅醫以為中風用順氣祛風之劑弗效祝曰此痰火濕熱所致與之清燥化痰前後飲竹瀝數升愈王節齊治一壯年人年壯可吐忽得暴疾如中風口不能言目不識人四肢不舉急投蘇合香丸不效王偶過聞之因詢其由曰適方陪客飲食後忽得此症食閉遂教以煎生薑淡鹽湯多飲探吐之吐出飲食數碗而愈虞恆德治一婦年五十七身肥白春初得中風暴仆不知人事身僵直實口噤不語喉如拽鋸水飲不能入六脈浮大弦滑右甚於左弦滑為實以藜蘆末一錢加麝香少許灌入鼻竅吐痰一升許先吐因水飲不能入如無此症小續命為穩始知人事身體略能舉動急煎小續命湯倍麻黃連進二服覆以衣被得汗漸蘇省能轉側但右手足不遂語言蹇澀後以二陳湯加芎歸芍藥防風羌活等藥合竹瀝薑汁日進二三服若三四日大便不去則不能言語脾之脈散舌下即以東垣導滯丸或潤腸丸微利之則言語復正如此調理至六十餘得他病而卒江陵府節度使進豨蘞丸方臣有弟訮年三十中風牀枕五年百藥不瘥有道人鍾針者因覩此患可餌豨蘞丸必愈其藥多生沃壤五月間收洗去土摘其葉及枝頭九蒸九曝不必太燥但取蒸黑為度杵為末煉蜜丸梧桐子大空心溫酒米飲下二三十丸所患忽加不得憂至四十服必復如故五十服當丁壯奉宣付醫院詳録又知益州張詠進表云臣因換龍興觀掘得一碑內說修養氣術并藥二件依方差人採覓其草頗有異金稜銀線素根紫荄對節而生蜀號火杴莖葉頗同蒼耳誰知至賤之中乃有殊常之效臣自喫至百服眼目精明即至千服鬚髮烏黑筋力輕健效驗多端臣本州有都押衙羅守一曽因中風墜馬失音不語臣與十服其病立痊又僧智嚴年七十患偏風口眼喎斜時時吐涎臣與十服亦便瘥今合一百劑差職員史元奏進本草薛已治王進士因勞役失於調養忽然昏憒此元氣虛火妄動挾痰而作急令灌童便童便妙神思漸爽更用參茋各五錢芎歸各三錢元參柴胡山梔炙甘草各一錢服之稍定察其形倦甚又以十全大補加五味麥門冬治之而安先生得手處在認症確未到處在不言脈凡人元氣素弱或因起居失宜或因飲食勞倦或因用心太過致遺精白濁自汗盜汗或內熱晡熱潮熱發熱或口乾作渴喉痛舌裂或胸乳膨脹脅肋作痛或頭頸時痛眩暈目花或心神不寧寤而不寐或小便赤澀莖中作痛或便溺餘滴臍腹隂冷或形容不充肢體畏寒或鼻氣急促或更有一切熱症皆是無根虛火但服前湯固其根本琇按無外感者可遵其法諸證自息若攻其風熱則誤矣艾郭武牙關緊左體癱不能言口眼牽動神昏欲絶六脈沉細而澀乃中寒濕所致非中風也即以薑汁調白末子白末子即膽星白附子烏頭三味灌入半盞吐痰四五口又磨至寶丹灌之又吐痰數口氣得通張眼四顧驚號大哭片時復昏不語繼以五積散加木香南星附子白术茯苓自當日午至來早服藥四盞患人方蘇三日後大便洞利三行皆是痰積又與虎骨酒服之全愈一男子卒中口眼喎斜不能言語遇風寒四肢拘急脈浮而緊此手足陽明經虛風寒所乘用秦芁升麻湯治之隨脈用藥稍愈乃以補中益氣加山梔而痊若口瘖不能言足痿不能行屬腎氣虛弱名曰痱症宜用地黃飲子治之然此症皆由將息失宜腎水不足而心火暴盛痰滯於胸也輕者自蘇重者必死一男子體肥善飲舌本强硬語言不清口眼喎斜痰氣湧盛肢體不遂薛以為脾虛濕熱用六君加煨葛根山梔神曲而痊一人年六十餘素善飲兩臂作痛恪服祛風治痿之藥更加麻木發熱體軟痰湧腿膝拘痛口噤語澀頭目暈重口角流涎身如蟲行搔起白屑薛曰臂麻體軟脾無用也痰涎自出脾不能攝也口斜語澀脾氣傷也頭目暈重脾氣不能升也癢起白屑脾氣不能營也遂用補中益氣加神曲半夏茯苓三十餘劑諸症悉退又用參术煎膏治之而愈顧憲幕飲食起居失宜左半身並手不遂汗出神昏痰涎上湧用參茋大補之劑汗止而神思漸清頗能步履後不守禁左腿自膝至足腫脹甚大重墜如石痛不能忍其痰甚多肝脾腎脈洪大而數重按則軟澀朝用補中益氣加黃柏知母麥門五味煎送地黃丸晚用地黃丸料加黃柏知母數劑諸症悉退但自弛禁不能全愈耳一男子時瘡愈後遍身作痛服愈風丹半身不遂痰涎上湧夜間痛甚薛作風客淫氣治以地黃丸而愈風客淫氣精乃亡邪傷肝也補腎即補肝一老婦兩臂不遂語言蹇澀服祛風之藥筋攣骨痛此風藥虧損肝血益增其病也薛用八珍湯補其氣血用地黃丸補其腎水佐以愈風丹而愈一婦人因怒吐痰胸滿作痛服四物二陳芩連枳殼之類不應更加祛風之劑半身不遂筋漸攣縮四肢痿軟日晡益甚內熱口乾形體倦怠薛以為鬱怒傷肝脾氣血復損而然遂用逍遙散補中益氣湯六味地黃丸調治喜其謹疾年餘愈一婦人脾胃虛弱飲食素少忽痰湧氣喘頭搖目劄手揚足擲難以候脉觀其面色黃中見青此肝木乘脾土用六君加升麻柴胡治之而蘇更以補中益氣加半夏調理而痊一婦人懷抱鬱結筋攣骨痛喉間似有一核此症甚多服烏藥順氣散等藥口眼喎斜臂難伸舉痰涎愈甚內熱晡熱食少體倦薛以為鬱火傷脾血燥生風所致用加味歸脾湯二十餘劑形體漸健飲食漸加又服加味逍遙散十餘劑痰熱少退喉核少利更用升陽益胃湯數劑諸症漸愈但臂不能伸此肝經血少用地黃丸而愈藥劑多寡其法妙妙車駕王用之卒中昏憒口眼喎斜痰氣上湧咽喉有聲六脈沈伏中隂此真氣虛而風邪所乘以三生飲一兩加人參一兩煎服即蘇若遺尿手撒口開鼾睡為不治用前藥亦有得生者夫前飲乃行經絡治寒痰之藥有斬關奪旗之功每服必用人參兩許駕驅其邪而補助真氣否則不惟無益適足以取敗矣觀先哲用茋附參附等湯其義可見曾公談録荆芥穗為末以酒調下二三錢凡中風者服之立愈前後甚驗是時順兒疾已革以酒滴水中調服之立定真再生也江篁南治休寧臨塘范本濟邑尹之內年五十餘夜間卒然暈倒在竈前口眼喎斜口角涎流初不知人少間略省面前要火燻灼乃以南星半夏陳皮川芎枳殼僵蠶天麻參茋甘草等藥至夜半汗出不止復昏暈甚手足抽掣乃以人參八錢黃茋五錢防風一錢附子七分與之作二三次服踰時吐出藥少許併查飲之不吐汗收斂次早頗能言右手能動舉苦頭痛及遍身痛以人參四錢白术陳皮歸芎南星各一錢半夏一錢半白芷七分荆穗秦芁蔓荆子各五分甘草三分加竹瀝薑汁夜半因惱怒復暈移時至次早頭痛未解要人以手按痛處稍安時時欲人執持兩手以人參二錢半夏一錢五分白术歸芎南星陳皮白芷荆穗甘草各一錢細辛二分是日頭痛稍減晚間復服一劑續加天麻蔓荆子之類出入調治一月而愈江應宿治淮商朱楓野年五十二歲患中風月餘逆豫診視六脈滑數弦長重按無力口角涎流言語蹇澀飲食作嘔此七情內傷熱勝風動之症調以六君秦艽天麻芩連瓜蔞薑汁竹瀝補以六味丸風熱漸退手能作字家眷逺來以為飲食少欲求速效請京口一醫投十六味流氣飲繼進滚痰三錢豫曰必死是藥矣預煎人參一兩候至夜分果大㵼神脫厥去不知人豫自持參湯灌之復蘇豫遂辭歸白下越旬日而訃音至惜哉此商而儒行者本虛病誤投下藥是犯虛虛之戒休寧程少溪賈秣陵城年四十八歲三月初旬往茅山進香衣著單薄中途遇雨衣服盡濡止宿旅舍帶濕睡卧回入城患中風左手足不遂口眼歪斜言語蹇澀面腫流涎口開眼合手撒喉如拽鋸汗出如油厄逆不定昏憒頭痛如破煩躁不寧諸醫環視議作風痰投以二陳加枳實瓜蔞芩連膽星三四日殊無退症逆豫診視六脉浮大弦滑重按豁然右大於左一倍此平日酒色過度兼之外感風邪臟腑俱受病而陽明經居多投白虎加小續命湯明醫雜著白虎配附子理中此以白虎合小續命二法俱妙一匕而厄逆止口閉涎收再二劑眼開呼吸和而諸症遞減脈始斂兩手停勻已踰險處豫有事暫回一二輩流言病症雖減人參附子乃劫藥若多服恐留熱毒在中遂易醫仍服二陳加寒涼二十餘劑頓然如舊反加鼻瘡目眥赤爛胸乳脹痛煩躁益盛復召豫診視皆虛熱無根之火乃用六味丸料加參附麥門五味元參知母二服安然頭痛除而虛熱減謗又至云參茋必不可服病家疑固不肯用豫固辭既不用參吾無竒術矣然二陳芩連雖不去病亦無傷也但不可輕用下痰峻利丸散不補正氣必成癱瘓可延歲月耳遂歸不復往宿按中風有真中類中之不同世人因名而迷其實昔人主乎風河間主火東垣主氣丹溪主濕未嘗外風而言但云致病之因豈可偏廢昔人主風者乃外感之風邪為真中風以立名三子曰火曰氣曰濕乃挾內傷為類中本氣所自病也名同而實異經曰蒼天之氣清靜則志意治順則陽氣固雖有大風痾毒弗能害也是故邪之所凑其氣必虛夫人年踰四旬陽明脈衰於上面焦髮白隂氣衰於下將息失宜腎水虛衰心火暴盛無制而成天地不交之否加之七情悒鬱憂思忿怒傷其氣者多有此症氣虛卒倒曰氣厥卒厥尸厥寒厥風痱風懿中濕即中氣之隂症虛病脉必沉伏緩弱身涼少痰涎手足不偏廢治宜豁痰開鬱先以蘇合丸次以二陳四君調以補中益氣加桂附扶虛行氣則風從氣運而散有風熱痰火曰痰厥食厥暑風漏風即中氣之陽症內實脈必弦數或洪大弦滑有力可從子和三法所謂熱勝風動之症調以通聖辛涼補血滋隂潤肝緩氣風熱自退若年高虛熱者脈雖弦數而虛弱無力又忌汗吐調從丹溪二陳加芩連羌防瓜蔞薑汁竹瀝若真中風邪東垣中經中血脈中腑中臟外有六經形症偏枯痿易癱瘓不隨脉必浮弦緊盛中腑者多著四肢中臟者多滯九竅中腑者以小續命湯隨六經加減通經發散入臟則內有便溺之阻輕則導滯丸麻仁丸重則三化湯通其壅塞或外無六經之證內無便溺之阻肢不能舉口不能言此中經也宜大秦芁湯補血以養筋以上三中諸般種種輕重不同豈可不審寒熱虛實內外有無傷感所挾真中類中混同施治概以二陳芩連損真之劑專治痰火鮮不敗事表而出之以俟知者孫斗華赴試南都六月初旬夢遺畏寒驚懼重裘厚被取汗過多身熱六脈滑數無力與清暑益氣湯誤次日舌强語言不清如顛目瞪不識人琇按汗過多身熱陽盛也又以風藥氣藥鼓火上行故見症如是與人參白虎湯加膽星僵蠶秦芁天麻薑汁竹瀝漸愈數日後舌心黑如墨與黃連解毒湯涼膈散㵼心湯不退與犀角地黃湯而愈此暑風類中若舌心黑而投參附或大黃俱不救當思解毒虛風江應宿治大司成許潁陽公頭振動搖診得六脈沈緩左關尺散軟無力即告之曰此虗風候也公乃日侍經筵矜持大過傷損肝腎二經之血分耳經曰諸風掉眩皆屬於肝義曰恐傷腎恐懼不已則火起於腎而銷鑠精血腎水一虧則心火暴盛無制故曰諸逆衝上皆屬於火風火相扇而掉搖治療之法惟宜養血順氣氣行而痰自消血榮而風自滅矣為製養血膏一料枸把為君參茋歸术為臣天麥二冬為使更製定振丸酒煮黃連薑製半夏為君四物養血為臣參茋白术為佐天麻秦芁靈仙荆防全辛為使蜜丸晝用養血膏夕服定振丸月餘獲效三越月漸愈浙商朱鶴子年九歲忽患手足抽掣動搖弄舌吐沫面白唇青不發熱作陽虛諸醫或作風治驚治火治痰治雜進珠犀金石牛黃琥珀蜈蚣全蝎等藥幾殆豫診視右手三部沈弱無力左手滑大論脈則虛痰此脾虛生風之症理宜大補用歸脾湯加桂附一七搐定减去桂附大劑參茋六服全愈虛風有隂陽之異前案為精血之虛曰隂虛後案為元氣之虛曰陽虛隂虛者涼肝補腎陽虛者溫肺健脾若作風治是犯虛虛之戒傷風丹溪治金得年三十八歲面色青白患傷風身熱大便不通小柴胡湯加羌活枳殼桃仁麻子仁各七分此等案俱見症治病一人黑色能飲酒患傷風頭疼身疼加火熱骨痛無比不喫飯人參敗毒散加乾葛盧正一年四十五歲患傷風腰疼身熱飲水小柴胡湯加杜仲牛膝天花粉連翹乾葛王成三患傷風腹㵼百二十來度五苓散加白术三錢前胡八分羌活一錢風能勝濕蒼术二錢神曲炒一錢方愷三患傷風心疼敗毒散加山梔炒九分白芍一錢五分草豆蔲一錢五分木香煨一錢祝顯一患傷風小便白濁無度小柴胡湯加黃柏知母白术芍藥當歸各一錢蓮肉去心皮一錢秋石八分薛立齊治鴻臚蘇龍溪患傷風咳嗽氣喘鼻塞流涕用參蘇飲一劑以散寒邪更用補中益氣湯以實腠理而愈後因勞怒仍作自用前飲益甚加黃連枳實腹脹不食小便短少服二陳四苓前症愈劇小便不通薛曰脾脹不食脾胃虛也小便短少肺腎虛也悉因攻伐所致投以六君加黃茋炮薑五味二劑諸症頓退再用補中益氣加炮薑五味數劑全愈僉憲阮君聘患傷風咳嗽面白鼻流清涕此脾肺虛而兼外邪用補中益氣加茯苓半夏五味治之而愈又用六君芎歸之類而安吳江史安卿子傷風用表散化痰之藥反痰盛咳嗽肚腹膨脹面色㿠白此脾肺俱虛用六君子加桔梗一劑頓愈至三日前症又作鼻流清涕此復傷風也仍用前藥加桑皮杏仁而愈史元年子喘嗽胸腹膨脹泄㵼不食此飲食傷脾土而不能生肺金也用六君子湯一劑諸症頓愈宿曰余每治傷風外感而無內傷者但用九味羌活湯參蘇飲無不立愈豫自感冒必補中氣而外邪始解可見人之禀賦萬有不齊豈可一例表散今觀薛案與豫元氣弱者吻合於此虛實可見迵風迵與洞同謂洞徹也淳于意治齊淳于司馬病切其脈告曰當病迵風迵風之狀飲食下嗌輒後之病得之飽食而疾走淳于司馬曰我之王家食馬肝食飽甚見酒來即走去驅疾至舍即泄數十出臣意告曰為火齊米汁飲之七八日而當愈琇按其人必內火素盛又食過飽而疾馳食乃奔迫而下食去腸虛氣復流聚故食入則氣迫輒後若洞徹然以黃連㵼火米汁補脾而愈凡治火迫下泄用之甚驗時醫秦信在旁臣意去謂左右閣都尉曰意以淳于司馬病為何曰以為迵風可治信即笑曰是不知也淳于司馬病法當後九日死琇按信誤以病同趙章斷以為死亦高手也即後九日不死其家復召臣意意往問之盡如意診臣即為一火齊米汁使服之七八日病已所以知之者診其脈時切之盡如法其病順故不死史記陽虛侯相趙章病召臣意衆醫以為寒中臣意診其脈曰迵風迵風者飲食下嗌而輒出不留法曰五日死而後十日乃死病得之酒琇按酒傷陽明太隂濕熱久從火化三隂生氣竭絶故洞泄而死也所以知趙章之病者臣意切其脈脈來滑是內風氣也飲食下嗌而輒出不留者法五日死皆為前分界法後十日乃死所以過期者其人嗜粥故中藏實中藏實故過期師言曰安榖者過期不安榖者不及期史記沓風附漏風琇按素問風論飲食中風則為漏風又外在腠理則為泄風安陽武都里成開方自言以為不病臣意診之謂病苦沓風三歲四肢不能自用使人瘖失音也瘖即死今聞其四肢不能用瘖而未死也病得之數飲酒以見大風氣琇按經云肺熱葉焦則生痿躄兹謂飲酒見大風氣是肺為風邪所傷故痿而失音也又云脾病而四肢不用則脾土亦為酒溼所傷矣所以知成開方病者診之其脈法竒咳言曰藏氣相反者死切之得腎反肺琇按澀而短也法曰三歲死也史記江少微治黃三輔年逾四旬醉飲青樓夜卧當風患頭疼發熱自汗盜汗飲食不進醫治十餘日罔效診得六脈浮洪重按豁然飲酒當風名曰漏風投以白术澤㵼酒煎而熱退汗仍不止心口如水此思慮所致與歸脾湯加麻黃根桂枝十數服而愈頭痛不已用白蘿蔔汁吹入鼻中立止中寒琇案中寒以直中三隂為是諸案惟富翁吳僕二症近之餘皆感寒非中寒也羅謙甫治參政商公年六旬餘原有胃虛之證至元己巳夏上都住時值六月霖雨大作連日不止因公務勞役過度致飲食失節每旦則臍腹作痛腸鳴自利須去一二行乃少定不喜飲食懶於言語身體倦困羅診其脈沈緩而弦參政以年高氣弱脾胃素有虛寒之證加之霖雨及勞役飲食失節重虛中氣難經云飲食勞倦則傷脾不足而往有餘隨之若歲火不及寒乃大行民病鶩溏今脾胃正氣不足腎水必挾木勢反來侮土乃薄所不勝乘所勝也此疾非甘辛大熱之劑則不能㵼水補土捨時從症雖夏暑之時有用熱逺熱之戒又云有假者反之是從㩲而治其急也內經云寒淫於內治以辛熱乾薑附子辛甘大熱以㵼寒水用以為君脾不足者以甘補之人參白术甘草陳皮苦甘溫以補脾土胃寒則不欲食以生薑草豆蔲辛溫治客寒犯胃厚朴辛溫厚腸胃白茯苓甘平助薑附以導寒濕白芍藥酸微寒補金㵼木以防熱傷肺氣為佐也不數服良愈琇按此症是中寒謂中氣虛寒非中寒也吳球治一人暑月逺行渴飲泉水至晚以單席隂地上睡頃間寒熱吐㵼不得身如刀刮而痛寒症可知醫曰此中暑也進黃連香薷飲一服次以六和湯隨服隨厥吳診其脈細緊而伏曰此中寒也衆皆笑曰六月中寒有是事乎吳曰人肥白素畏熱好服涼劑況逺行途中飲水必多今單席卧地夏月伏隂深中寒氣當以附子理中湯大服乃濟捨時從症病者曰吾在家夏常服金花黃連丸今途中多服益元散及瓜水因得此患吳曰此果然也用之甚效按張仲景云夏月陽氣在表胃中虛冷故欲著腹衣今人酷熱日取風涼夜多失蓋飲水食瓜果多服涼劑或以井泉浴體久而不成患者鮮矣一富翁患中寒隂症名醫盈座最後延御醫吳至診之曰非附子莫救但忘攜來令人之市揀極重者三枚生切為一劑計重三兩投之衆醫吐舌潛裁其半以兩半為劑進之病遂已吳復診曰何減吾成藥也問之知減其半曰噫嘻吾投三枚將活三年也今止活年半耳後年餘復病而卒脈藥之神如此江應宿見一木商自云曾經五月放樹久立風雨濕地衣服盡濡患寒熱交作遍身脹痛欲人擊打莫知為何病服藥罔效忽思燒酒熱飲數杯覺腹中寬快數飲至醉良愈此中寒濕醫莫能察識耳饒州吳上舍僕年踰二十患小腹卒痛四肢厥冷江診得六脈沈伏此中寒隂症投附子理中湯一七而愈中熱琇按中字宜作平聲為是蓋內熱病即經云熱中是也中熱多在盛夏名曰中暍其病甚暴今以中為中誤列中熱門淳于意治齊王侍醫遂病自鍊五石服之臣意往過之遂謂意曰不肖有病幸診遂也臣意即診之告曰公病中熱論曰中熱不溲者不可服五石石之為藥精悍公服之不得數溲亟勿服色將發癰遂曰扁鵲曰隂石以治隂病陽石以治陽病夫藥石者有隂陽水火之齊故中熱即為隂石柔齊治之中寒即為陽石剛齊治之臣意曰公所論逺矣扁鵲雖言若是然必審診起度量立規矩稱權衡合色脉表裏有餘不足順逆之法參其人動靜與息相應醫法之妙盡矣乃可以論論曰陽疾處內隂形應外者不加悍藥及鑱石夫悍藥入中則邪氣辟矣而宛氣愈深琇按觀此則為熱中無疑與隂虛火熾人服桂附初少愈後乃不治同診法曰二隂應外一陽接內者不可以剛藥剛藥入則動陽隂病益衰陽病益著邪氣流行為重困於俞忿發為疽意告之後百餘日果為疽發乳上琇按肝胃熱燥故疽發乳上入缺盆死此謂論之大體也必有經紀拙工有一不習文理隂陽失矣琇按重見癰疽門傷寒琇案傷寒皆祖仲景仲景原本素問熱論又案冬月為正傷寒春為溫病夏為熱病症雖略同治應稍異南史記范雲初為陳武帝屬官武帝有九錫之命雲忽感傷寒恐不得預慶事召徐文伯診視問曰可便得愈乎文伯曰便瘥甚易正恐二年後不復起耳雲曰朝聞道夕死可矣況二年乎文伯於是先以火煅地布桃柏葉設席置雲其上頃刻汗出以溫粉裛之翌日遂愈雲甚喜文伯曰不足喜後二年果卒夫取汗先期尚促夀限況不顧表裏不待時日便欲速愈者耶今病家不耐病病未三四日晝夜督汗醫者隨情順意鮮不致害故書此為戒木事方許學士叔微云一鄉人傷寒身熱大便不通煩渴鬱冒醫者以巴豆藥下之頃得溏利宛然如舊豫視之陽明結熱在裏非大柴胡承氣等不可巴豆止去積不能蕩滌邪熱藴毒亟進大柴胡等三服得汗而解以下作汗亦是一法一鄉人邱生者病傷寒許為診視發熱頭痛煩渴脉雖浮數而無力尺以下遲而弱許曰雖麻黃證而尺遲弱仲景云尺中遲者榮氣不足血氣微少未可發汗用建中湯加當歸黃茋令飲翌日脉尚爾其家煎迫日夜督發汗藥言幾不遜矣許忍之但只用建中調榮而已至五日尺部方應遂投麻黃湯啜二服發狂須臾稍定略睡已得汗矣信知此事為難仲景雖云不避晨夜即宜便治醫者須察其表裏虛實待其時日若不循次第暫時得安虧損五臟以促夀限何足貴也一人病發熱惡寒自汗脉浮而微弱三服桂枝湯而愈此方在仲景一百十三方內獨冠其首今人全不用惜哉仲景云太陽中風陽浮而隂弱陽浮者熱自發隂弱者汗自出澀澀惡風淅淅惡寒翕翕發熱宜桂枝湯此脉與證仲景說得甚分曉止是人看不透所以不敢用仲景云假令寸口脈微名曰陽不足隂氣上入陽中則灑淅惡寒也尺脈弱名曰隂不足陽氣下陷入隂中則發熱也此謂元受病而然也又曰陽微則惡寒隂弱則發熱醫妄汗之使陽氣微太下之令隂氣弱此所謂醫所病而然也大抵隂不足陽往從之故內陷而發熱陽不足隂往乘之故隂上入陽中則惡寒舉此二端明白何憚而不行桂枝哉一人病傷寒身熱頭痛無汗大便不通已四五日醫者將治大黃朴硝等下之許曰子姑少待豫為視之脈浮緩卧密室中自稱甚惡風許曰表證如此雖大便不通數日腹不脹别無所苦何遽便下之大抵仲景法須表證罷方可下不爾則邪乘虛入不為結胸必為熱痢也作桂枝麻黃各半湯繼之以小柴胡漐漐汗出大便亦通而解仲景云凡傷寒之病多從風寒得之始表中風寒入裏則不消矣擬欲攻之當先解表乃可下之若表已解而內不消大滿大堅實有燥屎自可徐下之雖四五日不能為禍也下不嫌遲若不宜下而便攻之內虛熱入協熱遂利煩躁之變不可勝數輕者困篤重者必死矣一丈夫因入水發熱倦怠以白术陳皮乾葛蒼术各二錢人參川芎各一錢五分生茋一錢甘草些少分作三貼服愈琇案此丹溪案宜入濕門一人年近五十大便下血脉來沉遲澀面黃神倦者二年矣九月間因勞倦發熱已自服參蘇飲兩貼熱退續早起過勞遇寒兩手背與面紫黑有一人新昏手背與面紫黑而大小便不通用溫補藥不救昏仆少頃復蘇大發熱妄語口渴身痛至不可眠脈之三部不調微帶數重取虛豁左大於右朱以人參二錢五分帶節麻黃黃茋各一錢白术二錢當歸身五分與五貼得睡醒來大汗如雨遂安兩日後再發熱脅痛咳嗽若睡時嗽不作而妄語且微惡寒診其脈似前而左略帶緊許曰此體虛再感寒也再與前藥加半夏茯苓十餘貼再得大汗而安身倦至不可久坐不思食用補中益氣湯去涼藥加神曲半夏宿砂五七十貼而安烺按此丹溪案原刻誤許學士一士人家病者二人皆旬日矣一則身熱發汗大便未通小便如經神昏如睡診其脈長大而虛用承氣下之而愈一則陽明自汗大便不通小便利津少口乾燥其脈亦大而虛豫作蜜兑三易之下燥屎得溏利而解一人患傷寒目痛鼻乾不得卧大便不利尺寸脈俱大已數日一夕汗出許謂速以大柴胡下之醫駭曰陽明自汗出津液已漏法當用蜜兑果然穩當何須用大黃藥許謂曰子只知把穩若用大柴胡此仲景不傳之妙子殆未知也乃竟用大柴胡二貼而愈仲景論陽明之病多汗者急下之人多謂已是自汗若下之豈不表裏俱虛又如論少隂云少隂病一二日口乾燥者急下之人多謂病發於隂得之日淺但見乾燥若更下之豈不隂氣愈盛舉斯二者則其疑惑者不可勝數此仲景之書世人罕讀也豫謂不然仲景稱急下之者亦猶急當救表急當救裏耳凡稱急者有三處謂才覺汗未至津液乾燥便速下之則為捷徑免致用蜜兑也若胸中識得了了自無可疑若未能了了誤用之反不若蜜兑為穩也一士人得太陽症因發汗汗不止惡風小便澀腎與膀胱為表裏故惡風而小便澀也所以用桂枝加附子足攣屈而不伸診其脈浮而大浮為風大為虛許曰在仲景方中有兩證大同而小異一則小便難一則小便數用藥少差有千里之失仲景第七證云太陽病發汗遂漏不止其人惡風小便難四肢微急難以屈伸者桂枝加附子湯第十六證云傷寒脉浮自汗出小便數脉浮自汗表也小便數邪已入裏故不可攻表心煩微惡寒腳攣急反以桂枝湯攻表此誤也得之便數咽中乾煩躁吐逆十六證仲景本文便厥咽乾云云處以甘草乾薑湯桂須與本文參看惡風用桂枝湯惡寒則不可用桂所以小便數在仲景治以甘草乾薑湯一則漏風漏不止惡風小便難一則自汗小便數或惡風或惡寒病各不同也豫用第七證桂枝加附子湯三啜而汗止佐以甘草芍藥湯足便得伸侯輔之病脉極沉細內寒外熱肩背胸脅癍出十數㸃語言狂亂或曰發斑譫語非熱乎許曰非也陽為隂逼上入於肺傳之皮毛故癍出神不守舍故錯語如狂非譫語也肌表雖熱以手按之須臾冷透如冰認症精確與薑附等藥數日約二十餘兩後得大汗而愈後因再發脉又沉遲三四日不大便與理中丸用理中丸作下法妙三日內約半斤其疾全痊侯生之狂非陽狂之狂乃失神之狂即隂虛也一人病傷寒大便不利日晡發潮熱手循衣縫兩手撮空直視喘急更數醫矣見之皆走此誠惡候得此者十中九死仲景雖有症而無治法但云脉弦者生澀者死已經吐下難於用藥謾且救之若大便得通而脉弦者庶可治也與小承氣湯一服而大便利諸疾漸退脉且微弦半月愈或問曰下之而脉弦者生此何謂也許曰金匱玉函云循衣妄撮怵惕不安微喘直視脉弦者生澀者死微者但發熱譫語承氣湯主之豫嘗觀錢仲陽小兒直訣云手循衣領及捻物者肝熱也此證在玉函列於陽明部蓋陽明者胃也肝有熱邪淫於胃經故以承氣瀉之且得弦脉則肝平而胃不受尅所以有生之理讀仲景論不能博通諸醫書以發明其隱奧専守一書吾未見其能也嘗治循衣撮空得愈者數人皆用大補氣血之劑也惟一人兼瞤振脉代遂於補劑中加桂二分亦振止脉和而愈一人病傷寒初嘔吐俄為醫者下之已七八日而內外發熱仲景本文有背微惡寒句須看吳氏注許診之曰當用白虎加人參湯或曰既吐復下宜重虛矣白虎湯可用乎許曰仲景云若吐下後七八日不解熱結在裏表裏俱熱者仲景本文有時時惡風句時時二字須看成注白虎加人參湯正相當也蓋始吐者熱在胃脘而脉至今虛大三投湯而愈仲景既稱傷寒若吐下後七八日不解熱結在裏表裏俱熱者白虎加人參湯主之又云傷寒脈浮發熱無汗其表不解不可與白虎湯又云脉浮滑表邪已化為熱邪未入裏故脉浮滑俱係陽明在經症亦須看成注此以表有熱裏有寒琇案喻嘉言謂寒字當作痰字解白虎湯主之國朝林億校正謂仲景於此表裏自差矣豫謂不然大抵白虎能除傷寒中暍表裏發熱故前後二證或曰表裏俱熱或云表熱裏寒皆可服之一種脈浮無汗其表不解全是麻黃與葛根證安可行白虎也林億見所稱表裏不同便謂之差是亦不思之過也海藏治秦二母病太隂病三日不解後嘔惡心而脉不浮醫與半硫丸二三服不止復與黃茋建中湯脉中極緊諸緊為寒無表裏病胸中大熱發渴引飲皆曰陽證欲飲之水王反與薑附等藥緊脉反沈細陽猶未生以桂附薑烏之類酒丸與百丸接之二日中十餘服病人身熱煩躁不寧欲作汗也又以前丸接之覆以厚衣陽脉方出而作大汗翌日大小便始通下瘀血一盆如豚肝然用胃風湯加桂附三服血止其寒甚如此亦世之希見也烺按原刻誤作許案一人病傷寒心煩喜嘔往來寒熱醫以小柴胡與之不除許曰脉洪大脈洪大非小柴胡可知而實熱結在裏小柴胡安能去之仲景云傷寒十餘日熱結在裏復往來寒熱者與大柴胡湯三服而病除大黃蕩滌藴熱傷寒中要藥王叔和云若不用大黃恐不名大柴胡須是酒洗生用為有力一舟子病傷寒發黃鼻內痠痛身與目如金色小便赤而數大便如經琇按醫學綱目作如常或欲用茵陳五苓許曰非其治也小便利大便如常則知病不在臟腑綱目無腑字今眼睛疼鼻痠痛綱目作眼睛鼻頞痛是病在清道中清道者華蓋肺之經也若下大黃則必腹脹為逆用瓜蒂散先含原刻食水次搐之鼻中黃水盡乃愈一人病傷寒脉浮而長喘而胸滿身熱頭痛腰脊强鼻乾不得卧許曰太陽陽明合病仲景法中有三證下利者葛根不下利嘔逆者加半夏喘而胸滿者麻黃湯也治以麻黃湯得解一武官為寇執置舟中􅀈板數日得脫乘飢恣食良久解衣捫虱次日遂傷寒自汗而膈不利一醫作傷食而下之一醫作解衣中邪而汗之雜治數日漸覺昏困上喘息高許診之曰太陽下之表未解微喘者桂枝加厚朴杏仁湯此仲景法也指令醫者急治藥一啜喘定再啜漐漐汗出至晚身涼而脉已和矣醫曰某平生未嘗用仲景方不知其神捷如此一人年三十初得病微汗脉弱惡風醫以麻黃藥與之汗遂不止發熱心多驚悸夜不得眠譫語不識人筋惕肉瞤振振動搖醫又進鎮心藥許曰强汗之過也仲景云脈微弱汗出惡風不可服青龍湯服之則筋惕肉瞤此為逆也惟真武湯可救遂進三服繼以清心丸竹葉湯數日遂愈一人病傷寒八九日身熱無汗時時譫語時因下後大便不通三日矣非躁非煩非寒非痛晝夜不得卧但心中無曉㑹處或時發一聲如歎息之狀醫者不省是何證許診之曰此懊憹怫鬱二證俱作也胃中有燥屎者承氣湯下燥屎二十餘枚得利而解琇按身熱無汗似大柴胡較勝仲景云陽明病下之心下懊憹微煩胃中有燥屎者可攻又云病者小便不利大便乍難乍易時有微熱怫鬱不得卧者有燥屎也承氣湯主之素問云胃不和則卧不安此夜所以不得眠也仲景云胃中燥大便堅者必譫語此所以有時發譫語也非躁非煩非寒非痛所以心中懊憹也聲如歎息而時發一聲所謂外氣怫鬱也燥屎得除大便通利胃中安和故其病悉去也一人得疾六脉沈伏不見深按至骨則弱緊有力頭疼脈沈為隂然隂證無頭痛亦可升陽行經身溫煩躁指末背冷胸中滿惡心更兩醫矣醫者不識止投調氣藥許因診視曰此隂中伏陽也仲景法中無此證世人患此者多若用熱藥以助之則為隂所隔絶不能導引真陽反生客熱用冷藥則所伏真火愈見銷鑠須用破散隂氣導達真火之藥使火升水降然後得汗而解乃授以破隂丹方見醫學綱目隂毒類二百粒作一服冷鹽湯下不半時煩躁狂熱手足躁擾其家大驚許曰俗所謂換陽也須臾稍定略睡身少汗自昏達旦方止身涼而病除一婦人狐惑聲嗄多眠目不閉目不閉聲啞為狐惑手足不冷宜先豁痰惡聞食臭不省人事者半月非痰不能待至半月後又手足拘强脈數而微細先與竹瀝薑汁一盞服之忽胸有汗腹鳴即目閉省人事遂用參术歸陳入竹瀝薑汁飲之五六貼全愈作痰而協虛李東垣治一人二月病傷寒發熱醫以白虎湯投之病者面黑如墨隂氣上溫於陽中故色黑與羅謙甫案同一治法本證不復見脉沈細小便不禁奈初不知用何藥及診之曰此立夏前誤用白虎之過白虎湯大寒非行經之藥止能寒臟腑不善用之則傷寒本病曲隱於經絡之間或更以大熱之藥救之以苦隂邪則他證必起非所以救白虎也有溫藥之升陽行經者吾用之升陽行經藥乾葛升麻防風白芷參茋蒼术白芍甘草有難者曰白虎大寒非大熱何以救君之治奈何李曰病隱於經絡間陽不升則經不行經行而本證見矣又何難焉果如其言而愈馮氏子年十六病傷寒目赤而煩渴似熱脉七八至醫欲以承氣湯下之已煮藥而李適從外來馮告之故李切脈大駭曰幾殺此兒內經有言在脈諸數為熱諸遲為寒今脈八九至是熱極也殊不知至真要大論曰病有脈從而病反者何也岐伯曰脈至而從按之不鼓諸陽皆然王注云言病熱而脈數按之不動乃寒盛格陽而致之非熱也此傳而為隂症矣此等案熟玩精思目博按醫學綱無此句令持薑附來吾當以熱因寒用之法治之藥未就而病者爪甲已青頓服八兩汗漸出而愈博案此案原刻微誤按此與王海藏治狂言發癍身熱脈沈細隂證例同東垣又有治腳膝痿弱下凥臀皆冷隂汗臊臭精滑不固脈沈數有力為火鬱於內逼隂向外為陽盛拒隂用苦寒藥下之者妙妙此水火徵兆之微脈證治例之妙王太僕曰紀於水火餘氣可知羅謙甫治靜江府提刑李君長子年十九歲至元壬午四月間病傷寒九日醫作隂症治之與附子理中丸數服其症增劇更一醫作陽症議論差互不敢服藥决疑於羅羅至賓客滿坐羅不敢直言證細為分解凡陽症者身須大熱而手足不厥卧則坦然起則有力不惡寒反惡熱不嘔不㵼渴而飲水煩躁不得眠能食而多語其脈浮大而數者陽證也凡隂證者身不熱而手足厥冷惡寒踡卧面向壁卧惡聞人聲或自引衣蓋覆不煩渴不欲食小便自利大便反快其脈沈細而微遲者皆隂症也某傷寒診其脈沈數得六七至夜呌呼不絶夜字妙辨在此全不得睡陽明在府又喜飲冰水陽證悉具且三日不見大便隂症自利多宜急下之乃以酒煨大黃六錢炙甘草二錢芒硝五錢煎服至夕下數行去燥糞二十餘塊是夜汗大出次日身涼脈靜矣豫思素問熱論云治之各通其臟腑仲景述傷寒論六經各異傳變不同活人書亦云凡治傷寒先須明經絡不識經絡觸途冥行鮮不誤矣一人患傷寒無汗惡風項既屈而且强羅曰項强几几葛根湯證或問何謂几几羅曰几几者如几人疾屈而强也謝復古謂病人羸弱須憑几而起誤也蓋仲景論中極有難曉處振振欲劈地心中懊憹外氣怫鬱鬱冒不仁膈內拒痛如此之類甚多成無已注几音殊几几為短羽鳥引頸之貌甚得仲景㫖烺按此許叔微案南省參議常德甫至元甲戌三月間赴大都路感傷寒證勉强至真定館於常參謀家遷延數日病不瘥總府李經歷并馬録事來求治羅診得兩手脈沈數外證却身涼四肢厥逆發瘢微紫見於皮膚唇及齒齦破裂無色毒咽乾聲嗄默默欲眠目不能閉目不閉聲啞為狐惑精神鬱冒反側不安此證乃熱深厥亦深變成狐惑其證最急詢之從者乃曰自內邱縣感冒頭痛身體拘急發熱惡寒初起原從太陽經來醫以百解散發之汗出浹背殊不解每經郡邑治法一同發汗極多遂至於此羅詳其說謂平昔膏粱積熱於內已燥津液又兼發汗過多津液重竭因轉屬陽明故大便難也急以大承氣下之手足冷大便閉宜先下得更衣再用黃連解毒湯病減大半復與黃連犀角湯數日而安至元己巳六月羅住夏於上都僉事董彥誠年踰四旬因勞役過甚煩渴不止極飲潼乳又傷冷物遂自利腸鳴腹痛四肢逆冷汗自出口鼻氣亦冷六脈如蛛絲時發昏憒溫救何疑衆醫議之以葱尉臍下又以四逆湯五兩生薑二十片連鬚葱白九莖水三升煮至一升去查涼服至夜半氣溫身熱思粥飲至天明而愈玉機真藏論云脈細皮寒氣少泄利飲食不入此謂五虛死漿粥入胃則虛者活信哉一人年五十餘中氣本弱至元庚辰六月中病傷寒八九日醫者見其熱甚以涼劑下之乂食梨三四枚痛傷脾胃四肢冷時昏憒羅診之其脈動而中止有時自還乃結脈舊刻誤熱也心亦悸動吃噫不絶色變青黃精神減少目不欲開石山以目閉而啞不言為脾傷踡卧惡人語少隂症以炙甘草湯治之大便㵼而目閉踡卧手足冷炙甘草湯成無已云補可去弱人參大棗之甘以補不足之氣桂枝生薑之辛以益正氣五臟痿弱榮衛涸流濕劑所以潤之故用麻仁阿膠麥門冬地黃之甘潤經益血復脈通心是也加桂枝人參急扶正氣生地黃減半恐傷陽氣銼一兩劑服之不效羅再思脈病對莫非藥陳腐而不效乎再於市鋪選嘗氣味厚者再煎服之其病減半再服而愈琇按辨藥亦要著凡藥昆蟲草木生之有地根葉花實採之有時失其地性味少異失其時氣味不全又況新陳不同精粗不等倘不擇用用之不效醫之過也內經云司歲備物氣味之専精也修合之際宜加意焉烺按醫學綱目是東垣案真定府趙吉夫年三旬餘至元夏間因勞役飲食失節傷損脾胃時發煩躁而渴又食冷物過度遂病身體困倦頭痛四肢逆冷斷不在臂膝嘔吐而心下痞此厥冷乃熱深厥亦深何也以有頭痛可辨若厥隂頭痛當吐痰沫不當嘔吐蓋嘔吐屬半表半裏者居多或太隂少隂亦有斷無頭痛之症醫者不審見其四肢冷嘔吐心下痞乃用桂末三錢匕熱酒調服仍以綿衣覆之作隂毒傷寒治之汗大出汗後即添口乾舌澀眼白睛紅項强硬肢體不柔和小便淋赤大便祕澀循衣摸牀如發狂狀問之則言語錯亂視其舌則赤而欲裂朝輕暮劇凡七八日家人輩自謂危殆羅診脈七八至知其熱證也遂用大承氣湯苦辛大寒之劑一兩作一服服之利下三行折其勝勢翌日以黃連解毒湯大苦寒之劑二兩使徐徐服之以去其熱三日後病十减五六更與白虎加人參湯約半斤服之㵼熱補氣前證皆退戒以慎起居節飲食月餘漸平復內經曰用藥無失天時無逆氣宜無翼其勝無贊其復是謂至治又云必先歲氣無伐天和當暑氣方盛之時聖人以寒涼藥急救腎水之原補肺金之不足雖有客寒傷人仲景用麻黃湯內加黃芩知母石膏之類恐發黃發斑又有桂枝湯之戒今醫用桂末熱酒調服此逆仲景之治法其誤甚矣省掾曹德裕男婦二月初病傷寒八九日請羅治之脈得沈細而微虛四肢逆冷自利腹痛太隂目不欲開石山以目閉而啞為脾傷兩手常抱腋下昏嗜好口舌乾燥亦手足冷目不欲開口乾燥但自利腹痛從溫補乃曰前醫留白虎加人參湯一貼可服否羅曰白虎雖云治口燥舌乾若執此一句亦未然今此證不可用白虎者有三傷寒論云立夏以前處暑以後不可妄用一也太陽證無汗而渴者不可用二也況病人隂症悉具其時春氣尚寒不可用三也仲景云下利清穀急當救裏宜四逆湯五兩加人參一兩生薑十餘片連鬚葱白九莖水五大盞同煎至三盞去查分三服一日服之至夜利止手足溫翌日大汗而解繼以理中湯數服而愈孫真人習業篇云凡欲為太醫必須諳甲乙素問黃帝針經明堂流注十二經三部九候本草藥性仲景叔和並須精熟如此方為太醫不爾猶無目夜遊動致顛隕執方用藥者可鑒哉吕滄洲治一人病傷寒十餘日身熱而人靜兩手脈盡伏似隂症俚醫以為死也弗與藥吕診之三部舉按皆無其舌胎滑而兩顴赤如火似戴陽語言不亂辨此症全在十餘日若是隂症過七日焉能語言不亂耶況身熱乎因告之曰此子必大發赤癍周身如錦文夫脈血之波瀾也今血為邪熱所搏淖而為癍外見於皮膚呼吸之氣無形可依猶溝隧之無水雖有風不能成波瀾癍消則脈出矣及揭其衾而赤癍爛然即用白虎加人參湯化其癍脈乃復常繼投承氣下之愈一人傷寒旬日辨症全在旬日二字及肌熱灼邪入於陽明俚醫以津液外出為脈虛自汗進𤣥武湯以實之遂致神昏如熟睡吕切其脈皆伏不見而肌熱灼指肌熱灼有少隂反發熱之辨況又脈伏耶然此症何以斷為實熱曰全在旬日二字若是直中隂經虛寒症何能至十日也即曰隂亦屬傳邪隂症非實熱而何告其家曰此必榮血致癍而脈伏非陽病見隂脈比也脈伏不見若是隂寒手足斷無不厥冷之理不見厥逆是實熱可知見癍則應候否則畜血耳乃去其衾裯視其隱處及小腹果見赤癍臍下石堅且拒痛為作化癍湯半劑繼進韓氏生地黃湯逐其血是夕下黑矢若干枚即癍消脈出後三日又腹痛遂用桃核承氣以攻之所下如前乃愈一婦傷寒乃隂間陽面赤足踡而下痢躁擾不得眠論者有主寒主溫之不一不能决吕以紫雪匱理中丸進徐以冰漬甘草乾薑湯飲之愈且告之曰下痢足踡四逆證也苟用常法則上焦之熱彌甚今以紫雪折之徐引甘辛以溫裏此熱因寒用也衆皆歎服浙東憲使曲出道過鄞病卧涵虛驛召吕往視吕察色切脈則面戴陽氣口皆長而弦蓋傷寒三陽合病也以方涉海為風濤所驚遂血菀而神懾為熱所搏遂吐血一升許且脅痛煩渴譫語少陽陽明症適是年歲運左尺當不應其輔行京醫以為腎已絶泣告其左右曰監司脈病皆逆不祿在旦夕家人皆惶惑無措吕曰此天和脈無憂也為投小柴胡湯減參加生地黃半劑後俟其胃實以承氣下之得利愈副樞張息軒病傷寒踰月既下而內熱不已所謂過經不解脅及小腹偏左滿肌肉色不變醫以為風矢所中膏其手摩之浹四旬所其毒循宗筋流入於皋丸赤腫若匏子瘍醫刺潰之而左脅腫痛如故有形可象來召吕診吕以關及尺中皆數滑而且芤因告之曰脈數不時則生惡瘡關內逢芤則內癰作季脅之痛癰作膿也經曰癰疽治之不得法頃時回死下之慎勿晚乃用保生膏作丸衣之以乳香而用硝黃作湯以下之下膿如糜可五升許明日再圊下餘膿立瘥丹溪治一人舊有下疳瘡忽頭疼發熱自汗衆作傷寒治反劇脈弦甚七至重則澀丹溪曰此病在厥隂肝而與證不對以小柴胡加草龍膽胡黃連熱服四貼而安施宗一患傷寒連飲水大碗十數碗小柴胡加花粉乾葛吳支七患傷寒發熱如火口乾要飲水小柴胡去半夏加乾葛花粉黃芩梁本一患傷寒胸脅疼小柴胡加木通枳殼薏苡苡仁本草除筋骨邪入作疼香附芍藥黃進年五十六歲好飲酒患傷寒發熱口乾似火燒補中益氣湯內加雞櫃子八分甘蔗汁二合芍藥地黃汁當歸川芎各一錢服之愈李謹三年三十四歲患傷寒發熱身如蒙刺痛諸痛皆屬肝木以血藥主之四物加生地紅花各八分人參白术黃茋馬敬一患傷寒發熱身癢癢如蟲行皮中以久虛無汗故也小柴胡內加紫背浮萍川芎當歸牡丹皮白芍熟地黃吳亮年六十三歲患傷寒發熱頭痛泄㵼一日一夜二三十度五苓散加白术神麯芍藥砂仁各一錢服之愈作濕症而兼治虛朱寬年四十二歲患傷寒肚腹疼痛發熱如火人參養胃湯內加柴胡煨薑服之愈姜連一患傷寒腰疼左腳似冰小柴胡湯加五味子十二粒黃柏杜仲牛膝唐敬三患傷寒發熱心疼人參養胃湯加知母砂仁草豆蔲各一錢人參養胃湯溫補中配消運之藥邵璠一患傷寒發熱胸疼痛如刀刺半表半裏小腸經也小柴胡加木通前胡燈心小腸為手太陽用小柴胡亦因半表半裏耶疑刋誤小腸當改少陽劉光澤年七十一歲患傷寒頭疼發熱四肢冷如冰局方不換金正氣散加五味子黃茋人參白术當歸身顧曾八年五十二歲患傷寒偏枯四肢不遂手足攣踡濟生方加虎骨酒石斛石榴葉防風虎脛骨當歸茵芋葉杜仲牛膝芎藭苦參金毛狗脊蒼术木通羅光逺年六十三歲患傷寒發熱四肢不隨補中益氣湯而愈周本道年三十七歲患傷寒頭痛略惡寒小柴胡湯加人參白术川芎當歸白芷浦海二患傷寒頭痛人參養胃湯而愈張民一患傷寒發熱頭疼四肢骨痛人參養胃湯加枳殼桔梗邱本三患傷寒發熱四肢倦怠補中益氣湯加柴胡黃芩林信一患傷寒發熱補中益氣湯而愈曹九三患傷寒雙腳攣拳寸步難行補中益氣湯加黃柏知母服之而愈胡文亮年三十五歲好男色患傷寒發熱四肢無力兩膀酸疼小柴胡加四物湯加人參白术服之愈言秉安年五十歲患傷寒發熱四肢厥冷補中益氣湯加五味子木香麥冬丁香七枚孔士能患傷寒發熱四肢無力腰疼小柴胡加白术黃茋五味子天花粉乾葛曹江患傷寒發熱氣喘咳嗽有痰參蘇飲減去紫蘇加麥冬天冬貝母款花白术各等分江亮年三十六歲患傷寒咳嗽夜發晝可作隂虛治之補中益氣湯加天冬麥冬當歸身五味子十五粒貝母許紀年三十九歲患傷寒發熱狂言譫語小柴胡湯加黃連人參白术生甘草作虛熱治高逺年六十一歲患傷寒發熱腹痛腹痛因邪氣與正氣相持則腹痛陽邪痛其痛不常以辛溫之劑和之隂寒痛其痛無休止時宜熱劑救之人參養胃湯加木香白芍藥服之愈方述年四十九歲患傷寒胸熱口乾大便泄㵼數十次五苓散加白术神麯炒白芍麥冬乾葛五味子服之愈與吳亮案同方毛能三患傷寒足冷到膝補中益氣湯加五味子人參一錢五分而愈項太一年二十九歲患傷寒頭痛發熱脅疼四肢疼痛胸脅不止小柴胡湯加羌活桔梗香附枳殼愈許祖一年十一歲患傷寒頭疼發熱自汗連腰痛小柴胡湯加枳殼白术香附木通高陽三年四十五歲患傷寒脅痛膀疼香蘇飲加人參柴胡桔梗香附黃芩按上三十餘證皆是內傷挾外感者可見東南溫暖之方正傷寒百無一二所以傷寒屬內傷者十居九於此可見滑伯仁治一婦暑月身冷身不發熱自汗口乾煩躁欲卧泥水中伯仁診其脈浮而數沈之豁然虛散身冷脈當沈微今浮而數沈取散當溫救所謂捨時從症曰素問云脈至而從按之不鼓諸陽皆然此為隂盛隔陽得之飲食生冷坐卧風露煎真武湯冷飲之一進汗止再進煩躁去三進平復如初一人病傷寒他醫皆以為痓證當進附子持論未决伯仁切其脈兩手沈實而滑四末覺微清以燈燭之遍體皆赤癍舌上胎黑而燥如芒刺身大熱胎黑不可憑為實燥如芒刺則可憑矣身大熱為關鍵神恍惚多譫妄語滑曰此始以表不得解邪氣入裏裏熱極甚若投附必死乃以小柴胡劑益以知母石膏飲之終夕三進次日以大承氣湯下之調理兼旬乃安一人病惡寒發熱頭體微痛苦嘔下泄五日矣其親亦知醫以小柴胡湯治之不解招滑診視脈弦而遲曰是在隂當溫之為製真武湯其親爭之强以人參竹葉湯進進則泄甚脈且陷弱始亟以前劑服之連進四五劑乃效一人病惡寒戰栗持捉不定兩手背冷汗浸淫雖厚衣熾火不能解攖寧滑即與真武湯凡用附六枚一日病者忽出人怪之病者曰吾不惡寒即無事矣或以問滑滑曰其脈兩手皆沈微餘無表裏證此蓋體虛受寒亡陽之極也初皮表氣隧為寒邪壅遏陽不得伸而然也是故血隧熱壅須用硝黃氣隧寒壅須用桂附隂陽之用不同者有形無形之異也潘子庸得感冒證已汗而愈數日復大發熱惡寒頭痛眩暈嘔吐却食煩悶咳而多汗攖寧滑診之脈兩手三部皆浮而緊曰在仲景法勞復證浮以汗解沈以下解今脈浮緊且證在表當汗衆以虛憊難之且圖溫補滑曰法當如是為作麻黃葛根湯三進更汗旋調數日乃愈一人冒雪進涼食病內外傷惡寒頭疼腹心痛而嘔兩感診之脈沈且緊時伏而不見死脈曰在法下利清穀當急救裏清便自調當急救表今所患內傷冷飲食外受寒沴清便自調急救表裏以桂枝湯力微遂為變法與四逆湯服之晬時服附子一兩明日則脈在肌肉唯緊自若外證已去內傷獨存乃以丸藥下去宿食諸緊為寒緊自若寒未去也烏得用丸藥下法以理中丸下方妥後調中氣數日即安一人七月內病發熱或令其服小柴胡湯必二十六劑乃安如其言服之未盡二劑則升發太過多汗亡陽惡寒甚肉瞤筋惕乃請滑診視脈細欲無即以真武湯進七八服稍有緒更服附子七八枚乃愈瓘曰汗多亡陽則內益虛惡寒甚而肉瞤筋惕者裏虛甚而陽未復也故宜真武湯多服附子而效一人病傷寒經汗下病去而人虛背獨惡寒脈細如線湯尉不應滑乃以理中湯劑加薑桂藿附大作服外以蓽撥良薑吳榝桂椒諸品大辛熱為末和薑糊為膏厚敷滿背以紙覆之稍乾即易如是半月竟平復不寒矣此治法之變者也一人病傷寒後勞復發熱自汗經七日或以為病後虛勞將復補之滑曰不然勞復為病脈浮以汗解奚補為以小柴胡湯小柴胡穩三進再汗而安琇按與前潘子庸症同是復感第有微甚之分前曰大熱脈浮緊此曰發熱脈浮故前用麻黃葛根此用小柴胡皆二進而愈王海藏治趙宗顔因下之太過生黃脈沈細遲無力次第用藥至茵陳附子湯大效按海藏次第用藥者謂先投韓氏茵陳茯苓湯次投茵陳橘皮湯次投茵陳附子湯也趙秀才因下之早黃病脈寸微尺弱身冷次第用藥用茵陳四逆湯大效一人患傷寒得汗數日忽身熱自汗脈弦數心不得寧真勞復也琇案此亦復症以脈弦數及心不寧故用補脾湯佐小柴胡與後症犯房勞及前二症俱不同許診之曰勞心之所致神之所舍未復其初而又勞傷其神榮衛失度當補其子益其脾解其勞庶幾得愈授以補脾湯佐以小柴胡湯解之或者難曰虛則補其母今補其子何也許曰子不知虛勞之異乎難經曰虛則補其母實則㵼其子此虛當補母衆所共知也千金曰心勞甚者補脾氣以益之脾王則感之於心矣歸脾湯之學此勞則當補其子人所未聞也蓋母生我者也子繼我而助我者也方治其虛則補其生我者與錦囊所謂本骸得氣遺體受䕃同義方治其勞則補其助我者與荀子所謂未有子富而父貧同義此治虛與勞所以異也本事方本烺案此案原悮王一男子病太陽證尺寸脈俱浮數按之無力王見其內隂虛與神术乾薑湯愈後再病王視之見神不舒垂頭不欲語疑其有房過問之犯房過乎必頭重目眩曰然與大建中三四服外陽內收脈反沈小始見隂候又與已寒加芍藥茴香等丸五六服三日內約服六七百丸脈復生又用大建中接之大汗作而解仍以汗解陶尚文治一人傷寒四五日吐血不止醫以犀角地黃湯等治而反劇陶切其脈浮緊而數若不汗出邪何由解遂用麻黃湯一服汗出而愈養葵先生用之而效以見血即汗汗即血之理或問曰仲景言衄家不可汗亡血家不可發汗而此用麻黃湯何也瓘曰久衄之家亡血已多故不可汗今緣當汗不汗熱毒藴結而成吐血當分其津液乃愈故仲景又曰傷寒脈浮緊不發汗因致衄血者麻黃湯主之蓋發其汗則熱越而出血自止也孫兆治東華門竇大郎患傷寒經十餘日口燥舌乾而渴心中疼自利清水衆醫皆相守但調理耳汗下皆所不敢竇氏親故相謂曰傷寒邪氣害人性命甚速安可以不次之疾投不明之醫乎召孫至曰明日即已不可下今日正當下遂投小承氣湯遂大便通得睡明日平復衆人皆曰此證因何下之而愈孫曰讀書不精徒有書耳口燥舌乾而渴豈非少隂症耶少隂症固不可下豈不聞少隂一症自利清水心下痛下之而愈少隂急下有三條仲景之書明有是說也衆皆欽服一人患傷寒五六日頭汗出陽虛自頸以下無汗不在黃例又非瘀血手足冷心下痞悶大便祕結或者見四肢冷又汗出似隂症滿悶以為隂症許診其脈沈而緊曰此證誠可疑然大便結非虛結也安得多隂脈雖沈緊為少隂證多是自利未有祕結者此辨妙此正半在裏半在表投小柴胡得愈脉沈緊隂脉也四肢冷汗出隂症也只一大便祕斷之為半表半裏非細心明眼不足以語此仲景稱傷寒五六日頭汗出微惡寒手足冷心下滿口不欲食大便硬脈細小者此謂隂微結必有表惡寒復有裏脈沈亦在裏也汗出為陽微假令純隂結不得復有外證無惡寒症悉入在裏此謂半在裏半在外也脈雖沈緊不得為少隂病所以然者隂不得有汗今頭汗出故知非少隂也頭汗出為陽微結尚在半表半裏非少隂症是隂不得有頭汗也陽微二字作虛字解妙可與小柴胡湯設不了了者得屎而解此疾證後同故得屎而解也或難曰仲景云脈隂陽俱緊反汗出者亡陽也此屬少隂不得有汗何也此難妙妙今頭汗出者故知非少隂何以頭汗出便知非少隂證若見汗出亡陽亦為隂症何必頭汗知非少隂孫曰此一段正是仲景議論處意謂四肢冷脈沈緊腹滿全似少隂然大便鞕頭汗出不得為少隂切記切記蓋頭者三陽同聚若三隂至胸而還有頭汗出自是陽虛故曰汗出為陽微是隂不得有汗也若少隂頭有汗則死矣厥逆自利頭汗踡卧為少隂死症故仲景平脈法云心者火也明少隂則無頭汗者可治有汗者死心為手少隂腎為足少隂相與為上下惟以意逆者得之此案當熟玩一道士患傷寒發熱汗出多驚悸目眩身戰掉欲倒地衆醫有欲發汗者有作風治有用冷藥解者病皆不除召孫至曰太陽經病得汗早欲解不解者因太陽經欲解復作汗腎氣不足汗不來所以心悸目眩身戰遂作真武湯服之三服微汗自出遂解蓋真武湯附子白术和其腎氣腎氣得行故汗得來也若但責太陽者唯能乾涸血液仲景云尺脈不足榮氣不足不可以汗以此知腎氣怯則難得汗也明矣工部郎中鄭君患傷寒胸腹滿面色黃如金諸翰林醫官商議略不定皆曰胸滿可下然脈浮虛召孫至曰諸公雖疑不用下藥鄭之福也下之必死某有一二服藥服之必瘥遂下小陷胸湯尋利其病良愈明日面色改白語曰孫尚藥乃孫真人後身耶或問曰傷寒至於發黃病亦甚矣小陷胸湯何效速也瓘曰濕熱甚者則發黃內熱已甚復被火者亦發黃也邪風被火熱兩陽相熏灼其身必發黃此太陽標與少陽經所傳者正在心下故胸滿結之淺也是為小結胸且脈浮陽脈也虛陽在上不可下宜小陷胸湯和之黃連栝蔞苦寒而㵼熱散結半夏辛溫又以之結琇案結字上當有散字而燥濕理逆病雖甚而結之淺故以緩輕之劑除之張致和治一人病隂證傷寒先因感寒濕既而發熱不食數日後不省人事語多錯亂神思昏迷面青齒露人謂其必死張診之兩手脈沈細先以小柴胡湯與之繼以四君子湯加炮附子數片煎成藥置盆中以水制其熱性少時令溫與服其脈漸回神思亦爽更用藥調理而愈一人傷寒壞證垂死手足俱冷氣息將絶口張不能言致和以人參一兩去蘆加附子一錢於石銚內煎至一碗以新汲水浸之若冰冷一服而盡少頃病人汗從鼻梁尖上涓涓如水此其驗也蓋鼻梁上應脾若鼻端有汗者可救以土在身中周遍故也近陸同婦産後患疫證二十餘日氣虛脈弱即同壞證亦以此湯治之遂愈世謂傷寒汗吐下三法差謬名曰壞證孫真人云人參湯須得長流水煎服若用井水則不驗蓋長流水取其性之通達耳蔣仲賓治一人病傷寒期月體兢兢而振齒相擊不能成語大虛症醫環視束手仲賓後至診之曰急取羊肉來衆醫咍曰傷寒大忌羊肉仲賓曰諸君母嘵嘵以羊肉斤許熟之取中大臠别用水煮良久取汁一升與病人服須臾戰止汗大出而愈王止仲文集平江張省幹病傷寒眼赤舌縮唇口破裂氣喘失音大便自利協熱勢甚危篤諸醫皆欲先止其㵼適秀州醫僧寶鑑過蘇張延視診脈乃投以茵陳五苓散白虎湯而愈諸醫問故僧曰仲景云五臟實者死今大腸通更止之死可立待五苓以導其小便白虎以導其邪氣此醫家之通曉也何難之有雲麓漫鈔成州團練使張子剛名鋭以醫知名居於鄭州刑部尚書慕容彥逢為起居舍人母夫人病召鋭於鄭至則死矣時方六月暑將就木張欲入視彥逢不忍意其欲求錢乃曰道路之費當悉奉償實不煩入張曰傷寒法有死一晝夜復生者何惜一視之彥逢不得已自延入悲哭不止張揭面帛注視呼仵匠語之曰若嘗見夏月死者面色赤乎曰無然則汗不出而蹶爾非死也幸無急斂趨出取藥命以水二升煮其半灌病者戒曰善守之至夜半大㵼則活矣鋭舍於外館至夜半時守病者覺有聲勃勃然遺屎已滿席出穢惡物斗餘一家大喜遽敲門呼張張曰吾今體倦莫能起然亦不必起明日方可進藥也天且明出門若將便旋然徑命駕歸鄭彥逢詣其室但留平胃散一貼而已其母服之數日良愈蓋張以彥逢有求錢之疑故不告而去紹興中流落入蜀王秬叔問之曰公之術古所謂十全者幾是歟曰未也僅能七八耳吾長子病診脈察色皆為熱極命煮承氣湯欲飲之將飲復疑至於再三將遂飲如有掣吾肘者姑持杯以待兒忽發顫悸覆綿衾至四五始稍定汗出如洗明日而脫然使吾藥入口則死矣安得為造妙世之庸醫學方書未知萬一自以為足吁可悲哉夷堅志給事毛宏病傷寒汗已不解醫與之補劑補旬日病大作盜汗唇裂召祝診視祝曰傷寒無補法此餘熱不解與芩連山梔石膏之劑一服即愈虞恆德治一人三月間得傷寒證惡寒發熱小便淋澀大便不行初病時莖中出小精血片如棗核大由是衆醫皆謂房事所致遂作虛證治而用補中益氣等藥七八日後熱愈甚用補而熱愈甚當思轉矣犬渴引飲胃中滿悶語言錯亂召虞診視六脈俱數甚右三部長而沈滑左手略平亦沈實而長虞曰此大實大滿證屬陽明經宜大承氣湯衆皆驚愕虞强作大劑連進二服大㵼後熱退氣和而愈十日後因食鴨肉太多致復熱來問虞教用鴨肉燒灰存性生韭汁調下六七錢下黑糞一碗許而安一人四月間得傷寒證惡寒太陽經發大熱而渴陽明舌上白胎三日前身脊太陽百節俱痛至第四日惟脅痛而嘔少陽自利三陽合病皆自下利六日來請虞治診其脈左右手皆弦長而沈實弦長沈實之脈且數甚虞曰此本三陽合病今太陽已罷而少陽與陽明仍在與小柴胡合黃連解毒服三服脅痛嘔逆皆除惟熱猶甚九日後漸加氣築痰響聲如拽鋸出大汗退後而身復熱愈甚熱復愈甚脈不變大故為實症此際宜法節庵治法法當死視其面上有紅色紅色而足不冷面色赤亦屬陽氣拂鬱在表潔淨而無賊邪之氣言語清亮間有譫語而不甚含糊虞故不辭去而復與治用涼膈散倍大黃服二服視其所下仍如前自利清水其痰氣亦不息與大承氣湯合黃連解毒湯二服其所下亦如前虞曰此蓋熱結不開而燥屎不來耳此純清水方可斷燥屎然前云舌白胎亦須細審胎白胎為痰想九日痰喘身熱愈甚此時舌亦黃後以二方相間日三四服每藥又各服至五貼始得結屎如肥皂子大者十數枚痰氣漸平熱漸減至十五日熱退氣和而愈或問曰傷寒論謂下後不可再下連日用此峻劑而獲安者何也曰燥屎未下而脈尚實胡為不可再下是故為醫者不可膠柱而調瑟也衍義一僧因傷寒發汗不徹有留熱身面皆黃多熱期年不愈醫作食黃治之治不對病不去問之食不減尋與此藥服五日病減三分之一十日減三分之二二十日病悉去方用山茵陳山梔子各三分秦芁升麻各四錢末之每用三錢水四合煎及二合食後溫服以知為度朱肱吳興人尤深於傷寒在南陽太守盛次仲疾作召肱視之曰小柴胡湯證也請併進三服至晚覺胸滿肱又視之問所服藥安在取視乃小柴胡散也肱曰古人製㕮咀銼如麻豆大煮清汁飲之名曰湯所以入經絡攻病取快今乃為散滯在膈上所以胸滿而病自如也因旋製自煮以進兩服遂安夷堅志臨安民有因患傷寒而舌出過寸無能治者但以筆管通粥飲入口每日坐於門一道人見之咨嗟曰吾能療此頃刻間耳奈藥不可得何家人聞而請曰苟有錢可得當竭力訪之不肯告而去明日又言之至於旬時㑹中貴人罷直歸下馬觀病者道人適至其言如初中貴問所須乃梅花冰片也笑曰此不難置即遣僕馳取以付之道人屑為末糝舌上隨手而縮凡用五錢病立愈丁志袁州天慶觀主首王自正病傷寒旬餘四肢乍冷乍熱旬餘而四肢乍冷乍熱熱深厥深若屬隂不能乍熱頭重氣塞熱症屬頭重亦有隂但目下視唇寒面青似寒纍日不能食勢甚危袁唯一醫徐生能治此疾診之曰脉極虛是為隂症必服桂枝湯乃可徐留藥而歸未及煮若有語之曰當服竹葉石膏湯王回顧不見寮中但有一老道士適入市只小童在呼問之曰恰何人至此曰無人自正惑之急遣邀徐醫還視曰或教我服此如何徐曰寒燠如冰炭君之疾狀已危果餌前藥立見委頓他日殺人之謗非吾所能任也自為煮桂枝湯一碗曰姑飲之正使不對病猶未至傷生萬一發躁狂眩旋用師所言未為晚方語次復聞耳傍人云何故不肯服竹葉石膏湯自正益悚俟徐去即買見成藥兩貼付童使煎又聞所告如初於是斷然曰神明三告我殆是賜以更生安得不敬聽即盡其半先時頭不得舉若戴物千斤倐爾輕清唇亦漸暖咽膈通暢無所礙悉服之少頃汗出如洗徑就睡及平旦脫然如常自正為人謹飭常茹素為人祈禱盡誠故為神所佑如此庚志程元章婺源游汀人與妻皆嗜食鱉婢梅香主炮飪每滋味不適口必撻之嘗得一大者長尺許方操刀欲屠覩其伸縮顫悸為之不忍指而曰我尋常烹製少失必遭笞杖責罰今放汝不殺亦不過痛打一頓遂解縛置於舍後汙池中池廣二丈水常不竭程夫婦以鱉肥大滿意饜飫既失之怒甚杖婢數十經二年婢患熱疾發狂奔躁不納粥飲體熱昏憒蓋陽證也家人謂不可療舁入池上茅亭以待絶命明日天未曉聞有叩宅後扉者謂為鬼物叱之婢曰我是梅香病已無事乞令歸家啓門信然驚問其故對曰半夜後髣佛見一黑物將濕泥草遍罨我身上環繞三四十匝便覺心下開豁四肢清涼全無所苦始知獨在亭子內程氏未以為然逮暮復使往效昨夕偃卧而密伺察之見巨鱉自池出銜水藻浮萍遮覆其體程不省所以婢詳道本末云乃涸池取得之鱉比昔其大加倍尾後穿竅尚存於是送諸深溪程追悔前過不復食此鄉人相傳以為戒邑醫虞仲和親見其事為豫引霖夢弼言熱證之極猝未可解者汲新井水浸衣裳互尉之為妙不可謂水族細微亦能知此蓋隂隲所招云類編一人秋間得傷寒證已經汗下不愈延至月餘耳聾食入即吐藥下亦吐此誤藥已多脾胃受傷故食藥不納也又類百合病乃以陳皮白术各三錢百合二錢乾薑一錢五分煎飲之一服即能食不吐既而因頓食過度復傷夜不能寐以消導諸藥投之愈一婦人病傷寒十五日不更衣腹脹脈沈弱乃以當歸九錢枳殼桃仁加酒大黃五六分婦人以血為主加枳殼寬大腸桃仁以通幽門一服脹稍減一日夜連續進四貼再以蜜棗導之下黑糞塊三四十枚而愈葛可久治一士人得傷寒疾不得汗比葛往視則發狂循河而走如遇此症當思隂竭發躁葛就捽置水中使禁不得出良久出之裹以重繭得汗解壺仙翁治歙人吳銑六月病傷寒七日不解他醫投以補劑熱益甚不出一夜死矣銑之親戚交游乃以問翁翁曰晚矣將奈何試入探其舌雖黑不硬黑舌有毒者居多用猪屎治之已見竒驗兩頰雖腫而咽尚通則可療也乃入探視如翁言亟往見翁拜謁於前曰銑今日之命危於纍卵有先生則活無先生則棄捐異路長終而不得反言未卒相與噓唏流涕悲不能自止翁曰人之傷於寒也四日太隂受之太隂脈布胃中絡於嗌故腹滿而嗌乾五日少隂受之少隂脈貫腎絡於肺繫舌本故口燥舌乾而渴今舌黑不硬頰腫而嗌尚通則是經未絶而可治也於是診其脈且應則為之火劑逐熱一飲汗盡再飲熱去三飲病已衆皆以為神黃十六病傷寒發狂譫語歌笑不倫手足厥逆熱深厥亦深身冷而掌有汗診其脈兩手沈滑而有力翁曰陽勝拒隂火極而復反兼勝已之化亢則害承乃制也熱勝血菀故發狂而譫語火性炎上故歌笑不倫陽極則反故身冷厥逆泄其血則火除抑其陽則神寧乃用桃仁承氣湯下血數升益以黃連竹瀝石膏之劑大汗而解郭雍治一人盛年恃健不善養因極飲冷酒食肉外有所感初得疾即便身涼自利手足厥額上冷汗不止遍身痛呻吟不絶偃卧不能轉側心神俱無昏憒不恍惚請醫視之治不力言曰此證甚重而病人甚靜靜字細玩殊不昏憒身重寒濕不能起自汗自利四肢厥此隂證無疑也又遍身痛不知處所出則身如被杖隂毒證也當急治之醫言繆悠不可聽郭令服四逆湯灸關元及三隂交未知加服九鍊金液丹一味硫黃利厥汗證皆少止稍緩藥艾則諸證復出再急灸治如此進退者三凡三日兩夜灸千餘壯服金液丹亦千餘粒四逆湯一二斗方能住灸湯藥陽氣雖復而汗不出證復如太陽病證復如太陽當以附子理中湯加石膏倣名醫雜著治法未敢服藥未敢服藥穩以待汗二三日復大煩躁飲水次則讝語癍出熱甚三日後始煩渴見癍熱甚當細審癍之為陽為隂而用藥無可奈何復與調胃承氣湯得利大汗而解隂陽反覆有如此者前言煩躁不可投凉藥此則可下證具非止小煩躁而已故不同也一人年踰五十五月間因房後入水得傷寒證誤過服熱藥汗出如油喘聲如雷晝夜不寐凡數日或時驚悸發狂汗出喘而不寐果是元虛欲脫之象不能數日之後反見驚悸發狂之症也口中氣自外出諸醫莫措手郭診之曰六脈雖沈無力然晝夜不得安卧人倦則脈無力耳細察之尚有胃氣不澀直格云脉浮洪而見汗如油氣喘者死今脈沈而不澀所以可救可治也夫陽動隂靜觀其不得安卧氣自外出乃陽證也又誤服熱藥宜用黃連解毒湯衆皆危之一服尚未效或以為宜用大青龍湯郭曰此積熱之久病邪未退藥力未至也再服病減半喘定汗止而愈一人年二十三禀氣素弱二月間因食豚肉數片兼感冒不安是夜自利腹痛煩躁不眠太隂症次日嘔惡不食連自利二次午間請郭往視之左三部沈而帶數三五不調右寸關舉按皆無尺沈微兩手頭面皆冷舌有白胎嘔惡不止身體重頰赤頰赤是戴陽齒露不食仍作㵼以附子理中湯人參用四錢白术二錢乾薑甘草各一錢陳皮八分生薑汁二匙灌下少頃脈之右寸關隱隱而出諸症稍定次日脈近和頰尚赤乃以四君加陳皮黃芩二劑而愈江篁南治一從叔房後感寒脈沈而遲小腹大痛豫以髙良薑二錢薑制厚朴官桂半之作一服煎投之即愈一妊婦夏月得傷寒症頭痛惡寒身熱心腹脹氣上壅渴甚食少背項拘急唇口乾燥乃以柴胡石膏湯枳實散二方合與服之一服而愈一壯年七月間傷寒人迎脈緊盛惡寒肢節痛指甲青乃以九味羌活湯去生地黃芩加薑棗葱白此方可商症見指甲青理宜溫散一服未解兼腹疼飽悶再與全方一服外症悉解然腹痛膈痞未除蓋五日矣乃以小柴胡去參芩半棗加芍藥牡蠣瓜蔞亦不應其人曰豫乃夏間食牛肉頗多想是食積宿而然江曰乃表邪傳至胸中未入於腑證雖滿悶尚為在表乃以小柴胡對小陷胸加枳實桔梗大黃一錢同煎服之更衣一度即愈一人年四十餘春初因房後傷寒身熱惡寒頭痛太陽腹脅痛太隂少陽自飲胡椒湯取汗汗出熱不退熱不退宜細審三日後江診其脈浮而洪大虞案亦自利清水但脈弦長沈實且下利清水虛咳嗽乃以葛根湯麻黃桂減半加白术五味子得微汗次早脈稍平身凉痛減但㵼不甚止頭疼嗽未減乃以白术陳皮五味川芎茯苓乾薑甘草薑棗一服而愈既而勞復感寒兼怒熱復作脅復痛甚目不欲開兼之咯痰如桃花膿琇按此實胡椒薑桂之誤仲景論曰嘔家有癰膿者不可治嘔膿盡自愈惟治其勞復小柴胡去參棗加五味脅痛減半但嗽出尚有膿大小溲如猪血水口渴甚夜睡譫語小柴胡去參半棗加胡黃連胡連治傷寒咳嗽天花粉茯苓五味子出入加減而安羅治兩案俱目不欲開一投炙甘草湯一投四逆湯俱用輕重溫補之劑而此案目不欲開又用小柴胡信哉傷寒要見症也按東垣治大頭天行症亦目不開當治毒而愈琇此乃目胞腫不能開非不欲開也一婦人患發熱胸中閉塞骨節煩疼一醫作停食投小沉香煎一服大便利下三十餘行隨致困篤熱煩愈甚不省人事又更醫診見脈煩熱此句有誤投四苓飲亦不效病勢危急又來招診視得兩寸口脈沈微而伏大便利下三十餘行而煩熱愈甚溫補何疑况脈沈微而伏耶外證唇口喎斜足趾微冷面色赤似熱而煩熱神昏不食即與奪命散按奪命散汲藥血竭生地丹皮乾荷葉乃行瘀之方恐非是又奪命散乃礞石一味至夜半胸間得少汗藥雖見效人猶未蘇復診其脈如故江謂此證始初感寒合和解而反用丸藥下之太過遂成隂證似陽投以通脈四逆湯加人參四服熱漸退脈稍起再作四逆加葱白湯八服人始平復調理半月而愈江應宿治休寧潘桂年六十餘客淳安患傷寒亟買舟歸已十日不更衣身熱如火目不識人譫語煩躁揭衣露體知惡熱也小便祕澀腹脹脈沈滑疾與大柴胡湯腹中轉矢氣小便通再與桃仁承氣湯大下黑糞熱退身涼而愈都事靳相莊患傷寒十餘日身熱無汗怫鬱不得卧非躁非煩非寒非痛時發一聲如歎息之狀醫者不知何證迎豫診視曰懊憹怫鬱證也投以梔子豉湯一劑十减二三再以大柴胡湯下燥屎怫鬱除而安卧調理數日而愈友人王曉同寓雲中一僕年十九歲患傷寒發熱飲食下咽少頃盡吐喜飲涼水入咽亦吐號呌不定脈洪大浮滑此水逆證投五苓散而愈率口何姓者在濟患傷寒後食肉復醫與利藥下之下後身熱耳聾口乾不渴喜潄水不欲咽是熱在經熱在經妙斷豫視之曰此誤下亡隂猶有表證與小柴胡去半夏加天花粉山梔麥冬五味歸芍生地穩極一服減半四劑良愈宿按醫之學傷寒為難以其邪氣自表入裏六經傳變六日三隂三陽之氣皆和邪氣自衰七日當已七日不己謂之過經再傳在表者可汗而已在裏者可泄而已此大法也若夫陽盛隂虛汗之則死下之則愈陽虛隂盛汗之則愈下之則死生死在於反掌之間若醫者體認不真隂陽差互以寒為熱以實為虛毫釐有差千里之謬輕者困篤重者必死矣昔張長沙氏著論實為百代醫方之祖舉世宗之誠是也但其方法惟宜用於冬月即時發病正傷寒其餘至春變溫至夏變熱又當依溫熱病例清涼和解從乎中治況江以南溫暖之方正傷寒病百無一二所以傷寒屬內傷者十居八九丹溪主乎溫散有卒中天地之寒氣有口傷生冷之物皆以補養兼發散之法實本內經成敗倚伏生於動動而不已則變作及風雨寒暑不得虛邪不能獨傷人之㫖也蓋凡外感寒者皆先因動作煩勞不已而內傷體虛然後外邪得入故一家之中有病有不病者由體虛則邪入而體不虛則邪無路入而不病也是故傷寒為病屬內傷者十居八九即百十三方中用人參者居多世人皆謂傷寒無補法但見發熱不分虛實一例汗下而致夭橫者滔滔皆是也夫邪之所凑其氣必虛其法補養兼發散宜用補中益氣湯為主隨所見證加減氣虛熱甚者少加附子以行參芪之功東垣內外傷辨甚詳世之病此者為多但有挾痰挾外邪者鬱熱於內而發者皆以補元氣為主看所挾而兼用藥寒多者補散加薑附熱多者加芩柏痰積者加消導雜合病當雜合治不必先治感冒譬如惡寒發熱得之感冒明是外合之邪已得浮數之脈而氣口又緊盛明為食所傷病者又倦怠脈重按俱有豁意而胸膈痞滿牽引兩脅其脈輕取似乎弦此又平時多怒肝邪之所為也細取左尺大沈弱之體此又平時房勞之過也治法宜感冒一節可緩須視其形色强弱厚薄且與補中化食行滯中氣一回傷滯稍行津液自和通體得汗外感之邪自解醫者若不審求只顧表散外邪又不究兼見之邪脈亦不窮問所得之病因與性情執著巧施雜合治法將見正氣日虛邪滯不出皆拙工之過也瘟疫靖康二年春京師大疫有異人書一方於齊舍凡因疫發腫者服之無不效其方黑豆二合炒令香熟甘草二寸炙黃以水二盞煎其半時時呷之解毒方庚志成化二十一年新野疫癘大作死者無虛日鄰人樊滋夫婦卧牀數日矣余自學來聞其家人如殺羊聲不暇去衣巾急往視之見數人用綿被覆其婦牀下致火一盆令出汗其婦面赤聲啞幾絶余叱曰急放手不然死矣衆猶不從乃强拽去被其婦躍起倚壁坐口不能言問曰飲涼水否頷之與水一碗一飲而盡始能言又索水仍與之飲畢汗出如洗明日愈或問其故曰彼發熱數日且不飲食腸中枯涸矣以火蒸之速死而已何得有汗今因其熱極投之以水所謂水火既濟也得無汗乎觀於火燃枯鼎雖赤而氣不升注之以水則氣自來矣遇此等證者不可不知夢醒録虞恆德治一婦年二十九三月間患瘟疫證病三日經水適來發熱愈甚至七八日病劇胸中氣築作痛莫能卧衆醫技窮入夜迎翁治病者以綿花袋盛托背而坐於牀令婢磨胸不息六脈俱微數極而無倫次又若蝦遊狀翁問曰恐下早成結胸耳主人曰未也翁曰三日而經水行致中氣虛與下同乃用黃龍湯人參大黃枳實厚朴甘草四物湯芎歸芍地小陷胸湯川連枳實蔞仁共為一劑加薑棗煎服主人曰此藥何名虞曰三合湯也一服而諸症悉減遂能卧再服熱退而病全安愈又因食粥太多而病復熱又作內傷處治而用補中益氣湯出入加減調理而愈汪石山治一人年弱冠房勞後忽灑灑惡寒自汗發熱頭背胃脘皆痛唇赤舌强嘔吐眼胞青色風虛醫投補中益氣不逺於病午後譫語惡熱表小便長表未除初日脈皆細弱而數次日脈則浮弦而數醫以手按臍下痛議欲下之豈有下理遣書來問汪曰此疫也斷之曰疫妙疫兼兩感內傷重外感輕耳臍下痛者腎水虧也妙按痛為實而斷為腎虛明其理耳若用利藥是殺之也古人云疫有補有降有散兹宜合補降二法以治用清暑益氣湯除蒼术嫌燥澤㵼嫌利五味嫌斂加生地補腎黃芩石膏除惡熱譫語服十餘貼而安陳斗嵓句曲人也父病疫藥罔效精誠禱天一夕夢老叟書授䖤蟺水愈汝父既覺莫辨為何物廣咨博訪知為蚯蚓也搗水飲疾愈人咸以為孝感所致江應宿治陳氏子年十七歲患疫大渴大熱頭痛如破泄㵼頻數六脈洪大與三黃石膏湯日進三服石膏加至一兩三日而愈何氏僕患天行時疫目不識人狂言妄語投以地漿童子小便浸白頭頸蚯蚓搗細新汲井花水濾下清汁任服一二碗即知人三日愈萬厯十六年南都大疫死者甚衆余寓雞鳴僧舍主僧患疫十餘日更數醫皆云禁飲食雖米飲不容下咽病者飢甚哀苦索食余曰奪食則愈雖有是說此指內傷飲食者言耳諺云餓不死傷寒乃邪熱不殺穀雖不能食亦不致死經云安穀則生況病挾內傷不足之證禁食不與是虛其虛安得不死强與稀粥但不使充量進補中益氣湯而愈若此類者甚衆余未嘗禁飲食而活者不少每見都城諸公但說風寒二字不辨有無內傷虛實一例禁絶飲食有二十餘日邪氣已盡米飲尚不容入口而餓死者何限表而出之以為習俗之戒宿按經云冬不藏精者春必病瘟是以多感於房勞辛苦之人安樂者未之有也一皆觸冒四時不正之氣而為病焉大則流行天下次則一鄉次則一家悉由氣運鬱發有勝有伏遷正退位之所致也視斯疾者其可不推運氣而治之乎仲景無治法後人用敗毒散治甚得理切不可作傷寒正治而大汗大下但當從乎中而用少陽陽明二藥加減和治殊為切當大頭天行泰和二年四月民多疫癘初覺憎寒壯熱體重次傳頭面腫盛目不能開上喘咽喉不利症凶極舌乾口燥俗云大頭傷寒諸藥雜治莫能愈漸至危篤東垣曰身半已上天之氣也邪熱客於心肺之間上攻頭面而為腫耳乃以芩連各半兩酒炒人參陳皮甘草𤣥參各二錢連翹板藍根敗毒行瘀馬勃鼠粘子各一錢白殭蠶炒升麻各七分柴胡五分桔梗三分配方之妙非後賢所能擬議為細末半用湯調時時服之心肺為近小製則服半用蜜丸噙化服法妙服盡良愈活者甚衆時人皆曰天方謂天仙所製也或加防風川芎薄荷歸身細切五錢水煎時時稍熱服之如大便燥結加酒蒸大黃一二錢以利之腫勢甚者砭針刺之羅謙甫治中書右丞姚公茂六旬有七宿有時毒至元戊辰春因酒再發頭面耳腫而疼耳前後腫尤甚胸中煩悶咽嗌不利身半以下皆寒足脛尤甚熱壅於上由是以牀相接作炕身半以上卧於牀身半以下卧於炕飲食減少精神困倦而體痛命羅治之診得脈浮數按之弦細上熱下寒明矣若以虛治則誤內經云熱勝則腫又曰春氣者病在頭難經云畜則腫熱砭射之也蓋取其易散故也急則治標遂於腫上約五十餘刺其血紫黑如露珠之狀頃時腫痛消散治上熱又於氣海中大艾炷灸百壯灸法佳乃助下焦陽虛退其隂寒次於三里二穴各灸三七壯治足胻冷亦引導熱氣下行故也治下寒遂處一方名曰既濟解毒湯以熱者寒之然病有高下治有逺近無越其制度以黃芩黃連苦寒酒製炒亦為引用以㵼其上熱以為君桔梗甘草辛甘溫上升佐諸苦藥以治其熱柴胡升麻苦平味之薄者隂中之陽散發上熱以為臣連翹苦辛平以散結消腫當歸辛溫和血止痛酒煨大黃苦寒引苦性上行至巔驅熱而下以為使投劑之後腫消痛減大便利再服減大黃慎言語節飲食不旬日良愈橘泉翁治一人病頭面項喉俱腫大惡寒醫疑有異瘡翁曰非也此所謂時毒似傷寒者丹溪曰五日不治殺人急和敗毒散加連翹牛蒡子大黃下之三日愈薛已治少宰李蒲汀誤服發散之藥耗損元氣患處不消體倦惡寒食少口乾薛用補中益氣加桔梗用托裏消毒散而全愈秋官陳同野元氣素弱脈細微而伏用參术芎歸陳皮柴胡升麻炙草以升舉陽氣用牛蒡𤣥參連翹桔梗以解熱毒二劑腫頓消而脈亦復矣設或脈微細而屬純隂或腫而屬純陽藥之鮮有不誤者一婦人潰後腫赤不消食少體倦膿清色白乃脾肺虛也先用六君加桔梗芎歸後用補中益氣加桔梗而斂一婦人表散過度腫硬不食脈浮大按之微短薛辭不治後果殁江篁南治給事中游讓溪嘉靖壬子正月忽感大頭風症始自頸腫時師以為外感而誤表之繼以為內傷而誤補之面發赤三陽俱腫頭頂如裂身多汗寐則譫語綿延三日喘咳勢急其親汪子際以竹茹橘皮湯繼以川芎茶調散合白虎湯去人參服一劑而減次日用前方去寒峻藥至晚漸定耳輪發水泡數箇餘腫漸消獨耳後及左頰久不散又次日以當歸六黃湯為主加散毒之藥延及二旬頂巔有塊如雞子大突起未平及面頰餘腫未消時時頭疼大便稀溏時二月中旬江至診得左脈浮小而駛右浮大近快有勃勃之勢江按脈症當從火治以生黃茋八分白术薏苡各一錢半茯苓片芩各八分生甘草三分煎加童便服次日脈稍平然兩頰尚赤早間或覺頭痛蓋餘火未全殺也黃茋加作一錢二分薏苡加作二錢頂塊漸消以後加生芪二錢更飲菉豆湯童溲五劑而愈宿按陽明邪熱兼少陽相火為病視其病勢在何部隨經處治當緩勿令重劑過其病所陽明為邪首大腫少陽為邪出於耳前後豫每治此症初用涼膈散繼以消毒飲無不立愈沙琇按原本誤解內經解㑊為沙證標題云解㑊今訂正之沙病琇按張杲醫說采葉氏録驗方本文祗沙病二字江氏誤標沙症為解㑊遂妄改葉方原文云俗名發沙之症以附㑹之今據醫說訂正江南舊無今東西皆有之原其證醫家不載大凡才覺寒栗似傷寒而狀似瘧但覺頭痛渾身壯熱手足厥冷鄉落多用艾灸以得沙為良有因灸膿血迸流移時而死者誠可憐也有雍承節印行此方云初得病以飲艾湯試吐即是其證急以五月蠶退紙一片碎剪安碗中以楪蓋密以湯泡半碗許仍以紙封楪縫勿令透氣良久乘熱飲之就卧以厚衣被蓋之令汗透便愈如此豈不勝如火艾枉殘害人命敬之信之葉氏録驗方文琇按此條原刻俱改削葉氏原今依醫說訂正解與魏玉橫論解㑊書即懈㑊音亦倦杭世駿不能㑊二字不見他書解而支節振聳憊而精氣不能檢攝筋不束骨脈不從理解解㑊㑊不可指名非百病中有此一症也內經言此者凡五平人氣象論云尺脈緩澀謂之解㑊王氏注儜不可名儜困弱也玉機真象論云冬脈太過則令人解㑊此從脈起見也刺瘧論云足少陽之瘧令人身體解㑊寒不甚熱不甚惡見人見人心惕惕然熱多汗出甚此從瘧起見也刺要論云刺骨無傷髓髓傷則銷鑠胻酸體解㑊然不去矣四時刺逆從論云夏刺經脈白氣乃竭令人解㑊此從刺而究其極也要見從四末以起見如經所言墮怠小變其辭而意較微渺爾後世傳注有與經發明者又有二風論云使人怢栗而不能食名曰寒熱怢栗全元起本作失味皇甫謐甲乙經作解㑊則怢栗即解㑊之解也至真要大論云發不逺熱無犯溫涼王氏注不發汗以奪盛陽則熱內淫於四支而為解㑊不可名也粗工呼為鬼氣要病久久不已則骨熱髓涸齒乾乃為骨熱病此又究極解㑊之流弊所謂救病於已形也篁南江氏輯名醫類案引葉氏録驗方以為俗名發痧之證於瘟疫大頭天行之後另列一門武斷極矣發痧余嘗有此病發必神思躁擾少腹痛靈素未嘗言及時小小患苦耳與解㑊之義毫不干涉篁南父子負盛名而內經不讀庸醫祖述其說轉以欺世事無害而理則大繆矣足下續案已成刪去此門庶為穩愜毋令人有誤解內經之誚蕘言或可采也一嫠婦身肥常患發痧之證每用苧麻刮之即愈輒與輒發不出二三日醫用四物等治反加鼻衄江以香附撫芎黃芩梔子等開鬱降火清熱之劑與之數服而愈不復舉名醫類案卷一
