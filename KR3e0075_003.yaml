body:
  text: 名醫類案卷三眀江瓘編痰羅謙甫治楊大參七旬餘宿有風痰春間忽病頭旋眼黑目不見物心神煩亂兀兀欲吐不吐心中如懊憹狀頭遍痛微腫而赤色腮頰亦赤色足胻冷此足冷因痰火上升羅曰此少壯時好飲酒久積濕熱於內風痰內作上熱下寒陰陽不得交通否之象也經云治熱以寒雖良工不能廢其繩墨而更有道也然而病有逺近治有重輕參政年髙氣弱上熱雖盛豈敢用寒涼之劑損其脾胃經云熱則砭之以三稜針約二十餘處刺出紫血如露珠之狀少頃頭目清利諸症悉減遂處一方天麻為君柴胡黃芩黃連俱酒製為臣以治上熱陳皮辛溫炙甘草甘溫補中益氣為佐生薑半夏辛溫治風痰茯苓甘平利水導濕熱引而下行故以為使立方可法服數服邪氣平而愈此案與東垣治火條中案相同滄州翁治一人病寓湖心僧舍以求治翁至其人方飯坐甫定即摶爐中灰雜飯猛噬且喃喃詈人命左右掖之切其脈三部皆弦直上下行而左寸口尤浮滑蓋風留心胞症也法當湧其痰而凝其神既湧出痰沫四五升即熟睡竟日乃寤寤則病盡去徐以治神之劑調之神完如初丹溪治一室女素強健六月發煩悶困憊不食時欲入井脈沉細數弱口漸渴醫作暑病治不效又加嘔而瘦手心熱喜在暗處脈漸伏而妄語慿脈作暑治亦不謬但喜在暗處云云明屬風痰朱制局方妙香丸妙香丸方牛巴豆辰氷片麝黃砂黃膩粉蜜金箔蠟丸如芡實大井水下一丸半日大便藥已出矣病不減遂以麝香水洗藥以針穿三孔涼水吞半日下稠痰數升得睡漸愈因記金匱云昔肥而今瘦者痰也一人患痰血滯不行胸中有飲服韭汁三四盞胸中煩躁不寧無效以瓜蔞仁一錢半夏二錢貝母三錢為末炊餅丸麻子大薑湯送下即抑痰丸一人遍身俱是塊塊即痰也二陳加白芥薑炒黃連煎服一人年五十形肥味厚且多憂怒脈常沉澀自春來得痰氣病醫認為虛寒率與燥熱香竄之劑至四月間兩足弱氣上衝飲食減朱視之曰此熱而脾虛痿厥之症作矣形肥而脈沉未是死症但藥邪太盛當此火旺實難求生且與竹瀝下白术膏盡二斤氣降食進一月後仍大汗而死此案又見第八卷痿症門一婦年五十餘素多怒因食燒酒次早面浮絶不思食痰身倦怠脈沉澀獨左豁大朱作體虛有痰氣為痰所隔不得降當補虛利痰藥為主煎六君吞滚痰丸每早以二陳加參术大劑與一貼後探令吐出藥辰時與索矩三和湯三倍加白术至睡後以神祐丸七粒撓其痰神祐丸不如滾痰丸佳如此一月而安虞恆德治一婦四月間因多食青梅得痰飲病日間胸膈中大痛如刀錐至晚胸中痛止而膝髂大痛蓋痰飲隨氣升降故也一醫作胃寒治胃寒之脈宜見沉遲或緊今見洪數而滑非寒可知用乾薑良薑官桂烏附丁沉輩及煮胡椒粥間與病日劇加之口渴小水淋瀝虞診其六脈洪數而滑作清痰處治令其亟烹竹瀝服三日口不渴小水亦不淋瀝但胸中與膝互痛如舊用蘆葡子汁研與半碗吐痰半升至夜痛尤甚而厥正所謂引動其猖狂之勢耳粗工至此束手無策矣次日用參蘆一兩逆流水煎服不吐又次日苦參煎湯服亦不吐又與附子尖桔梗蘆皆不吐一日侵晨梨蘆末一錢麝香少許酸漿水調與始得大吐至次日天明吐方定前後得痰及稠飲一小桶其痛如脫調理而安一東南朝貴素畏熱藥病痰輒云火痰茹芩連一日冬雪寒冽眩嘔以死韓飛霞以黑附子一片砒一分舂入薑汁劫之大吐又服暖藥而愈此蓋地氣束人豈可拘執自誤况痰生於濕濕生於寒乎吐寒痰之法會稽徐彥純治一人病痰數年不愈診其脈左手微細右手滑大微細為寒滑大為燥以瓜蒂散湧其寒痰數升汗出如沃次以導水丸禹功散去腸中燥垢亦數升人半愈後以淡劑流濕降火開胃口不踰月而瘥吐下兼行盛文紀以醫名吳中有訓導病頭疼發熱惡寒初作外感治或以風治見熱則退熱痛則止痛或又以氣虛治由是病劇人事不省飲食已絶危哉盛診視曰君幾誤死法當先去其滯遂用二陳湯加大黃六七錢令守者曰急煎俾服至夜分左眼若動肝氣乃舒大泄則有可生之機矣至夜半時腹中有聲左眼果開遺穢物斗許中有堅硬如卵之狀竹刀剖視即痰裹麵食也此症斷之痰裹食非明眼不能既而氣舒結散津液流通即索食矣衆醫問故盛曰訓導公北人也久居於吳飲酒食麵皆能助濕濕能傷脾脾土一虧百病交作有是病服是藥更何疑焉衆醫咸服黃師文治一婦人卧病垂三年狀若勞瘵諸醫以虛損治不瘥黃視之曰此食陰物時或遭驚也問之婦方自省悟曰曩者食水糰時忽人報其夫墜水由此一驚病延至今不能愈黃以青木香丸兼以利藥一貼與之須臾下一塊抉之乃痰裹一水糰耳當時被驚怏快在下而不自覺也自後安康無恙小兒醫陳日新形體尫羸嘗日病熱至暮尤甚醫以陰虛治或以勞瘵治荏苒半載病勢轉危日新謂其父曰欲得大黃通利大腸為之一快雖死無憾其父從之遂以導痰湯入硝黃煎服自辰至申下結糞一塊如核桃許抉開視之乃上元看燈時所食粉餌因痰裹在外不能化由是致熱日漸銷鑠耳向使日新不自知醫則終為泉下人矣誰謂劉張之法無補於世哉錢中立治周訓導年五十時患痰火之症外貌雖癯稟氣則厚性不喜飲醫視脈孟浪指為虛火用補中益氣湯加參术各五錢病者服藥踰時反致氣喘上升喘息幾殆錢視曰此實火也宜㵼不宜補痰氣得補火邪愈熾豈不危殆先用二陳湯探吐出痰碗許其夜安寢平明仍用二陳去半夏加朴硝大黃下結糞無數其熱始退更用調理藥旬日始安吁不識病機妄施補瀉鮮有不敗事者豐城尹莫強中凡食已輒胸滿不下多方治之不效偶家人輩合橘紅湯取嘗之似有味因連日飲之一日坐廳事方操筆覺胸中有物墜下大驚目瞪汗如雨急扶歸須臾腹疼下數塊如鐵彈子不可聞自此胸次廓然蓋脾之冷積也其方橘皮去穰取紅一斤甘草鹽各四兩水五碗慢火煮乾焙搗為末點服夫當病經年藥餌多矣不知功乃在一橘皮世之所忽豈可不察哉又古方以橘皮四兩水五碗慢火煮乾焙搗為末點服名曰二賢散以治痰特驗泊宅編吳茭山治一男子瘦弱因卧卑濕之地遂得溢飲之症頭目眩暈羞日光寒熱時作痰能作寒熱信然四肢歷節疼痛四肢歷節疼痛乃濕飲流注關節羌合羅案四肢病看之方妙處以大羌活湯大活湯方羌活术獨活歸升麻草靈仙瀉防風苓蒼當甘澤茯醫作風治或作虛治將及半年俱不效吳診脈曰寸口脈沉而滑兩尺弦此溢飲濕痰也但汗吐之諸醫以病者虛羸當用補法謂吐汗必死吳曰此溢飲當發其汗遂以控涎丸一服控涎丸方蝎甘遂川烏鐵粉製半夏打殭蠶丸全生薑汁糊為硃砂為衣薑湯下却用爆乾綿子一斗燃之以被圍之勿令氣泄令患人坐薰良久倐然吐出黑痰升許大汗如雨痛止身輕其病遂愈一婦素有心脾氣痛好燒酒患舉則四肢厥冷每用諸香附子薑桂之屬隨服隨止一日前患復作遂以前藥服之不安仍飲燒酒二盞酒下腹脅脹滿坐卧不得下木香檳榔丸一百丸大便通後痛稍可頃間下墜愈痛向後延吳診視脈數而有力知前香燥太過酒毒因利而發即以黃連解毒湯入木香少許二服而安琇案此條不當入痰案王中陽治江東富商自奉頗厚忽患疾心驚如畏人捕之聞脂粉氣即便遺泄晝夜坐臥常欲人擁護方安甫交睫即陽氣不固遍身紅暈紫斑兩腿連足淫濕損爛膿下不絶飲食倍常酬應不倦非虛可知纍醫不效王診得六脈俱長三部九候往來有力兩手寸尺特盛至數遲數不愆卒難斷證因問之商曰某但覺虛弱無力多驚悸及苦於下元不固兩腿風瘡侍奉皆賴婦人而又多欲不能自禁奈何治之王曰時醫必作三種病治一者治驚悸二者治虛脫三者治風瘡以余觀之只服滚痰丸然後調理滿座愕然王曰此係太過之脈心腎不交斷症妙商曰然則腿腳為風癩乎王曰非也水火亢行心不攝血運於下不能上升凝於肌膚日久濕爛與火炎水濫神情不寧精元頻泄者本同標異也豫欲逐去痰毒然後調理遂與滚痰丸二次三日後脈候稍平再令服之商曰某浙産也家人慮吾體虛每求補劑王曰君連年醫藥不效反增劇者不識虛實認似為真故也再令服三次越五日其脈和已不言及驚悸之苦但求遺泄之藥王用豁痰湯本方加茯苓煎服月餘諸症悉減精爽能步止求治腿瘡更令服豁痰藥數劑用嬰幼門泥金膏以新汲水濃調厚敷兩腿乾則易之經一時洗去則熱氣已衰皮肉寬皺然後用杖毒活血之劑治之方出衛生寶鑑痰症門泥金膏亦出此書一貴婦忽心腹冷痛遂吐出宿汗不已又吐清涎如雞蛋清之狀一嘔一二升許少頃復嘔諸藥不納咽唾亦不能順下虞恆德治産後吐案合看吐同症不同已經三日但聰明不昧三日之後聰明不昧非虛可知囑後事將就木王診六脈弦細而長虛症無長脈令服滾痰丸三十丸並不轉逆須臾坐寐移時索粥食之次日再進三十丸更服局方茯苓半夏湯次日服小兒方白术散四五日飲食如常而愈一人素清癯骨立苦滿腹冷痛呻吟之聲撼屋振床嘔吐清汁如雞蛋清諸醫不效令服滾痰丸三十粒即寧睡更不嘔逆復診其脈雖熟寐中亦甚弦數睡醒仍更呻吟再投五十丸其痛休作數四但不甚大嘔節續如厠略有大便如水浸豬肉亦如赤白滯下小溲少許皆如丹粉和膠膩不多餘皆是藥汁迫暮大嘔如雞蛋清水二升藥丸皆如茶腳褐色仍如前粒粒分曉痛乃定熟睡次日留豁痰湯數貼令其服罷仍服白术散而愈燕人楊姓者久患冷氣滿腹上攻下注大痛不堪任通陳壅上即吐冷涎半升而止已見痰症每日一作飲食不進遂成骨立醫用溫補不效視其脈六脈弦長徑急兩畔别有細脈沸然而作狀如爛綿不問患者所苦何症但以脈言之弦長徑急則有一胸膈臭痰在內患者曰然衆醫皆作冷氣因補治下元日久並無少效某自覺胸中痞悶但不會北方醫今聞此説令我大快遂投滾痰丸五十丸臨睡服之臨睡服藥方得力半夜後吐黑緑冷涎敗水無數次早大便略通已見敗痰更求今晚之藥再付七十丸其病如脫再進一次令服局方橘皮半夏湯四君子湯而愈李媪年八十餘臥病日久心煩喜怒改常胸閉不能進食迷悶展轉不安並無寒熱别證病無寒熱而胸迷悶痰也令親人求治王曰彼疾久治不瘥吾除滾痰丸之外無法可施况其年髙不食豈其宜乎吾固知其可服但不可多試以十丸投之一服逐敗痰三五片如水浸阿膠頓覺安好再與三十丸作三服即安更製龍腦膏一料令其每夜噙睡無恙五載而終一富翁素強健忽病喘滿不咳不吐痰病日久腿腳隂囊盡水腫合治江東商案看之知腿腳陰囊水腫乃痰使之倚臥肩息困極王曰非水症也但胸膈有敗痰宜服滚痰丸患者曰非四五人扶持莫能登溷遂已之至於針刺放水備嘗諸苦年餘漸瘥忽吐臭痰患人撫床大聲曰果中前言吾不智以致久患今則痰敗必成肺癰急請王來遂製龍腦膏一劑服未盡而愈方出養生主論一婦嬌弱豐頤不顯言何證求王診視六脈疾數徑急上大下小三焦部分搏指之甚王曰那得許多熱來其夫笑曰此言與老醫之言何其相背太甚老醫曰那得許多冷來故服藥衣食並是辛熱過暖之事疑其症益加今當從先生之言請為治之問其見證曰上壅痰盛胸閉脅痛頭不能舉口苦舌乾精神煩亂夢寐恍惚兩頷結核飲食不美於是令服滚痰丸八十丸隨時清利相繼三次服之五七日一次服九十丸至百丸每夜噙龍腦膏然病勢日久兼聞稟賦夙異遂令服黃連解毒丸一年方愈方出養生主論汪沈治淮陰楊姓者患脾虛而痰盛因服硝黃過多致脾胃益憊疲倦不能下榻數月危甚汪診之以導痰湯加人參白术服之漸愈薛已治一儒者背腫一塊按之則軟軟則非毒肉色如故飲食如常勞則吐痰體倦此脾虛而痰滯用補中益氣加茯苓半夏少加羌活加羌活散鬱妙外用隂陽散以薑汁調搽而消後因勞頭暈作嘔仍以前藥去羌活加蔓荆子而愈閣老梁厚齋氣短有痰小便赤澀腎虛可知足跟作痛尺脈浮大按之則澀此腎虛而痰飲也用四物送六味丸不月而康仲景云氣虛有飲用腎氣丸補而逐之誠開後學之矇瞶濟無窮之夭枉腎氣丸即六味丸孟都憲患氣短痰暈服辛香之劑痰盛遺尿腎虛兩尺浮大按之如無前案尺按之澀此按之如無皆主補腎乃腎虛不能納氣歸源香燥致甚耳用八味丸料三劑而愈孫都憲形體豐厚勞神善怒面帶陽色口渴吐痰或頭目眩暈或熱從腹起俱似火症烏知為虛耶左三部洪而有力右三部洪而無力乃足三陰虧損用補中益氣加麥門五味及加減八味丸而愈立齋兄體貌豐偉吐痰甚多脈洪有力殊不耐勞遇風頭暈欲仆脈症似實火但不耐勞為虛症又遇風則暈仆若果實熱斷無此症口舌破裂或至赤爛誤食薑蒜少許口瘡益甚服八味丸及補中益氣湯加附子錢許即愈停藥月餘諸症復作以補中益氣加麥門五味兼服而愈笑哭不常琇按素間神有餘則笑不休神不足則悲其有痰者亦因乎火也張子和路逢一婦人喜笑不休半年矣諸醫治之術窮張曰此易治耳以食鹽二兩成塊燒令通紅放冷研細以河水一大碗煎三五沸溫分三服須臾探吐出痰半斗次服火劑黃連解毒湯不數日而笑止倪維德治一婦病氣厥笑哭不常人以為鬼祟所憑倪診脈俱沉胃脘必有積有所積必作疼遂以二陳湯導之吐痰升許而愈此蓋積痰類祟也一妓患心疾狂歌痛哭裸裎妄詈問之則瞪視默默脈沉堅而結曰得之憂憤沉鬱食與痰交積胸中涌之皆積痰裹血後與大劑清上膈數日如故臨淄人自謂無病忽覺神思有異晚歌笑不節沈宗常曰此陰火乘肝晚動陰火乘脾見於書陰火乘肝見此案宜以柔劑少加利之良愈四物加大黃瀉青丸一婦無故悲泣不止或謂之有祟祈禳請禱傋至不應金匱有一症云婦人藏燥喜悲哀傷欲哭象如神靈所作數欠伸者甘麥大棗湯主之其方甘草三兩小麥一升大棗十枚水六升煮取三升分溫三服亦補脾氣十四貼而愈悲屬肺經云在藏為肺在志為悲又云精氣并於肺則悲是也此方補脾蓋虛則補母之義也厥琇按素問陽氣衰于下則為寒厥陰氣衰于下則為熱厥又三陽三陰皆有厥症淳于意治故濟北王阿母自言足熱而悶臣意言曰熱蹶也琇按素問熱厥為酒與穀氣相薄即刺其足心各三所按之無出血病旋已病得之飲酒大醉史記子和治西華季政之病寒厥其妻病熱厥前後十餘年其妻服逍遙散十餘劑不效二人脈皆浮大而無力政之曰吾手足之寒時時漬以熱湯寒不能止吾婦手足之熱終日沃以冷水而不能已何也子和曰寒熱之厥也此皆得之貪飲食縱嗜欲遂出內經厥論證之政之喜曰內經真聖書也十餘年之疑今而釋然縱不服藥愈過半矣子和曰熱厥者寒在上也寒厥者熱在上也寒在上者以溫劑補肺金熱在上者以涼劑清心火分處二藥令服之不旬日二人皆愈矣熱用溫劑寒用涼劑治法之變無踰此一少婦氣實多怒事不如意忽大呌而欲厥蓋痰閉於上火起於下而上衝滑伯仁乃用香附五錢生甘草三錢川芎七錢童便薑汁炒煎服又用青黛人中白香附丸服稍愈後用吐法乃安再用導痰湯加薑汁黃連香附生薑下龍會丸安吕元膺治一僧病厥已三日不知人切其脈右寸口之陽弦而遲少陰之脈左尺緊而徑不滿四十動而止此寒邪乘於腎肝所致法當以辛甘復其陽為作湯三升頓服遂起對客如不病然一藏已絶去此若干日當復病即死果驗丹溪治一婦病不知人稍蘇即號呌數四而復昏朱診之肝脈弦數而且滑曰此怒心所為蓋得之怒而強酒也詰之以不得於夫每夜必引滿自酌解其懷朱治以流痰降火之劑而加香附以散肝分之鬱立愈一人平生腳自踝以下常覺熱冬不加綿於上常自言我資稟壯不怕冷朱曰此足三陰虛宜斷欲事以補養陰血庶幾可免彼笑而不答年方十七痿半年而死劉錫鎮襄陽日寵妾病傷寒暴亡衆醫云脈絶不可治或言市上賣藥許道人有竒術可用召之曰是寒厥爾不死也乃請健卒三十人作速掘坑熾炭百斤雜薪燒之俟極熱施薦覆坑舁病人臥其上蓋以氈褥少頃氣騰上如蒸炊遍體流汗衣被透濕已而頓蘇如取藥數種調治即日愈夷堅志陳斗嵓治一婦人病厥逆脈伏一日夜不蘇藥不能進陳視之曰可活也針取手足陽明手陽明大腸合谷穴足陽明胃厲兑穴氣少回炙百會穴乃醒初大泣既而曰我被數人各執凶器逐潛入匱中聞小兒啼百計不能出又聞擊匱者隙見微眀俄覺火燃其蓋遂躍出其擊匱者針也燃匱蓋者炙也郝允治二里婦一夜中口噤如死狀允曰血脈滯也不用藥聞雞聲自愈一行踸踔輒踣允曰脈厥也當活筋以藥尉之自快皆驗遊以春治一嫠婦年三十餘忽午後吐酸水一二碗許至未時心前作痛至申痛甚暈去不省人事至戍方蘇如故每日如此醫治期年不愈遊至用二陳下氣之劑不效熟思其故忽憶針經有云未申時氣行膀胱想有瘀血滯於此經致然遂用歸尾紅花各三錢乾漆五錢煎服痛止吐定暈亦不舉次日復進一貼前症俱愈第三日前方加大黃桃仁飲之小便去凝血三四碗而痊江篁南治一婦忽如人將冷水潑之則手足厥冷不知人少頃發熱則漸省一日二三次虛何疑江診六脈俱微若有若無欲絶非絶此氣虛極之症也用人參三錢陳皮一錢枳殼二分人參漸加服參六兩而愈一人臥奄然死去腹中走氣如雷名曰尸厥用硫黃一兩焰硝五錢研細分三服好酒煎覺煙起即止溫灌之片晌再服遂醒江應宿治弟婦年二十五寡居因事忤意忿怒腹脹如鼓嘔噦大呌而厥少頃復蘇晝夜扶立不能坐臥醫莫能療將就木宿適自外歸聞喊聲問其狀知痰涎閉塞火氣衝逆而發厥耳急煎薑湯磨紫金錠一匕而愈後旬日遇事忤意激怒復舉製平胃加薑炒黃連半夏香附米為丸服半料不復舉矣合滑伯仁案同看痓琇按痓乃痙之訛有汗為柔痙無汗為剛痙痓癡去聲惡也痙擎上聲風強病丹溪治一少年痘瘡靨謝後忽口噤不開四肢強直不能屈時繞臍腹痛一陳則冷汗如雨痛定汗止時作時止脈極弦緊而急如真弦狀繞臍痛似實時作時止為虛諸緊為寒知其極勤苦因勞倦傷血瘡後血愈虛風寒乘虛而入當用辛溫養血辛涼散風芍藥當歸為君川芎青皮釣鈎藤為臣白术甘草陳皮為佐桂枝木香黃連為使更加紅花少許煎服十二貼而安妙方使尤佳子和治一婦年三十病風搐目眩角弓反張數日不食諸醫作驚風暗風風癎治之以南星雄黃天麻烏附不效子和曰諸風掉眩皆屬肝木曲直搖動風之用也陽主動陰主靜由火盛制金金衰不能平木肝木茂而自病故也琇按此論深得痙病肯綮先涌風涎二三升次以寒劑下十餘行治以流痰降火又以扉針刺百會穴出血二杯立愈博按此案舊刻脫誤虞恆德治一婦年三十餘身材小瑣形瘦弱月經後忽一日發痙口噤手足攣縮角弓反張虞知其去血過多風邪乘虛而入用四物湯加防風羌活荆芥少加附子行經二貼病減半六貼全安瞑目不食琇按土敗木賊之病四明僧奉真良醫也天章閣待制許元為江淮發運使奏課於京師方欲入對而其子病亟瞑而不食惙惙欲逾宿矣使奉真視之曰脾已絶不可治死在明日元曰觀其疾勢固知其不可救今方有事須陛對能延數日之期否奉真曰如此自可諸藏皆已衰唯肝臟獨過脾為肝所勝其氣先絶一臟絶則死若急瀉肝氣冷肝氣衰則脾少緩可延三日過此無術也乃投藥至晚能張目精神稍復啜粥明日漸蘇而能食元甚喜奉真笑曰此不足喜肝氣暫舒耳無能為也後三日果卒筆談人漸縮小呂縉叔以制誥知潁州忽得疾身軀日漸縮小臨終僅如嬰兒古無此疾終無人識正德中楚人姓潘行三者身甚肥壯卒之日縮如嬰兒人皆莫知其由後詢之平生服硫黃以致如此始信呂縉叔之事不妄大厯中元察為卭州刺史而州城將有魏淑者膚體洪壯年方四十親老妻少而忽中異疾無所酸苦但飲食日損身體日銷耳醫生術士拱手無措寒暑未周即如嬰孩焉不復能行坐語言其母與妻更相提抱遇淑之生日家人召僧致齋其妻乃以叉股挾之以哺須臾能盡一小甌自是日加所食身亦漸長不半歲乃復其初察則授與故職馳驅氣力且無少異後十餘年捍蠻戰死于陳集異記人暴長大皇甫及者其父為太原少尹甚鍾愛之及生如常兒至咸通壬辰歲年十四矣忽感異疾非有切肌徹骨之苦但暴長耳逾時而身越七尺帶兼數圍長啜大嚼復三倍於昔矣明年秋無疾而逝三水小牘人化為水歙客經潛山見蛇腹脹甚嚙一草以腹磨頃之脹消蛇去客念此草必消脹毒取置篋中夜宿旅邸鄰房有過客為腹脹所苦客取藥就釜煎一杯飲之頃間其人血肉俱化為水獨遺骸骨急挈裝而逃至明主人不測何為及潔釡炊飲則釜遍體成金乃密瘞其尸既久客至語其事春渚紀聞卒死劉太丞毗陵人有鄰家朱三者只有一子年三十餘忽然卒死脈全無請太丞治之取齊州半夏細末一大豆許納鼻中良久身微暖氣更蘇迤邐無事此必痰厥一時人問卒死太丞單方半夏如何活得死人答曰此南嶽魏夫人方外臺祕要神方救五絶病一曰自縊死氣絶二曰牆壁屋崩壓死氣絶三曰溺水死氣絶四曰鬼魘死氣絶五曰産乳死氣絶並能救之問葛生何授得此神術能活人命生曰我因入山採藥遇白衣人問曰汝非葛醫生乎我乃半夏之精汝遇人有五絶之病用我救治即活但用我作細末令乾吹入鼻中即復生矣鳯綱漢陽人常採百草花水漬之甕盛泥封自正月始迄九月末又取甕埋之百日煎丸之卒死者以藥丸納口中水下之立活時人稱為神仙云外傅消疸琇按經曰心移寒于肺肺消飲一溲二死不治又曰心移熱于肺傳為鬲消又曰疸成為消中又有脾疸膽疸齊章武里曹山跗病淳于意診其脈曰肺消疸也加以寒熱即告其人曰死不活適其共養此不當醫治法曰後三日而當狂妄起行欲走後五日死即如期死山跗病得之盛怒而以接內所以知山跗之病者意切其脈肺氣熱也脈法曰不平不鼓形弊此五藏髙之逺數以經病也琇按肺為華蓋藏位最髙故切之時不平而代不平者血不居其處琇按盛怒接內則肝傷而不藏血代者時參擊並至乍躁乍大也此兩絡脈絶琇按肝腎無氣故脈代故死不治所以加寒熱者言其人尸奪尸奪者形弊形弊者不當關灸砭石及飲毒藥也意未往診時齊太醫先診山跗病灸其足少陽脈口而飲之半夏丸琇按誤以寒熱屬少陽病者即泄注腹中虛又灸其少陰脈琇按損肝之腑損肝之母是壞肝剛絶深如是重損病者氣以故加寒熱所以後三日而當狂者肝一絡連屬結絶乳下陽明故絡絶開陽明脈陽明脈傷即當狂走琇按熱入陽明則發狂狀如傷寒又血并于陰陰氣并于陽故為驚狂後五日死者肝與心相去五分故五日盡盡則死矣陳斗嵓治一人當心一塊如盤不腫不疼但晝夜若火燎近二年形瘦色黃醫以為勞瘵為鬱火為溼痰治皆弗效陳診之曰左關脈如轉豆琇按左闕脈動仍是肝火經曰陽動則病消疸熱中以清靈丹十餘服心間團圞汗濈然又進近百服一夕心如醉大汗而愈脈經曰五藏脈小皆為消疸者消榖善飢也與此不同痺琇按經文論疸甚詳後人昧于病情故略而不舉齊王黃姬兄黃長卿家有酒召客召淳于意諸客坐未上食意望見王后弟宋建告曰君有病往四五日君腰脅痛不可俯仰又不得小溲不亟治病即入濡腎及其未舍五臟急治之方今客腎濡此所謂腎痺也宋建曰然建故有腰脊痛往四五日天雨黃氏諸倩見建家京下方石即弄之建亦欲效之效之不能起即復置之暮腰脊痛不得溺至今不愈琇按腎為作強之官強力傷之藏病及府膀胱失氣化之權故不得溲建病得之好持重所以知建病者意見其色太陽膀胱色乾腎部上及界腰以下者枯四分所故以往四五日知其發也意即為柔湯使服之十八日所而病愈史記古者患胸痺者心中急痛錐刺不得蜀醫為胸府有惡血故也遂生韭數斤搗汁令服之即果吐出胸中惡血遂瘥又蕭炳謂小兒初生與韭汁灌之吐出惡血長則無病驗韭能歸心氣而去包中惡氣治胸中也名醫録咳嗽琇按五藏六府皆冇咳症症各不同大抵藏病不已乃移于府素問五氣所病以肺為咳者肺為金邪中之則有聲又曰秋傷于溼冬生咳嗽衍義云有人患氣嗽將期年或教以橘紅生薑焙乾神曲等分為末糊丸如梧桐子大食後臨臥以米飲送下三十丸兼舊患膀胱氣緣服此皆愈孫兆治一人病吐痰頃刻升餘喘咳不定面色鬱黯精神不快兆告曰肺中有痰胸膈不利當服仲景葶藶大棗湯㵼中有補一服訖已覺胸中快利略無痰唾矣錢仲陽治一人病咳面色青而光氣哽哽乙曰肝乘肺此逆候也若秋得之可治今春不可治其人祈哀強與藥明日吾藥再㵼肝而少却三補肺而益虛又加唇白法當三日死今尚能粥當過期至五日而絶滑伯仁治一婦妊五月病嗽痰氣逆惡寒咽膈不利不嗜食者浹旬伯仁診其脈浮弦形體清癯曰此上受風寒也越人云形寒飲冷則傷肺投以溫劑與之致津液開腠理散風寒而嗽自安矣張子和治常仲明病寒熱往來時咳一二聲面黃無力懶思飲食夜寢多汗日漸瘦削諸醫作虛損治之用二十四味燒肝散鹿茸牛膝補養二年口中痰出下部轉虛戴人斷之曰上實也先以涌劑吐痰二三升次以柴胡飲子柴胡飲子身人參芍大黃薑黃芩胡炙草歸白生柴降火益水一月餘復舊此二陽病也內經云二陽之病發心脾不得隱曲心受之則血不流故女子不月脾受之則味不化故男子少精此二證名異而實同仲明之病乃脾受之味不化也一男子年二十餘病勞嗽數年其聲欲出不出戴人曰曾服藥否其人曰家貧未常服藥戴人曰年壯不妄服藥者易治先以苦劑涌之次以舟車濬川丸大下之更服重劑瘥一田夫病勞嗽一涌一泄已減大半次服人參補肺湯臨臥更服檳榔丸以進食一男子五十餘病傷寒咳嗽喉中聲如鼾與獨參湯一服而輕再服而鼾聲除至三四服咳嗽亦漸退凡服參三斤而愈梅師治久患㗇呷咳嗽喉中作聲不得眠取白前搗為末溫酒調服二錢衍義云白前保定肺氣一婦人患肺熱久嗽身如炙肌瘦將成肺勞以枇杷葉木通欵花紫苑杏仁桑白皮等分大黃減半各如常製治訖同為末蜜丸如櫻桃大食後臨臥含化一丸未終劑而愈丹溪治一人年五十餘患咳嗽惡風寒胸痞滿口稍乾心微痛脈浮緊而數左大於右蓋表盛裏虛問其素嗜酒肉有積後因接內涉寒冒雨忍飢繼以飽食酒肉而病先以人參四錢麻黃連根節一錢半與二三貼嗽止寒除改用厚朴枳實青陳皮瓜蔞半夏為丸與二十貼參湯送下痞除看他用藥先後輕重之法一人患乾咳嗽聲啞用人參橘紅各一錢半白术二錢半夏曲一錢茯苓桑白皮天冬各七分甘草青皮各三分五貼後去青皮加五味二十粒知母地骨皮瓜蔞仁桔梗各五分作一貼入薑煎再加黃芩五分仍與四物入童便竹瀝薑汁并炒黃柏二藥晝夜間服兩月聲出而愈先以六君子加天冬桑皮青皮後配入養陰清火潤肺之品妙一壯年因勞倦不得睡患嗽痰加黃白膿聲不出時春寒醫與小青龍四貼喉中有血絲腥氣逆上兩日後覺血腥漸多有血一線自口右邊出一茶頃遂止晝夜十餘次脈弦大散弱左大為甚此勞倦感寒強以辛甘燥熱之劑動其血不治恐成肺痿以參茋歸术芍陳草帶節麻黃煎熟入藕汁服之二日而嗽止乃去麻黃又與四貼而血除但脈散未收食少倦甚前藥除藕汁加黃芩砂仁半夏半月而愈一人痰嗽脅下痛先以白芥子薑汁竹瀝瓜蔞桔梗連翹風化硝薑蜜丸噙化茶清下仇山村少時嘗苦嗽百藥不瘳有越州學録者教其取桑條向南嫩者不拘多少每條約寸許用二十一枝納於沙石鍋中用水五碗煎至一碗遇渴飲之服一月而愈仇逺稗史一人嗽但用香櫞去核薄切片以酒煮熟用蜜拌勻睡起服一人事佛甚謹適苦嗽踰月夜夢老僧呼謂之曰汝嗽只是感寒吾有方授汝但用生薑一物切作薄片焙乾為末糯米糊丸芥子大空心米飲下三十丸覺如其言數服而愈癸志張致和治沈方伯良臣患痰嗽晝夜不能安寢屢易醫或曰風曰火曰熱曰氣曰溼湯藥雜投形羸食減幾至危殆其子求治張診脈沉而濡溼痰生寒復用寒涼脾家所苦宜用理中湯加附子誰謂痰症無用附子之理此土生金之法其夜遂得貼枕徐進調理之劑果安或曰痰症用附子何也殊不知痰多者戴元禮常用附子療治之出證治要訣汪石山治一婦年三十因夫買妾過於憂鬱患咳嗽甚則吐食嘔血兼發熱惡寒自汗醫用葛氏保和湯不效汪診其脈皆浮濡而弱按之無力晨則近數午後則緩午後則緩故可治曰此憂思傷脾病也脾傷則氣結而肺失所養故嗽遂用麥門冬片芩以清肺陳皮香附以散鬱人參黃茋芍藥甘草以安脾歸身阿膠以和血數服病少寬後每貼漸加參至五六錢月餘而愈一人年二十餘病咳嗽嘔血盜汗或腸鳴作泄午後發熱此弱症也汪切脈細數無復倫次因語之曰難經云七傳者逆經傳也初因腎水涸竭是腎病矣腎邪傳之於心故發熱而夜重心邪傳之於肺故咳嗽而汗泄肺邪傳之於肝故脅痛而氣壅肝邪傳之于脾故腸鳴而作泄脾邪復傳之於腎而腎不能再受邪矣今病兼此數者死不出旬日之外矣果如期而逝一人形長色蒼瘦年逾四十每遇秋涼病咳嗽氣喘不能臥春暖即安病此十餘年矣醫用紫蘇薄荷荆芥麻黃等以發表用桑白皮石膏滑石半夏以疏內暫雖輕快不久復作汪診之脈頗洪滑此內有鬱熱也秋涼則皮膚緻密內熱不能發泄故病作矣內熱者病本也今不治其本乃用發表徒虛其外愈不能當風寒疏內徒耗其津愈增鬱熱之勢遂以三補丸加大黃酒炒三次貝母瓜蔞丸服仍令每年立秋以前服滚痰丸三五十粒病漸向安一婦年逾五十其形色脆弱每遇秋冬痰嗽氣喘自汗體倦臥不安席或嘔惡心汪診之脈皆浮緩而濡曰此表虛不禦風寒激內之鬱熱而然表虛人皆知之內有鬱熱知之者鮮矣遂用參茋各三錢麥冬白术各一錢黃芩歸身陳皮各七分甘草五味各五分煎服十餘貼而安每年冬寒病發即進此藥次年秋間滯下腹痛後重脈皆濡細稍滑汪曰此內之鬱熱欲下也體雖素弱經云有故無損遂以小承氣湯利兩三行腹痛稍除後重未退再以補中益氣湯加枳殼黃芩芍藥煎服先攻後補而兼清仍用醋澆熱磚布裹坐之而愈是年遇寒嗽喘亦不作矣一婦産後咳嗽痰多晝輕夜重不能安寢飲食無味或時自汗醫用人參清肺湯嗽愈甚汪診之脈浮濡近駛曰此肺熱也令服保和湯五貼而愈一婦懷妊七月嗽喘不能伏枕兩臀坐久皮皆潰爛醫用蘇子降氣湯三拗湯參蘇飲俱罔效汪診之右脈浮濡近駛按之無力左脈稍和曰此肺虛也宜用補法遂以人參錢半白术麥冬各一錢茯苓八分歸身阿膠黃芩各七分陳皮五味甘草各五分煎服六七貼而愈一童子八歲傷寒咳嗽痰少面赤日夜不休醫以參蘇飲數日嗽甚汪診之脈洪近駛曰熱傷肺也令煎葛氏保和湯病如失保和湯方欵知母花貝母米天冬麥冬冬粉仁杏仁桔梗五味阿膠甘草歸身兜鈴生地紫苑紫蘇百合薄荷一婦年三十質脆弱産後咳嗽痰臭或作肺癰治愈劇延及兩腳漸腫至膝大便溏小腹脹痛午後發熱面紅氣促不能向右臥此弱症脈一數便不治汪診脈虛小而數曰凡咳嗽左右向不得眠者上氣促下㵼泄者發熱不為瀉減者皆病之反也按此皆原於脾經曰脾生諸臭入肺腥臭入心焦臭入肝腐臭自入為穢臭蓋脾不能運行其溼溼鬱為熱釀成痰而臭矣經曰左右者隂陽之道路也脾虛則肺金失養氣劣行遲壅遏道路故咳嗽氣促不能右臥也脾虛必奪母氣以自養故心虛發熱而見於午也脾主溼溼勝則內滲於腸胃為溏泄外滲於皮膚為浮腫辨症精確令用參茋甘草補脾為君白术茯苓滲溼為臣麥冬保肺氣酸棗仁以安心神為佐陳皮前胡以消痰下氣為使用東壁土以受陽光最多用之以為引用蓋土能解諸臭用以補土亦易為力矣此取錢氏黃土湯之義也服一貼前症略減病者喜甚汪曰未也數服後無反復方是佳兆否則所謂過時失治後發寒熱真陽脫矣泄而腳腫脾氣絶矣何能收救一婦人患症同前醫作肺癰治而用百合煎湯煮粥食反劇汪診其脈細弱而緩緩則可治治以參茋甘溫等劑不數服而愈此由治之早也一人年十九面白質弱因勞思夢遺遂吐血碗許自是微咳倦弱後身忽大熱出疹疹愈鬱熱發疹故愈陰囊癢甚搓擦水流敷以壁土囊腫如盞大遂去土以五倍塗少蜜炙為末敷之遂愈因感風寒其嗽尤甚繼以左右脅痛汪診脈虛而數見其畏風寒嘔惡倦動糞溏氣促曰此金極似火也夫心屬火而藏神腎屬水而藏志二經俱屬少陰而上下相通今勞思則神不寧而夢志不寧而遺遺則水不升而心火獨亢也肝屬木而藏血其象震震為雷心火既亢則同類相應引動龍雷之火載血而越出於上竅矣肝脈環繞隂器亦因火擾而痛癢腫脹也火勝金故肺經虛而乾咳皮毛為之合亦為火鬱而發疹大腸為之府故亦傳導失宜而糞溏然金虛不能平木故木火愈旺而凌脾脾虛則嘔惡而食減經曰壯火食氣脾肺之氣為壯火所食故倦於動作而易感風寒也經言兩脅者隂陽往來之道路也為火阻礙則氣不利而痛矣然火有虛有實有似火而實非火故經言有者求之無者求之虛者責之實者責之此治火之大法也前症之火皆虛非水溼之可折伏惟甘溫之劑可以祛除譬之龍雷之火日出則自潛伏矣若用苦寒降火正如雨驟雷烈而火愈熾矣世醫治火不惟不求之有無虛實專泥咳嗽吐血皆屬陰虛誤服參茋不救之語概用滋隂等劑况此服滋陰已百餘貼而病反增劇豈可仍以隂虛治之耶且經言形寒飲冷則傷肺又謂脾胃喜溫而惡寒今用甘溫健其脾則肺金不虛而咳嗽氣促自愈肝木有制而脅痛吐血自除虛妄之火亦自熄矣遂以參茋各四錢神曲山查各七分白术麥冬貝母各一錢甘草五分炒乾薑四分配黑薑炒煎服十餘貼脈數減嗽少除精神稍健但後又適新婚不免耗損真隂將何以制其虛妄之火耶蓋咳屬肺金數脈屬火咳而脈數火尅金也冬月水旺而見數脈亦違時也大凡病見數脈多難治療病久脈數尤非所宜故為之深慮耳論弱症之案未有如此篇精切詳明者當熟讀而綱領之臨症自有得心應手之快薛已治大參李北泉時吐痰涎內熱作渴肢體倦怠勞而足熱用清氣化痰益甚薛曰此腎水泛而為痰法當補腎不信更進滾痰丸一服吐瀉不止飲食不入頭暈眼閉始信薛言用六君子湯數劑胃氣漸復却用六味丸月餘諸症悉愈地官李伯川每勞咳嗽薛用補中益氣湯即愈一日復作自用參蘇飲益甚更服人參敗毒散項強口噤腰背反張薛曰此誤汗亡津液而變痓矣仍以前湯加附子一錢四劑而愈司廳陳國華素隂虛患咳嗽以自知醫用發表化痰之藥不應用清熱化痰等藥症愈甚薛曰此脾肺虛也不信用牛黃清心丸更加胸腹作脹飲食少思足三陰虛症悉見朝用六君加桔梗升麻麥冬五味補脾土以生肺金夕用八味丸補命門火以生脾土諸症悉愈經云不能治其虛安問其餘此脾土虛不能生肺金而金病復用前藥而反瀉其火吾不得而知也中書鮑希伏素陰虛患咳嗽服清氣化痰丸及二陳芩連之類痰益甚更用四物黃柏知母玄參之類腹脹咽啞右關脈浮弦左尺脈洪大薛曰脾土既不能生肺金陰火又從而尅之當滋化源朝用補中益氣加山茰麥冬五味夕用六味丸加五味三月餘喜其慎疾得愈武選汪用之飲食起居失宜咳嗽吐痰用化痰發散之藥時仲夏脈洪數而無力脈數不時則生惡瘡關內逄芤則內癰作胸滿面赤吐痰腥臭汗出不止薛曰水泛為痰之證而用前藥是謂重亡津液得非肺癰乎不信仍服前藥翌日果吐膿脈數左三右寸為甚始信用桔梗湯一劑膿數頓止再劑全止面色頓白仍以憂惶薛曰此症面白脈澀不治自愈白肺色也澀肺脈也色脈得令故愈又用前藥一劑佐以六味丸治之而愈儒者張克明咳嗽用二陳芩連枳殼胸滿氣喘侵晨吐痰加蘇子杏仁口出痰涎口乾作渴薛曰侵晨吐痰脾虛不能消化飲食胸滿氣喘脾虛不能生肺金涎沫自出脾虛不能收攝口乾作渴脾虛不能生津液遂用六君加炮薑肉果溫補脾胃更用八味丸以補土母而愈上舍史瞻之每至春咳嗽用參蘇飲加芩連桑杏乃愈一日復發用前藥益甚加喉瘖少陰之脈循喉嚨就治左尺洪數而無力薛曰此腎經陰火刑剋肺金當滋化源遂以六味丸料加麥冬五味炒山梔及補中益氣湯而愈一男子夏月咳嗽吐痰用胃火藥不應薛以為火乘肺金用麥門冬湯而愈後因勞役復嗽用補中益氣加桔梗山梔片芩麥冬五味而愈但口乾體倦小便赤澀日用生脈散而愈韓飛霞旅寓北方夏秋久雨天行咳嗽頭痛用益元散蔥薑湯調服應手取效日發數十斤此蓋甲巳土運溼令痰壅肺氣上竅但瀉膀胱下竅而已不在咳嗽例也江篁南治一少年患咳嗽潮熱診之曰病得之好內飲以四物減芎加麥冬紫苑阿膠地骨皮嗽熱良已既而不謹復作他醫以寒涼之劑投之胸痞滿食減下泄江以甘溫助其中氣病旋已所以知病得之好內者切其脈芤而駛真陰損熱內生也後緩而弱脾重傷於苦寒也江應宿奉叔父方伯之滇南抵任月餘叔父患痰嗽氣喘不能伏枕腰痛大便祕小溲淋滴胸膈痞悶嘔吐清水召官醫十餘曹治之罔效素有痰火哮喘病每遇天寒或飲食起居失宜即舉發動經旬餘不藥亦愈本欲不服藥則痞悶二便脹急難當命宿診之六脈緩弱無力右為甚緩為脾脈虛而協溼故宜利小便而投四苓二陳即告之曰叔父非往昔痰火此屬內傷蓋因科場選士勞倦傷脾兼以長途雨露受濕溼傷脾脾氣虛則肺金失養清濁相干隂陽反作經曰濁氣在上則生䐜脹故痞滿而嘔清水宜分利隂陽不得專執升清之説滲溼利水因喘而痞宜利小便進四苓散加陳皮半夏竹茹一劑而大小便通利嘔水亦止是夜伏枕安卧次早换六君子加當歸阿膠牛膝麥冬五味諸症悉除但覺倦怠時吐稠濁痰一二口痰滯肺上竅宜瀉下竅膀胱再單用六君倍加參术少佐貝母升麻麥冬五味補脾土調理叔父笑曰汝十年之後當以醫顯吾幾違首丘之願遂上疏棄官而歸途中日進前藥一服共服參斤餘抵家平復如初喘琇按素問有云肺病者喘咳逆氣腎病者喘咳蓋以肺腎為子母之藏又肺主出氣腎主納氣也洪邁曰豫淳熙丁未四月有痰疾因晚對上宣諭使以胡桃肉三顆生薑三片臨卧時服之畢則飲湯三兩呷又再嚼桃薑如前數且飲湯勿行動即就枕既還玉堂如恩指敬服旦而嗽止痰不復作輯之事亦類此云已志信州老兵女三歲因食鹽蝦過多齁喘之狀乳食不進貧無可召醫治一道人過門見病女喘不止教使取甜瓜蒂七枚研為粗末用冷水半茶盞許調澄取清汁呷一小呷如其言才飲竟即吐痰涎若膠黏狀胸次既寬齁喘亦定少日再作又服之隨手愈凡三進藥病根如掃此藥味極苦難吞咽謂之曰甜瓜蒂苦誠然類編羅謙甫治一貴婦年踰五十身體肥盛當八月中霖雨時行外傷溼因過飲酒及潼乳內傷溼腹脹喘滿聲聞舍外其症重極不得安臥大小便澀滯氣壅于上氣口脈大兩倍於人迎關脈沉緩而有力溼甚羅思霖雨之溼飲食之熱溼熱太盛上攻於肺神氣躁亂故為喘滿邪氣盛則實實者宜下之為製平氣散加白牽牛二兩半生半熟青皮三錢檳榔三錢陳皮五錢大黃七錢利大便而小便亦通內經曰肺苦氣上逆急食苦以泄之故以白牽牛苦寒㵼氣分溼熱上攻喘滿故以為君陳皮苦溫體輕浮理肺氣青皮苦辛平散肺中滯氣為臣檳榔卒溫性沉重下痰降氣大黃苦寒蕩滌滿實故以為使使亦有重于臣耶再商之為細末每服三錢煎生薑湯調下無時一服減半再服喘愈仍有胸膈不利煩熱口乾時時咳嗽再與加減㵼白散以桑白皮一兩地骨皮知母陳皮青皮桔梗各五錢黃芩炙甘草各三錢銼如麻豆大每服五錢水煎服數劑良愈華他有云盛則為喘減則為枯活人書云發喘者氣有餘也盛而為喘者非肺氣盛也喘為氣有餘者亦非肺氣有餘也氣盛當認作氣虛有餘當認作不足肺氣果盛又為有餘當清肅下行而不喘以其火入于肺衰與不足而為喘焉故言盛者非肺氣盛也言肺中之火盛也言有餘者非言肺氣有餘也言肺中之火有餘也故㵼肺以苦寒之劑非㵼肺也㵼肺中之火實補肺也用者不可不知一人六旬餘素有喘症或唾血痰平居時則不喘稍行動則氣喘促今人此症頗多急以黃柏知母滋腎丸空心服七八十丸其症大減此坎離丸能泄衝脈之火者故如此效也洪輯居溧陽西寺事觀音甚謹幼子佛護三歲病痰喘醫不能治凡五晝夜不乳食五晝夜不乳虛可知症危輯憂惶禱于觀音至中夜妻夢一婦人自後門入告曰何不服人參胡桃湯覺而語輯輯灑然悟曰是兒必活此蓋大士垂救爾急取新羅人參寸許胡桃一枚不暇剝治煎成湯灌兒一蜆殼許喘即定再進遂得醒眀日以湯剝去胡桃皮取淨肉入藥與服喘復作乃只如昨法治之信宿而瘳此藥不載方書蓋人參定喘而帶皮胡桃則斂肺也丹溪治一人貧勞秋深渾身熱手足疼如煅晝輕夜重服風藥愈痛氣藥不效脈澀而數澀為少血為瘀數則為熱右甚于左飲食如常形瘦蓋大痛而瘦非病也用蒼术酒黃柏各一錢半生附一片生甘草三分麻黃五分研桃仁九箇煎入薑汁令辣熱服一起仍用溫散濕熱非溫散不行故耳四貼去附子加牛膝一錢八貼後氣喘痛略減意其血虛因多服麻黃陽虛被發動而上奔當補血鎮墜以酸收之以四物倍川芎芍藥加人參二錢五味十二粒與二貼喘定三日後脈減大半澀如舊仍痛以四物加牛膝參术桃仁陳皮甘草檳榔生薑五十貼而安後因負重腹痛食少前藥加黃茋三分二貼而愈一人五七月間喘不得卧主于肺麻黃石膏各二錢柴胡桑白皮各一錢甘草五分黃芩一錢半服之一汗而愈後以五味甘草桑白皮人參黃芩遂安一人痰多喘嗽用白术半夏香附蒼术各一兩黃芩杏仁各半兩薑汁糊丸服一婦人六十八歲惡寒發熱自四月來久病得痰嗽眠卧不得食少心膈痛口乾其嗽五更煩甚以白术三錢芍藥二錢半炒枳殼麻黃各二錢片芩一錢半桔梗蘇梗葉各一錢木通五分炙甘草些少五味二十粒入竹瀝一人日病喘不得臥肺脈沉而澀此外有風涼溼氣遏內熱不得舒以黃芩陳皮木通各錢半麻黃蘇葉桂枝各一錢黃連乾生薑各五分薑連並用妙甘草些少一人體虛感寒發喘難臥以蒼术白术麻黃防風炒片芩各五分半夏枳殼各一錢桂枝木通炙甘草各三分薑二片同煎研杏仁五枚此方半夏為君兼解表三方前一方為熱多而設後一方為寒多而設也浦江吳輝妻孕時足腫七月初旬産後二日洗浴即氣喘但坐不得卧者五箇月産後元虛氣喘豈能至五月耶惡寒得暖稍寬兩關脈動尺寸皆虛無百藥不效朱以牡丹皮桃仁桂枝茯苓乾薑枳實厚朴桑皮紫蘇五味瓜蔞實煎湯服之一服即寬二三服得臥其病如失蓋作汚血感寒治之也滑伯仁治一人肺氣焦滿病得之多欲善飲且殫營慮中積痰涎外受風邪發則喘喝痰咳不自安為製清肺泄滿降火潤燥苦辛之劑遂安沈宗常治廬陵人脹而喘三日食不下咽矣視脈無他問何食飲對以近食羊脂沈曰得之矣脂冷則凝溫尉之所及也溫之得利而愈天台李翰林有莫生患喘疾求醫李曰莫生病日久我當治之乃取青橘皮一片展開入江子江子即巴豆也一箇以麻線繫定火上燒煙盡存性為末生薑汁酒一鍾呷服之到口便定實神方也程明祐治張丙患中滿氣喘衆醫投分心氣飲舟車丸喘益甚一醫曰過在氣虛以參茋補之喘急瀕死程診之曰病得痰滯經絡藏腑否寒生䐜脹投滚痰丸初服腹雷鳴再服下如雞卵者五六枚三服喘定氣平繼以參苓平胃散出入三十日復故所以知丙得之痰滯經絡者切其脈沉而滑痰候也虞恆德治一羽士年五十餘素有喘病九月間得發熱惡寒證喘甚脈洪盛而似實此洪盛脈恐為涼藥所激而然一醫作傷寒治而用小柴胡湯加枳殼陳皮等藥六日後欲行大承氣一醫曰此傷食也宜用枳實導滯丸爭論不決虞視之二醫皆曰脈實氣盛當㵼虞曰此火盛之脈非真實也觀其短氣不足以息當作虛治金匱云病人無寒熱而短氣不足以息者實也此以虛治當以意逆不可徒執古人之法也何以故正亦因有寒熱也而用補中益氣湯加麥冬五味入附子三分煎服二貼脈收斂四貼而病減輕六貼全安汪古朴治一婦形肥而長面色紫淡産後病喘不能卧消榖善飢汗出如洗婁全善云産後喘極危多死也而况汗出如洗乎其得生處全在消穀善飢汪診視曰此陰虛陽亢當合東垣丹溪兩法治之遂以升陽滋陰之劑旬餘而愈汪石山治一人體肥色白年近六十痰喘聲如曳鋸夜不能卧汪診之脈洪浮六七至中或有一結曰喘病脈洪可治也脈結者痰礙經隧耳宜用生脈湯加竹瀝服之至十餘貼稍定患者嫌遲更醫服三拗湯猶以為遲益以五拗湯危矣于是復以前方服至三四十貼病果如失一人年踰六十病氣喘汪診之脈皆縈縈如蛛絲曰病不出是夜矣果如期而逝一中年男子久喘每發時不食數日聲撼四鄰百治不效脈寸沉伏關滑遂於未發時用人參白术當歸地黃薑汁製之瓜蔞實陳皮茯苓黃芩黃連乾薑些少煎湯下青礞石丸將發時先用神效沉香丸下之次於前藥中加杏仁枳實蘇葉倍瓜蔞實煎服一月後症減十分之八後遂守此方漸安後凡治數人以此法加減之皆效一婦人年五十餘素有嗽病忽一日大喘痰出如泉身汗如油脈浮而洪全似命絶之狀令速用麥冬四錢人參二錢五味錢半煎服一貼喘定汗止三貼後痰亦漸少再於前方加瓜蔞實錢半白术當歸芍藥黃芩各一錢半服二十餘貼而安此生脈散之功也平江沈伯寧家豐好內厚味每年到四九月內必發氣喘擡肩吐痰脈沉澀而細數諸醫用平肺之藥數年不愈如此者六七年用人參生地黃膏和當歸牛膝肉蓯蓉枸杞子五味知母黃柏天麥二冬元參末丸如梧子大每空心服百丸以救腎虛又用阿魏黃連山查沉香牛黃辰砂膽星陳皮神曲糊丸梧子大臨臥薑湯送三四十丸以治厚味服訖復用瓊玉膏二劑而安江汝潔治一老婦病虛弱氣喘左身半自頭面以下至足發熱自汗單衣被不能耐右身半自頭面以下至足厚衣被不能溫如此三年矣醫藥不效江診其六脈舉之俱微而略弦按之略洪而無力二關脈略勝於二寸經曰微則為虛又曰諸弦為飲又曰洪為陽為熱又曰無力為虛據此則知風邪入脾表裏隂陽氣血俱虛之候作也經曰治病必求其本今受風邪乃木來侵土又風自太陽而入脾先當於太陽疏泄以固表次當養脾而祛木俾脾無賊邪之患則血氣漸盛而左熱右寒之疾可除也以石膏欵花蕊各三錢官桂甘草半之研為細末以管吹入喉中濃茶送下三四分嗽喘即止次日用滋補之劑白术二錢半白芍香附各一錢半黃茋陳皮各一錢甘草三分水煎服後除芍藥加人參三錢數服而愈江應宿治朱萬里子年十七歲因服砒毒雜進解毒藥并多服泥水大吐後發喘擡肩竦體手足爪甲黑色氣不相續頻死復蘇飲食難進六晝夜不得臥時六月中旬邀宿診視脈促而面赤曰胃火衝逆用蔥煮麻黃五聖湯一匕而愈所謂火鬱發之也瘧琇按經曰夏傷于暑秋必痎瘧然必因風溼之邪而發羅謙甫治一人年踰四十七月間勞役過飲午後發熱而渴冰水不能解早晨稍輕服藥不效羅診其脈弦數金匱云瘧脈自弦弦數多熱瘧論曰疸瘧脈數素有熱氣盛於身厥逆上衝中氣實而不外泄因有所用力腠理開風寒舍於皮膚之內分肉之間而發發則陽氣盛而不衰則病矣其氣不及於寒故但熱不寒者邪氣內藏於裏而外舍於分肉之間令人消爍肌肉故名曰疸瘧月令云孟秋行夏令民多疸瘧動而得之名曰中暍以白虎湯加梔子治之其人逺行勞役暑氣有傷酒熱相搏午後時助故大熱而渴如在甑中先以柴胡飲子一兩下之後以白虎加梔子湯每服一兩數服而愈滑伯仁治一人病瘧瘠損饘粥難下咽六十餘日殆甚脈數兩關尤弦疾久體瘠而神完曰是積熱居脾且滯於飲食法當下藥再進疾去其半復投甘露飲柴胡白虎等劑浹旬而愈一婦人瘧寒熱涌嘔中滿而痛下利不食年五十餘殊困頓醫藥不效伯仁診其脈沉而遲曰是積暑與食伏痰在中當下之瘧表利裏並發論正治則先表後重甚則攻裏今以沉遲之脈斷為積暑與食伏痰非明眼不能亦治法之變或曰人疲倦若是且下利不食烏可下方擬進參附或曰云云世醫俱是如此且引醫貫為症滑曰脈雖沉遲按之有力雖利而後重下迫不下則積不能去病必不已乃以消滯丸藥微得通利即少快明日即加數服之宿積腸垢盡去向午即思食旋以薑橘參苓淡滲和平飲子調之旬餘乃復毛崈甫事母葉夫人極孝母年六十餘病痁旬餘憂甚每夕禱於北辰拜且泣妹立母傍恍惚聞有告曰何不服五苓散持一貼付之啓視皆紅色妹曰尋常此藥不如是安可服俄若夢覺以語兄兩醫云此病蓋藴熱所致當加硃砂於五苓散中以應神言才服罷痁不復作有宗室以恩添差通判常州郡守不甚加禮遂苦痁疾久而弗愈族人士蘧為鈐轄素善醫往問正話間痁作而顛撼掖不醒盡室駭懼蘧云無傷也是心中抑鬱陰陽交戰至於損厥正四將軍飲子證也先令灼艾灸至四百壯了無蘇意於是急製藥以一附子火炮去皮臍四分之二訶子四箇炮去核陳皮四箇全者洗淨不去白甘草四兩炙各自切碎為四服水二盞薑棗各七煎去五之三持飲病者初一杯灌之不納至再稍若吞咽三則倐起坐四服盡頓愈更不復作一時救急如此此病痁臨發日逐杯併服無不神效類編丹溪治一貴人年近六十形壯色蒼味厚春得痎瘧用劫藥屢止屢作綿延至冬來求治知其痰少惟胃氣未完天寒欠汗非補不可以一味白术末之粥丸空腹熱湯下二百丸盡二斤大汗而愈如此者多但略有加減耳一人形色俱實患痎瘧而且痢自恃強健能食但苦汗出朱曰瘧非汗不愈可慮能食耳此非痢也胃熱善消脾病不化食積與病勢甚矣宜謹節以養胃氣省出入以避風寒俟汗出透而安不從所言尋卒一婦病瘧三日一發食少經不行已三月脈無時冬寒議作虛寒治以四物湯加附茱茰神曲丸服疑誤再診見其梳洗言動如常知果誤也三陰瘧亦有實者醫貫之論不可拘也經不行非無血為痰礙脈無非血氣衰乃積痰生熱結伏其脈而不見耳當作溼熱治與三花神佑丸旬日後食進脈出帶微弦朱謂胃氣既全不用藥瘧當自愈而經行也令其淡滋味果應一少婦身小味厚痎瘧月餘間日發於申酉間日瘧疾頭痛身熱口乾寒多喜飲極熱辣湯脈伏面色慘晦作實熱痰治之脈伏喜熱湯無不作虛寒治此案治法可法以十棗湯為末粥丸黍米大服十粒津咽日三次令淡飲食半月後大汗而愈一人性急好酒色味厚適多憂怒患久瘧忽一日大發熱大便所下臭積大孔極陷下此大虛也脈弦大而浮發熱臭積脈弦大浮皆實也而作極虛治真妙不可言須看浮字久瘧之後又無新客感而大發熱非虛而何遂以瓦磨如錢圓燒紅投童便中急取起令乾以紙裹於痛處恐外寒乘虛而入也以參歸陳皮煎湯服淡味半月而安一婦久痢因哭子變瘧醫與四獸飲之類一日五六作汗如雨不止凡兩月朱診之脈微數食少疲甚蓋痢後無陰悲哀傷氣又進溼熱之藥助起旺火正氣愈虛汗既大出無邪可治陰虛陽散死在旦夕豈小劑之所能補遂用參术各二兩白芍一兩黃茋半兩炙甘草二錢作大服濃煎一鍾日服三四次兩日寒熱止而愈一壯男子因勞役發嗽得痎瘧又服發散藥三發後變為發熱舌短語言不正痰吼有聲脈洪數似滑洪數似滑之脈兼之發熱似乎表裏未清而用獨參湯須看他服發散藥之後之變症耳先用獨參湯加竹瀝二蛤殼後吐膠痰三塊舌本正而言可辨症未退後用人參黃茋湯服半月諸症皆退粥食調養二月方能起立而愈一老人瘧嗽半年兩尺脈數而有力色稍枯蓋服四獸飲等劑中焦溼熱下流伏結於腎以致腎火上連於肺瘧嗽俱作參术芩連升麻柴胡調中一二日與黃柏丸作虛而協熱治兩日夜夢交通而不泄此腎熱欲解故從前陰精竅而走散無憂也次日瘧嗽皆止一富家子年壯病瘧自卯足寒至酉分方熱至寅初乃休一日一夜止蘇一時因思必為接內感寒所致問云九月暴寒夜半有盜急起不著中衣當時足冷十日後瘧作蓋足陽明與衝脈合宗筋會於氣街入房太甚則足陽明與衝脈之氣皆奪於所用其寒乘虛而入舍於二經二經過脛會足跗上於是二經之陽氣益損不能滲榮其經絡故病作卒不得休因用參术大補附子行經加散寒以取汗數日不汗病如前因思足跗道逺藥力難及再以蒼术川芎桃枝煎湯盛以髙桶扶坐浸足至膝外治取汗法亦佳食頃以前所服藥飲之汗出通身而愈一人年三十餘久瘧虛甚盜汗得嗽嗽來便熱夜甚以甘草些少白术二錢半防風一錢人參黃茋黃連各五分乾薑二分數服而愈二婦人同病瘧一者面光澤乃溼在氣分非汗不解兩發汗出而愈一者面赤黑色乃暑傷血分瘧赤黑面色為暑用四物加辛苦寒之劑二日發唇瘡而愈臨病處治其可執一乎虞恆德治二男子年皆踰四十五各得痎瘧三年矣俱發於寅申己亥日一人晝發於己而退於申一人夜發於亥而退於寅虞曰晝發者乃陰中之陽病宜補氣解表與小柴胡湯倍加柴胡人參加白术川芎葛根陳皮青皮蒼术夜發者為陰中之陰病宜補血疏肝用小柴胡合四物加青皮各與十貼教其加薑棗煎於未發前二時服每日一貼服至八貼同日得大汗而愈胡仲禮者真州人也國初以醫名能精其術遂大聞於時尤妙太素脈有病瘧者久莫能止求視其脈曰此瘧母也須百劑方愈病者歸服藥至半意憚之中止而病未瘳他日以問醫孫姓者脈之曰此須五十劑乃可如言而病已蓋孫其壻即傳業於仲禮者其精如此孫琳治張知閣久病瘧遇熱作時如火年餘骨立醫以為虛投之茸附熱愈甚招孫診視投小柴胡湯三貼服之熱減十九又一服脫然孫曰是名勞瘧熱從髓出又加剛劑剝損氣血安得不瘦蓋熱不一有去皮膚中熱者有去臟腑中熱者若髓熱非柴胡不可北方銀州柴胡只須一服南方力減故三服乃效今却可進滋補藥矣薛已治一婦人久瘧形體怯弱內熱晡熱自汗盜汗飲食少思月事不行服通經丸虛症悉具此因虛而致瘧因瘧而致經閉用補中益氣湯及六味丸各百餘劑瘧愈而經行矣一婦人久瘧瘧作則經不行形虛脈大頭痛懶食大便泄瀉小便淋漓口乾舌裂內熱腹膨皆元氣下陷相火合病壯火食氣用補中益氣湯治之尋愈惟不時頭痛乃加蔓荆子而痛止又兼用六味丸而經行一婦人久瘧兼之𢃄下發後口乾倦甚薛用七味白术散加麥冬五味作大劑與之恣飲再發稍可乃用補中益氣加茯苓半夏十餘劑而愈凡截瘧薛常以參术各一兩生薑四兩煨熟煎服即愈或以大劑補中益氣加煨薑其功尤捷一産婦患瘧發熱作渴胸膈脹滿遍身作痛三日不食咽酸噯氣此是飲食所傷脾胃不能消化用六君加神曲山查四劑而不作酸乃去神曲山查又數劑而飲食進其大便不通至三十五日計飲進七十餘碗腹始悶令用豬膽汁導而通之其糞且甚燥琇按得非燥藥過劑耶婦人令用導法頗不雅潤以下之頗為簡易一産婦患瘧久不愈百病蜂起其脈或洪大或微細或弦緊或沉伏難以名狀用六君子加炮薑二十餘劑脈症稍得又用參术煎膏佐以歸脾湯百餘劑而瘥冬官朱省菴停食感寒而患瘧自用清脾截瘧二藥食後腹脹時或作痛服二陳黃連枳實之類小腹重墜腿足浮腫加白术山查吐食未化薛曰食後脹痛乃脾虛不能尅化也小腹重墜乃脾虛不能升舉也腿足浮腫乃脾虛不能運行也吐食不消乃脾胃虛寒無火也治以補中益氣加吳茱萸炮薑木香肉桂一劑諸症頓退飲食頓加不數劑而痊一儒者秋患寒熱至春未愈久病屬虛胸痞腹脹用人參二兩生薑二兩煨熟煎服寒熱即止更以調中益氣加半夏茯苓炮薑數劑元氣頓復後任縣尹每飲食勞倦疾作服前藥即愈一上舍每至夏秋非停食作瀉必瘧痢癨亂遇勞吐痰頭眩體倦發熱惡臭用四物二陳芩連枳實山梔之類患瘧服止截之藥前症益甚時或遍身如芒刺然時身如芒刺虛而協溼以茯苓半夏以滲之薛以補中益氣加茯苓半夏內參茋各三錢歸术各二錢十餘劑少愈若間斷其藥諸病仍至連服三十餘劑全愈又服還少丹半載形體充實汪石山治老人年近七旬形色蒼白勞倦病瘧瘧止胸膈痞悶惡心痰多不思飲食懶倦口苦頭痛夜夢紛紜兩腿時瘡脈皆浮濡無力且過於緩醫書云脈緩無力者氣虛也又云勞則氣耗又云勞倦傷脾脾傷不能運化精微以養心故心神為之不寧宜倣歸脾湯例治之人參二錢麥冬白术各一錢歸身酸棗仁茯神各八分黃芩陳皮各六分枳實甘草各五分川芎七分煎服二貼夜臥頗安但覺後欲吐或則吞酸吐痰減去枳實加山查七分吳茱萸二分服之仍用參术歸芎山梔山查丸服而愈博按此案原刻謬誤一人年踰四十形瘦色紫淡素勞傷脾令常服參苓原刻誤茋白术散獲安住藥一年復勞飲冷酒不爽是夜頭又被溼遂致身冷不安早起面目俱黃醫用零筋草根酒煎服之吐瀉大作又加薑煎則心熱膈壅不進飲食大便祕結瘧作胸膈痞塞粥飲不入食湯則噯氣嘔逆吐涎意向甚惡汪診左脈浮澀原刻濡無力肝脈頗弦右肺部濡散脾部浮微二部脈皆似有似無或呼吸相引又覺應指曰此脾虛之極也初因勞熱飲冷頭又被溼內熱因鬱故發為黃若用搐藥以泄上焦溼熱則黃自退乃用草藥酒煎溼熱雖行而脾氣存也幾希且勿治瘧當補脾為急用人參五錢橘紅一錢時時煎湯呷之令其旦暮食粥以養胃氣彼如所言旬餘乃愈一人年踰四十不肥不瘦形色蒼白季秋久瘧醫用丹劑一丸止之嘔吐不休粒米不入大便或㵼面赤妄語身熱汪診脈皆浮而欲絶仲景云陽病得陰脈者死今面赤身熱妄語其證屬陽而脈微欲絶則陰脈矣此一危也經曰得榖者昌失榖者亡今粒米不入此二危也又曰泄而熱不去者死今數泄㵼而面赤身熱不除此三危也以理論之法在不治古人云治而不愈者有矣未有不治而愈者也令用人參五錢白术二錢炒米原刻御米一錢橘紅原刻陳皮八分煎服至四貼始漸有生意一人年近三十形瘦淡紫八月間病瘧汪診之左脈頗和而駛右脈弱而無力令用清暑益氣湯加減服之覺胸膈痞悶遂畏人參更醫作瘧治而瘧或進或退服截藥病稍增延至十月復請汪診脈皆浮小而濡帶數右手則尤近不足曰正氣久虛邪留不出瘧尚不止也宜用十全大補湯減桂加茯苓倍參服之漸愈一人年踰三十形瘦色蒼八月間病瘧或用截藥或用符水延纒不愈胸膈痞滿飲食少進大腸痔血小便短赤瘧發於夜寒少熱多自汗汪診左脈濡小而緩右脈濡弱無力曰此久瘧傷脾也用人參二錢白术歸身茯苓各一錢芍藥八分黃芩七分枳實五分陳皮六分甘草四分煎服後因痔血未止吞槐角丸而血愈多仍服前方而血減矣一婦面色淡紫年逾四十九月病瘧夜發渴多汗嘔吐粒食不進數日汪診脈皆浮濡而緩按之無力遂用人參五錢橘紅八分甘草七分白术一錢煎服十餘貼瘧止食進漸有生意但大便二十日不通再診右脈浮小無力左脈沉弱無力前方加歸身一錢大麻仁錢半如舊煎服病除一婦年逾三十瘦長淡紫六月産八月瘧瘧止胸膈痞悶才勞喘咳血身熱腳冷汪診左脈濡緩原本悮弱右肺部頗洪關尺二部亦弱以生地黃白芍麥門冬白术各一錢阿膠歸身牡丹皮各七分人參八分陳皮五分煎服一貼再令熱服瀉止膈快但盜汗而腳軟前方加黃茋錢半黃柏七分依前煎服愈一人年三十形色蒼白因勞感熱九月盡病瘧頭痛口渴嘔吐胸膈痞塞不進飲食自汗倦怠熱多寒少醫用截藥病增飲水即吐汪診脈皆浮大而濡頗弦曰此勞倦傷脾熱傷氣之瘧也令用人參三錢黃茋錢半白术麥冬各一錢枳實五分山查七分歸身黃柏知母各七分乾薑甘草各三兮石翁用藥妙在佐使得宜後學須倣此例煎服三貼病減復勞病作前方人參加作四錢服之而安一人年三十九久瘧醫用補中益氣湯或止或作延及半年因解髮結勞傷咳嗽醫以前方加半夏五味遂致喉痛聲啞夜不能寢請汪視之右脈浮濡左脈小弱曰經云隂火之動發為喉痺是也此必色欲不謹久服參茋徒增肺中伏火耳令以甘桔湯加鼠黏子蜜炙黃柏煎服二貼喉痛除而聲出繼服保和湯五貼而安一人年三十餘形瘦淡紫素勞久瘧三日一發於夜三陰瘧嘔吐熱多寒少不進飲食小便頻數氣喘咳嗽日夜打坐不能伏枕幾月矣頭身骨節皆痛數月不能伏枕虛也然真正虛脫不能待幾月之喘嗽而况兼症有頭身骨節痛耶此為虛中有實醫作瘧治病甚衆皆危之脈皆浮虛緩弱而不甚大若脈洪大當作極虛治汪以參术加陳皮黃柏枳實知母麥冬北五味煎服三貼病退越二日復病令用四物加童便服之則嗽除喘止始能就臥再用八物湯除茯苓加枳實香附又用枳术丸加人參砂仁歸身黃芩吞服調理熱來常服童便半年而安加減法妙一婦形色脆白年五十餘憂勞六月背瘡艾灸百餘壯瘡散病瘧身熱自汗口渴頭暈嘔吐泄瀉不進飲食寒少熱多自用清暑益氣湯病甚汪診左脈浮微似有似無右脈浮小按之不足曰病雖屬瘧當作虛治依方而用清暑益氣湯固與病宜但邪重劑輕病不去耳令以參术加作五錢茋三錢茯苓一錢陳皮七分甘草五分煎服病退一人因冒風病瘧熱多寒少頭痛倦怠食少自汗已服參蘇飲一貼汪診之脈皆浮虛近駛曰此虛瘧也非參蘇飲所宜以參茋歸术等藥煎服五六貼而愈且諭之曰元氣素虛不宜發散凡遇一切外感必須以補元氣為主少加發散之藥以佐之庶為允當一婦常患咳嗽加以瘧疾因左脅有塊瘧止有孕嗽尚不寧喉乾痰少時或嘔吐出頑痰鍾許乃止夜亦如是常覺熱盛胸膈壅滿背心亦脹常要打摩妊已六月夜半如厠身忽寒戰厚覆少頃乃愈越兩日夜半又發寒熱如瘧肢節痛上身微汗口中覺吐冷氣胸喉如有物礙心前虛腫按之即痛頭痛氣喘坐臥不寧醫作傷寒發散又作痰症而用二陳不效汪往視之脈皆濡而近滑曰胃虛血熱也此症亦虛中有實但斷以血熱辨在何處想因頭痛四肢痛心前按之痛耶先以四君子湯加黃芩枳殼麥冬煎服二三貼以保胃氣繼以四物加檳榔枳殼麻仁大黃三服下之非明眼如何敢下遂滯下後重虛坐努責怠倦不食時或昏悶亂呌食則脹不食則飢四肢痛腳腫琇按此或悮下之過汪曰胃虛非湯藥所宜令合枳术丸加人參當歸黃芩服月餘諸症悉除胎亦無損一人形瘦色脆年近三十四月間腹痛惟覺氣轉左邊五日而止次年四月亦然八月病瘧間日一發寒少熱多十餘日止第三年四月八月如舊腹痛瘧作四年五年四月八月亦然但瘧作腹痛瘧止痛止旬餘瘧除又瀉痢十餘日瀉止瘧又作但不腹痛五日瘧瘥仲冬感寒頭痛發熱腹及右脅脹痛氣喘溏瀉內黑外紅日夜五六次內熱不減飲食難進醫用三乙承氣湯二貼繼用木香枳术丸諸症稍定午後發熱愈熾遇食愈脹得瀉略寬陰火乘脾頭痛不減請汪診視脈皆浮濡近駛曰氣屬陽當升虛則下陷矣又屢服消剋攻下之劑所謂虛其虛也安得不脹而頻瀉乎經云下者舉之其治此病之謂歟或曰脹滿者氣有餘也積塊者氣固結也經云結者散之有餘者損之今有餘而補固結而益何也此一辨不可少汪曰人身之氣猶天之風風性剛徑揚砂走石孰能禦之孟子曰至大至剛是也餒則為物障蔽反以為病若能補養以復其剛大之性則衝突排蕩又何脹滿不散積塊不行經曰壯者氣行則愈怯者著而成病是也蓋氣之強壯者則流動充滿或有積滯亦被衝突而行散何病之有氣之怯弱則力小遲鈍一有積滯不免因循承襲積著成病法當升陽益胃遂以參苓白术散煎升麻湯妙神效調服月餘仍令丸服一料而愈一人形瘦色脆年三十餘八月因勞病瘧寒少熱多自汗體倦頭痛胸痞略咳而渴惡食大便或祕或溏發於寅申己亥夜醫議欲從丹溪用血藥引出陽分之例治之汪診其脈濡弱近駛稍弦曰察形觀色參脈乃屬氣血兩虛瘧已深入厥陰矣專用血藥不免損胃又損肺也淹延嵗月久瘧成勞何也自汗嗽渴而蒼术白芷豈宜例用惡食胸痞而血藥豈能獨理古人用藥立例指引迷途耳因例達變在後人推廣之也遂以補中益氣湯加川芎黃柏枳實神曲麥門冬倍用參茋术煎服三十餘貼諸症稍除瘧猶未止乃語之曰今當冬氣沉潛瘧氣亦因之以沉潛難使浮達况汗孔亦因以閉塞經曰瘧以汗解當此閉藏之時安得違天時以汗之乎且以參术枳實陳皮歸身黃芩丸服胃氣既壯來年二月瘧當隨其春氣而發泄矣果如期而安一人年三十形色頗實初因舟行過勞受熱咳嗽不已續又病瘧素有熱淋服藥或作或輟汪診之脈皆濡弱近緩左尺略駛曰此熱傷氣也肺為氣主氣傷肺亦傷矣故發咳嗽其瘧亦因熱而作令用人參錢半白术麥冬茯苓各一錢歸身知母各七分青皮黃柏甘草各五分煎服而安九月復舟行過勞傷熱其瘧復作或一日一發或二日三日一發或連發二日無期而發虛可知醫治不效仍用前方煎服而安一人年三十一六月中因勞取涼夢遺遂覺惡寒連日慘慘不爽三日後頭痛躁悶須看三日後三字少陰亦有頭痛分别陰陽在此家人診之驚曰脈絶矣議作陰症欲進附子湯未決請汪治曰陰症無頭痛今病如是恐風暑乘虛入於陰分故脈伏耳非絶脈也若進附子湯是以火濟火安能復生姑待以觀其變然後議藥次日未末申初果病寒少熱多頭痛躁渴痞悶嘔食自汗大便或瀉或結脈皆濡小而駛脾部兼弦此非尋常袪瘧燥烈劫劑所能治遂用清暑益氣湯減蒼术升麻加柴胡知母厚朴川芎以人參加作二錢黃茋錢半白术當歸各一錢煎服二十餘貼而愈祁邑二尹此人也形長魁偉年逾四十六月舟中受熱病瘧寒少熱多頭痛躁渴汗多醫用七寶飲治之不愈汪診其脈浮濡而駛略弦曰此暑瘧也以白虎湯加人參三錢煎服十餘貼而瘧止程侍御形色清脆年四十餘素善飲病熱頭痛惡食泄瀉小便短少午後惡寒發熱醫用二陳平胃五苓共一服治不退反增腰腹拘急汪診視脈皆濡弱頗弦而駛曰耗血傷胃惟酒為甚復加以時熱外傷其氣內外兩傷法當從補若用草果檳榔常山半夏燥烈之劑譬之抱薪救火寧不益其病耶遂以人參二錢黃茋錢半以益皮毛不令汗泄白术茯苓石膏麥冬各一錢以導溼熱不使傷胃知母青皮神曲黃芩歸身川芎柴胡各七分以消積滯而和表裏少加甘草三分煎服十餘貼瘧止後以參苓白术散常服收功一人年三十餘八月因勞病瘧請汪診視脈皆六至而數無力曰古人云形瘦色黑者氣實血虛也又云脈數無力者血虛也間日發於午後亦血分病也以色脈論之當從血治但今汗多乃陽虛表失所衛消榖善飢乃胃虛火乘其土皆陽虛也仲景法有憑證不憑脈者兹當憑證作陽虛治以參茋各三錢白术白芍麥門冬各一錢歸身生地甘草各七分黃柏知母陳皮各五分煎服二十餘貼若用尋常驅瘧劫劑寧免後艱博案舊刻此案脫二句石山翁年逾六十形質近弱八九月酷熱時往來休歙外有藥劑之勞內有病者之憂內外弗寧晝夜不靜至十月初旬瘧作三日午後一發寒熱不甚喜熱惡寒寒去熱來則覺爽矣口乾微渴臨發昏倦嗜臥左脈沉小而數右脈浮濡無力亦近於數獨脾部弦而頗洪瘧去則脈皆大小浮沉相等惟覺緩弱而已初服補中益氣湯十餘貼病無加減夜苦盜汗繼服當歸六黃湯先補氣血黃茋每貼四錢五貼汗止瘧如舊再服白虎湯後清暑邪人參四錢石膏三錢知母一錢甘草六分米一撮煎服十餘貼而愈一人瘦長脆白年三十餘久瘧後盜汗自汗過多加以傷食吐瀉大作吐止而瀉四日不住筋惕肉瞤驚悸夢遺小便不禁汪診脈皆緩弱右則略弦而澀曰此下多亡陰汗多亡陽氣血虛也遂以參茋為君白术為臣山梔麥冬牡蠣為佐酸棗歸身山查為使加以薄桂煎服旬餘諸症稍退半年之間常覺臍下內熱一團烘烘不散時或夢遺一醫議作熱鬱固欲下之汪曰此非有餘之熱乃陰虛生內熱耳若欲下之是殺之耳宜以前方加黃柏熱當自退果驗一人年十七八時因讀書忍飢感寒得瘧延纒三年瘧愈寒氣臍左觸痛熱尉而散仍或發或止後因新娶往縣復受飢寒似病傷寒吐二日夜不止即服理中湯補中益氣湯固本丸補陰丸豬肚丸其吐或作或止飲食少進續後受飢勞倦食則飽悶子至午前睡安略爽食稍進午後氣升便覺脹悶胸膈漉漉水響四肢微厥吐水或酸或苦亦有間日吐者大便燥結小便赤短身體瘦弱不能起止汪曰雖不見脈見證必是稟賦素弱不耐飢寒宜作飲食勞倦為主而感冒一節且置諸度外夫氣升脹悶觸通者脾虛不能健運以致氣鬱而然胸膈漉漉水聲謂之留飲乃用獨參湯補養其氣血加薑以安其嘔吐黃柏以降其逆氣初服三貼臍左痛除吐止將人參加作一兩吐又復作此由補塞太過而無行散佐使故也人參減作七錢附五分炮薑七分半夏八分蒼术厚朴各七分茯苓一錢服至二十餘貼吐止食進餘病皆減頗喜肉味以手揉其肚尚有水聲汩汩微感寒腹中氣猶微動或時鼻衄數點近來忽瀉二日而自止才住前藥又覺不爽前方加黃茋四錢山梔七分減黃柏如舊煎服或曰吐水或酸或苦大便閉燥小便赤短諸書皆以為熱凡病晝輕夜重諸書皆為血病今用薑附者何也蓋吐水酸苦由脾虛不能行溼溼鬱為熱而水作酸苦也薑附性熱辛散溼逢熱則收鬱逢熱則散溼收鬱散酸苦自除大便燥結者由吐多而亡津液也小便短少者由氣虛不能運化也故用人參以養血氣則血潤燥除氣運溺通矣若用苦寒之藥則苦傷血寒傷氣反增其病矣日輕夜重為血病者道其常也此則不然雖似血病實氣病也醫作血病而用固本補陰等藥反不解非血病可知所以日輕夜重日則陽得其位而氣旺故病減夜則陽失其位而氣衰故病重經曰至於所生而持自得其位而起是也故病則有常有變而醫不可不達其變也病將愈猶或鼻衄數點者此浮溜之火也加山梔氣味薄者以潛伏之久當自愈後聞食母豬肉前病復作汪曰臟腑習熟於藥病亦見化於藥再無如之何矣此案宜熟玩一人年踰四十形肥色蒼因勞後入房感風夜半瘧作自汗寒少熱多一日一作醫用清脾小柴胡四獸等劑不效漸至二日或三日一發三陰瘧汪診左脈浮洪虛豁而數右脈虛小散數頭眩耳鳴四肢懶倦手足麻大便溏左脅瘧母時或夢遺虛無疑矣發則嘔吐多痰或辰或午發至酉戌乃退每至三十日連發二次子時發至黎明其發微辰時發至酉戌其發如常乃用參茋歸术知母麥冬厚朴陳皮大劑與之初服一劑痞塊反高小腹脹痛汪曰若藥不瞑眩厥疾不瘳再當服之此一轉非認症真不能數貼後脈覺稍靜不數病者曰脈平而病不減何也汪曰瘧邪已深非數劑之藥旦夕之功所能愈當久服待春分陽氣發揚方得全愈苟惑人言不惟瘧不能止或癆或鼓難免後憂夫瘧因感風暑寒水而作也經曰皮膚之外腸胃之內氣血之所舍也氣屬陽風暑陽邪而中於氣血屬陰寒水陰邪而中於血先中陽邪後中陰邪則先寒後熱先中陰邪後中陽邪則先熱後寒陽邪多則熱多渴而有汗陰邪多則寒多而汗少氣血受邪而居於其舍悍衛之氣運行不息不受邪也日行陽二十五度夜行陰二十五度每一刻則周身一度行與邪遇則邪壅遏其道路故與相搏而瘧作也搏則一勝一負負則不與之搏而悍衛無礙故瘧止矣可知久病後發寒熱忽然無故而止當思元氣脫盡連寒熱不能作耳夫邪之盛衰因氣血之盛衰氣血盛邪亦盛氣血衰邪亦衰久則氣血衰或靜養二三日氣血復盛而邪亦盛悍衛行與之遇又復相抗而瘧每三十日連發二次者蓋二十八九三十日晦日也陰極陽生之時夜半微陽始生而力尚弱故瘧發亦輕辰則陽旺矣故瘧亦重此瘧所感陽邪居多故隨陽氣盛衰而為之輕重其三日一發非入於藏也由氣血盛衰而然非若傷寒之傳經也或曰邪氣既因氣血而盛衰今補其氣血未免邪亦盛矣曰邪之所湊其氣必虛氣血未補終未至於強健強健邪無容留矣經曰邪正不兩立是也俞子容治嶺南一大商病瘧胸中痞悶煩躁昏不知人願得涼藥清利上膈其症上熱下寒脈沉而微以生薑附子作湯浸冷俾服溫救踰時蘇醒自言胸膈迹爽然不知實用附子也初瘧用附子人所未知若庸工見其胸中痞悶投以涼藥下之十無一生然此法惟山嵐瘴氣所致下體虛冷之人宜施若暑瘧痰瘧則别處治可也江篁南治曹氏子年二十餘客歸跋涉勞倦兼受熱飲涼水患瘧每日午先寒後熱多汗一醫為用清脾湯繼用斬鬼丹吐涎益甚後二日嘔吐不止乃用人參養胃湯二貼嘔吐如故兼痰中有血六月中旬江視之脈虛豁以二陳湯加白芍白术扁豆人參枳實山查黃連藿香薑棗出入加減八劑愈一人瘧疾更三醫不可後一醫投薑附湯可而復作每至午前大寒寒時面青手指趾甲俱青指甲青寒者多然有一症與痰相摶亦青黑色可與大熱案橘泉翁治法參看異狀戰栗寒後復熱得汗只涼瘦削危甚不可言江診六部脈沉細先投溫脾湯繼進鐵煎散三盞五更下鶴頂丹至次日午前以理中湯下黑錫丹一服如此三日而愈此乃寒症之藥也一人瘧後先寒後熱醫用清脾湯又服截瘧丹遂發惡心吐而復瀉理中湯之用因此次日鼻衄兩三碗但多煩熱求治加以小柴胡加半夏柴胡之類四服解其榮中之熱次投鐵煎散以祛瘧之邪午前將末理中湯入黃丹冷水調下黑錫丹和中􅐦痰鎮下妙理瘧即不來矣此乃熱因寒用寒因熱用之意江應宿治李祠部真陽傷寒變瘧大渴大熱煩燥引飲都城醫用六君加青皮厚朴檳榔草果十餘日不效召豫診視六脈洪數微弦與小柴胡去半夏加白虎湯一劑而渴止再劑熱退而愈豫時有儀揚之行李問已後當服何藥豫曰公勞傷心脾將來但恐寤而不寐宜歸脾湯調理後果煩躁不寐遣幼官往儀召豫至則諸醫衆論紛紜將欲下豫止之曰胃不和則臥不安豈可妄下其家人囂囂以下為是竟投下藥豫固辭不復往綿延三月餘弗瘳遂養病歸籍多方調理而後愈此蓋輕病重治皆醫之過也阮上舍患瘧已經三年或三日一發或五七日一發發於午後未申時諸寒熱無期唯瘧有期背心隱隱寒起戰栗兩膝齊冷至足一二刻寒退熱作煩渴引飲屢治或暫止或半月一月又復作右脅下一塊如杯行步稍遠即覺微痛乘馬勞頓亦作痛九月初診得弦數之脈投柴胡桑白皮各五錢鱉甲醋炙二錢作一服加煨薑水煎服即止更與四君加柴胡鱉甲調理月餘間與瘧母丸不復舉矣夫久瘧乃屬元氣虛寒蓋氣虛則寒血虛則熱胃虛則惡寒脾虛則發熱陰火下流則寒熱交作或吐涎不食泄瀉腹痛手足逆冷寒戰如栗若誤投以清脾截瘧等耗氣血藥多致綿延不休若兼停食宜用六君枳實厚朴若食已消而不愈用六君子湯若內傷外感用藿香正氣散若內傷多而外感少用人參養胃湯若勞傷元氣兼外感用補中益氣加川芎若勞傷元氣兼停食補中益氣加神曲陳皮若氣惱兼食用六君加香附山梔若咽酸或食後口酸當節飲食病作時大熱躁渴以薑湯乘熱飲之此截瘧之良法也每見發時飲啖生冷物者病或少愈多致脾虛胃損往往不治大抵內傷飲食者必惡食外感風寒者不惡食審係勞傷元氣雖有百症但用補中益氣湯其病自愈其屬外感者主以補養佐以解散其邪自退若外邪既退即補中益氣以實其表若邪去不實其表或過發表虧損脾胃皆致綿延難治凡此不問陰陽日夜所發皆宜補中益氣湯此不截之截也夫人以脾胃為主未有脾胃實而患瘧痢者若專主發散攻裏降火導痰是治其末而忘其本以前乃治瘧之大略如不應當分六經表裏而治之夫瘧三日一發丹溪以發日之辰分屬三陰而藥無三陰之别總用撫芎當歸紅花蒼术黃柏等藥掣起陽分瘧入陰分由陽虛陷入也惟宜陽分助氣之藥加血藥引入陰分亦可掣起專用血藥祗恐邪愈下陷何以能掣起哉名醫類案卷三
