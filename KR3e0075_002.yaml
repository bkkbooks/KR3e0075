body:
  text: 名醫類案卷二明江瓘撰內傷琇按七情之病皆為內傷兹苐以飲食勞倦當之故所列多厖雜淳于意治齊丞相舍人奴從朝入宮臣意見之食閨門外望其色有病氣臣意即告宦者平平好為脈學臣意所臣意即示之舍人奴病告之曰此傷脾氣也當至春膈塞不通不能食飲法至夏泄血死琇按脾不統血肝不藏血宦者平即往告相曰君之舍人奴有病病重死期有日相君曰卿何以知之曰君朝時入宮君之舍人奴盡食閨門外平與倉公立即示平曰病如是者死相即召舍人奴而謂之曰公奴有病否舍人曰奴無病身無痛者至春果病至四月泄血死所以知奴病者脾氣周乘五藏傷部而交故傷脾之色也望之殺然黃土敗察之如死青之兹木賊衆醫不知以為大蟲不知傷脾所以至春死病者胃氣黃黃者土氣土不勝木故至春死所以至夏死者脈法曰病重而脈順清者曰內關內關之病人不知其所痛心急然無苦若加以一病死中春一愈順及一時其所以四月死者診其人時愈順愈順者人尚肥也奴之病得之流汗數出炙於火而以出見大風也齊中郎破石病臣意診其脈告曰肺傷不治當後十日丁亥溲血死即後十一日溲血而死破石之病得之墮馬僵石上琇按跌撲傷肺肺嬌藏也而主氣凡受刑甚者肺葉亦損所以知破石之病者切其脈得肺隂氣其來散數道至而不一也色又乘之夭白所以知其墮馬者切之得畨隂脈番隂脈入虛裏乘肺脈肺脈散者固色變也乘之所以不中期死者師言曰病者安穀即過期不安穀則不及期其人嗜黍黍主肺故過期所以溲血者診脈法曰病養喜隂處者順死喜養陽處者逆死其人喜自靜不躁又久安坐伏几而寐故血下泄王石韋之死後所以見血者以喜居隂處姚僧坦治梁元帝患心腹病諸醫皆請用平藥僧坦曰脈洪而實此有宿食非用大黃必無瘥理元帝從之果下宿食愈沈繹字誠莊吳郡人好學篤行洪武中其外舅陳翁謫戍蘭州無子遂被逮補軍伍時肅王疾劇或稱誠莊善醫王召令診視問平日所嗜知為乳酪用濃茶飲數杯而愈謂人曰茶能蕩滌膈中之膩也王神其術奏授本府良醫羅謙甫治一人年六十有五至元戊寅夏日因勞役飲食不節又傷冷飲得疾醫者皆以為四時證治之不愈逮十日羅往治之診視曰右手三部脈沉細而微太隂證也左手三部脈微浮而弦虛陽在表也大抵隂多而陽少今所苦身體沉重溼四肢逆冷寒自利清穀引衣蓋覆氣難布息懶言語此脾受寒溼中氣不足故也仲景言下利清穀急當救裏宜四逆湯溫之內經復有用熱逺熱之戒口乾但欲嗽水不欲咽早辰身涼而肌生粟午後煩躁不欲去衣昏昏睡而面赤隱隱紅癍見於皮膚此表實裏虛故也亦有見癍為隂盛于內逼陽于外者若許學士之治侯輔病是也內虛則外證隨時而變羅治中風案以為病邪入於經則動無常處症互相出見此案見癍則曰內虛外症隨時而變詳內外之證乃飲食勞倦寒傷於脾胃非四時之證明矣治病必察其下博按內經云治病必察其下謂察其時下之宜也舊刻以下文有標本字遂改下為本謬矣今適當大暑之時而得內寒之證以標本論之時標也病本也用寒藥則順時而違本用熱藥則從本而逆時此乃寒熱俱傷必當從乎中治中治者溫之是也寒溼之症又見紅癍看他從乎中治溫以散之妙亦見看病以日期為凖標本為憑時此案從乎中治以溫羅治一人泄脈沉緩而弦捨從症而用薑附當因病之輕重緩急而緩急之不得執成見于我也遂以錢氏白术散加升麻就本方加乾葛甘草解其癍少加白术茯苓以除溼而利小便人參藿香木香和脾胃進飲食㕮咀每服一兩煎服再服癍退而利止身溫而神出次服異功散治中湯辛溫之劑一二服五日得平止藥主人曰病雖少愈勿藥可乎羅曰藥攻邪也內經曰治病以平為期邪氣既去強之以藥變證隨起不若以飲食調養待其真氣來復此不藥而藥不治而治之理存焉從之旬日良愈博兒赤馬刺年三十餘因獵得兔以火炙食頗多抵暮至營極困倦渴飲潼乳斗餘是夜腹脹如鼓疼痛悶亂卧起不安欲吐不吐欲瀉不瀉此症不發熱無外感手足無所措舉家驚惶羅診其脈氣口大二倍於人迎乃應食傷太隂經之候也右手關脈又且有力蓋燒肉乾燥因而多食則致渴飲乾肉得潼乳之溼是以滂滿於腸胃乃非峻急之劑則不能去遂以備急丸五粒覺腹中轉矢氣欲利不利復投備急丸五粒又與無憂散五錢須臾大吐又利十餘行皆物與清水相合而下約二斗餘腹中空快氣漸調至平旦以薄粥飲少少與之三日後再以參术等藥調其中氣七日而愈此所謂飲食自倍腸胃乃傷者也一婦人三十餘嵗憂思不已飲食失節脾胃有傷面色黎黑不澤環唇尤甚心懸如飢狀腎虛又不欲食氣短而促大抵心肺在上行榮衛而光澤於外宜顯而不藏腎肝在下養筋骨而強於內當隱而不見脾胃在中主傳化精微以灌四傍沖和而不息其氣一傷則四臟失所憂思不已氣結而不行飲食失節氣耗而不足使隂氣上溢於陽中故黑色見於面色黑非瘀血又經云脾氣通於口其華在唇今水反侮土故黑色見於唇此隂陽相反病之逆也上古天真論云陽明脈衰於上面始焦故知陽之氣不足非助陽明生發之劑則無以復其色博按原刻脫十四字故用沖和順氣湯作溼熱鬱火治用升陽之劑妙以葛根一錢五分升麻防風各一錢白芷一錢黃茋八分人參七分甘草四分芍藥蒼术各三分以薑棗煎配方之妙可師可法已午前服取天氣上升之時使人之陽氣易達也數服而愈此隂出乘陽治法也衛生寶衛太常少卿劉叔謙之內李氏中統三年春欲歸寧不得又因勞役四肢困倦躁熱惡寒時作疼痛不欲食食即嘔吐氣弱短促怠惰嗜卧醫作傷寒治之解表發汗次日傳變又以大小柴胡之類治之至十餘日後病愈劇主家云前藥無效莫非他病否醫曰此傷寒六經傳變至再經傳盡當自得汗而愈翌日見爪甲微青黑色足脛至腰如氷冷目上視而覩不轉睛咽嗌不利小腹冷氣上衝心而痛嘔吐不止氣息欲絶溫救何疑羅診其脈沉細而微不見傷寒之證無六經證此乃中氣不足妄將傷寒治之發表攻裏中氣愈損壞證明矣乃以辛熱之藥附子炮去皮臍乾薑炮各五錢草豆蔲炙甘草各三錢益智仁白芍藥丁香藿香白术各二錢人參陳皮吳茱萸各一錢半當歸一錢名曰溫中益氣湯㕮咀一兩作一服至夜藥熟而不能進續續灌下一口飲至半夜稍有呻吟之聲身體漸溫忽索粥飲至旦食粥兩次又煎一服投之至日髙衆醫齊至診之曰脈生證回矣越三日不更衣或欲以脾約丸潤之羅曰前證用大辛熱之劑陽生證回今若以大黃之劑下之恐寒不協轉生他證衆以為不然遂用脾約丸二十丸至夜下利兩行翌日面色微青精神困倦嘔吐復作羅再以辛熱前藥溫之而愈內經曰寒淫於內治以辛熱佐以苦甘溫附子乾薑大辛熱助陽退隂故以為君丁香藿香豆蔲益智茱萸辛熱溫中止吐用以為臣人參當歸白术陳皮白芍炙甘草苦甘溫補中益氣和血脈協力用以為佐使也真定路總管劉仲美年逾六旬宿有脾胃虛寒之證至元辛巳閏八月初天氣隂寒因官事勞役渴而飲冷夜半自利兩行平旦羅往診視其脈絃細而微四肢冷手足心寒唇舌皆有褐色青腹中微痛氣短不思飲食羅曰內經云色青者肝也肝屬木唇者脾也脾屬土木來尅土故青色見於唇也舌者心之宫水挾木勢制火凌脾故色青見於舌也難經云見肝之病則知肝當傳之脾故先實脾土今脾已受肝之邪矣潔古先師云假令五臟勝各形已勝補不勝而瀉其勝重實其不勝微瀉其勝而以黃茋建中湯加芍藥附子主之且芍藥味酸瀉其肝木微瀉其勝黃茋甘草甘溫補其脾土是重實其不勝桂附辛熱瀉其寒水又助陽退隂飴糖甘溫補脾之不足肝苦急急食甘以緩之生薑大棗辛甘大溫生發脾胃升騰之氣行其榮衛又能緩其急每服一兩依法水煎服再服而愈史丞相年近七旬至元丁卯秋間因內傷自利數行覺肢體沉重不思飲食嗜卧懶言語舌不知味腹痛頭亦痛而惡心醫以通聖散大劑服之覆以厚衣遂大汗出前證不除反增劇易數醫四月餘不愈病已久羅診視得六脈沉細而微弦不欲食食即嘔吐中氣不調滯於升降口舌乾燥頭目昏眩肢體倦怠足胻冷卧不欲起素不飲酒肢體本瘦又因內傷自利復汗是重竭津液脾胃愈虛不能滋榮周身百脈故使然也非甘辛大溫之劑則不能溫養其氣經云脾欲緩急食甘以緩之又脾不足者以甘補之黃茋人參之甘補脾緩中故以為君形不足者溫之以氣當歸辛溫和血潤燥木香辛溫升降滯氣生薑益智草豆蔲仁辛甘大熱以蕩中寒理其正氣白术炙甘草陳皮甘苦溫乃厚腸胃麥蘖麯寬腸胃而和中神麯辛熱導滯消食為佐使也名曰參术調中湯㕮咀一兩薑三片煎服之嘔吐止飲食進越三日前證悉去左右曰前證雖去九日不更衣如何羅曰丞相年髙氣弱既利且汗脾胃不足陽氣虧損津液不潤也豈敢以寒涼有毒之劑下之仲景曰大發汗後小便數大便堅不可用承氣湯如此雖內結宜以蜜煎導之須臾去燥屎二十餘塊遂覺腹中空快上下氣調又以前藥服之喜飲食但有所傷則橘皮枳术丸消導之月餘乃平復丞相曰病去矣當服何藥防其復來羅曰但慎言語節飲食不可再藥許學士治一男子素嗜酒因暴風寒衣薄遂覺倦怠不思飲食半月至睡後添發熱遍身痛如被杖微惡寒天明脈之六脈浮大按之豁豁然左為甚許作極虛受風寒治之人參為君黃茋白术當歸身為臣蒼术甘草陳皮通草乾葛為佐使大劑與之至五貼後遍身汗如雨凡三易被得睡覺來諸證悉平滑伯仁治一人病怔忡善忘口淡舌燥多汗四肢疲軟發熱小便白而濁衆醫以內傷不足擬進茸附伯仁診其脈虛大而數曰是由思慮過度厥陽之火為患耳夫君火以名相火以位相火代君火行事者也相火一擾能為百病况厥陽乎百端之起皆自心生越人云憂愁思慮則傷心其人平生志大心髙所謀不遂抑鬱積久致內傷也然抱薪救火望安奚能遂命服補中益氣湯硃砂安神丸空心則進小坎離丸月餘而安丹溪治一人臘月因齋素中飢而胃寒作勞遂發熱頭疼與小柴胡湯自汗神昏視聽不能脈大如指脈大為虛似有力熱不退冬月而發熱頭痛自汗乃太陽中風宜桂枝湯不可用小柴胡脈大如指視聽不能內傷重而外感輕求其脈大如指不能視聽之故恐為小柴胡涼劑激之而然與參术黃茋熟附炙甘草作大劑服之一日汗少二日熱減能視聽初用藥至四日前藥中加蒼术與二貼再得汗熱除乃去蒼术附子作小劑服三日而安一少年九月間發熱頭疼妄語大渴醫與小柴胡十餘貼熱愈甚九月發熱頭痛在太陽症如何就渴又非傳邪合病焉有妄語如是內傷若用小柴胡是殺之也朱視其形肥面帶白稍露筋骨脈弦大而數左為甚遂作虛證治之以蒼术為君妙法茯苓芍藥為臣黃茋為佐附子一片為使與二貼而證不減或謂不當用附子曰虛甚誤投寒藥人肥而脈左大於右事急矣非附子則參茋焉能有速效再與一貼乃去附子而作大劑與之五十貼琇按誰能耐此大汗而愈又自調養兩月平復一少年因勞倦大熱而渴恣飲泉水次日熱退言視謬妄自言腹脹不能轉側不食戰掉脈澀而大右為甚灸氣海三十壯用白术黃茋各二錢熟附五分與十貼不效又增發熱而渴但少進稀粥丹溪曰此氣欲利而血未應也於前藥去附加酒當歸以和血有熱加參一錢半與三十貼而安一肥白人年壯因勞倦成病秋間大發熱已服柴胡等藥七八貼矣兩手脈洪數而實觀之形色知其脈本不實以服涼藥所致因與溫補藥黃茋附子湯冷飲二貼困睡微汗而解脈亦稍軟繼以黃茋术湯脈漸斂小而愈是肥白人虛勞多氣虛也一老人飢寒作勞患頭疼惡寒發熱表邪骨節疼無汗妄語時作時止前證俱屬表邪但時作時止虛症可知况一起妄語又非陽明在腑內傷可知自服參蘇飲取汗汗大出而熱不退至第四日診其脈洪數而左甚此因飢而胃虛加以作勞陽明雖受寒氣不可攻擊當大補其虛俟胃氣充實必自汗而解以參茋歸术陳皮炙甘草每貼加附子一片一晝夜盡五貼至第五日口稍乾言有次諸症雖解熱尚未退乃去附加芍藥又兩日漸思食精爽間與肉羮又三日汗自出熱退仍以汗解脈雖不散洪數尚存朱謂此脈洪當作大論大則為虛年髙而誤汗此後必有虛證見又與前藥至次日自言病以來不更衣凡十三日矣今穀道虛坐迸痛努責如痢狀不堪自欲用大黃巴豆等劑朱曰大便非實閉乃氣因誤汗虛不得充腹無力可努認症精確仍用前補藥間以肉汁粥及瑣陽粥與之一日半濃煎椒蔥湯浸下體外治法亦佳方下大軟便塊不結硬五六枚診其脈仍未斂此氣血仍未復論脈妙又與前藥兩日小便不通小腹滿悶頗苦但仰卧則點滴而出朱曰補藥未至目光如電於前藥倍加參茋兩日小便方利又服補藥半月而安治盧兄汗後再發熱妄語治吕仲汗後熱不退妄語治陶明節熱退後目不識人言語謬誤皆用參茋歸术等補劑而愈信哉譫語多屬虛也項彥章治一人病發熱惡風而自汗氣奄奄弗屬諸醫作傷寒治發表退熱而益增項診隂陽俱沉細隂脈且微數論症宜桂枝湯然脈當浮緩今沉細又無頭痛內傷何疑處以補中益氣之劑醫止之曰表有邪而以參茋補之邪得補而愈盛必死此藥矣項曰脈沉裏病也微數者五性之火內扇也氣不屬者中氣虛也是名內傷經曰損者溫之飲以前藥而驗虞恆德治一人年三十因勞倦傷食致腹痛䐜脹面黃十日後求診得右手氣口脈洪盛而滑右關浮診虛大而滑重按則沉實左寸關亦弦滑而無力兩尺皆虛而伏虞曰此中氣不足脾氣弱而不磨當補瀉兼施而治初與補中益氣湯二服次日與枳實導滯丸八十丸大便去二次次日又與補中益氣湯如此補一日瀉一日二十日服補藥十貼導滯丸千數腹脹退而安一人年四十五正月間路途跋涉勞倦發熱身體略痛而頭不痛自以為外感而用九味羌活湯三貼汗出熱不退前後又服小柴胡湯五六貼執愈甚經八日召虞診視至卧榻前見煎成湯飲一盞在案問之乃大承氣湯將欲飲切其脈右三部浮洪略弦而無力左三部略小而亦浮軟不足虞曰汝幾自殺此內傷虛症服此藥大下必死伊曰我平生元氣頗實素無虛損證明是外感無疑也虞曰將欲作陽明內實治而下之歟脈既不沉實又無目疼鼻乾潮熱譫語等證將欲作太陽表實治而汗之歟脈雖浮洪而且虛又無頭痛脊強等證今經八日不應仍在表汝欲作何經而治之乎精切詳明伊則唯唯不語以補中益氣湯加附子大劑與之是夜連進二服天明往診脈略平和伊言尚未服仍謂前效欲易外感退熱之藥虞曰前藥再飲二服不效當罪我又如前二服脈證俱減半伊始曰我幾誤矣去附子再煎二服與之熱退氣和而愈但體猶困倦如前服前藥二十餘貼始得強健復元而安一人三十餘九月間因勞倦發熱醫作外感治用小柴胡黃連解毒白虎等湯反加痰氣上壅狂言不識人目赤上視身熱如火衆醫技窮八日後虞診六脈數疾七八至右三部豁大無力左略弦而芤虛症無疑虞曰此病先因中氣不足又內傷寒涼之物致內虛發熱因與苦寒藥太多為隂盛隔陽之證幸元氣少充未死耳以補中益氣加熟附二錢乾薑一錢又加大棗生薑煎服衆醫笑曰此促其死也黃昏時服一劑痰氣遂平而熟寐伊父曰自病不寐今安卧鼾聲如平時至夜半方醒始識人而諸病皆減又如前再與一劑至天明得微汗氣和而愈劉宗序治一婦六月間勞倦中暑其兄仰同知喜看方書為用六和湯香薷飲之類反加虛火上升面赤身熱後邀劉診視六脈疾數三部豁大而無力劉曰此病先因中氣不足內傷瓜果生物致內虛發熱非六和香薷所能治况夏月伏隂在內重寒相合所以夏月多此等症此為隂盛隔陽之症急用補中益氣湯加附子三錢乾薑一錢同煎置冰中浸冷服之其夜得熟睡至天明微汗而愈仰謝曰伏隂之説既聞命矣但不識以藥冰之何也劉曰此即內經熱因寒用寒因熱用之義仰歎服張養正治蘇州聞教諭遘羸疾吳醫治之率用三白湯無竒效張至診治亦用三白湯家人曰前藥用之多矣張正色曰子勿嘵嘵吾用湯使不同遂投熟附二三片煎俾服之即瘥薛已治一儒者素勤苦惡風寒表鼻流清涕表寒噤虛噴嚏表薛曰此脾肺氣虛不能實腠理彼不信服祛風之藥肢體麻倦虛痰涎自出寒殊類中風薛曰此因風劑耗散元氣隂火乘其土位遂以補中益氣加麥冬五味治之而愈秀才劉允功形體魁偉不慎酒色因勞怒頭暈仆地痰涎上湧寒手足麻痺麻屬氣血虛口乾引飲六脈洪數而虛乃腎經虧損不能納氣歸源而頭暈不能攝水歸源而為痰陽氣虛熱而麻痺虛火上炎而作渴辨症精確用補中益氣合六味丸料治之而愈其後或勞役或入房其病遂作用前藥隨愈秀才陳時用素勤勞因怒口斜痰盛脈滑數而虛此勞傷中氣怒動肝火用補中益氣加山梔茯苓半夏桔梗數劑而愈錦衣楊永興形體肥厚筋骨軟痛痰盛作渴喜飲冷水或用愈風湯天麻丸等藥痰熱益甚服牛黃清心丸更加肢體麻痺薛以為脾腎俱虛用補中益氣湯加減八味丸三月餘而痊已後連生七子夀踰七旬外科精要云凡人久服加減八味丸必肥健而多子信哉琇按此説不可為訓一婦年七十五遍身作痛不發熱而痛久虛無汗屬火筋骨尤甚不能伸屈口乾目赤火頭暈痰壅胸膈不利小便短赤夜間殊甚遍身作癢如蟲行身癢隂虛有四症用六味丸料加山梔柴胡治之諸症悉愈一産婦筋攣臂軟肌肉掣動亡陽此血氣俱虛而有熱當參别症合斷用十全大補湯而痊其後因怒而復作用加味逍遙散而愈一産婦兩手麻木服愈風丹天麻丸遍身皆麻神思倦怠晡熱作渴自汗盜汗此氣血俱虛用十全大補加炮薑數劑諸症悉退卻去炮薑又數服而愈但有內熱用加味逍遙散數劑而愈髙光祿脾胃素虛因飲食勞倦腹痛胸痞誤用大黃等藥下之譫語煩躁頭痛喘汗吐瀉頻頻時或昏憒脈大無倫次用六君加炮薑四劑而安但怠倦少食口乾發熱六脈浮數脈浮數又非表邪元氣虛也欲用瀉火之藥薛曰不時發熱是無火也脈浮大是血虛也脈虛浮是氣虛也此因胃虛五藏虧損虛症發見內虛則外症隨時而變服補胃之劑諸症悉退徐大尹因飲食失宜日晡發熱口乾體倦小便赤澀兩腿酸痛薛用補中益氣湯治之彼知醫自用四物黃柏知母之劑反頭眩目赤耳鳴唇燥寒熱痰湧大便熱痛小便赤澀又用四物芩連枳實之類胸膈痞滿飲食少思汗出如水再用二陳芩連黃柏知母麥冬五味言語譫妄兩手舉拂屢治反甚復求用參茋各五錢歸术各三錢逺志茯神酸棗仁炙甘草各一錢服之熟睡良久四劑稍安又用八珍湯調服而愈夫隂虛乃脾虛也脾為至隂因脾虛而致前證蓋脾稟於胃故用甘溫之劑以生發胃中元氣而除大熱胡乃反用苦寒復傷脾血耶若前證果屬腎經隂虛亦因腎經陽虛不能生隂耳經曰無陽則隂無以生無隂則陽無以化無隂則陽無以化不宜六味滋腎丸妙何也腎欲堅急食苦以堅之又云虛則補其母當用補中益氣六味地黃丸不穩以補其母尤不宜用苦寒之藥世以脾虛脾虛則不宜用知柏悮為腎虛輒用黃柏知母之類反傷胃中生氣害人多矣知柏並不傷胃本草可考大凡足三隂虛多因飲食勞役以致腎不能生肝肝不能生火而害脾土不能滋化但補脾土則金旺水生木得平而自相生矣一男子每遇勞役食少胸痞發熱頭痛吐痰作渴脈浮大薛曰此脾胃血虛病也脾屬土為至隂而生血故曰隂虛彼不信服二陳黃連枳實厚朴之類諸症益甚又服四物黃柏知母麥冬更腹痛作嘔脈洪數而無倫次薛先用六君加炮薑痛嘔漸愈又用補中益氣全痊劉秀才勞役失宜飲食失節肢體倦怠發熱作渴初起何以即渴頭痛惡寒明是表症須辨內傷外感之頭痛惡寒不明此理徒用溫補死先生言下矣誤用人參敗毒散痰喘昏憒揚手擲足胸間發癍如蚊所呐羅謙甫案亦見紅癍從乎中治陽許學士案亦見紅癍為隂盛于內逼于外薛用補中益氣加薑桂麥冬五味補之而愈一儒者素勤苦因飲食失節大便下血或赤或黯半載之後非便血則盜汗非惡寒則發熱血汗二藥用之無效六脈浮大心脾則澀此思傷心脾不能攝血歸源然血即汗汗即血其色赤黯便血盜汗皆火之升降微甚耳惡寒發熱氣血俱虛也乃午前用補中益氣以補脾肺之源舉下陷之氣午後用歸脾加麥冬五味以補心脾之血收耗散之液不兩月而諸症悉愈一男子發熱煩渴時或頭痛此頭痛為內傷服發散藥反加喘急腹痛其汗如水晝夜譫語此勞傷元氣誤汗所致其腹必喜手按詬之果然遂與十全大補加附子一錢服之熟睡喚而不醒舉家驚惶及覺諸症頓退屬內真寒而外假熱故肚腹喜暖口畏冷物此乃形氣病氣俱不足法當純補元氣為善一男子飲食勞倦而發寒熱右手麻木虛或誤以為疔毒敷服皆寒涼敗毒腫脹重墜而色痿黃肢體倦怠六脈浮大按之如無此脾胃氣虛也詢之果是銷銀匠因熱手入水梅銀寒凝隧道前藥益傷元氣故耳遂用補中益氣及溫和之藥煎湯漬手而愈一儒者修左足傷其大指甲少許不見血不作痛形體如故後因飲食勞倦足重墜微腫痛或晝睡或夜寐其足如故誤服敗毒之劑寒熱腫痛蓋脾起於足大指此是脾氣虛弱下陷用十全大補湯而愈談侍御但頭痛即吐清水不拘冬夏喫薑便止已三年矣薛作中氣虛寒用六君加歸茋木香炮薑而瘥一儒者四時喜極熱飲食或吞酸噯腐或大便不實足指縫溼癢此脾氣虛寒下陷用六君加薑桂治之而愈稍失調舊患復作前藥加附子錢許數劑不再舉一男子形體倦怠飲食適可足指縫溼癢行坐久則重墜此中氣虛而下陷用補中益氣加茯苓半夏而愈一男子食少胸滿手足逆冷飲食畏寒發熱吐痰時或作嘔自用清氣化痰及二陳枳實之類胸腹膨脹嘔吐痰食小便淋漓又用四苓連柏知母車前小溲不利諸病益甚薛曰此脾氣虛寒無火之症故食入不消而反出遂用八味丸補火以生土用補中益氣加薑桂培養中宫生發陽氣尋愈一男子每勞肢體時痛諸痛皆屬肝木火痛亦有屬邪火者但此為虛宜甘溫足矣不得重用辛熱或用清痰理氣之劑不勞常痛加以導溼臂痛漫腫形體倦怠內熱盜汗脈浮大按之微細此陽氣虛寒用補中益氣加附子一錢人參五錢腫痛全愈又以十全大補百餘劑而安共服人參十三斤薑附各斤餘琇按嘗見病非薑附所宜醫以重劑人參入之多不為患參能驅駕薑附信哉一婦年四十餘七月間患脾虛中滿痰嗽發熱又因溼麵冷茶吞酸吐嘔絶食誤服芩連青皮等藥益加寒熱口乾流涎不收且作渴聞食則嘔胃虛數日矣薛視之曰脾主涎此脾虛不能約制故涎自出也欲用人參安胃散惑於衆論以為胃經實火宿食治之病日增劇忽思冬瓜食少許頓發嘔吐酸水不止仍服前藥病益甚復邀薛視之則神脫脈絶瀕死矣惟目精尚動此際斷要溫補薛曰寒淫於內治以辛熱然藥莫能進矣急用鹽艾附子炒熱尉臍腹以散寒回陽又以口氣接其口氣以附子作餅熱貼臍間一時許神氣少蘇以參术附子為末更以陳皮煎膏為丸如粟米大入五七粒隨津液咽下即不嘔二日後加至十餘粒諸病少退甘涎不止五日後漸服煎劑一二匙胃氣少回乃思粥飲繼投參术等藥去附子妙溫補中氣五十餘劑而愈以上五條乃脾胃虛寒陽氣脫陷也汪石山治一人年逾五十過勞怠倦煩悶惡食不爽汪診之脈浮小濡緩曰此勞倦傷脾也冬春宜倣補中益氣湯例夏秋宜倣清暑益氣湯例依法受方服之良愈一人年三十餘嘗因冒寒發熱醫用發表不愈繼用小柴胡熱熾汗多遂昏昏憒憒不知身之所在卧則如雲之停空行則如風之飄毛虛極又兼消穀善飢夢遺諸症汪觀其形色類肥者曰此內火燔灼而然虛極矣切其脈皆浮洪如指曰脈經云脈不為汗衰者死在法不治所幸者脈雖大按之不鼓形雖長而色尚蒼可救也醫以外感治之所謂虛其虛誤矣經云邪氣乘虛而入宜以內傷為重遂以參茋歸术大劑少加桂附服十餘貼病減十之二三再除桂附加芍藥黃芩服十餘貼病者始知身卧於牀足履於地自喜曰可不死矣服久果起一人年逾五十患眩暈溲澀體倦夢遺心跳通夜不寐易感風寒諸藥俱不中病汪診之脈皆浮大或小弱無常曰虛之故也丹溪云肥人氣虛宜用參茋又云黑人氣實不宜用之果從形歟抑從色歟汪熟思之色雖黑而氣虛當從形治遂以參茋為君白术茯苓木通為臣梔子酸棗仁麥冬為佐陳皮神曲為使煎服晨吞六味地黃丸夜服安神丸逾年病安程篁墩先生形色清癯肌膚細白年四十餘患眩暈四肢倦怠夜寐心悸言亂或用加減四物湯甘寒以理血或用神聖復氣湯辛熱以理氣又或作痰火治或作溼熱治俱不效汪診之脈皆沉細不利心部散澀曰此隂脈也脾與心必憂思所傷宜倣歸脾湯例加以散鬱行溼之藥此症若不散鬱行溼即投歸脾亦不效服數貼病果向安一夕因懊惱忽變急請診視脈三五不調或數或止先生以為怪脈汪曰此促脈也促脈或痰或氣滯無足慮曰何為而脈變若此曰此必怒激其火然也以淡酒調木香調氣散一七服之其脈即如常一人形長而瘦色白而脆年三十餘得竒疾遍身淫淫循行如蟲或從左腳腿起漸次而上至頭復下於右腳自覺蟲行有聲之狀是陽虛召醫診視多不識其為何病汪往診其脈浮小而濡按之不足兼察形視色知其為虛證矣傷寒論云身如蟲行汗多亡陽也遂倣此例而用補中益氣湯多加參茋以酒炒黃柏五分佐之服至二三十貼遂愈一人形長蒼紫素善食喜啖肉年近六十時六月傷飢又被雨溼既而過食冷物腹中疼脹嘔吐次年至期前病復作醫作傷食或作冷氣率用香燥消導之藥時作時止第三年十月病又作食則胃脘勵痛近來忽吐瘀血如指者三四條大便溏瀉亦皆穢汚又常屢被盜驚今猶卧則驚寤汪診左脈沉弱右脈浮虛但覺頗弦次早復診左脈濡小無力右脈虛豁脈之不常虛之過也令用人參二錢白术錢半茯神當歸生地黃茋酸棗仁各一錢石菖蒲五分山梔子七分五貼覺力健而食進尚噯氣失氣未除飲食少味令人參加作三錢白术加作二錢服愈一人年十九形瘦面色黃白三月間微覺身熱五月間因勞傷於酒肉遂大熱膈悶夢遺盜汗午後熱甚或作食積或作隂虛或作痰火治皆不應汪診之午間脈皆洪滑汪曰食飽之餘脈不定也來早再診脈皆收斂而弱右脈尤弱遂以人參三錢黃茋錢半白术麥冬各一錢黃柏知母山查子各七分枳實甘草各五分煎服熱減汗除五服惟夢遺一月或二次三次令服固精丸五六兩仍令節食守淡味病愈後又覺熱前方減甘草加石膏一錢半牡丹皮八分一婦蒼白不肥不瘦年逾五十病舌尖痛虛火三年才勞喉中熱痛虛火或額前一掌痛早起頭暈飲食無味胸膈痞悶醫用消導清熱之藥不效汪診右脈濡散無力而緩左脈比右頗勝亦近無力十五年前哭子過甚遂作憂思傷脾哭泣傷氣從東垣勞倦傷脾之例用參茋各錢半白术芍藥天麻各一錢川芎元參各七分甘草枳實各五分黃柏陳皮各六分煎服愈一兒年十餘色白神怯七月間發熱連日父令就學內外俱勞循至熱熾頭痛正合補中益氣湯症失此不治以致吐瀉食少其父知醫乃進理中湯吐瀉少止漸次眼合咽啞不言昏昧不省人事粥飲有礙手常揾住隂囊虛寒為灸百會尾骶不應其父來問汪曰兒本氣怯又兼暑月過勞經曰勞則氣耗又曰勞倦傷脾即此觀之傷脾之病也身熱者經曰陽氣者煩勞則張蓋謂氣本陽和或煩勞則陽和之氣變為邪熱矣頭痛者經曰諸陽皆會於頭今陽氣亢極則邪熱薰蒸於頭而作痛也吐瀉者脾胃之清氣不升濁氣不降也目閉者蓋諸脈皆屬於目而眼眶又脾所主脾傷不能營養諸脈故眼閉而不開也咽啞者蓋脾之絡連舌本散舌下脾傷則絡失養不能言也目閉而啞俱為脾傷妙經曰脾胃者水穀之海五藏皆稟氣於脾脾虛則五藏皆失所養故肺之咽嗌為之不利而食難咽故心之神明為之昏瞀而不知人常欲手揾隂囊者蓋無病之人隂升陽降一有所傷則升者降降者升經曰隂陽反作是也是以隂升者降從其類而入厥隂之囊因隂多陽少故手欲揾之也此皆脾胃之病妙斷經曰土極似木亢則害承乃制也症似風木乃變象耳不治脾胃之土而治肝木之風欲求活難矣且用參茋术各三錢熟附一錢煎至熟用匙灌半酒杯候看何如服後病無進退連服二三日神稍清目稍開始有生意食仍難咽汪診之脈皆浮緩不及四至汪曰藥病相宜再可減去附子病一轉即去附子妙因時令在七月也服之漸漸稍蘇初醫或作風熱施治而用荆防芩連蠶蝎之類或作驚痰而用牛黃硃砂輕粉等藥此皆損胃之劑豈可投之兒今得生幸耳實賴其父之知醫也或曰經云無伐天和其症又無四肢厥冷時當酷暑而用附子何也此一辨不可少汪曰參茋無附子無速效而經亦曰假者反之正如冬月而用承氣之類此亦捨時從症之意也程明佑治閔德病頭痛身熱煩悶他醫汗之熱益甚脈不為汗衰乃曰此隂陽交而魂魄離也程曰非也病得之內傷飲食宿滯泄之可愈已泄之而安吳茭山治一人患內傷鬱痰氣虛諸醫皆作有餘之氣遂用四七分氣消導之劑服之氣升似火又以梔子芩柏寒涼之劑服之其患增劇四體瘦削早晨氣潮若火焚狀用涼藥而愈甚隂覆乎陽也宜升陽散鬱補胃吳診其脈浮大無力知氣虛而清氣下陷故也法宜甘溫退熱遂以補中益氣湯倍加參茋服之其熱漸平飲食倍進次以蠲飲枳术丸服十日倐然利出鬱痰升許先補胃後治痰因脈浮大無力之故然後用六味丸入紫河車一具調理月餘而瘳一男子患內傷微熱咳嗽其人素欠保養不忌葷酒日久則卧牀矣吳診之兩手脈弦以參蘇飲二貼頭目稍清餘熱未退次以滋隂降火湯未獲全效病家易醫治之醫曰此傷寒誤於藥也當得大汗而愈遂以蔥白散大發其汗其脈愈浮其熱愈熾日晡陽虛頭痛此後再汗為誤醫尚以風邪未解仍以清肌解散之藥虛益甚矣復請吳診脈之弦大虛芤改革男子則亡汗失精矣與補中益氣湯數服而安次以人參養榮湯五十貼其患遂愈江篁南治程巨患肌熱多汗時昏暈不醒目時上竄氣短氣逆虛舌上白胎腹中常鳴粒米不入診其脈兩手脈皆浮大大則為虛而駛帶弦告之曰虛損內傷症也病雖劇不死蓋得之驚恐過勞又兼使內過食傷中之過耳其家曰信然巨自楚歸江中遇盜躍入中流幾死浮水至岸衣盡濡赤身奔馳風露侵襲抵家兼有房勞飲食過度醫用消導劑過多故至此江曰經云汗出而脈尚躁疾者死目直視者死在法不治然察脈尚有神可救也按此本內傷外感之症今外邪已去內傷飲食亦消導無餘惟驚惕房勞失調補故氣虛而汗又溼熱生痰中氣虛挾痰故時時暈厥也法宜補中清痰因其苦於暈厥以參茋歸术麥冬陳皮五味柴胡甘草一劑投之暈厥止但覺氣愈逆咽膈不利何不用理中湯配二陳竹瀝厚朴杏子歸芍乃以甘桔湯加貝母煎飲之咽膈即舒次日前方除五味歸加貝母元參暈厥復作乃以人參二錢陳皮少許煎湯調人乳飲之覺安連進數劑是夜加竹瀝薑汁即能食粥三次但覺上焦作疼又次日苦多汗以人參黃茋為君酸棗仁浮麥陳皮貝母為臣牡蠣麻黃根為佐桂枝木香少許為使是夜稍安脈亦收斂而小繼以補中豁痰安神之劑出入加減兩月而愈陳球七月間行舟遇風濤驚恐又因事惱怒內傷病胸膈痞滿食少又澡浴冒風外感發熱小溲紅八月初間醫用柴芩湯痞滿益甚又加自汗一醫用清暑益氣湯除人參黃茋服之稍寬此方用得當然汗益多汗多則熱退小便黃小便紅變黃亦佳江診視左脈浮之不應沉取豁然虛右寸來促關損小而駛兩尺沉而無力先以香附湯吞大安丸繼以參术補脾為君酸棗仁斂汗為臣枳實以泄肝芍藥引金泄木當歸和血潤燥陳皮厚朴以理氣寬脹川芎山梔香附以散鬱茯苓以利水一劑汗減四之三胸膈寬食倍進夜卧安次早略覺腹脹嘔吐清痰遂寬再與二服前方加半夏生薑出入加減數日而愈吳氏子年三十餘病發熱醫用藥汗之不效又投五積散其熱益甚兼汗多足冷似溼溫症但脈不同身熱不壯不同溼溫脈關前濡關後急身微熱江診其脈告曰此內傷外感也用參茋歸术以補裏防風羌活以解其表加山查以消導之一服病減半所以知吳子病者六脈皆洪大搏指洪大搏指作虛而受風寒氣口大於人迎一倍也既而更醫熱復作且頭疼口乾鼻衄譫語昏睡江曰此汗多亡陽也投柴胡桂枝湯熱復作症見頭痛口乾鼻衄譫語乃陽明在經投柴胡桂枝湯妙不得認鼻衄為熱以血為紅汗也後以生脈飲合柴葛解肌加入生地黃芩白芍可法和其榮衛諸症減半惟口乾不除乃以麥冬生地陳皮生甘草茯神人參柴胡白芍乾葛五味黃芩一服食進諸症皆除所以知之者診其脈兩手皆洪盛按之勃勃然也程氏子年二十餘稟弱又使內勞役過度兼有憂恐之事忽患手足戰搖不定甚至反張汗出如雨常昏暈不知人一日二十餘度二十餘度虛極又吃忒飲食難進面色黎黑一醫作中風治證益劇半更時江至兩手戰搖不能診視捉執猶不定略診之弦大搏擊似肝藏脈似真藏之脈乃以大劑參茋加白术陳皮大附子天麻麻黃根之類一日夜服人參二兩汗少止昏暈稍疏諸症稍減連服補劑三日四體戰始定脈可按病雖少回而虛未復江乃言歸戒以確守前方多服庶幾可愈數日來迎書曰舊症將復舉之狀詢之乃減參茋大半江至則復作如舊乃仍前倍加參茋大劑補之乃定服人參三四斤而愈孫秀才患症耳聾少陽煩躁合病身熱譫語陽明醫曰此傷寒少陽症也服小柴胡不效更醫投白虎湯亦不減又兼唇乾齒燥舌乾倦甚神思憒憒且治後事矣江曰此內傷症也以生脈湯加陳皮甘草一服舌稍津潤耳稍聞神思略回繼加白术柴胡等藥出入而愈所以知之者切其脈帶結而無力也此症身無汗非風溫但見症如此而以生脈散治之為脈結而無力結為疝瘕積鬱加減藥似可商族弟因過飲夢遺失蓋感寒病頭痛發熱醫用十神湯發汗不出繼投生料五積散雜治不效豫視其面赤身熱頭疼肢節痛陽縮氣喘促危急囑後事江曰此內傷外感症也以參术補中羌防葛薑蔥解表大附子少許因陽縮以回陽薄暮一服半更時大汗熱退製附术和腎氣故得汗而解即熟睡二鼓寤而索粥曉更衣二度自覺清爽仍有頭眩口乾燥以四君加歸芎五味陳皮乾葛藿香等出入增減數服而愈所以知之者切其脈兩手皆沉微而右浮滑琇按兩字皆字糊塗內傷重而外感輕也江南仲治徐丹成發熱四肢熱如火左脅一點疼痛傷肝難當五日不更衣小溲赤澀醫作傷寒治服發散藥不效無六經見症妄行散劑易醫作疝治投青皮枳殼茴香等藥病增劇江診左脈弦數重按無力右脈弦滑氣口緊實倍於人迎此非傷寒症乃內傷必醉飽強力氣竭肝傷病也經云損其肝者緩其中問其由乃中途覆舟盡力救貨時冬寒忍飢行五十里遇族人縱飲青樓遂得此症正合經云必數醉若飽以入房氣聚於脾中不得散脾主四肢故熱如火酒氣與穀氣相薄熱盛於中故熱遍於身內熱而溺赤也酒氣盛而慓悍腎氣日衰陽氣獨勝故手足為之熱也用參术枸把左脅一點痛乃傷肝也用枸杞以補肝妙炙草甘溫緩中神曲枳殼术蜜白芥化食行滯佐枳殼白芥尤佳可法可法一服病減再服熱退用六味丸以補肝腎之虧損兼旬而愈黃氏子年十六嵗九月間患瘧五六發即以常山飲截之遂止數日後夜半因驚恐出汗遂發熱不止無惡寒症醫仍作瘧治不效或者認作傷寒投以消導之劑增劇日稍輕夜熱尤重已經八日矣召仲視之診得六脈浮大無力按之豁然外症譫語不食耳聾大呌問之有何苦則曰遍身痛腹中脹為熱所苦似陽明少陽合病在經亦當頭痛胸滿今遍身痛而頭不痛腹脹胸不滿斷非傷寒何也以日輕夜重之熱經八日在何經而認作傷寒耶投以補中益氣湯八貼不效復請他醫作內傷飲食外感風寒用解表消導二劑益加大熱如炙如火昏憒目不識人言語謬妄耳聾無聞復召仲仲曰此內傷不足之症無疑前藥雖未獲效精神漸覺清爽早間熱亦稍輕長熱不退方是方寒原因瘧後脾氣大虛加之寒涼消導之劑復傷元氣藥力未至仍用前方人參加作三錢黃茋四錢炮薑肉桂各三分熟附五分投桂附大見神力與二貼熱減半耳微聞言有次減去桂附大劑參茋十餘劑小便頻再加益智仁五分而愈命門火衰薛立齋治廷評張汝言胸膈作痞飲食難化服枳术丸久而形體消瘦發熱口乾脈浮大而微用補中益氣加薑桂諸症悉退惟見脾胃虛寒遂用八味丸補命門火不月而飲食進三月而形充此症若不用前丸多變腹脹喘促腿足浮腫小便淋瀝等症急用加減腎氣丸亦有得生者一儒者雖盛暑喜燃火四肢常欲沸湯漬之面赤吐痰一似實火吐甚宿食亦出惟食椒薑等方快薛曰食入反出乃脾胃虛寒用八味丸十全大補加炮薑漸愈不月平復此症無汗後滑案為暑邪宜參看一婦飲食少非大便不實必吞酸噯腐或用二陳黃連更加內熱作嘔薛曰東垣有云邪熱不殺穀此脾胃虛弱末傳寒中以六君加炮薑木香數劑胃氣漸復飲食漸進又以補中益氣加炮薑木香茯苓數劑全愈後怒飲食頓少元氣頓怯更加發熱脈洪大而虛兩尺如無益氣湯八味丸兩月餘諸症悉退愈以上三症乃久病故如此治而愈一人因失足劃然有聲坐立久則左足麻木雖夏月足寒如氷嘉靖己亥夏月因醉睡覺而飲水復睡遂覺右腹痞結以手摩之瀝漉有聲熱摩則氣泄而止每每加劇飲食稍多則作痛泄醫令服枳术丸不效甲辰嵗薛診之曰此非脾胃病乃命門火衰不能生土虛寒使之然也若専主脾胃誤矣服八味丸而安此案可法羅工部仲夏腹惡寒而外惡熱鼻吸氣而腹覺冷體畏風而惡寒脈大而虛微每次進熱粥甌餘必兼食生薑湯甌許若粥離火食之腹內即冷薛曰熱之不熱是無火也當用八味丸壯火之源以消隂翳彼不信乃服四物元參之類而歿陳工部發熱有痰服二陳黃連枳殼之類病益甚冬月薛診之左尺微細右關浮大重按微弱曰此命門火衰不能生土而脾病當補火以生土或可愈也不悟仍服前藥脾土愈弱次年春病篤復邀薛治右寸脈平脫此脾土不能生金生氣絶於內矣薛不治曰經云虛則補母實則瀉其子凡病在子當補其母况病在母而屬不足反瀉其子不死何俟蔣州判形體魁偉中滿吐痰勞則頭暈所服皆清痰理氣薛曰中滿者脾氣虧損也痰盛者脾氣不能運也頭暈者脾氣不能升也指麻者脾氣不能周也遂以補中益氣加茯苓半夏以補脾土用八味丸以補土母而愈後用乾坤生意方云凡人手指麻軟三年後有中風之疾可預服搜風天麻二丸以防之乃朝夕服以致大便不禁飲食不進而歿愚謂預防之理當養氣血節飲食戒七情逺房幃可也若服前丸適所以招風取中也江應宿治朱秀才母年四十三嵗寡居患惡寒頭疼內傷惡心嘔吐寒痰多汗易感風寒表虛診其脈兩尺沉細無力乃命門火衰人肥而多鬱脾肺虛寒治以人參白术柴胡半夏陳皮香附青皮枳實乾薑紫蘇四君加疏肝散鬱溫中之品亦可法二劑痰清惡寒少止繼以八味丸全愈暑羅謙甫治蒙古百戶因食酒肉飲潼乳得霍亂吐瀉症從朝至午精神昏憒已困急來告羅視之脈皆浮數按之無力所傷之物已出矣即以新汲水半碗調桂苓白术散徐徐服之稍得安靜又於墻隂掘地約二尺許貯以新水在內攪動待一時澄定用清者一杯再調服之漸漸氣調吐瀉遂止至夜安卧翌日微煩渴遂煎錢氏白术散時時服良愈或曰用地漿者何也坤屬地地屬隂土平曰靜順感至隂之氣又於墻隂貯新汲水以取重隂之氣也隂中之隂能瀉陽中之陽霍亂因暑熱內傷所得故用地漿之意也提舉父年近八十六月中暑毒霍亂吐瀉昏瞀終日不省人事時夜參半請羅視之脈七八至洪大有力暑脈虛大當作虛論頭熱如火足冷如氷半身不遂牙關緊急蓋年髙氣弱當暑氣極盛陽明得令之際况因動而得之中暑明矣非甘辛大寒之劑不能瀉其暑熱墜浮溜之火安神明也遂以甘露散甘辛大寒瀉熱補氣加茯苓以分隂陽約一兩水調灌之漸漸省事諸證悉去慎言語節飲食三日以參术調中湯以意增減旋服理正氣逾十日平復一倉官季夏時病胸項多汗胸項多汗先傷暑兩足逆譫語醫者不曉雜治經旬羅診之關前濡關後急當作溼溫治蓋先受暑後受溼暑溼相搏是名溼溫先以白虎加人參湯次以白虎加蒼术湯頭痛漸退足冷頭痛並見當知此是溼溫症足漸溫汗漸止三日愈此名賊邪誤用藥有死之理心病中暑為正邪中溼得之從所不勝者為賊邪今心受暑而溼邪勝之水尅火從所不勝是也五邪之中最逆也經曰溼溫之脈陽濡而弱隂小而急濡弱見陽部溼氣搏暑也小急見於隂部暑氣蒸溼也細心精别暑溼相搏名曰溼溫是謂賊邪也總宜白虎合五苓為佳羅亦素有停飲之疾每至暑月兩足漐漐未常乾服此藥二三服即愈滑伯仁治一人病自汗如雨至赤身熱口燥心煩盛暑中宜帷幕周密自以至虛亡陽服术附數劑脈虛而洪數舌上胎黃脈虛身熱胎黃自汗口燥心煩亦難别隂陽但汗如雨而不畏寒暑可知若隂有汗則死伯仁曰前藥誤矣輕病重治醫者死之素問云必先嵗氣毋伐天和术附其可輕用以犯時今又云脈虛身熱得之傷暑暑家本多汗加之剛劑脈洪數而汗甚乃令撤幔開窗少頃漸覺清爽以黃連人參白虎三進而汗止大半諸症亦減兼以既濟湯渴用冰水調天水散七日而愈孫兆治一人自汗陽微厥故自汗隂微厥不得復有外症兩足逆冷至膝下似隂症腹滿腹滿故先傷溼不省人事孫診六脈小弱而急問其所服藥取視皆隂病藥也孫曰此非受病重藥能重病耳遂用五苓散白虎湯十餘貼病少蘇再服全愈或問治法孫曰病人傷暑也始則陽微厥而脈小無力醫謂隂病遂誤藥其病愈厥用五苓散大利小便則腹減白虎解利邪熱則病愈凡隂病脛冷則臂亦冷渠今脛冷臂不冷則非下厥上行所以知是陽微厥也妙辨此症乃先傷溼後傷暑為溼溫之症也丹溪治一人夏大發熱譫語肢體莫舉喜冷飲脈洪大虛而數以黃茋茯苓濃煎如膏用涼水調服三四次後昏卧如死氣息如常次日方醒而愈一人夏發大熱大汗惡寒戰栗不自禁持且煩渴此暑病也脈虛微細弱而數其人好賭致勞而虛以人參竹葉作湯調辰砂四苓散八貼而安惡寒戰栗亦有屬暑者但此脈不沉與少隂反發熱不同煩渴與少隂引水自救不同少隂戰栗惡寒無汗者多少隂引水自救自利人靜而不煩者多然隂脈俱沉項彥章治一人病甚諸醫皆以為瘵盡愕束手項診之脈細數而且實細數者暑也暑傷氣宜虛今不虛而反實乃熱傷血藥為之也家問死期曰何得死為作白虎湯飲之即瘥吳茭山治一婦冬月偶感患灑灑惡寒翕翕發熱惡食乾嘔大便欲去不去諸醫皆以虛弱痰飲治之以二陳補心等藥服不效延及半月吳診其脈虛而無力類乎傷暑衆不然之究問其病因其婦曰因天寒換著綿衣取綿套一牀蓋之須臾煩渴寒熱嘔吐綿延至今耳吳曰誠哉傷暑也蓋綿套曬之盛暑夾熱收入笥中必有暑氣尚未開泄今人體虛得之易入故病如是其婦曰然遂製黃連香薷飲連進二服而愈逢年嵗熱甚凡道路城市昏仆而死者此皆虛人勞人或飢飽失節或素有疾一為暑氣所中不得泄即關竅皆窒非暑氣使然氣閉塞而死也古方治暑無他但用辛甘發散疏導心氣與水流行則無害矣宜薑蔥湯調益元散崇寧乙酉吳為書局時一馬夫馳馬出局下忽仆地絶琇按此由動而得之是為中暍急以五苓大順散灌之皆不驗已踰時同舍王相使取大蒜辛溫一握道上熱土補胃雜研爛以新水甘寒和之濾去渣決其齒灌之少頃即蘇至暮此僕為吳御馬而歸乃知藥病相對有如此者此方本徐州沛縣市門忽有板書釘其上或傳神仙救人者沈存中王聖美皆著其説而吳親驗之出石林老人避暑録陳斗嵓治倫司成舟中遇昏暈不知人自汗瘛瘲醫以為中風陳曰人迎脈過盛病因飲後便涼痰火妄動非中風也以清暑益氣湯一劑而愈汪希説治一壯男子形色蒼黑暑月客遊舟回患嘔􅎪顛倒不得眠粒米不入六日矣脈沉細虛豁諸醫雜投藿香柴苓等藥不效危殆汪曰此中暑也進人參白虎湯人參五錢服下嘔􅎪即止鼾睡五鼓方醒索粥連進二三服乃減參稍輕調理數劑而愈汪石山治一人年三十餘形瘦弱忽病上吐下瀉水漿不入口者七日若是中寒該發熱厥冷不見厥冷故從暑治自分死矣汪診脈八至而數曰當夏而得是脈暑邪深入也吐瀉不納水穀邪氣自甚也宜以暑治遂以人參白虎湯進半杯良久復進一杯覺稍安三服後減去石膏知母以人參漸次加作四五錢黃柏陳皮麥冬等隨所兼病而佐使一月後平復一人瘦長而脆暑月過勞飢飲燒酒遂病熱汗昏懵語亂汪視之脈皆浮小而緩按之虛豁曰此暑傷心勞傷脾也蓋心藏神脾藏意二藏被傷宜有此症法宜清暑以安心益脾以寧志意遂用八物加麥冬山梔子陳皮煎服十餘貼而愈江篁南曰夏月熱倒人昏迷悶亂急扶在隂涼切不可與冷飲當以布巾衣物等蘸熱湯覆臍下及氣海間續續以湯淋布巾上令撒臍腹但暖則漸醒也如倉卒無湯處掬道上熱土於臍端以多為佳冷則頻換也後與解暑毒若才熱倒便與冷飲或冷水淋之即死又一法道途無湯處即掬熱土於臍上仍撥開作窩子令衆人溺於中以代熱湯亦可取效解暑用白虎湯竹葉石膏湯之類凡覺中暑即嚼生薑一大塊冷水送下如不能嚼即用水研灌之立醒路途倉卒無水渴甚急嚼生蔥二寸許和津同咽可抵飲水二升江應宿治嶽母年六十餘六月中旬勞倦中暑身熱如火口渴飲冷頭痛如破脈虛豁二三至一止投人參白虎湯日進三服渴止熱退頭痛用白蘿葡汁吹入鼻中良愈溼寒溼之邪身黃而不熱體重而不渴許學士治一人病身體痛而黃喘滿頭痛自能飲食裏無病大小便如常脈大而虛鼻塞且煩許曰非溼熱宿穀相搏此乃頭中寒溼也不可行茵陳五苓散仲景云溼家病身疼痛發熱面黃而喘頭痛鼻塞而煩其脈大自能飲食腹中和無病病在頭中寒溼故鼻塞納藥鼻中則愈仲景無方見外臺刪繁證云治天行熱病蓋通貫臟腑沉鼓骨髓之間或為黃疸宜瓜蒂散瓜蒂一味為末些少搐鼻內出黃水即愈羅謙甫治征南元帥忒木兒年近七十秋間征南過揚州時仲冬病自利完穀不化臍腹冷痛足脛寒以手搔之不知痛癢常燒石以溫之亦不得暖診之脈沉細而微蓋髙年氣弱深入敵境軍事煩冗朝暮形寒飲食失節多飲乳酪履卑溼陽不外固由是清溼襲虛病起於下故胻寒而逆內經曰感於寒則受病微則為咳盛則為泄為痛此寒溼相合而為病也法當急退寒溼之邪峻補其陽非灸病不已先以大艾壯於氣海灸百壯補下焦陽虛次灸三里各三七壯治胻寒而逆且接引陽氣下又灸三隂交散足受寒溼之邪遂處方云寒淫所勝治以辛熱溼淫於外平以苦熱以苦發之以附子大辛熱助陽退隂溫經散寒故以為君乾薑官桂大熱辛甘亦除寒溼白术半夏苦辛溫燥脾溼故以為臣人參草豆蔲甘草大溫中益氣生原本誤乾薑大辛溫能散清溼之邪蔥白辛溫能通上焦陽氣故以為佐又云補下治下制以急急則氣味厚故作大劑服之不數服瀉止痛減足胻漸溫調其飲食十日平復明年秋過襄陽值霖雨旬餘前症復作再依前灸添陽輔各灸三七壯再以前藥投之數服愈一人年三十餘形色瘦黑飲食倍進食後吐酸食飯乾惡難吞嘗有結痰注於胸中不上不下才勞則頭暈眼花或時鼻衄糞後去紅或黑午後至晚胸膈煩熱眉心時痛好睡醒來口舌乾苦盜汗夢遺腳冷手及臀尖生膿泡瘡此症有屬肝脾鬱結者以加味歸脾治之同四七湯醫以四物湯涼血劑投之不效羅診之左脈小弱而數右脈散弱而數俱近六至虛熱之病曰症脈皆屬隂虛作隂虛治之不效何也此必脾虛溼鬱為熱而然也今用滋隂降火反滋溼而生熱病何由安宜用參茋甘溫之劑補脾去溼可焉問曰丹溪論瘦黑者鼻衄者脈數者參茋當禁羅曰醫貴知變不可執泥脈經云數脈所主其邪為熱其症為虛能食能睡非虛而兼鬱邪鬱則致火用藥之妙亦神矣哉遂以人參二錢黃茋一錢半白术麻黃根生地茯苓麥冬各一錢歸身川芎各八分黃芩七分麥芽厚朴黃柏五味加澤瀉柴胡青皮山梔子各七分甘草五分服十餘貼胸腹腰臍生小疥而愈春夏之交人病如傷寒其人汗自出肢體重痛轉側難小便不利此名風溼非傷寒也小便不利非表症傷寒可知仲景傷寒第七症用桂枝加附子湯治冬月正傷寒此春夏之交宜五苓𣪚隂雨之後卑溼或引飲過多多有此症但多服五苓散小便通利溼去則愈切忌轉瀉發汗小悮必不可救初虞世云醫者不識作傷風治之發汗死下之死己未京師大疫正為此羅得其説救人甚多大抵五苓散能分水去溼耳胸中有停飲及小兒吐哯欲作癎五苓散最妙節菴云肢體腫不能轉側額上微汗惡寒不欲去衣大便難小便利熱至日晡而劇宜羌活沖和微解肌咽渴小便不利五苓散中山王知府次子年十三嵗六月中旬暴雨方過地水泛溢因而戲水衣服盡溼母責之至晚覺精神昏憒怠惰嗜卧次日病頭痛身熱腿腳沉重非溼而何一女醫用和解散發之閉戶塞牖覆以重衾以致苦熱不勝遂發狂言欲去其衾而不得去是夜汗至四更汗溼透其衾明日循衣撮空又以承氣湯下之下下後語言漸不出四肢不能收持有時項強手足瘛瘲搐急而攣目左視而白睛多口唇肌肉蠕動飲食減少形體羸瘦羅視之具説前由詳之蓋傷溼而失於過汗也且人之元氣起於臍下腎間動氣周於身通行百脈今盛暑之時大發其汗汗多則亡陽百脈行澀故三焦之氣不能上榮心肺上氣不足心火旺而肺氣燋况因驚恐內畜經曰恐則氣下陽主聲陽既亡而聲不出也陽氣者精則養神柔則養筋又曰奪血無汗奪汗無血今發汗過多氣血俱衰筋無所養其病為痙則項強手足瘛瘲搐急而攣目通於肝肝者筋之合也筋既燥而無潤故目左視而白睛多肌肉者脾也脾熱則肌肉蠕動故口唇蠕動有時而作有悮為筋惕肉瞤而用溫者毫釐千里之别經云肉痿者得之溼地也脾熱者肌肉不仁發為肉痿痿者痿弱無力運久為不仁陽主於動今氣欲竭熱留於脾故四肢不用此傷溼過汗而成壞證也當治時熱益水原救其逆補上升生發之氣針經曰上氣不足推而揚之此之謂也以人參益氣湯治之補中益氣湯加白芍黃柏經曰熱淫所勝治以甘寒以酸收之人參黃蓍之甘溫補其不足之氣而緩其急搐故以為君腎惡燥急食辛以潤之生甘草甘微寒黃柏苦辛寒以救腎水而生津液故以為臣當歸辛溫和血脈陳皮苦辛白术苦甘炙草甘溫益脾胃進飲食肺欲收急食酸以收之白芍之酸微寒以收耗散之氣而補肺金故以為佐升麻柴胡苦平上升生發不足之氣故以為使乃從隂引陽之謂也名曰人參益氣湯水二盞半先浸兩時辰煎至一盞熱服早食後午食前各一服投之三日語聲漸出少能行步四肢柔和飲食漸進至秋而愈丹溪治一人患溼氣背如負二百斤重以茯苓白术乾薑桂心澤瀉豬苓酒芩木通蒼术服愈一少年素溼熱又新婚而勞倦胸膈不快覺有冷飲脈澀大因多服辛溫大散藥血氣俱衰以蒼术白术半夏陳皮各五錢白芍六錢龜板七錢半柏皮甘草各一錢半黃芩三錢宿砂一錢炊餅丸服愈一人因溼氣兩脅疼痛腰腳亦痛白濁滲溼湯加參术木通澤瀉防巳甘草蒼术蒼耳黃柏知母牡礪龜板川歸白芍地黃等分煎服愈一人溼氣腰似折胯似冰以除溼湯加附子平胃散配附子妙半夏厚朴蒼术木香陳皮茯苓牛膝杜仲酒芩豬苓澤瀉黃柏知母等分煎服愈一人溼氣二胯痛小便不利當歸拈痛湯加滑石木通燈心豬苓澤瀉一女子十七八嵗髮盡脫飲食起居如常脈微弦而澀輕重皆同此厚味成熱溼痰在膈間復因多食梅酸味以致溼熱之痰隨上升之氣至於頭薰蒸髮根之血漸成枯稿遂一時脫落宜補血升散之藥用防風通聖散去硝惟大黃三度酒製炒兼以四物湯酒製合作小劑煎以灰湯入水頻與之兩月餘診其脈溼熱漸解乃停藥淡味調養二年髮長如初琇按此案重見眉髮自落門江篁南自治一少年夏月因以冷水浸兩足跟又坐溼地患足跟腫痛不能移步困卧數月教以乾土圾一塊穵一凹如足跟大炭火燒紅去火用醋一碗沃之任其滲乾乃以足跟臨土圾初略懸髙薰之漸漸近之其下體骨節皆酸快不可言且有微汗連換土磚薰三四日而愈江應宿治嘉興錢舉人每逢隂雨則腰膝沉重如帶千錢不能步履人肥而脈沉緩此溼病也投茯苓滲溼丸二陳加蒼术羌活黃芩而愈消渴莫君錫不知何許人大業中為太醫丞煬帝晚年沉迷酒色方士進大丹帝服之蕩思不可制日夕御女數十人入夏帝煩躁日引飲數百杯而渴不止君錫奏曰心脈煩盛真元大虛多飲則大疾生焉因進劑治之仍乞進冰盤於前俾上日夕朝望之亦解煩躁之一術也方勺博按元本悮張杲治提點鑄錢朝奉郎黃沔久病渴極疲瘁方每見必勸服八味丸初不甚信後纍治不痊謾服數兩遂安或問渴而以八味丸治之何也對曰漢武帝渴張仲景為處此方琇按仲景乃建安時人方謂其治漢武不知何本趙養葵亦仍其悮蓋渴多是腎之真水不足致然若其勢未至於消但進此劑殊佳且藥性溫平無害也泊宅編李東垣治順德安撫張耘夫年四十餘病消渴舌上赤裂飲水無度小便數多李曰消之為病燥熱之氣勝也內經云熱淫所勝佐以甘苦以甘瀉之熱則傷氣氣傷則無潤折熱補氣非甘寒之劑不能故以人參石膏各二錢半甘草生炙各一錢甘寒為君啓元子云滋水之源以鎮陽光故以黃連三分酒黃蘖知母山梔各二錢苦寒瀉熱補水為臣以當歸麥冬白葵蘭香各五分連翹杏仁白芷各一錢全蝎一箇甘辛寒和血潤燥為佐以升麻二錢柴胡三分藿香二分反佐以取之桔梗三錢為舟楫使浮而不下也名之曰生津甘露飲子為末湯浸蒸餅和成劑捻作餅子曬半日杵篩如米大食後每服二錢抄在掌內以舌舐之隨津咽下或白湯少許送下亦可此治製之緩也治之旬日良愈古人消渴多傳瘡瘍以成不治之疾此既效亦不傳瘡瘍以夀考終後以此方治消渴諸症皆驗衛生寶鑑蜀醫張肱治眉山有揭穎臣者長七尺健飲啖倜儻人也忽得消渴疾日飲水數斗食常倍而數溺消渴藥服之逾年病日甚自度必死張診脈笑曰君幾誤死矣取麝香當門子以酒濡之作十餘丸取枳枸子為湯飲之遂愈問其故張曰消渴消中皆脾衰而腎敗土不勝水腎液不上泝乃成此疾今診頴臣脾脈熱極而腎不衰當由酒與果實過度虛熱在脾故飲食兼人而多飲飲水既多不得不多溺也非消渴也麝能敗酒瓜果近輒不結而枳枸即木蜜亦能消酒毒屋外有此木屋中釀酒不熟以其木為屋其下釀無味故以二物為藥以去酒果之毒也滑伯仁治一人患消渴衆醫以為腎虛水竭津不能上升合附子大丸服之既服渴甚舊有目疾兼作其人素豐肥因是頓瘦損倉惶請滑視之曰隂陽之道相為損益水不足則濟之以水未聞水不足而以火濟之不焦則枯乃令屏去前藥更寒劑下之蕩去火毒繼以苦寒清潤之劑竟月平復一士人患消渴服銀柴胡一味愈渴熱甚加黃連同煎服後服大補隂丸不渴體健一仕人患消渴醫者斷其逾月死棄官而歸中途一醫者令急遣人致北梨二擔食盡則瘥仕者如其言才渴即啖梨未及五六十枚而病愈汪石山治一婦年逾三十常患消渴善飢腳弱冬亦不寒隂虛小便白濁浮於上者如油脈皆細弱而緩右脈尤弱曰此脾疸也宜用甘溫助脾甘寒潤燥方用參茋各錢半麥冬白术各一錢白芍天花粉各八分黃柏知母各七分煎服病除治商山一人消渴用丹溪法繅絲湯飲之而愈此物屬火有隂之用能瀉膀胱中相火引氣上潮於口火熱琇按是案所列亦厖雜子和曰一人素飲酒成病一醫用酒癥丸熱服後目覩天地但見紅色遂成龍火卒不能救一僧三陽蓄熱常居靜室不敢見明明則頭痛如錐每置冰於頂上不能解其熱諸醫莫辨用吐汗下三法治之又以涼藥清鎮之而愈東垣治參政年近七十春間病面顔鬱赤若飲酒狀痰稠黏時眩暈如在風雲中又加目視不眀李診兩寸洪大尺弦細無力此上熱下寒明矣欲藥之寒涼為髙年氣弱不任記先師所論凡治上焦譬猶烏集髙巔射而取之即以三稜針於巔前眉際疾刺二十餘出紫黑血約二合許時覺頭目清利諸苦皆去自後不復作丹溪治一婦患心中如火一燒便入小腸急去小便大便隨時亦出如此三年求治脈滑數此相火送入小腸經以四物加炒連柏小茴香木通佐使妙四貼而安一人因酒肉發熱用青黛瓜蔞仁薑汁日飲數匙三日愈一人虛損身如麻木腳底如火以柴胡牛蒡子川歸白芍參术黃茋升麻防風羌活荆芥牛膝四十貼而愈一人每晨飲燒酒數杯後終日飲常酒至五六月大發熱醫用冰攤心腹消復增之內飲以藥三日乃愈一人年二十四月間病發熱脈浮沉皆有不足意其間得洪數一種隨熱進退不時知非傷寒因問必是飲酒過量酒毒在內今為房勞氣血虛乏而病作耶曰正月間每晨飲燒酒喫犬肉近一月矣遂得病情用補氣血藥加乾葛以解酒毒服一貼微汗懈怠熱如故因思是病氣與血皆虛不禁葛根之散必得枸距子方可解也偶有一小枝在書册中加前藥內煎服而愈一婦年四十外則覺冷內則覺熱身疼頭痛倦怠脈虛微澀以川芎芍藥柴胡各五分羌活炒柏炙草各三分南星一錢薑二片服一婦年五十餘滿身骨節痛半日以後發熱至半夜時却退乃以白术一錢半蒼术陳皮各一錢炒柏五分羌活木通通草各三分一人因寒月涉水又勞苦於久瘧乍安之餘腿腰痛漸漸渾身痛脅痛發熱脈澀此勞倦乏力也以黃茋五錢白术蒼术陳皮各一錢人參炒柏各五分木通三分炙甘草二分煎下龍薈丸一婦午後發熱遍身痛血少月經黑色熱大便閉以芍藥五錢黃茋蒼术各三錢炒柏木通各二錢琇按此案宜入經水門以上四方補兼發散隨所見脈證加減皆正法治也一婦年近二十發熱閉目則熱甚渴思水解脈澀而濁溷此食痰也以乾葛白术陳皮片芩木通桔梗黃連甘草下保和丸二十粒琇按宜入痰門一男子因恐發熱心下不安以南星茯苓各五錢朱砂二錢分作六貼再用人參當歸柴胡各三錢黃芩川芎木通各二錢甘草五分紅花少許分四貼水煎取金銀器同煎熱調服以上二法補兼發散隨所見脈證加食積痰藥也子和治一人常病目每服補肝散以致睛脹但見窗欄橫排幾至喪明令涌泄五七次繼服涼藥方愈琇按宜入目門橘泉翁治武靖侯夫人病周身百節痛又胸腹脹目閉逆冷手指甲青黑色此症總不見身熱醫以傷寒主之七日而昏沉皆以為弗救翁曰此得之大怒火起於肝肝主筋氣盛則為火矣又有痰相搏故指甲青黑色不得以指甲青黑斷為寒須合症脈而治與柴胡枳殼芍藥芩連瀉三焦火明日而省久之愈一人年十八病眩暈狂亂此非傷寒狂醫以為中風已而四肢厥冷欲自投水中欲投水中若不細審竟以為隂竭發躁矣醫曰是當用烏附庶足以回陽翁曰此心脾火盛陽明內實用熱藥則不治強以瀉火解毒之劑三服愈虞恆德治一婦年四十餘夜間發熱早晨退五心煩熱無休止時半年後虞診六脈皆數伏而且牢浮取全不應與東垣升陽散火湯妙切記此法今人則竟滋隂降火矣四服熱減大半胸中覺清快勝前再與二貼熱悉退後以四物加知母黃柏少佐以炒乾薑服二十餘貼愈傅愛川治一人脈弦細而沉天明時發寒熱至晚二腿汗出手心熱甚則胸滿拘急大便實而能食似勞怯詢之因怒而得用大柴胡湯但胸背拘急不能除後用二陳治痰加羌活防風紅花黃芩煎服愈韓飛霞治一都司頭重眼昏耳聾牙痛便腳如不著地醫不識為何疾一日梳洗畢腹痛少間手足俱不能舉韓曰此火證也蓋素勞心勞形所致因檢玉機微義示之期辛散之劑十貼恐有消渴痿痺瘡瘍之患乃屏喧譁靜卧果十劑耳如人呼體蟣虱發癢成疙瘩然後頭腳始知著落亟入山靜養之偶以事觸怒火一發遂渴如欲狂者一日瓜梨泉水無計韓曰此非草木之藥可扶矣遍求人乳日進十盞旬餘渴減又偶以事怒手足不舉如一軟物卧四日乃服乳無算而瘥脈之心經澀曰瘡作矣幸不生大毒患馬眼膿疥八越月乃止能行步登山再以駐顔小丹助之遂復如初王仲陽治一婦壯年每患頭痛腹痛十指酸痛心志紛紜鼻息粗甚其脈甚大蓋欲近男子不可得也俗謂之花風王以涼膈散青木香圎互換疏導三五次更服三黃丸瀉三焦之火數日而愈曽有火旺遺精者亦用前丸散而愈倪仲賢治陳上林實以勞役得熱疾日出氣暄則熱夜及涼雨則否暄盛則增劇稍晦則蘇如是者二年倪曰此七情內傷脾胃隂熾而陽鬱耳以東垣飲食勞倦法治之其熱旋已壺仙翁治文學張徴伯病風熱不解時瘟疫大行他醫診其脈兩手俱伏曰此陽證見隂不治欲用陽毒升麻湯升提之翁曰此風熱之極火盛則伏非時疫也升之則死矣卒投連翹涼膈之劑一服而解薛已治大尹沈用之不時發熱日飲冰水數碗寒藥二劑熱渴益甚形體日瘦尺脈洪大而數時或無力王太僕曰熱之不熱責其無火寒之不寒責其無水又云倐熱往來是無火也時作時止是無水也法當補腎用加減八味丸不月而愈一人年七十九仲冬將出少妾入房致頭痛發熱似傷寒太陽然以後見症當細别眩暈喘急痰涎壅盛小便頻數口乾引飲遍舌生刺縮斂如荔枝然下唇黑裂面目俱赤煩躁不寐或時喉間如煙火上衝急飲涼茶少解已濵於死脈洪大無倫且有力見症俱似實火脈且有力亦似實但洪大無倫四字虛症可知臨症焉可不細心耶捫其身烙手此腎經虛火遊行於外投以十全大補加山茱萸澤瀉丹皮山藥麥門冬五味附子一鍾熟寢良久脈症各減三四再以八味丸服之諸症悉退後畏冷物而愈此案當求其故所謂同脈異經也一人年六十一痢後入房精滑自遺二日方止又房勞感寒怒氣遂發寒熱右脅痛連心胸腹痞自汗盜汗如雨四肢厥冷睡中驚悸或覺上升如浮或覺下陷如墮遂致廢寢或用補藥二劑益甚脈浮大洪數按之微細此屬無火虛熱急與十全大補加山藥山萸丹皮附子一劑諸症頓愈用補劑益甚者必得溫腎而愈臨症者不可不細心韓州同年四十六仲夏色欲過度煩熱作渴飲水不絶小便淋瀝大便祕結舊刻悮通行唾痰如湧面目俱赤滿舌生刺兩唇燥裂假熱症遍身發熱或時身如芒刺而無定處兩足心如火烙以冰折之作痛真寒脈洪而無倫此腎隂虛陽無所附而發於外非火也果真火症焉能作痛况脈洪無倫耶蓋大熱而甚寒之不寒是無水也當峻補其隂遂以加減八味丸料一斤內肉桂一兩以水頓煎六碗冰水浸冷與飲半晌已用大半睡覺而食溫粥一碗復睡至晚乃以前藥溫飲一碗乃睡至曉食熱粥二碗諸症悉退翌日畏寒足冷至膝諸症仍至或以為傷寒薛曰非也大寒而甚熱之不熱是無火也陽氣亦虛矣急以八味一劑服之稍緩四劑諸症復退大便至十三日不通以豬膽導之諸症復作急用十全大補方應舉人陳履賢色欲過度孟冬發熱無時飲水不絶遺精不止小便淋瀝或用四物芩連之類前症益甚更加痰涎上湧口舌生瘡服二陳黃柏知母之類胸膈不利飲食少思更加枳殼香附肚腹作脹大便不實脈浮大按之微細令朝用四君子佐以熟地當歸夕用加減八味丸更以附子唾津調搽湧泉穴漸愈後用十全大補湯其大便不通小腹作脹此直腸乾澀令豬膽通之形體殊倦痰熱頓增急用獨參湯而安再用前藥而愈但勞發熱無時其脈浮洪薛謂其當慎起居否則難治彼以為迂至次年夏復作乃服四物黃柏知母而歿汪石山治一人年三十餘忽病渴熱昏悶面赤倦怠汪診之脈皆浮緩而弱兩尺尤甚曰此得之色欲藥宜溫熱其人曰先生之言誠然也但病熱如此復加熱藥惑矣汪曰寒極生熱此證是也腎虛寒者本病也熱甚者虛象也譬如雷火雨驟而火愈熾日出火斯滅矣遂以附子理中湯煎熟冷服三貼熱渴減半再服清暑益氣湯十貼而安一人年踰三十神色怯弱七月患熱淋諸藥不效至十一月行房方愈正月復作亦行房而愈三月傷寒咳嗽有痰兼事煩惱延至十月少愈後復作服蘆吸散而愈但身熱不解因服小便腹內膨脹小腹作痛後又因晚卧左脅有氣觸上痛不能睡飲食減半四肢無力食則腹脹痛或瀉兼胸膈飽悶脾胃虛口舌乾燥夜卧盜汗從腰已下常冷久坐腰痛腳軟手心常熱診左手心脈浮數而滑腎肝二脈沉弱頗緩右手肺脈虛浮而駛脾脈偏弦而駛命門散弱而駛次日再診心肝二脈細軟稍不見駛矣腎脈過於弱肺脈浮軟亦不見駛脾脈頗軟命門過浮略堅淋症脈汪曰膀胱者津液之府氣化出焉淋者由氣餒不能運化故津液鬱結為熱而然也房後而愈者鬱結流利而熱自解矣三月天日和煦何得傷寒多由肺氣不足莫能護衛皮毛故為風邪所襲鬱熱而動其肺以致痰嗽也始受熱中得蘆吸散而愈者以辛溫豁散痰與熱也嗽止身熱不退者由嗽久肺虛虛則脾弱子盜母氣而母亦虛脾肺之氣不能榮養皮毛故熱作也講得分明經曰形寒飲冷則傷肺又曰脾胃喜溫而惡寒今服小便之寒涼寧不愈傷其脾肺邪是以腹脹作痛脅氣觸上或瀉或汗種種諸病皆由損其脾肺也末傳寒中時或變易不常者亦由氣血兩虛虛而為盈難乎有常矣遂用參茋各二錢茯苓白术一錢歸身牛膝七分厚朴陳皮木香甘草各五分薄桂三分煎服二十餘貼諸證悉退後因解頭勞倦諸證復作汪診脈與前頗同但不數不駛耳脈不見駛所以補而兼溫仍用參茋各三錢麥冬歸身厚朴枳實甘草黃茋等劑愈博按此案原刻略有脫悮江篁南治一婦年五十餘因經行遇事惱怒又哭泣失飢因而作戰行步乏力自汗醫用六君子加歸茋芍香附六七貼覺飽悶加枳殼汗止復作身熱乃以參茋歸术茯苓陳皮香附白芍柴胡麥冬薑棗二貼不效改用歸芍參柴芩陳香附知母地骨乾葛石膏薄荷一服牙痛止身微汗熱稍退既而夜深身熱復作次早診得右脈浮數近大散亂無次渾渾如湧泉左沉小而駛亦散亂無倫症見頭汗作疼肌熱腹中覺飢然惡心食不下以小柴胡加川芎藿香扁豆桔梗陳皮香附一劑遍身微汗二三次肌熱內熱減半嘔惡喉疼皆愈食增蓋邪搏諸陽津液上湊則汗見於頭乃邪氣在半表半裏也藥合症故效速耳但云上齶腫辣食飲不便蓋上齶屬督脈陽脈之海也以參术歸芍茯苓陳皮香附黃芩麥冬蓮實二劑而安琇按此案未善鬱丹溪治一室女因事忤意鬱結在脾半年不食但日食熟菱米棗數枚遇喜食饅頭彈子大深惡粥飯朱意脾氣實非枳實不能散以溫膽湯去竹茹與數十貼而安一少婦年十九因大不如意事遂致膈滿不食纍月憊甚不能起坐已脾午心間發熱面赤酉腎戌心包退夜小便數而點滴脈沉澀而短小沉為氣滯澀為血瘀短小為虛重取皆有經水不足此氣不遂而鬱於胃口有瘀血而虛中宫郤因食鬱而生痰遂補瀉兼施以參术各二錢茯苓一錢紅花一豆大帶白陳皮一錢濃煎食前熱飲之少頃藥行與粥半匙少頃與神祐丸減輕粉牽牛減輕粉牽牛即小胃丹細丸如芝麻大津液咽下十五丸晝夜二藥各進四服至次日食稍進第三日熱退面不赤七日而愈一女許嫁後夫經商二年不歸因不食困卧如癡無他病多向裏牀睡朱診之肝脈弦出寸口曰此思想氣結也藥難獨治得喜可解不然令其怒脾主思過思則脾氣結而不食怒屬肝木木能尅土怒則氣升發而衝開脾氣矣令激之大怒而哭至三時許令慰解之與藥一服即索粥食矣朱曰思氣雖解必得喜則庶不再結乃詐以夫有書旦夕且歸後三月夫果歸而愈孫景祥治李長沙學士年三十九時患脾病其症能食而不能化因節不多食漸節漸寡幾至廢食氣漸薾形日就憊醫咸謂瘵也以藥補之病彌劇時嵗暮醫曰吾技窮矣若春木旺則脾必傷重會孫來視曰及春而解因怪問之孫曰病在心火必左寸洪數之脈故得木而解彼謂脾病者不揣其本故也公得非有憂鬱之事乎曰噫是也蓋是時喪妻亡弟悲愴過傷積久成病非惟醫莫之識而自亦忘之矣於是盡棄舊藥悉聽孫言三日而一藥不過四五劑及春果愈李因歎曰醫不識病而欲拯人之危難矣哉世之徇名遺實以軀命托之庸人之手往往而是向不遇孫不當補而補至於羸憊而莫悟也麓堂文集州監軍病悲思郝允告其子曰法當得悸而愈時通守李宋卿御史嚴甚監軍向所憚也允與子請於宋卿一造問責其過失監軍惶怖汗出疾乃已邵氏聞見録虞恆德治一人年三十嵗三月間房事後乘馬渡河遇深淵沉沒幸馬健無事連溼衣行十五里抵家次日憎寒壯熱肢節煩疼似瘧非瘧之狀醫作虛症治用補氣血藥服月餘不效更醫作瘵治用四物加知母黃柏地骨皮之類及大補隂丸倍加紫河車服至九月反加滿悶不食雇乳嫗日止飲乳汁四五杯粒米不入虞診視六脈皆洪緩重按若牢右手為甚虞作溼鬱治用平胃散倍蒼术加半夏茯苓白术川芎香附木通砂仁防風羌活加薑煎服黃昏服一貼一更時又服一貼至半夜遍身發紅丹如癮疹溼鬱而為熱病邪才透片時遂沒而大汗索粥與稀粥二碗由是諸病皆減能食仍與前方服三貼後以茯苓滲溼湯倍加白术服二十貼而安琇按此案宜入溼門括蒼吳球治一宦者年七十少年患虛損素好服補劑一日事不遂意頭目眩暈精神短少請醫調治遂以前症告之謂常服人參養榮補中益氣等湯每貼用人參三五錢其效甚速若小可服之茶湯耳醫者不察遂以前方倍以人參熟地弗效都以為年髙氣血兩虛當合固本丸與湯丸并進可以速效服之數服筋脈反加以氣急吳診其脈大力薄問有病情因得之曰先生歸休意切當道欲留豈無抑鬱而致者乎况公有年氣之所鬱醫者不審同病異名同脈異經二句妙之説概行補藥所以病日加也病者歎曰斯言深中豫病遂以四七湯數服稍寬氣血和平浹旬而愈程仁甫治一婦年二十餘秋生一子次年春夏經行二次既而不月自以為妊至六七月漸漸內熱口渴八月大熱大渴程未診視為用補血安胎之劑不效自秋徂冬連經數醫症漸重次年二月復診六脈沉數浮取不應形瘦憔悴煩熱不休日夜手握鐵器或浸冷水中一日用茶二十餘碗體倦食少惡心吐出如豆沫狀胸滯不快經閉不行程思前症皆火鬱於內不能發泄故熱渴也經曰火鬱發之是其治也用升陽散火湯四劑熱去其半心胸舒暢繼用參茋甘歸芍地知膏味麥門葛陳生津止渴氣滯加青皮乾嘔少加藿香出入服至五十餘劑更以人參固本丸對坎離丸每料加鹿角膠三兩五味桃仁各一兩紅花七錢以為生血之引用也服二月餘熱退口渴十去七八口沫清丸藥數料三年後經行有孕錢漸川幼攻文勤苦久之抱鬱成疾上焦苦咽閉中焦苦膈噎煩悶下焦苦遺濁極而嘔血幾殆醫罔效顧愛杏分治之上焦用藥清火解毒食飽服中焦用藥開鬱除煩食後服下焦用藥升降水火空心服品不過三四劑不過五六病若失頤養張本斯五湖漫聞云余嘗於都太僕坐上見張翁一百十三嵗普福寺見王瀛洲一百三十嵗毛間翁一百三嵗楊南峰八十九嵗沈石田八十四嵗吳白樓八十五嵗毛礪菴八十二嵗諸公至老精敏不衰升降如儀問之皆不飲酒若文衡翁施東岡葉如巖耄耋動靜與壯年不異亦不飲酒此見酒之不可以沉湎也人生類以眠卧為晏息飲食為頤養不知睡卧最不可嗜禪家以為六欲之首嗜卧則損神氣飲食不可過多多能抑塞陽氣不能上升將以養生實以殘生也君子夙興夜寐常使清明在躬淡餐少食常使腸胃清虛則神氣周流隂陽得位此最養生之大要推篷寤語孔子曰人有三死而非其命也已自取也夫寢處不時飲食不節逸勞過度者疾苦殺之家語莊子曰夫畏途者十殺一人則父子兄弟相戒必盛卒徒而後敢出焉不亦智乎故人之所畏者袵席之上飲食之間而不知戒者過也栁公度年八十餘有強力常云吾初無術但未嘗以氣海暖冷物熟生物不以元氣佐喜怒耳唐書醫戒進士王日休勸醫云醫者當自念云人身疾苦與我無異凡來請召急去無遲或止求藥宜即發付勿問貴賤勿擇貧富専以救人為心以結人緣以積已福冥冥中自有祐之者若乘人之急切意求財用心不仁冥冥中自有禍之者吾鄉張彥明善醫僧道貧士軍兵官員及凡貧者求醫皆不受錢或反以錢米與之人若來召雖至貧亦去富者以錢求藥不問錢多寡必多與藥期於必效未嘗萌再攜錢來求藥之心病若危篤知不可救亦多與好藥以慰其心終不肯受錢豫與處甚久詳知其人為醫而口終不言錢可謂醫人中第一等人矣一日城中火災周回爇盡煙焰中獨存其居一嵗牛災尤甚而其莊上獨全此神明祐助之明效也其子讀書後乃預魁薦孫有二三龎厚俊爽亦天道福善之信然也使其孜孜以錢物為心失此數者所得不足以償所失矣同門之人可不鑒哉若常如是存心回向淨土必上品生若因人疾苦而告以淨土則易生信心使復發大願以廣其傳以贖宿譴以期痊愈必遂所願若天年或盡亦可乘此願力往生淨土常如是以化人非徒身後上品化生現世則人必尊敬而福報亦無窮矣名醫類案卷二
