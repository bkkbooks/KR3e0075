body:
  text: 名醫類案卷七明江瓘編諸蟲太倉公治一女病甚衆醫皆以為寒熱篤當死不治公診其脉曰蟯瘕蟯瘕為病腹大上膚黃粗循之戚戚然公飲以芫華一撮即出蟯可數升病已三十日如故病蟯得之於寒濕寒濕氣宛篤不發化為蟲公所以知其病者切其脉循其尺索刺粗而毛美奉髮是蟲氣也其色澤者中藏無邪氣及重病史記已博按此案見第五卷癥瘕門華他治一人忽患胸中煩悶面赤不食診之曰君胃中有蟲欲成內疽腥物所為也即作湯二升再服須臾吐出蟲三升許頭赤而動半身猶是生魚膾所苦遂愈唐張鷟朝野僉載云洛州有士人患應聲語即喉中應之以問良醫張文仲張經夜思之乃得一法即取本草令讀之皆應至其所畏者即無聲仲乃録取藥合和為丸服之應時而止永州通判㕔軍員毛景得竒疾每語喉中必有物作聲相應有道人教令誦本草藥名至藍而默然遂取藍捩汁飲之少頃吐出肉塊長二寸餘人形悉具劉襄子思為永倅景正被疾踰年親見其愈泊宅編許叔微精於醫云五臟蟲皆上行唯有肺蟲下行最難治當用獺爪為末調藥初四初六日治之此二日肺蟲上行金州防禦使崔堯封有甥李言吉左目上瞼忽生一小瘡漸大如鴨卵其根如弦恆掩其目不能開堯封飲之令大醉遂與割去瘡既破中有黃雀飛鳴而去聞竒録一婦人忽生蟲一對於地能行長寸餘自後月生一對醫以苦參加打蟲藥為丸服之又生一對埋於土中過數月發而視之暴大如拳名子母蟲從此絶根青陽夏戚宗陽家素業醫任江陰訓導有生員之父患腹脹求其診視乃曰脉洪而大濕熱生蟲之象况飲食如常非水腫蠱脹之證以石榴皮椿樹東行根加檳榔三味各五錢長流水煎空心頓服之少頃腹作大痛㵼下長蟲一丈許遂愈客座新聞吳茭山治一婦産後惡露缺通寒熱時作小腹結成一塊形大如杯抽刺疼痛用聚寶丹蟠葱等藥俱不效一日吳診其脉洪而緊以虎珀膏貼患處二日後其塊漸軟其痛如常倐然隂户中覺如蟲行動狀少頃小溲出蟲三條形長寸許身紅頭紫有嘴出此之後其痛漸緩過後二次仍出四條蟲狀如前痛止身安諸患皆愈因意病者未産之前尿胞必有溼熱生蟲之患偶因産後去血況服諸香燥熱之劑及貼琥珀膏亦是追蟲之物蟲不能容所以因而出也陸顒吳郡人自幼嗜麵食食愈多而質愈瘦胡人以藥吐一蟲長二寸許色青狀如蛙此名消麵蟲實天下之竒寶也其說甚異不具述說淵虞花溪治一婦人患尸蟲用花椒二分苦練根一分丸服其蟲盡從大便泄出一人患腦痛為蟲所食㦯教以桃葉枕一夕蟲自鼻出形如鷹嘴莫能識其名遁齊閒覽一人在姻家過飲醉甚送宿花軒夜半酒渴欲水不得遂口吸石槽中水碗許天明視之槽中俱是小紅蟲心陡然而驚鬱鬱不散心中如有蛆物胃脘便覺閉塞日想月疑漸成痿隔遍醫不愈吳球往視之知其病生於疑也用結線紅色者分開翦斷如蛆狀用巴豆二粒同飯搗爛入紅線丸十數丸令病人暗室內服之置宿盆內放水須臾欲㵼令病人坐盆瀉出前物蕩漾如蛆然後開窗令親視之其病從此解調理半月而愈從政郎陳檏富沙人母髙氏年六十餘得飢疾每作時如蟲齧心即急索食食罷乃解如是三四年畜一猫極愛之常置於傍一日命取鹿脯自嚼而啖猫至於再覺一物上觸喉間引手探得之如拇指大墜於地頭尖匾類塌沙魚身如蝦殼長八寸漸大侔兩指其中盈實剖之腸肚亦與魚同有八子胎生蠕蠕若小鰍人莫識其為何物蓋聞脯香而出髙氏疾即愈類編趙子山寓居邵武軍天王寺苦寸白蟲為撓醫者戒云是疾當止酒而以素所耽嗜欲罷不能一夕醉於外舍歸已夜半口乾咽燥倉卒無湯飲適廊廡間有甕水月映瑩然可掬即酌而飲之其甘如飴連飲數酌乃就寢逮曉蟲出盈席覺心腹頓寬宿疾遂愈驗其所由蓋寺僕日織草屨浸紅藤根水也庚志蔡定夫戡之子康積苦寸白為孽醫者使之碾檳榔細末取石榴東引根煎湯調服之先炙肥猪肉一大臠置口中咽咀其津膏而勿食云此蟲惟月三日以前其頭向上可用藥攻打餘日即頭向下縱藥之無益肺蟲初四日初六日上行寸白蟲惟初三日上行蟲聞肉香咂啖之意故空羣爭赴之覺胸中如萬箭攻攢是其候也然後飲前藥蔡如其戒不兩刻腹中雷鳴急奔厠蟲下如傾命僕以杖撥之皆聨屬成串幾長數丈尚蠕蠕能動舉而棄之溪流宿患頓愈故廣其傳以濟人云庚志一人因灼艾訖火痂便落瘡內鮮血片片如蝴蝶樣騰空飛去痛不可忍此是血肉俱熱用大黃芒硝等分為末水調下微利即愈一人有蟲如蟹走於皮下作聲如兒啼為筋肉之化用雷丸雄黃等分為末糝猪肉上炙肉食之即愈一人臨卧忽渾身虱出約五升血肉俱壞而舌尖血出不止用鹽醋湯飲下數次即愈一人大腸內蟲出不斷斷之復生行坐不得鶴虱末調服五錢自愈一人腹中如鐵石臍中水出旋變作蟲行之狀繞身作癢痛不可忍扒掃不盡濃煎蒼术浴之又以蒼术麝香水調服之楊勔中年得竒疾每發言腹中有小聲效之數年間其聲寖大有道士見而驚曰此應聲蟲也久不治延及妻子宜讀本草遇蟲不應者當取服之勔如言讀至雷丸蟲忽無聲乃頓服數粒遂愈正敏後至長沙遇一丐者亦有是疾環而觀之者甚衆因教使服雷丸丐者謝曰某貧無他技所以求衣食於人者唯藉此耳一人頭皮內時有蛆行以刀切破用絲瓜葉擠汁搽之蛆出盡絶根汪石山治一婦每臨經時腰腹脹痛玉户淫淫蟲出如鼠粘子狀緑色者數十枚後經水隨至其夫問故汪曰厥陰風木生蟲婦人血海屬於厥陰此必風木自甚兼脾胃溼熱而然也正如春夏之交木甚溼熱之時而生諸蟲是也宜清厥陰溼熱即令以酒煮黃連為君白术香附為臣研末粥丸空腹吞之月餘經至無蟲且妊矣休寧西山金舉人嘗語人曰豫嘗病小腹甚痛百藥不應一醫為灸關元十餘壯小腹痛百藥不效宜灸次日莖中淫淫而癢視之如蟲出四五分急用鐵鉗扯出蟲長五六寸連日蟲出如此者七痛不復作初甚驚恐後則視以常皆用手扯此亦偶見也仲景云火力雖微內攻有力蟲為火力所逼勢不能容故從溺孔出也其人善飲御內膀胱不無溼熱遇有留血瘀濁則附形蒸鬱為蟲矣經云溼熱生蟲有是理也故癆蟲寸白蟲皆由內溼熱蒸鬱而生非自外至者也正如春夏之交溼熱蒸鬱而諸蟲生焉是矣此亦竒病因記之無錫一人遍身膚肉有紅蟲如線長二三寸時或遊動瞭瞭可見癢不可勝醫莫能治一日偶思食水蛙蛙至蟲遂不見乃市蛙為脯旦晚食之月餘其蟲自消五湖漫聞哮江少微治小兒鹽哮聲如曳鋸以江西淡豆䜴一兩白砒一錢研細拌入精猪肉四兩內以泥固濟炭火鍛出青烟為度研細和淡䜴搗勻為丸如黍米大每服二三十丸滾白水送下此方甚佳即紫金丹忌大葷鹽醬一月而愈一貴公子患鹽哮年方九齡每以風寒即發投以噙丸藥餅夜卧醒放舌上任其自化下隨效方用苦葶藶五錢隔紙炒茯苓五錢花粉麻黃杏仁款花蕊桑白皮蜜炙貝母去心各三錢五味子二錢罌粟殼蜜炙一錢五分右為細末烏梅肉三錢棗肉三錢煮爛如泥搗和前末為餅每重一分半服未半料永不復發須忌大葷一兩月一小兒鹽哮喘嗽用海螵蛸刮屑研細末以白糖蘸喫愈一富兒厚味發哮喘以蘿葡子淘淨蒸熟晒乾為末薑汁蒸餅為丸即清金丹每服三十丸津咽下遍身痛周離亨治一人遍身疼每作殆不可忍都下醫或云中風或云中溼或云腳氣治俱不效周曰此血氣凝滯也沉思良久為製一散服之甚驗方以延胡索當歸桂等分依常法治之為末疾作時溫酒調下三四錢隨人酒量頻進之以止為度蓋延胡索活血化氣第一品也其後趙待制霆𨗳引失節肢體拘攣數服而愈泊宅編江應宿治休寧程君膏長子十八歲遍身疼痛腳膝腫大體熱面赤此風溼相搏也與當歸拈痛湯二三服熱退而愈身癢意菴治一人因田間收稻忽然遍身癢入骨髓用食鹽九錢泡湯三碗每進一碗探而吐之如是者三而癢釋矣一小兒遍身作癢以生薑搗爛以布包擦之而止倪仲賢治吳陵盛架閣內子左右肩背上下患癢至兩臂頭面皆然屢以艾灼癢處暫止且復作如是數年老人切其脉曰左關浮盛右口沉實此酒食滋味所致也投以清熱化食行滯之劑其癢遂止江汝潔治一婦人患上身至頭面俱癢刺痛起塊衆醫皆謂大風等症江診得左手三部俱細右手三部皆微實大都六脉俱數經曰微者為虛弱者為虛細者氣血俱虛蓋心主血肝藏血乃血虛無疑腎藏精屬水其部見微乃為水不足水既不足相火妄行無制以致此疾經曰諸痛瘡癢皆屬心火右手寸脉實實者陽也脉經曰諸陽為熱乃熱在肺分火尅金故也且肺主皮毛皮毛之疾肺氣主之胸膈及皮毛之疾為至髙之疾也右關微為實乃火在土分土得火則燥肌肉之間脾氣主之肌肉及皮毛痛癢皆火熱在上明矣右尺微實火居火位兩火合明陽多隂少治宜補水以制火養金以伐木若作風治未免以火濟火以燥益燥也乃以生地黃白芍各一錢參茋各六分連翹丹皮各六分麥冬八分柏皮防風甘草各四分五味子九粒黃連四分配方之妙筆難盡述水煎溫服查內加苦參一兩再煎洗十數劑而安一男子每至秋冬遍身發紅點作癢此寒氣收斂腠理陽氣不能發越炥鬱內作也宜以人參敗毒散解表再以補中益氣湯實表而愈一女子十二歲善怒遍身作癢用柴胡川芎山梔芍藥以清肝火以生地當歸黃芩凉肝血以白术茯苓甘草健脾土而愈配方亦妙半載後遍身起赤痕或時眩暈此肝火熾甚血得熱而妄行是夜果經至琇按以上二條俱立齊案面病附痄腮羅謙甫治楊郎中之內年五十餘體肥盛春患頭目昏悶面赤熱多服清上藥不效羅診其脉洪大而有力內經云面熱者足陽明胃病脉經云陽明經氣盛有餘則身已前皆熱况其人素膏粱積熱於胃陽明多血多氣本實則風熱上行諸陽皆會於頭故面熱之病生矣先以調胃承氣湯七錢黃連二錢犀角一錢疏利三兩行徹其本熱次以升麻加黃連湯去經絡中風熱上行則標本之病俱退矣方以升麻葛根各一錢白芷七分甘草炙白芍各五分連芩酒製各四分川芎生犀末各三分荆芥穗薄荷葉各二分右㕮咀水半盞先浸川芎荆芥穗薄荷作一服水二盞半煎至一盞半入先浸三味同煎煎法可法至一盞食後溫服日三服忌溼麵五辛之物真定府維摩院僧年六十餘體瘠弱初冬病頭面不耐寒氣弱不敢當風行諸法不效羅診其脉弦細而微且年髙常食素茶果而已此陽明之經本虛脉經云氣不足則身已前皆寒栗又如誦經文損氣由此胃氣虛經絡之氣亦虛不能上達頭面故大惡風寒先以附子理中丸數服而溫其中氣次以升麻湯加附子行其經絡方以升麻葛根各一錢白芷黃茋各七分甘草炙草豆䓻仁人參各五分黑附炮七分益智三分作一服連鬚葱白同煎數服良愈或曰升麻湯加黃連治面熱加附子治面寒有何依據答曰出自仲景云診楊氏脉陽明標本俱實先攻其裏後㵼經絡中風熱故升麻湯加黃連以寒治熱也尼僧陽明標本俱虛寒先實其裏次行經絡故升麻湯加附子以熱治寒也仲景羣方之祖信哉有人因灸三里而滿面黑氣醫皆以為腎氣浮面危候也有人云腎經有溼氣上蒸於心心火得溼成烟氣形於面非臨症過不知此語之妙面屬心故心腎之氣常相通如坎之外體即離離之外體即坎心腎未嘗相離也耳屬水其中虛則有離之象目屬火其中滿則有坎之象抑可見矣以去溼藥治之如五苓散黃茋防已之類皆可用醫餘餘杭人和倅將赴官因蒸降真木犀香自開甑而仆甑面上為熱氣所薰面即浮腫口眼皆為之閉更數醫不能治一醫云古無此證以意療之乃取僧寺久用炊布燒灰存性隨𫝊而消未半月而愈蓋以炊布受湯上氣多反用以出湯毒猶以鹽水取鹹味耳即輕粉毒亦以輕粉引之意此心法之巧也興國初有任氏有美色聘進士王公甫謂甫不遂寸祿愁鬱不樂面色漸黑自慚而歸母家求治一道人曰是可療也以女真散酒下二錢日兩服數日間面變微白一月如舊賂得其方用黃丹紫苑俱等分為末爾名醫録一人患頭面發熱有光色他人手近如火炙用蒜汁半兩酒調下吐一物如蛇遂安一人面肉腫如蛇狀用溼磚上青苔一錢水調塗方可用立消仁宗在東宮時嘗患痄腮命道士贊能治療取赤小豆四十九粒咒之雜他藥為末傅之而愈中貴任承亮在傍知然後承亮自患惡瘡濵死尚書郎傅求授以藥立愈問其方赤小豆也承亮始悟道士之技所謂誦咒乃神其術耳久之㳂官過豫章或苦脅疽幾達五臟醫者治之甚捷承亮曰君得非用赤小豆耶醫驚拜曰某用此活三十餘人願勿復宣言周少隱病宗室彥符傳之曰善惡諸瘡無藥可治者皆能治有僧發背狀如爛瓜周鄰家乳婢腹疽作用之皆如神其法細末水調傅瘡及四傍赤腫藥落再傅之類編薛立齊治地官陳用之患痄腮服發散之劑寒熱已退腫毒不消欲作膿也用託裏消毒散而膿成又用託裏散而毒潰但膿清作渴用八珍加麥門五味三十餘劑而愈上舍盧君患前症兩尺脉數症屬腎經不足誤服消毒之劑致損元氣而不能愈用補中益氣六味丸料而愈上舍熊君頤後患之膿水清稀形體消瘦遺精盜汗晡熱口乾痰氣上湧久而不愈脉洪大按之微細用加減八味丸料并十全大補湯不數劑諸症悉愈一婦人素內熱因怒耳下至頸腫痛寒熱用柴胡山梔散而腫痛消用加味逍遙散而熱退用八珍湯加丹皮而內熱止宋朝類苑載楊嵎瘍生於頰連齒輔車外腫若覆甌膿血內潰痛楚甚療之百方不差或語之曰天官瘍醫中有名方何不試用嵎按瘍醫注疏中法製之用藥注瘡中少損朽骨連牙潰出遂愈周禮瘍醫掌腫瘍潰瘍金瘍折瘍之祝藥劀殺之齊凡療瘍以五毒攻之所謂腫者壅腫也潰者膿血溢也折者傷損也金者刃傷也祝讀如注以藥傅著之也劀刮去膿血也殺去其惡肉也齊與劑同五毒五藥之有毒者石膽一丹砂二雄黃三礜石四礜石有毒即升藥寫古方􅈨石礜石混磁石五用黃堥置五石其中燒之三日夜其烟上著以雞羽掃取之以注瘡惡肉破骨盡出黃堥黃瓦器也此當為後醫方之祖焦氏筆乘瘍醫公孫知叔記問該博深明百藥之性創造五毒之劑取丹砂養血而益心雄黃長肉而補脾􅈨石理脂膏而助肺磁石通骨液而壯腎石膽治筋而滋肝外療瘡瘍之五症內應五臟拘之以黃堥熟之以火候藥成傅瘍無不神效一人鬚有疽一夕決潰勢欲殆以前藥傅之應手而差推篷寤語一幼女患唇四圍生瘡黃脂如蠟用旋覆花燒灰存性真麻油調搽愈又一孩滿面生瘡用蛇退鍛存性香油調搽愈耳橘泉治一人病頭眩兩耳鳴如屯萬蜂中甚痛心撓亂不自持醫以為虛寒下天雄矣翁曰此相火也而脉帶結是必服峻劑以劫之急與降火升陽補隂之劑脉復病愈孫兆殿丞治平中間有顯官權府尹忘其名氏一日坐堂決事吏人環立尹耳或聞風雨鼓角聲顧左右曰此何州郡也吏對以天府尹曰若然吾乃病耳遽召孫公往焉公診之與藥治之翌日病愈尹召孫公問曰吾所服藥切類四物飲孫曰是也尹曰始慮為大患服此藥立愈其故何也孫曰心脉太甚腎脉不能歸耳以藥凉心經則腎脉復歸乃無恙青箱記張友䕫壯歲常苦兩耳癢日一作遇其甚時殆不可耐挑剔無所不至而所患自若也常以堅竹三寸許截之拆為五六片細刮如洗帚狀極力撞入耳中皮破血出或多至一蜆殼而後止明日復然失血既多為之困悴適有河北醫士周敏道至詢之曰此腎藏風虛致浮毒上攻未易以常法治也宜買透冰丹服之勿飲酒啖溼麵蔬菜雞猪之屬能盡一月為佳䕫用其戒數日癢止而食忌不能久既而復作乃著意痛斷纍旬耳不復癢類編薛立齊治文選姚海山耳根赤腫寒熱作痛屬三焦風熱但中氣素虛以補中益氣加山梔炒芩牛蒡子而愈一儒者因怒耳內作痛出水或用袪風之劑筋攣作痛肢體如束此肝火傷血前藥復損所致非瘡毒也用六味料而愈一人年二十耳內出水作痛年餘矣脉洪數尺脉為甚屬肝腎二經虛熱用加減地黃丸料一劑而愈一男子每交接耳中作痛或作癢或出水以銀簮探入甚喜隂凉此腎經虛火用加減八味丸而愈一婦人因怒發熱每經行兩耳出膿兩太陽作痛以手按之痛稍止怒則胸脅乳房脹痛或寒熱往來小溲頻數或小腹脹悶皆屬肝火血虛用加味逍遙散一劑諸症悉退以補中益氣加五味而痊太卿魏莊渠癸卯仲冬月耳內作痛左尺洪大而澀薛曰此腎水枯竭不能生木當滋化源為善彼不信仍雜用補胃之劑薛曰不生腎水必不能起明春三月召治則昏憒不語頤耳之分已有膿矣且隂莖縮入腹內小便無度固辭不克用六味丸料一鍾隂莖舒出小便十減六七神思頓醒薛曰若急砭膿出庶延數日不信翌日耳膿出而歿憲副姜時川癸卯冬就診右寸浮數而有痰口內如有瘡然薛曰此胃火傳於肺也當薄滋味慎起居甲辰秋復就診尺脉洪數而無力曰此肺金不能生腎水無根之火上炎也宜靜調養滋化源彼云今喉中不時燥痛肌體不時發熱果是無根之火無疑矣退謂人曰薛謂我病可疑至乙巳春復往視喉果腫潰脉愈洪大又誤以為瘡毒投苦寒之劑遂卒琇按此案當入咽喉門一婦人因勞耳鳴頭痛體倦此元氣不足用補中益氣加麥冬五味而痊三年後得子因飲食勞倦前症益甚月經不行晡熱內熱自汗盜汗用六味地黃丸補中益氣湯頓愈前症若因血虛有火用四物加山梔柴胡不應八珍加前藥若氣虛弱用四君子若怒耳若聾或鳴者實也小柴胡加芎歸山梔虛用補中益氣加山梔若午前甚作火治用小柴胡加炒連炒梔氣虛用補中益氣午後甚作血虛用四物加白术茯苓若隂虛火動或兼痰甚作渴必用地黃丸以壯水之主經曰頭痛耳鳴九竅不利腸胃之所生也脾胃一虛耳目九竅皆為之病少宰李蒲汀耳如蟬鳴服四物湯耳鳴益甚此元氣虧損之症五更服六味地黃丸食前服補中益氣頓愈此症若血虛而有火用八珍加山梔柴胡氣虛而有火用四君加山梔柴胡若因怒就聾或鳴實用小柴胡加芎歸山梔虛用補中益氣加山梔午前甚用四物加白术茯苓久須用補中益氣午後甚用地黃丸少司馬黎仰之南銀臺時因怒耳鳴吐痰作嘔不食寒熱脅痛用小柴胡合四物加山梔茯神陳皮而瘥石山治一人年近六十面色蒼白病左耳聾三十年矣近年來或頭左邊及耳皆腫潰膿膿從耳出甚多時或又腫復膿今則右耳亦聾屢服袪風去熱逐痰之藥不效汪診左手心脉浮小而駛肝腎沉小而駛右脉皆虛散而數此恐乘輿逺來脉未定耳來早脉皆稍斂不及五至非比日前之甚數也夫頭之左邊及耳前後皆屬於少陽也經曰少陽多氣少血今用風藥痰藥類皆燥劑少血之經又以燥劑燥之則血愈虛少矣血少則澀滯澀滯則壅腫且血逢冷則凝今復以寒劑凝之愈助其壅腫久則鬱而為熱腐肉成膿從耳中出矣漸至右耳亦聾者脉絡相貫血氣相依未有血病而氣不病也是以始則左病而終至於右亦病矣况病久血氣已虛且人年六十血氣日涸而又出外勞傷氣血又多服燥劑以損其氣血膿又大泄已竭其氣血則虛而又虛可知矣以理論之當滋養氣血氣血健旺則運行有常而病自去矣否則不惟病不除而腦癰耳疽抑亦有不免矣人參二錢黃茋三錢歸身白术生薑各一錢鼠粘子連翹柴胡陳皮各六分川芎片芩白芍各七分甘草五分煎服數十貼而愈王萬里時患耳痛魏文靖公勸服青鹽鹿茸煎雄附為劑且言此藥非謂君虛宜服曷不觀易之坎為耳痛坎水藏在腎開竅於耳而水在志為恐恐則傷腎故為耳痛氣陽運動為顯血隂流行常幽血在形如水在天地間故坎為血卦是經中已著病症矣竟餌之而愈丹鉛續録一人耳內生疔如棗核大痛不可動用火酒滴耳內令仰上半時以箝取出絶根此名耳痔江應宿治上舍孫順吾患耳鳴重聽人事煩冗雜治半年不愈逆豫視之脉數滑以二陳加瞿麥扁畜木通黃柏一服知二服已耳暴聾者用全蝎去毒為末酒調滴耳中聞流水聲即愈說纂耳聾用全蝎四十九枚用生薑厚片如數鋪鍋內置蝎於薑上慢火烙薑片至黃色蝎熟去毒并頭足研為細末酒調送下隨量飲醉為度取汗許公子延耳生􅀈瘡用甘蔗鍛存性雞蛋清調搽愈鼻狄梁公性好醫藥尤妙針術顯慶中應制入關路旁大榜云能療此兒酬絹千匹有富室兒鼻端生贅如拳石綴鼻根蒂如筋痛楚危亟公為腦後下針疣贅應手而落其父母輦千縑奉酬公不顧而去集異記韓懋治一人鼻中肉贅臭不可近痛不可搖醫莫能治韓方以白􅈨末加硇少許吹其上頃之化水而消與勝溼湯加㵼白散二劑而愈此厚味壅溼熱蒸於肺門如雨霽之地突生芝菌也凡治病只此理耳一士人患鼻淵脉疾而數此有內熱遂以黃魚腦即石首魚頭中二塊是也取二三十枚鍛過存性為末先以一二分吹入鼻中以五分酒下不數服而愈更不復發古方鼻淵即今之腦漏是也當别寒熱二症若涕臭者屬熱宜用清凉之藥散之若涕清不臭覺腥者屬虛寒宜溫和之劑補之當審此理一人鼻中毛出晝夜長一二尺漸漸粗圎如繩痛不可忍摘去更生此因食猪羊血過多而然也用硇砂乳香飯丸水下十粒早晚各一服病去乃止一人鼻腥臭水流以碗盛而視之有鐵色蝦魚如米大走躍捉之即化為水此肉壞矣食雞魚一日二次一月而愈永真年東市百姓王布知書藏錢千萬商旅多賔之有女年十四五豔麗聰悟鼻兩孔各垂息肉如皂莢子其根如麻線長寸許觸之痛入心髓其父破錢數百萬治之不差忽一日有梵僧乞食因問布知君女有異疾可一見吾能治之布大喜即見其女僧乃取藥色正白吹其鼻中少頃摘去之出少黃水都無所苦布賞之百金不受唯乞息肉遂珍重而去勢疾如飛酉陽雜爼江篁南治一壯年患鼻衄胸膈不利醫用苦寒驅風敗血之劑服之年餘其人倦怠甚目不欲開江診視右寸脉浮洪帶結餘部皆沉細而軟曰鼻衄雖是多酒所傷然苦寒驅風破血之藥豈宜常服經曰苦傷氣又曰苦傷血况風藥多燥燥服血服之積久安得不倦怠耶且目得血而能視目不欲開者血傷倦怠者氣傷也所謂虛其虛誤矣治宜化滯血生新血四物加炒片芩紅花茯苓陳皮甘草黃茋煎服兼服固本丸日就強健鼻衄亦愈江應宿治友人王曉鼻塞氣不通利濁涕稠黏屢藥不效已經三年宿診視兩寸浮數曰鬱火病也患者曰昔醫皆作腦寒主治子何懸絶若是耶經曰諸氣膹鬱皆屬於肺越人云肺熱甚則出涕故熱結鬱滯壅塞而氣不通也投以升陽散火湯十數劑病如失程文彬治男子年二十餘鼻流濁涕名曰鼻淵已經三年治不效程以辛夷薄荷葉各五錢蒼耳子二錢半白芷一兩為末水丸如彈子大每服二錢食後葱湯送下或茶化亦可藥完愈睂一人睂毛搖動目瞪不能視唤之不應但能飲食用蒜三兩取汁酒調下即愈一男子睂間一核初如豆粒二年漸大如桃用清肝火養肝血益元氣而愈睂髮自落張仲景有竒術王仲宣年十七時過仲景景曰君體有病宜服五石湯若不治年及三十當睂落仲宣以為賖逺不治後至三十果睂落其精如此一騎軍一旦得疾雙眼昏咫尺不辨人物睂髮自落鼻梁崩倒肌膚有瘡如癬皆為惡疾勢不可救因為洋州駱谷子歸寨使遇一道流自谷中出不言姓名授其方曰皂角刺一二斤為灰蒸晒研為末食上濃煎大黃湯調一錢匕浹旬鬢髮再生肌膚悅潤眼目倍明得此方後入山不知所之感應神仙傳薛已治一儒者因飲食勞役及惱怒髮脫落薛以為勞傷精血隂火上炎所致用補中益氣加麥冬五味及六味地黃丸加五味睂髮頓生如故一男子年二十巔毛脫盡先以通聖散宣其風熱博按原刻脫此句次用六味地黃丸不數日髮生寸許兩月復舊吳江史萬湖云有男女偶合睂髮脫落無藥調治數月後復生江應宿見一男子睂髮脫落遇方士教服鹿角膠每日侵晨酒化下一二錢半年睂髮長年餘復舊鬚髮不白指揮使姚歡年八十餘鬚髮不白自言六十歲患癬疥周匝頂腫或教服黃連遂愈久服故髮不白其法以宣連去鬚酒浸一宿焙乾為末蜜丸桐子大日午臨卧以酒吞二十粒東坡大全集學正程畿齊翁年八十餘鬚髮不白自言三十歲後服六味地黃丸加生脉散至今五十餘年無一日缺是以精神完固康健不衰服此忌蘿葡大蒜抱朴子云槐子服之補腦令人髮不白而長生焦氏筆乘庾肩吾常服槐實年九十餘目看細書鬢髮皆黑梁書上舍黃霞璧傳染鬚方用五倍子一錢半入鍋內炒黃烟出將盡起清烟二陳就取起以手撚試之紫色為度銅落四分紅銅清水淬末食鹽生礬各二分俱為細末用烏梅三四個石榴皮少許煎水調如稀糊磁器盛之重湯頓稠先將肥皂洗鬚拭乾乘熱塗之以薄綿紙貼上明早用溫水潤透洗淨如皮肉黃色將絹片染油擦去目東垣治一人因多食猪肉煎餅同蒜醋食之後復飲酒大醉卧於暖炕翌日二瞳子散大於黃睛視物無的實以小為大以短為長卒然見非常之處行步踏空百治不效曰經云五臟六府之精氣皆上注於目而為之精精之窠為眼骨之精為瞳子又云筋骨氣血之精而為脉并為系上屬於腦又瞳子黑眼法於隂今瞳子散大者由食辛熱物太甚故也辛主散熱則助火上乘於腦中其精故散精散則視物亦散大也夫精明者所以視萬物者也今視物不真則精衰矣蓋火之與氣勢不兩立經曰壯火食氣壯火散氣手少隂心足厥隂肝所主風熱連目系邪之中人各從其類故循此道而來攻頭目腫悶而瞳子散大皆血虛隂弱故也當除風熱凉血益血以收耗散之氣則病愈矣以滋隂地黃丸經云熱淫所勝平以鹹寒佐以苦甘以酸收之以黃連黃芩大苦寒除邪氣之盛為君當歸身辛溫生熟地黃苦甘寒養血凉血為臣五味酸寒體輕浮上收瞳子之散大人參甘草地骨皮天門冬枳殼苦甘寒㵼熱補氣為佐柴胡引用為使忌食辛辣物助火邪及食寒冷物損胃氣藥不能上行也一人目翳暴生從下而起其色緑瞳痛不可忍曰翳從下而上病從陽明來也緑非五色之正此腎肺合而為病乃以墨調膩粉合之却與翳色相同腎肺為病明矣乃㵼腎肺之邪入陽明之藥為使既效矣他日病復作者三其所從來之經與翳色各異固悟曰諸脉皆屬於目肺病則目從之此必經絡未調故目病未已也問之果然治疾遂不作一人病翳眼六年以至遮瞳人視物不明有雲氣之狀因用百點膏而效東垣十書一軍官六月患眼疾於上眼皮下出黑白翳兩個隱澀難開兩目緊縮而無疼痛兩手寸脉細緊按之洪大無力知是太陽膀胱為命門相火煎熬逆行作寒水翳及寒膜遮精呵缺善悲健忘噴嚏多淚時自淚下面赤而白能食不大便小便數而缺氣上而喘用撥雲湯而愈蘭室祕藏丹溪治一老人目忽盲他無所苦以大虛治之急煎人參膏一斤服二日目稍有見不信一醫用青礞石藥朱曰今夕死矣果然一壯年忽早起視物不見就睡片時略見而不明食減倦甚脉緩大四至之上重則散而無力意其受溼所致詢之果卧溼地半月遂以白术為君黃茋茯苓陳皮為臣附子為使十餘貼愈一人形實好熱酒忽目盲脉澀此熱酒傷胃氣汚濁血死其中而然也以蘇木作湯調人參末服二日鼻及二掌皆紫黑朱曰滯血行矣以四物加蘇木桃仁紅花陳皮煎調人參末服數日而愈呂滄洲治一人病二目視物皆倒植屢治不效曰視一物為二視直為曲古人嘗言之矣視物倒植誠所未喻也願聞其因彼曰某嘗大醉盡吐所飲酒熟睡達曙遂病呂切其脉左關浮促餘部皆無恙即告之曰當傷酒大吐時上焦反覆致倒其膽府故視物皆倒植此不內外因而致內傷者也法當復吐以正其膽府遂授藜蘆瓜蒂為粗末水煎俾平旦頓服湧之湧畢視物不倒植錢仲陽治一乳婦因悸而病既愈目張不得瞑錢曰煮郁李酒飲之使醉即愈所以然者目系內連肝膽恐則氣結膽衡不下郁李能去結隨酒入膽結去膽下目能瞑矣飲之果驗石山治一婦年踰四十兩眼昏昧咳嗽頭痛似鳴而痛若過飢惡心醫以眼科治之病甚翁診脉皆細弱脾部尤近弦弱曰脾虛也東垣云五臟六府皆禀受于脾上貫於目脾虛則五藏精氣皆失所司不能歸明於目矣邪逢其身之虛隨眼系入於腦則腦鳴而頭痛心者君火也宜靜相火代行其令勞役運動則妄行侮其所勝故咳嗽也醫不理脾養血而以苦寒治眼是謂治標不治本乃用參茋錢半麥門冬貝母各一錢歸身八分陳皮川芎黃芩各七分甘草乾菊花各五分麥牙四分煎服二貼諸症悉除淮安陳吉老儒醫也有富翁子忽病視正物皆以為斜凡几案書冊之類排設整齊必更移令斜自以為正以至書寫尺牘皆然父母憂之醫皆不諳其疾或以吉老告遂攜子求治既診脉後令其父先歸留其子設樂開宴酬勸至醉乃罷扶病者坐轎中使人舁之髙下其手常令傾側展轉久之方令登榻而卧達旦酒醒遣之歸家前日斜視之物皆理正之父母躍然而喜往問治之之方吉老云令郎無他疾醉中嘗閃倒肝之一葉搭於肺上琇按肝去肺位甚逺安能上搭語恐未確不能下故視正物為邪今復飲之醉則肺脹展轉之間肝亦垂下矣藥安能治之哉富翁歎服雲麓漫鈔饒州民郭端友精意事佛紹興之夏忽兩目失光翳膜遮障巫醫針刮皆無功自念唯佛力可救一日三時禮佛一夜夢皂衣告曰汝要眼明用獺掌散熊膽丸則可明日市得獺掌散點之不效既而於道藏獲觀音治眼熊膽丸方即依方市藥修製之服之兼旬眼明眸子瞭然以治人目疾多愈藥方用十七品南熊膽一分為主黃連蜜䝉花羌活各一兩半防己二兩半草龍膽蛇蛻地骨皮大木賊仙靈脾皆一兩瞿麥旋覆花甘菊花皆半兩𬎼仁三錢半麒麟竭一錢蔓菁子一合同為細末以羯羊肝一具煮其半焙乾入於藥中取其中生者去膜爛研入上件藥杵而丸之桐子大飯後米飲下三十丸諸藥修製無别法唯木賊去節𬎼仁用肉蔓菁水淘蛇蛻炙云夷堅志江陵傅氏家貧鬻紙為業性喜雲水見必邀迎小閣塑呂仙翁像奉事甚謹雖妻子不許輒至一日有客方巾布袍入共語曰適有百金邀傅飲傅目昏多淚客教用生熟地黃切焙椒去目及閉口者微炒三物等分為末蜜丸桐子大五十丸鹽米飲空心下傅如方治藥不一月目明夜能視物年八九十耳目聰明精力如壯辛志唐崔承元因官治一死囚出活之囚後數年以病目致死一旦崔為內障所苦喪明逾年後夜半歎息獨坐忽聞階除窸窣之聲崔問為誰徐曰是昔䝉活囚來報恩耳乃告以用黃連一兩白羊子肝一具去膜同於沙盆內研令極細隨手為丸桐子大每服以溫水下三十丸連作五劑言訖忽不見崔依此合服數月眼復明凡諸目疾及翳障青盲皆治忌猪肉冷水本事方一人患赤眼腫痛脾胃虛弱飲食難進診其脉肝盛脾弱凉藥以治肝則損脾飲食愈難進服暖藥以益脾則肝愈盛而加病何以治之乃於溫平藥中倍加肉桂不得用茶調恐傷脾也肉桂殺肝而益脾故一治兩得之傳曰木得桂而死醫餘一人患眼疾每睡起則眼赤腫良久却愈百治莫效師曰此血熱非肝病也卧則血歸於肝熱血歸肝故令眼赤腫也良久却愈者人卧起血復散於四肢故也遂用生地黃汁浸粳米半升滲乾曝令透骨乾三浸三乾用磁瓶煎湯一升令沸下地黃米四五匙煎成薄粥湯放溫食半飽後飲一二盞即睡如此兩日遂愈生地黃汁凉血故也醫餘錢鏐老年一目失明聞中朝國醫胡姓者善醫上言求之晉祖遣醫泛海而往醫視其目曰尚父可無療此當延五七歲夀若決膜去內障即復舊但慮損福耳鏐曰吾得不為一目鬼死於地下足矣願醫盡其術以療之醫為治之復故鏐大喜且賂醫金帛寶帶五萬緡具舟送歸京師醫至鏐卒年八十一矣劉頴叔異苑郭太尉真州人久患目盲有白翳膜遍服藥莫效有親仲監稅在常州守官聞張鼉龍之名因薦於太尉請視之曰此眼緣熱藥過多乃生外障視物不明醫者皆以為肝元損下虛補其肝腎眼愈盲與藥點眼併服之一月取翳微消果一月翳退雙目如舊其方只用猪膽微火銀銚內煎成膏入冰腦如黍米大點入眼中微覺翳輕後又將猪膽白膜皮曝乾合作小繩如叉大小燒作灰待冷點翳甚者亦能治之名醫録潭州宗室趙太尉家乳母苦爛緣風眼近二十年有賣藥老媼過門云此眼有蟲其細如絲色赤而長久則滋生不已吾能談笑除之入山取藥晚下當為治療趙使人隂尾之見媼沿道掇叢蔓木葉以手挼碎入口中咀嚼而留汁滓於小竹筒內俄復還索皂紗䝉乳母眼取筆畫雙眸於紗上然後滴藥汁漬眼下緣轉盼間蟲從紗中出其數十七狀如前所云數日再至下緣內乾如常人復用前法滴上緣又得蟲十數家人大喜後傳與醫者上官彥誠遍呼鄰婦病此者驗試皆差其藥乃覆盆子葉一味著於本草陳藏器云治眼暗不見物冷淚浸淫不止及青盲等取此草日曝乾搗令極爛薄綿裹之以人乳汁浸如人行八九里久用點目中即仰面卧不過三四日視物如少年但禁酒麵油蓋治眼妙品也癸志明州定海人徐道亨父沒奉母周遊四方事之盡孝淳熙中寓泰州因患赤眼而食蟹遂成內障欲進路不能素解暗誦般若經出丐市里所得錢米持歸養母凡厯五年忽夜夢一僧長睂大鼻托一鉢鉢中有水令掬以洗眼復告之曰汝此去當服羊肝丸百日徐意為佛羅漢喜而拜願乞神方僧曰洗淨夜明沙當歸蟬蛻木賊去節各一兩共碾為末黑羊肝四兩水煮爛搗如泥入前藥拌和丸桐子大食後溫熟水下五十丸服之百日復舊與其母還鄉母亡棄家入道類說福州人病目兩瞼間赤濕流淚或痛或癢晝不能視物夜不可近燈光兀兀癡坐其友趙子春語之曰是為爛緣血風我有藥正治此名曰二百味花草膏病者驚曰用藥品如是世上方書所未有豈易遽辦直相戲耳趙曰我適見有藥當以與君明日攜一錢匕至堅凝成膏使以匙抄少許入口一日淚止二日腫消三日痛定豁然而愈乃往趙致謝且叩其名物笑曰只用羯羊膽去其中脂而滿填好蜜拌均蒸之候乾即入瓶研細為膏以蜂採百花羊食百草故隱其名以眩人耳癸志荀牧仲常謂豫曰有人視一物為兩醫者即作肝氣有餘故見一為兩教服補肝藥皆不驗此何疾也豫曰孫真人云目之系上屬於腦後出於腦中邪中於頭因逢身之虛其入深則隨目系入腦入於腦則轉轉則目系急急則目眩以轉邪中於睛所中者不相比則睛散睛散則岐故見兩物也令服驅風入腦藥而愈本事方省郎中張子敬年六十七病眼目昏暗唇微黑色皮膚不澤六脉弦細而無力一日出示治眼二方問可服否羅謙甫曰此藥皆以黃連大苦之藥為君諸風藥為使且人年五十膽汁減而目始不明內經云土位之主其瀉以苦諸風藥亦皆㵼土人年七十脾胃虛而皮肉枯重㵼其土使脾胃之氣愈虛而不能營運榮衛之氣滋養元氣胃氣不能上行膈氣吐食諸病生焉况已年髙衰弱起居皆不同此藥不可服祗宜慎言語節飲食懲忿窒欲此不治之治也張以為然明年春除關西路按察使三年致仕還精神清勝脉亦和平此不妄服寒藥之效也內經曰誅伐無過是謂大惑豈不信哉一人眼赤鼻張大喘渾身出斑髮如銅鐵絲硬乃目中熱毒氣結於下焦用白礬活石各一兩水三碗煎至一碗半不住口飲盡乃愈一人眼前常見禽蟲飛走捉之即無乃肝膽經為疾用酸棗仁羌活元明粉青箱子各一兩為末每水煎至二錢和查服日三服一人眼珠垂下至鼻大便血出名肝脹用羌活水煎數服愈一人眼內白眥却黑見物依舊毛髮直如鐵條不語如醉名血濆用五靈脂酒調下二錢愈一婦人眼中忽有血如射而出或緣鼻下但血出多時即經不行乃隂虛相火之病遂用歸身尾生地黃酒芍加柴胡黃柏知母條芩側柏葉木通紅花桃仁水煎食前服數劑而愈琇按此症由三隂火盛迫血上溢俗名倒經有從咽喉湧出有從牙齦泄出者薛已治給事張禹功目赤不明服袪風散熱藥反畏明重聽脉大而虛此因勞心過度飲食失節以補中益氣加茯神酸棗仁山藥山茱萸五味頓愈又勞役復甚用十全大補兼以前藥漸愈却用補中益氣加前藥而痊東垣云諸經脉絡皆走於面而行空竅其清氣散於目而為精走於耳而為聽若心煩事冗飲食失節脾胃虛損心火太甚百脉沸騰邪害孔竅而失明矣况脾為諸隂之首目為血脉之宗脾虛則五藏之精氣皆失其所若不理脾胃不養神血乃治標而不治本也一儒者日晡兩目緊澀不能瞻視此元氣下陷用補中益氣倍加參茋數劑而愈一男子亦患前症服黃柏知母之類更加便血此脾虛不能統血肝虛不能藏血也用補中益氣六味地黃丸而愈一儒者兩目作痛服降火袪風之藥兩目如緋熱倦殊甚薛用十全大補湯數劑諸症悉退服補中益氣兼六味丸而愈復因勞役午後目澀體倦服十全大補而愈一男子年二十素嗜酒色兩目赤痛或作或止兩尺洪大按之微弱薛謂少年得此目當失明翌早索途而行不辨天日衆皆驚異與六味地黃丸加麥冬五味一劑頓明孫真人在廟治衛才人患眼疼衆醫不能療或用寒藥或用補藥加之藏府不和上召孫孫曰臣非眼科乞勿全責於臣降㫖有功無過孫乃診之肝脉弦滑非壅熱也乃年壯血盛肝血併不通遂問宮人月經已三月不通矣用通經藥經行而愈子和自病目或腫或翳羞明隱澀百餘日不愈張仲安云宜刺上星百㑹攢竹絲空諸穴上血出及以草莖內兩鼻中出血約升許來日愈昔有人家一妾視物如曲弓視界尺之直亦如曲鉤俸醫親見藥莫能治一婦病熱目視壁上皆是紅蓮花滿壁醫用滚痰丸下之愈趙卿良醫也有機警一少年眼中常見一小鏡子諸醫不效趙診之與少年期來晨以魚鱠奉候少年及期赴之延於內且令從容俟客退方接俄而設臺子施一甌芥醋更無他味卿亦未出逮禺中久候不至少年飢甚且聞醋香不免輕啜之逡巡又啜之覺胸中豁然眼花不見因竭甌啜之趙卿方出少年以啜醋慚謝卿曰郎君先因喫鱠太多芥醋不快又有魚鱗在胸中所以眼花適來所備芥醋只欲郎君因飢以啜之果愈此疾烹鮮之㑹乃權詐也北夢瑣言管連雲之內目患沿眶紅爛數年愈甚百計治之不能療為延吳御醫診之曰吾得之矣為治大熱之劑數服其病如脫目復明問之曰此不難知也此女人進涼藥多矣用大熱劑則凝血復散前藥皆得奏功昔有人患內障眼用熟地黃麥門冬車前子三味為細末蜜丸如梧桐子大此方儘可用本草云三物相雜治內障眼有效東坡仇池記梅聖俞和吳正仲赤目見寄詩云暫看朱成碧難逢扁與和金箆舊孰在訶子古方磨自注云葛洪治赤目翳膜方訶子一枚以蜜磨注目中焦氏筆乘江應宿之內産後患沿眶紅爛雜治不效意是脾經風熱用槐樹枝八兩青鹽食鹽各二兩水飛炒燥早晨擦牙洗之而愈少參崑石容公為諸生時患兩目蒙䝉若霧露不見物得歙醫吳生方服之復明方用女貞子蜜水酒三停拌勻九蒸九曬四兩蜜䝉花依上拌蒸如數榖精依上拌蒸大黃依上拌蒸各二兩弱者少減防風柴胡石決明煆各二兩荆芥穗一兩川芎青皮麩炒黃連連翹各兩半家菊花枸杞子茺尉子各三兩元參四兩當歸尾青箱子草決明炒香各一兩八錢赤芍一兩二錢甘草九錢細辛四錢共二十二味為細末水一鍾化真熊膽入黑羊膽鯉魚膽雄猪膽老米打糊丸如黍米大食後每服二錢日三服忌燒酒大蒜雞鵝數年之疾一旦復明此公居刑部時曽數與豫言之今貢士霖野雷君録其方且聞服藥屏居寂室內觀瞑目靜坐其功尤勝於藥矣及其厯任中外潔已操行不激不隨不萎不倦本寂室中瞑目之力也咽喉張子和治一男子纏喉風腫表裏皆作藥不能下以涼藥灌入鼻中下十餘行外以拔毒散傅之陽起石燒赤與伏龍肝等分為末新汲水調掃百遍三日熱始退腫消一貴婦喉痺蓋龍火也雖用涼劑而不可使冷服為龍火宜以火逐之人火者烹飪之火是也乃使曝於烈日之中登於髙堂之上令婢攜火爐坐藥銚於上使藥嘗極熱不至大沸適口時時呷之百餘次龍火自散此法以熱虛是不為熱病扞格故也羅謙甫治梁濟民因膏粱而飲又勞心過度肺氣有傷以致氣腥臭唾涕稠黏口舌乾燥以加減㵼白散主之難經云心主五臭入肺為腥臭此其一也方以桑白皮桔梗各二錢地骨皮甘草炙一錢半知母七分麥門冬黃芩各五分五味二十粒煎食後溫服忌酒麵辛熱之物日進二服衛生寶鑑開德府一士人攜僕入京其僕忽患喉風脹滿氣塞不通命在須㬰一人云惟馬行街山水李家善治即偕往李駭曰證候危甚猶幸來此不然難救矣乃於笥中取一紙撚著火烟起吹滅之令患者張口刺於喉間俄出紫血半合即時氣寬能言及啖粥飲糝藥傅之立愈士人神其技後還鄉一醫偶傳得此術云咽喉病發於六府者如引手可探及刺破瘀血即已若發於五藏則受毒牢深手法藥力難到惟用紙撚為第一然不言所以用之之意後有人拾取其殘者蓋預以巴豆油塗故施火即燃藉其毒氣徑到病所類編一人患喉腫痛食不得下身熱頭痛大便不通醫之論紛然皆謂熱當服涼劑有一善醫云脉緊數諸緊為寒是感寒氣所致衆醫不從善醫者曰我有法驗得寒熱浴室中坐火用炒木葱湯沐浴若是病熱則此暖處必有汗而咽喉痛不減若是感寒則雖沐浴無汗患者然之遂入沐淋洗而無汗就浴室中服麻黃一服須臾大汗大便通即時無事衆醫欽服凡辨熱病與感寒皆可用此法醫餘羅謙甫治征南元帥不鄰吉歹年七旬春間東征南回至楚丘因過飲腹痛腸鳴自利日夜約五十餘行咽嗌腫痛耳前後赤腫舌本强涎唾稠黏欲吐不能出以手曵之方出言語艱難反側悶亂夜不得卧羅診得脉浮數按之沉細而弦即謂中丞粘公曰仲景云下利清穀身體疼痛急當救裡後清便自調急當救表救裡四逆湯救表桂枝湯總帥今胃氣不守下利清穀腹中疼痛雖宜急治之比之嗌咽猶可少緩公曰何謂也答曰內經云瘡發於咽嗌名曰猛疽此病治遲則塞咽咽塞則氣不通氣不通則半日死故宜急治於是遂砭刺腫上紫黑血出頃時腫勢大消遂用桔梗甘草連翹鼠黏酒黃芩升麻防風等分㕮咀每服約五錢水煎清令熱潄冷吐出之咽之恐傷脾胃自利轉甚再服涎清腫散語聲出後以神應丸辛熱之劑以散中寒解化宿食而燥脾溼丸者取其不即施行則不犯其上焦至其病所而後化乃治主以緩也不數服利止痛定後胸中閉塞作陳而痛復思靈樞有云上焦如霧宣五穀味薰膚充身澤毛若霧露之溉是為氣也今公年髙氣弱自利無度致胃中生發之氣不能滋養於心肺故閉塞而痛經云上氣不足推之揚之脾不足者以甘補之再以異攻散甘辛微溫之劑溫養脾胃加升麻人參上升以順正氣不數服而胸中快利痛止內經云調氣之方必别隂陽內者內治外者外治微者調之其次平之勝者奪之隨其攸利萬舉萬全又曰病有逺近治有緩急毋越其制度又曰急則治其標緩則治其本此之謂也一人咽喉間生肉層層相疊漸漸腫起有竅出臭氣用臭橘葉煎服而愈一人但飲食若别有一咽喉斜過膈下徑達左脅而作痞悶以手按之則厯厯有聲以控涎丹十粒服之少時痞處熱作一聲轉瀉下痰飲二升再食正下而達胃矣范九思不知何許人也業醫善針有人母患喉生蛾只肻服藥不用針無可奈何范曰我有藥但用新筆點之暗藏鈹針在筆內刺之蛾破血出即愈可見醫者貴乎有機也楊立之自廣府通判歸楚州喉間生癰既腫潰而膿血流注日夕不止寢食俱廢醫者束手適楊吉老赴郡二子􅌽之至熟視良久曰不須看脉已知之矣然此疾甚異須先啖生薑片一斤乃可投藥否則無法也語畢即出其子有難色曰喉口潰膿痛楚豈能食生薑立之曰吉老醫術通神其言不妄試取一二片啖我如不能進屏去無害遂食之初時殊為甘香稍復加益至半斤許痛處已寬滿一斤始覺味辛辣膿血頓盡粥食入口了無滯礙明日招吉老謝而問之曰君官南方多食鷓鴣此禽好啖半夏久而毒發故以薑製之今病源已清無服他藥類說齊東野語云辛丑余侍親還自福建途中有喉閉者老醫傳一方用鴨嘴膽礬一味研細釅醋調灌之藥甫下咽大吐膠痰即差膽礬難得真者不可不預儲以備急也江應宿治一婦喉痺用祕方蟢蛛窠二十一片煆存性枯礬燈草灰等分以鵝管吹入喉中即時消散用之驗一僕人患纏喉風用祕方透明雄黃一錢鬱金一錢巴豆七粒三生四熟去殼燈燒存性三物共研細末每服一分二厘半用茶清調服愈一人喉閉不通用牙皂白礬黃連等分置新瓦上焙乾為末吹入遂通一人喉痺以鮮射干山豆根等分煎湯灌入即愈一人懸中下而赤皆以為熱遍試凉藥不效此中氣虛用補中益氣而愈一人喉風牙關緊閉以牙皂五錢水一碗煎三分加好蜜一杯徐徐灌入鼻中其痰自出即可進藥口一人口內生肉毬有根線長五寸餘吐毬出方可飲食以手輕按痛徹於心水調生麝香一錢頻服之三日根化而愈程仁甫治一婦年近四十信來求藥云不時懸腭墮下勞苦即衄血或遍身作痛程雖未診視按經云喉舌之疾皆屬痰火推察其原又是隂血不足不能制上焦虛火而前症作矣若能滋下焦隂血使水升火降病當不舉若峻用正治之藥上焦之火未去而中寒之疾復生前病何由得愈若能依法調治兼守戒忌或可痊也八物湯加桔梗陳皮貝母元參喉痛甚加荆芥薄荷丸藥加減八味丸加黃柏久服而安舌子和治一婦人木舌脹其舌滿口諸藥不效令以緋針針小而鋭者砭之五七度腫減三日方平計所出血幾盈斗一婦人産子舌出不能收醫有周姓者令以硃砂末傅其舌仍令作産子狀以二女掖之乃於壁外潛纍盆盎置危處墮地作聲聲聞而舌收矣夫舌乃心之苗此必難産而驚心火不寧故舌因用力而出也今以硃砂鎮其心火又使倐聞異聲以恐下經曰恐則氣下故以恐勝之也王況遊京師會鹽法忽變有大賈覩揭示失驚吐舌遂不能復入經旬食不下咽尫羸日甚國醫莫能療其家憂惶榜於市曰有治之者當謝千金況應其請見賈之狀忽發笑不能制心謂難治其家怪而詰之況謬咍之曰所笑者輦轂之大如此乃無人治此小疾耳且曰試取針經來況謾檢之偶有穴與其疾似況曰爾家當勒狀與我萬一不能治則勿尤我我當針之可立愈其家從之急針舌之底抽針之際其人若委頓狀頃刻舌遂伸縮如平時自是名動京師益究心肘後諸書卒有聞於世事之偶然有如此王明清揮塵餘話一士人㳂汴東歸夜泊村步其妻熟寐撼之問何事不答又撼之妻驚起視之舌腫巳滿口不能出聲急訪醫得一叟負囊而至用藥糝之比曉復舊問之乃蒲黃一味須真者佳本事方一士人無故舌出血仍有小穴醫者不知何疾偶曰此名舌衄炒槐花為末糝之而愈良方一人舌腫脹舒出口外無敢醫者一村人云偶有此藥歸而取至乃紙撚以燈燒之取烟薰舌隨即消縮問之曰吾家舊有一牛舌腫脹出口人教以萆麻油蘸紙撚燃烟薰之而愈因以治人亦驗一人傷寒舌出寸餘連日不收用梅花片腦糝舌上應手而收重者用五錢方愈薛已治一婦人善怒舌本強手臂麻薛曰舌本屬土被木剋制故耳用六君加柴胡芍藥治之一男子舌下牽强手大指大腸經次指不仁或大便祕結或皮膚赤暈薛曰大腸之脉散舌下此大腸血虛風熱當用逍遙散加槐角秦芁治之牙太倉公治齊中大夫病齲齒為灸其左太陽陽明脉更為苦參湯日漱三升出入五六日病已得之風及卧開口食而不漱史記東垣治一婦人年三十齒痛甚口吸涼風則暫止閉口則復作乃溼熱也足陽明胃貫於上齒手陽明大腸貫於下齒況陽明多血聚加以膏粱之味助其溼熱故為此病用黃連梧桐淚苦寒薄荷荆芥穗辛涼治溼熱為主升麻苦辛引入陽明為使牙者骨之餘以羊䯒骨灰補之為佐麝香少許入內為引用為細末擦之牙痛方妙痛減半又以調胃承氣去硝加黃連以治其本二三行而止其病良愈不復作一人因服補胃熱藥致上下牙疼痛不可忍牽引頭腦滿面發熱大痛足陽明之别絡入腦喜寒惡熱乃是手陽明經中熱盛而作也其齒喜冷惡熱以清胃散治之而愈子和治一人忽患牙痛曰陽明經熱有餘也乃付舟車丸七十粒服畢過數知交留飲强飲熱酒數杯藥為熱酒所發盡吐之吐畢而痛止三五日又痛再飲前藥百餘粒大小數行乃止一婦牙痛治療不差致口頰皆腫以金沸草散大劑煎湯薰漱而愈綱目一老人云祖上多患齒疼脫落得一竒方名牢牙散以槐枝栁枝各取四十九根切碎皂角不蛀者七莖鹽四十丈重同入磁瓶內黃泥固濟糠火燒一夜候冷取出研細用如常法甚效數世用之齒白齊密劉漢卿郎中患牙槽風久之頷穿膿血淋漓醫皆不效在維揚時有丘經厯妙於針術為漢卿針委中膀胱穴及女膝穴無考是夕膿血即止旬日後頷骨脫去别生新者完美如故又張師道亦患此證用此法針之亦愈委中穴在腿䐐中女膝穴在足後跟考之針經無穴惜乎後人未知其神且驗也癸辛雜志張季明治一人患牙疼為灸肩尖肩尖即肩髃乃大腸穴微近骨後縫中小舉臂取之當骨解陷中灸五壯即差嘗灸數人皆愈隨左右所患無不立驗灸畢項大痛良久乃定永不發季明曰豫親病齒痛百方治之不效用此法治之遂差良方一人牙齒日長漸漸脹開口難為飲食蓋髓溢所致只服白术愈可見腎虛者不宜服术衛生十全方葉景夏家一妾病齒遇痛作時爬牀刮席呌呼連夕達旦勺飲不可入口毒醫藥莫效經年不差或授一方取附子尖天雄尖全蝎七箇皆生碾碎拌和以紙撚蘸少許點痛處隨手即止林元禮云未足為竒更有一法捕蚵蚾大者一枚削竹箆子刮其睂即有汁黏其上約所取已甚則放之而以汁點痛處凡疳蝕癰腫一切齒痛皆效藥到痛定仍不復作孫僴云此名蟾酥膏先以箆掠睂下汁未出時當以細杖鞭其背及頭候作怒鼓脹則流注如湧然後以綿經窒痛處類編祁門汪丞相有妾平日好食動風物尤嗜蟹或作蟹羮恣噉之一日得風熱之疾齒間壅一肉出漸大脹塞口不能閉水漿不入痛楚待斃而已有一道人云能治之其法用生地黃取汁一碗猪牙皂角數挺火上炙令熱蘸汁令盡末之傅癰肉上隨即消縮不日而愈後多金賂其方洛陽李敏求赴官東吳其妻病牙痛每發呻吟宛轉至不堪忍令婢輩以叉按置牙間少頃銀色輒變黑毒氣所攻痛楚可知也沿途醫之罔效嘉禾僧惠海為制一湯服之半年所苦良已後食熱麵復作坐間煮湯以進一服而愈其神速若此視藥之標題初不著方名但云涼血而已敏求報之重徐以情叩之始知為四物湯蓋血活而涼何由致壅滯以生疾也一人忽然氣上喘不能語言口中涎流吐逆齒皆搖動氣出轉大即悶絶名傷寒并熱霍亂用大黃人參各五錢水三盞煎一盞服烺按傷寒并熱霍亂何以入齒牙類疑悮宋英宗書齒藥方生地黃細辛白芷皂角各一兩去皮子入瓶中黃泥固濟炭五六斤鍛令盡炭入殭蠶一分甘草二錢為細末早晚揩齒併治衄血動搖等疾雲烟過眼録江應宿在燕京見小兒醫陳吏目患齒痛臉腮腫起痛楚難支聞一匠夫能治蟲牙試召視之與五靈脂如米粒者三顆令咬在痛齒上少頃以溫水漱出得小白蛀蟲三條痛止腫消瘖呂元膺治一僧病診其脉獨右關浮滑餘部無恙曰右關屬脾絡胃挾舌本蓋風中廉泉得之醉臥當風而成瘖問之而信乃取荆瀝化至寶丹飲之翌日遂解語一中年男子傷寒身熱醫與傷寒藥五七日變神昏而瘖遂作本體虛有痰治之人參半兩黃茋白术當歸陳皮各一錢煎湯入竹瀝薑汁飲之十二日其舌始能語得一字又服之半月舌能漸轉運言語熱除而痊蓋足少隂脉挾舌本脾足太隂之脉運舌本手少隂别繫舌本故此三脉虛則痰涎乘虛閉塞其脉道而舌不能轉運言語也若此三脉無血則舌無血營養而瘖經云刺足少隂脉重虛出血為舌難以言又言刺舌下中脉太過血出不止為瘖治當以前方加補血藥也此案不可為訓既云傷寒七日後變神昏而瘖恐熱傳少隂心經即作體虛有痰亦當配清熱之品不得純用補劑并下一條俱丹溪翁案一男子五十餘歲嗜酒吐血後不食舌不能言但渴飲水熱脉略數火與歸身芍地各一兩參术二兩陳皮兩半甘草二錢入竹瀝童便薑汁少許二十餘貼能言若此三脉風熱中之則其脉弛縱故舌亦弛縱不能轉運而瘖風寒客之則其脉縮急故舌卷而瘖在中風半身不收求之也丹溪治一人遺精誤服參茋及升浮劑遂氣壅於上焦而瘖聲不出乃用童便浸香附為末調服而疏通上焦以治瘖又用蛤粉青黛為君黃柏知母香附佐之為丸而填補下焦以治遺十餘日良愈本草言尿主久嗽失音故治瘖多用尿白能降火故也一人患卒瘖杏仁三分去皮尖熬别杵桂一分如泥和取杏核大綿裹含細細咽之日夜三五次孫兆治曹都使新造一宅落成遷入經半月飲酒大醉卧起失音瘖不能言召孫視之曰因新宅故得此疾耳半月當愈先服補心氣薯蕷丸治溼用細辛川芎十日其疾漸減二十日全愈曹既安見上問誰醫曰孫兆上乃召問曰曹何疾也對曰凡新宅壁皆溼地亦隂多人乍來隂氣未散曹心氣素虛飲酒至醉毛竅皆開隂溼之氣從而乘心經心經既虛而溼又乘之所以不能語臣先用薯蕷丸使心氣壯然後以川芎細辛去溼氣所以能語也即仲景法虛者先固其裏後清其表一男子年近五十久病痰嗽忽一日感風寒食酒肉遂厥氣走喉病暴瘖與灸足陽明胃别豐隆二穴豐隆穴在足胃穴也外豐隆踝上八寸胻骨廉陷中各三壯足少陰腎照海穴照海穴在足心腎穴也白照海神農經云在內踝直下肉際是穴各一壯其聲立出信哉聖經之言也仍以黃芩降火為君杏仁陳皮桔梗瀉厥氣為臣訶子瀉逆甘草和元氣為佐服之良愈一人驚氣入心絡瘖不能言以蜜他僧即淡底研細一匕許茶調服遂愈有人因伐木山中為狼所逐而得是疾或授以此方亦愈又一軍尉採藤於谷逢惡蛇而疾其狀正同亦用此藥療之而愈黃帝問曰人有重身九月而瘖此為何也岐伯對曰胞之絡脉絶也帝曰何以言之岐伯曰胞絡者繫於腎少隂之脉貫腎繫舌本故不能言也帝曰治之奈何岐伯曰無治也當十月復歐陽公與梅聖俞書失音記得一方將槐花於新瓦上炒熟琇按火刑肺金者宜之置懷袖中隨處送一二粒口中咀嚼之使喉中常有氣味久之聲自通焦氏筆乘皮膚皴裂東垣治一人皮膚皴裂不任其痛兩手不能執轅足不能履地停轍止宿因製潤肌膏與之即效方以珠青四兩白蠟八錢乳香二錢於鐵鐺內先下瀝青隨手下黃蠟乳香次入麻油一二匙俟瀝青鎔開微微熬動放大淨水盆於其旁以攪藥用鐵錍滴一二點於水中試之如硬入少油看軟硬合宜新綿濾於水中揉扯以白為度磁器內盛或油紙裹每用先火上炙裂口子熱捻合藥亦火上炙軟塗裂口上紙少許貼之自然合矣虞天民治仲兄年四十五歲平生瘦弱血少深秋得燥症皮膚拆裂手足枯燥搔之屑起血出痛楚十指中厚皮而莫能搔癢虞製一方名生血潤膚飲用歸茋生熟地天麥二門冬五味片芩栝婁仁桃仁泥酒紅花升麻煎服十數貼其病如脫大便燥結加麻仁郁李仁此值庚子年歲金太過至秋深燥金用事久晴不雨乃得此症烺按原刻悮作汪石山案骨哽鄱陽汪友良因食火肉誤吞一骨如小指大哽於咽喉間隱然見於膚革引手可揣摸百計不下凡纍日雖咳嗽亦痛僅能略通湯飲舉家憂懼昏睡中見一人衣朱衣者告曰欲脫骨哽惟南硼砂妙恍惚驚寤謂非夢也殆神明陰受以方欲全其命索笥得砂一塊汲水滌洗取而含化終食間脫然如失壬志吳江縣浦村王順富人也因食鱖魚被哽骨橫在胸中不上不下痛楚之甚飲食不得幾死忽遇漁人張九言取橄㰖與食即軟也適當春夏之時無此果乃取橄㰖核搗為末以急流水調服之果安張九曰父老傳橄㰖木作魚棹箆魚若觸即便浮可捉所以知畏橄㰖也今人煮河豚須用橄㰖乃知化魚毒也名醫録滁州蔣教授名南金因食鯉魚玉蟬羮為肋骨所哽凡治哽藥及象角屑用之皆不效或令以貫衆不拘多少濃煎汁一盞半分三服併進連服三劑至夜一咯而出因戲云此管仲之力也禮部王員外言昔金陵有一士子為魚骨鯁所苦不能飲食忽見賣白餳糖者因買食之頓覺無恙後見孫真人已有此方見說略誤吞金䥊張成忠漢上人有女八歲將母金䥊子一隻剔齒含口中不覺咽下胸膈痛不可忍憂惶無措忽銀匠來見云某有一藥物可療歸取藥至米飲抄下三錢令服來早大便取下後問之乃羊脛炭一物為末爾劉遵道草窗先生族弟也有漁人誤吞釣鉤遵道令鎔蠟為丸以線貫下鉤鋭入蠟即拽而出其人德之日獻魚一尾至歿乃止咸平中職方魏公在潭州有數子弟皆幼因相戲以一釣竿垂鉤用棗作餌登陸釣雞雛一子學之而誤吞其鉤至喉中急引乃鉤以鬚逆不能出諸醫莫敢措手魏公大怖時本郡有一莫都料性甚巧魏公召告其故莫沉思良久言要得一蠶繭及大念佛數珠一串公與之莫將繭翦如錢大用手揉四面令軟以油潤之仍中通一竅先穿上鉤線次穿數珠三五枚令兒正坐開口漸添引數珠俟之到喉覺至繫鉤處乃以力向下一推其鉤以下而脫即向上急出之見繭錢向下裹定鉤線鬚而出並無所損魏公大喜謝之且曰心明者意必大巧意明者心必善醫名醫録江應宿在維揚治鄉人王姓者因事犯鹽院驚懼自吞黃金一二錢心中憒憒無可奈何少頃已獲正犯其事遂平欲求生遍求醫藥不效逆豫往視之四肢厥冷六脉沉伏計無所出沉思銀工鎔金必用硼砂硼能製金急市硼四錢為末粥丸分二次服下少頃煎承氣湯利下硼裹金從大便出而安凡人溺死者及服金屑未死者以鴨血灌之即活誤吞水蛭蜈蚣吳少師在關外嘗得疾數月間肌肉消瘦每飲食下咽少時腹如萬蟲攢攻且癢且痛皆以為勞療也張鋭為切脉戒曰明日早且忍飢勿啖一物鋭當來為之計旦而往天方劇暑曰請選健卒趨往十里外取行路黃土一銀盂而令厨人旋治麵停午乃食才舉筋取土適至於是溫酒二升投土攪其內出藥百粒進之腸胃掣痛幾不堪任急登圊鋭密使别坎一穴便扶吳以行須㬰大下如傾穢惡斗許有馬蝗千餘宛轉盤結俱已困死吳亦憊甚扶憩榻上移時方餐粥三日而平始言去年正以夏夜出師中途躁渴命候兵持馬盂挹澗水甫入口似有物未暇吐之則竟入喉矣自此遂得病鋭曰蟲入肝脾裏勢須滋生常日遇食時則聚丹田間吮咂精血飽則散處四肢苟惟知殺之而不能掃盡故無益也鋭是以請公枵腹以誘之此蟲喜酒又久不得土味乘飢畢集故一藥能洗空之耳吳大喜厚贈金帛以歸庚志寧國衛承務者唯一子忽得疾羸瘦如削醫以為瘵疾治療無益醫劉大用問其致疾之因曰嘗以六月飲娼家醉臥桌上醒渴求水不得前有菖蒲盆水清潔舉而飲之自是疾作劉默喜遣僕掘田間淤泥以水沃濯取清汁兩碗置几上令隨意飲衛子素厭疾苦忍穢一飲而盡俄而腸胃間攻轉攪刺久之始定續投宣藥百粒隨即洞泄下水蛭六十餘條便覺襟膈豁然此乃盆中所誤吞也蛭入腹藉膏血滋養蕃育種類每黏著五藏牢不可脫然去汚渠已久思其所嗜非以此物致之不能集也然尫羸别以藥調補類編有人因醉薄暮渴飲道傍田間水自此忽患胸腹脹悶遍醫不效人亦莫識其病因幹宿客邸夜半思水飲令僕覓之僕夜捫索見有缸數隻疑店主以此貯水遂取一碗飲其主便覺胸次豁然再索之忽覺藏府急於店傍空地大㵼一二行平明視之所瀉乃水蛭無數繼看夜所飲缸水乃刈藍作靛者其病遂愈方思前時渴飲田水乃誤吞水蛭在腹遂成脹痛之疾乃蛭為害今人耘田為此蟲所囓以靛塗之無不愈者金莊一農夫夏天晝臥於地熟寐間蜈蚣入其口既寤喉中介介如梗狀咯不能出咽不能下痛癢不定甚為苦楚一醫用雞卵劈破入酒調勻頓服仍以大黃為末和香油飲之頃刻瀉出蜈蚣尚活蓋蜈蚣被雞卵拘攣其足不能舒動以利藥下之故從大便而出雞性好食蜈蚣亦取相制之意耳菽園雜記有村店婦人因用火筒吹火不知筒中有蜈蚣藏焉用以吹火蜈蚣驚迸竄入喉中不覺下胸臆婦人求救無措適有過客教取小猪兒一箇切斷喉取血令婦人頓飲之須臾以生油一口灌婦人遂惡心其蜈蚣滚在血中吐出繼與雄黃細研水調服愈一人夜醉誤吞水蛭腹痛黃瘦不進飲食用小死魚四箇猪脂煎鎔攪勻入巴豆十粒碎爛和田中乾泥丸如菉豆大以田中冷水吞之一丸㵼下為度有人蚰蜒入耳遇其極時以頭撞柱至血流不知云癢甚不可忍蚰蜒入耳往往食髓至盡又能滋生凡蟲入耳用生油灌妙無骨之蟲見油即死一人晝臥蚰蜒忽入耳初無所苦久之覺腦痛疑其食腦甚苦之莫能為計也一日將午餉就案而睡適有雞肉一盤在旁夢中忽噴嚏覺有物出鼻中視之乃蚰蜒在雞肉上自此腦痛不復作蚰蜒狀類蜈蚣而細好入人耳往往食人腦髓髓盡人斃北方多有之菽園雜記蛇蟲獸咬臨川有人以弄蛇貨藥為業一日為蝮所囓即時殞絶一臂忽大如股少頃遍身皮脹作黑黃色遂死有道人方旁觀言曰此人死矣我有一藥能療但恐毒氣益深或不可治諸君能相與證明方敢為出力衆咸竦踊觀之乃求錢二十文以往才食頃奔而至命新汲水解裹中調一升以杖抉傷者口灌之藥盡覺腑中搰搰然黃水自其口出臭穢逆人四肢應手消縮良久復如故其人已能起與未傷時無異遍拜見者且鄭重謝道人道人曰此藥甚易辦吾不惜傳諸人乃香白芷一物也法當以麥冬湯調服適事急不暇姑以水代之吾今活一人可行矣拂袖而去郭邵州得其方嘗有鄱陽一卒夜直更舍為蛇齧腹明旦赤腫欲裂以此飲之即愈夷堅志一人被毒蛇傷良久已昏困有老僧以酒調藥二錢灌之遂蘇及以藥滓塗咬處良久復灌二錢其苦皆去問之乃五靈脂一兩雄黃半兩為末爾有中毒者用之皆驗本草衍義徑山寺僧為蛇傷足久之毒氣蔓延游僧教以汲淨水洗病腳挹以軟帛糝以白芷末入鴨嘴膽礬麝香少許良久惡水湧出痛乃止明日淨洗如初日日皆然一月平復談藪趙延禧云遭惡蛇所螫處貼蛇皮便於其上灸之引去毒氣痛即止太平廣記南海地多蛇而廣府治尤甚某侍郎為帥聞雄黃能制此毒乃買數百兩分貯絹袋囊挂於寢室四隅經月餘日臥榻外常有黑汁從上滴下臭且臊使人窺之則巨蟒橫其上死腐矣於是盡令撤去障蔽死者長丈許如柱大旁又得十數條皆蟠糾成窠他屋內所驅放者合數百自是官舍為清類編浙西軍將張韶為蚯蚓所咬其形如大風睂鬚皆落每夕蚯蚓鳴於體有僧教以濃作鹽湯浸身數遍瘥朝野僉載有人被壁鏡毒幾死一醫用桑柴灰汁三度沸取調白礬為膏塗瘡口即差兼治蛇毒太平廣記張收嘗為猘犬所傷醫云宜食蝦蟆鱠收甚難之醫含笑先嘗收因此乃食瘡即愈沈約宋書彭城夫人夜之厠蠆螫其手呻吟無賴華他令溫湯漬手數易湯常令暖其旦則愈太平御覽蛇入人竅中急以手捻定以刀刮破尾以椒或辛辣物置尾以綿繫之即自出不可拔一室女近窗作女工忽頭疼痛甚諸藥不效一醫徐察之窗外畜鵝知為鵝虱飛入耳中咬而痛也以稻稈煎濃汁灌之虱死而出遂不痛晉州吳權府佃客五月間收麥用騾車搬載一小厮引頭被一騾跑倒又咬破三兩處痛楚不可忍五七日膿水臭惡難近又兼蛆蚊攢攻不能禁無奈臥門外車房中一道人見之曰我有一方可救傳汝修合如法製服蛆皆化為水而出蠅亦不敢近又以寒水石為末傅之旬日良愈僉以為神其方以蟬退青黛各五錢華隂細辛二錢半蛇退皮一兩燒存性右為末和勻每服三錢酒調下如騾馬牛畜成瘡用酒調灌之皆效如夏月犬傷及諸般損傷生蛆蟲極盛臭惡不可近皆可用之江應宿夜被蜈蚣螫其手立腫毒甚偶記一方取生白礬火化滴上痛止腫消嶠嶺多蜈蚣動長二三尺螫人求死不得然獨畏托胎蟲托胎蟲即蝸牛之脫殼者俗名蜒蚰是也多延井幹墻壁上蜈蚣雖大偶從下過托胎蟲必自落於地蜈蚣為局縮不得行托胎蟲乃徐徐圍繞周匝蜈蚣愈益縮然後登其首陷腦而食之以故人遭蜈蚣害必取托胎蟲涎輒生搗塗焉痛立止鐵圍山叢談名醫類案卷七
